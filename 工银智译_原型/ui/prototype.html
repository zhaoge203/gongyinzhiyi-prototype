xt": "折算。", "page": 99, "section": null, "tags": []}, "B2795": {"text": "（6）税收", "page": 99, "section": null, "tags": []}, "B2796": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 100, "section": null, "tags": ["市场风险"]}, "B2797": {"text": "96", "page": 100, "section": null, "tags": []}, "B2798": {"text": "对于按照中国法律法规和基金投资所在地的法律法规规定应交纳的各项税金， 本基金将", "page": 100, "section": null, "tags": []}, "B2799": {"text": "按权责发生制原则进行估值；对于因税收规定调整或其他原因导致基金实际交纳税金与估", "page": 100, "section": null, "tags": []}, "B2800": {"text": "算的应交税金有差异的，基金将在相关税金调整日或实际支付日进行相应的估值调整。", "page": 100, "section": null, "tags": []}, "B2801": {"text": "对于非代扣代缴的税收， 基金管理人可聘请税收顾问对相关投资市场的税收情况给予", "page": 100, "section": null, "tags": []}, "B2802": {"text": "意见和建议。境外托管人根据基金管理人的指示具体协调基金在海外税务的申报、缴纳及", "page": 100, "section": null, "tags": ["汇率与跨境风险"]}, "B2803": {"text": "索取税收返还等相关工作。基金管理人或其聘请的税务顾问对最终税务的处理的真实准确", "page": 100, "section": null, "tags": []}, "B2804": {"text": "负责。", "page": 100, "section": null, "tags": []}, "B2805": {"text": "（7） 在任何情况下， 基金管理人如采用本款第1－8项规定的方法对基金资产进行估值，", "page": 100, "section": null, "tags": []}, "B2806": {"text": "均应被认为采用了适当的估值方法。但是，如果基金管理人认为按本款第1－8项规定的方", "page": 100, "section": null, "tags": []}, "B2807": {"text": "法对基金资产进行估值不能客观反映其公允价值的，基金管理人可根据具体情况，并与基", "page": 100, "section": null, "tags": []}, "B2808": {"text": "金托管人商定后，按最能反映公允价值的价格估值；", "page": 100, "section": null, "tags": []}, "B2809": {"text": "（8）国家有最新规定的，按其规定进行估值。", "page": 100, "section": null, "tags": []}, "B2810": {"text": "4.基金份额净值错误的处理方式", "page": 100, "section": null, "tags": []}, "B2811": {"text": "（1）差错类型", "page": 100, "section": null, "tags": []}, "B2812": {"text": "基金运作过程中，如果由于基金管理人或基金托管人、或登记结算机构、或代销机构、", "page": 100, "section": null, "tags": []}, "B2813": {"text": "或投资人自身的过错造成差错，导致其他当事人遭受损失的，过错的责任人应当对由于该", "page": 100, "section": null, "tags": []}, "B2814": {"text": "差错遭受损失的当事人（ “受损方”）按下述“差错处理原则”给予赔偿并承担相关责任。", "page": 100, "section": null, "tags": []}, "B2815": {"text": "上述差错的主要类型包括但不限于 ： 资料申报差错、数据传输差错、数据计算差错、系", "page": 100, "section": null, "tags": []}, "B2816": {"text": "统故障差错、下达指令差错等；对于因技术原因引起的差错，若系同行业现有技术水平无", "page": 100, "section": null, "tags": []}, "B2817": {"text": "法预见、无法避免、无法抗拒，则属不可抗力，按照下述规定执行。", "page": 100, "section": null, "tags": []}, "B2818": {"text": "由于不可抗力原因造成投资人的交易资料灭失或被错误处理或造成其他差错， 因不可抗", "page": 100, "section": null, "tags": []}, "B2819": {"text": "力原因出现差错的当事人不对其他当事人承担赔偿责任，但因该差错取得不当得利的当事", "page": 100, "section": null, "tags": []}, "B2820": {"text": "人仍应负有返还不当得利的义务。", "page": 100, "section": null, "tags": []}, "B2821": {"text": "（2）差错处理原则", "page": 100, "section": null, "tags": []}, "B2822": {"text": "因基金估值错误给基金投资人造成的损失应由基金托管人和基金管理人协商共同承担，", "page": 100, "section": null, "tags": []}, "B2823": {"text": "基金托管人和基金管理人对不应由其承担的责任，有权根据过错原则，向过错人追偿，基", "page": 100, "section": null, "tags": []}, "B2824": {"text": "金合同的当事人应将按照以下约定处理。", "page": 100, "section": null, "tags": []}, "B2825": {"text": "1） 差错已发生，但尚未给当事人造成损失时，差错责任方应及时协调各方，及时进行", "page": 100, "section": null, "tags": []}, "B2826": {"text": "更正，因更正差错发生的费用由差错责任方承担；由于差错责任方未及时更正已产生的差", "page": 100, "section": null, "tags": []}, "B2827": {"text": "错，给当事人造成的损失由差错责任方承担；若差错责任方已经积极协调，并且有协助义", "page": 100, "section": null, "tags": []}, "B2828": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 101, "section": null, "tags": ["市场风险"]}, "B2829": {"text": "97", "page": 101, "section": null, "tags": []}, "B2830": {"text": "务的当事人有足够的时间进行更正而未更正，则有协助义务的当事人应当承担相应赔偿责", "page": 101, "section": null, "tags": []}, "B2831": {"text": "任。差错责任方应对更正的情况向有关当事人进行确认，确保差错已得到更正。", "page": 101, "section": null, "tags": []}, "B2832": {"text": "2） 差错的责任方对可能导致有关当事人的直接损失负责，不对间接损失负责，并且仅", "page": 101, "section": null, "tags": []}, "B2833": {"text": "对差错的有关直接当事人负责，不对第三方负责。", "page": 101, "section": null, "tags": []}, "B2834": {"text": "3） 因差错而获得不当得利的当事人负有及时返还不当得利的义务。但差错责任方仍应", "page": 101, "section": null, "tags": []}, "B2835": {"text": "对差错负责，如果由于获得不当得利的当事人不返还或不全部返还不当得利造成其他当事", "page": 101, "section": null, "tags": []}, "B2836": {"text": "人的利益损失，则差错责任方应赔偿受损方的损失，并在其支付的赔偿金额的范围内对获", "page": 101, "section": null, "tags": []}, "B2837": {"text": "得不当得利的当事人享有要求交付不当得利的权利；如果获得不当得利的当事人已经将此", "page": 101, "section": null, "tags": []}, "B2838": {"text": "部分不当得利返还给受损方，则受损方应当将其已经获得的赔偿额加上已经获得的不当得", "page": 101, "section": null, "tags": []}, "B2839": {"text": "利返还的总和超过其实际损失的差额部分支付给差错责任方。", "page": 101, "section": null, "tags": []}, "B2840": {"text": "4）基金份额净值计算差错小于基金份额净值0.5%时，基金管理人与基金托管人应在", "page": 101, "section": null, "tags": []}, "B2841": {"text": "发现日对账务进行更正调整，不做追溯处理。", "page": 101, "section": null, "tags": []}, "B2842": {"text": "5） 差错责任方拒绝进行赔偿时，如果因基金管理人过错造成基金资产损失时，基金托", "page": 101, "section": null, "tags": []}, "B2843": {"text": "管人应为基金的利益向基金管理人追偿，如果因基金托管人过错造成基金资产损失时，基", "page": 101, "section": null, "tags": []}, "B2844": {"text": "金管理人应为基金的利益向基金托管人追偿。除基金管理人和托管人之外的第三方造成基", "page": 101, "section": null, "tags": []}, "B2845": {"text": "金资产的损失，并拒绝进行赔偿时，由基金管理人负责向差错方追偿。", "page": 101, "section": null, "tags": []}, "B2846": {"text": "6） 如果出现差错的当事人未按规定对受损方进行赔偿，并且依据法律法规、基金合同", "page": 101, "section": null, "tags": []}, "B2847": {"text": "或其他规定，基金管理人自行或依据法院判决、仲裁裁决对受损方承担了赔偿责任，则基", "page": 101, "section": null, "tags": []}, "B2848": {"text": "金管理人有权向出现过错的当事人进行追索，并有权要求其赔偿或补偿由此发生的费用和", "page": 101, "section": null, "tags": []}, "B2849": {"text": "遭受的直接损失。", "page": 101, "section": null, "tags": []}, "B2850": {"text": "7）按法律法规规定的其他原则处理差错。", "page": 101, "section": null, "tags": []}, "B2851": {"text": "（3）差错处理程序", "page": 101, "section": null, "tags": []}, "B2852": {"text": "差错被发现后，有关的当事人应当及时进行处理，处理的程序如下：", "page": 101, "section": null, "tags": []}, "B2853": {"text": "1） 查明差错发生的原因，列明所有的当事人，并根据差错发生的原因确定差错的责任", "page": 101, "section": null, "tags": []}, "B2854": {"text": "方；", "page": 101, "section": null, "tags": []}, "B2855": {"text": "2）根据差错处理原则或当事人协商的方法对因差错造成的损失进行评估；", "page": 101, "section": null, "tags": []}, "B2856": {"text": "3） 根据差错处理原则或当事人协商的方法由差错的责任方进行更正和赔偿损失；其中", "page": 101, "section": null, "tags": []}, "B2857": {"text": "基金份额净值计算差错小于基金份额净值0.5%时，基金管理人与基金托管人应在发现日对", "page": 101, "section": null, "tags": []}, "B2858": {"text": "账务进行更正调整，不做追溯处理；基金份额净值计算差错达到或超过基金份额净值0.5%", "page": 101, "section": null, "tags": []}, "B2859": {"text": "时，基金管理人应当公告、通报基金托管人并报中国证监会备案；", "page": 101, "section": null, "tags": []}, "B2860": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 102, "section": null, "tags": ["市场风险"]}, "B2861": {"text": "98", "page": 102, "section": null, "tags": []}, "B2862": {"text": "4） 根据差错处理的方法，需要修改基金登记结算机构的交易数据的，由基金登记结算", "page": 102, "section": null, "tags": []}, "B2863": {"text": "机构进行更正，并就差错的更正向有关当事人进行确认。", "page": 102, "section": null, "tags": []}, "B2864": {"text": "（4）基金净值的确认", "page": 102, "section": null, "tags": []}, "B2865": {"text": "用于基金信息披露的基金资产净值和基金份额净值由基金管理人负责计算， 基金托管人", "page": 102, "section": null, "tags": []}, "B2866": {"text": "负责进行复核。基金管理人应于每个开放日估值时间点计算基金净值并发送给基金托管人。", "page": 102, "section": null, "tags": []}, "B2867": {"text": "基金托管人对净值计算结果复核确认后发送给基金管理人，由基金管理人对基金净值予以", "page": 102, "section": null, "tags": []}, "B2868": {"text": "公布。", "page": 102, "section": null, "tags": []}, "B2869": {"text": "（5）特殊情况的处理", "page": 102, "section": null, "tags": []}, "B2870": {"text": "1） 基金管理人或基金托管人按上述估值方法进行估值时，所造成的误差不作为基金资", "page": 102, "section": null, "tags": []}, "B2871": {"text": "产估值错误处理。", "page": 102, "section": null, "tags": []}, "B2872": {"text": "2）对于因税收规定调整或其他原因导致基金实际交纳税金与基金按照权责发生制进", "page": 102, "section": null, "tags": []}, "B2873": {"text": "行估值的应交税金有差异的，相关估值调整不作为基金资产估值错误处理。", "page": 102, "section": null, "tags": []}, "B2874": {"text": "3）全球投资涉及不同市场及时区， 由于时差、通讯或其他非可控的客观原因，在本", "page": 102, "section": null, "tags": []}, "B2875": {"text": "基金管理人和本基金托管人协商一致的时间点前无法确认的交易，导致的对基金资产净值", "page": 102, "section": null, "tags": []}, "B2876": {"text": "的影响，不作为基金资产估值错误处理。", "page": 102, "section": null, "tags": []}, "B2877": {"text": "4） 由于不可抗力原因，或由于各家数据服务机构发送的数据错误，本基金管理人和", "page": 102, "section": null, "tags": []}, "B2878": {"text": "本基金托管人虽然已经采取必要、适当、合理的措施进行检查，但未能发现错误的，由此", "page": 102, "section": null, "tags": []}, "B2879": {"text": "造成的基金资产估值错误，本基金管理人和本基金托管人可以免除赔偿责任。但基金托管", "page": 102, "section": null, "tags": []}, "B2880": {"text": "人应当积极采取必要的措施消除由此造成的影响。", "page": 102, "section": null, "tags": []}, "B2881": {"text": "5.暂停估值与公告基金份额净值的情形", "page": 102, "section": null, "tags": []}, "B2882": {"text": "（1）基金投资涉及的主要证券交易市场遇法定节假日或因其他原因停市时；", "page": 102, "section": null, "tags": []}, "B2883": {"text": "（2）因不可抗力或其它情形致使基金管理人、基金托管人无法准确评估基金资产价值", "page": 102, "section": null, "tags": []}, "B2884": {"text": "时；", "page": 102, "section": null, "tags": []}, "B2885": {"text": "（3）占基金相当比例的投资品种的估值出现重大转变，而基金管理人为保障投资人的", "page": 102, "section": null, "tags": []}, "B2886": {"text": "利益，决定延迟估值；", "page": 102, "section": null, "tags": []}, "B2887": {"text": "（4）如出现基金管理人认为属于紧急事故的任何情况，会导致基金管理人不能出售或", "page": 102, "section": null, "tags": []}, "B2888": {"text": "无法评估基金资产的；", "page": 102, "section": null, "tags": []}, "B2889": {"text": "（5）当前一估值日基金资产净值50%以上的资产出现无可参考的活跃市场价格且采用", "page": 102, "section": null, "tags": []}, "B2890": {"text": "估值技术仍导致公允价值存在重大不确定性时，经与基金托管人协商确认后，应当暂停基", "page": 102, "section": null, "tags": []}, "B2891": {"text": "金估值；", "page": 102, "section": null, "tags": []}, "B2892": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 103, "section": null, "tags": ["市场风险"]}, "B2893": {"text": "99", "page": 103, "section": null, "tags": []}, "B2894": {"text": "（6）中国证监会和基金合同认定的其它情形。", "page": 103, "section": null, "tags": []}, "B2895": {"text": "1.本基金的基金合同生效后， 在开始办理基金份额申购或者赎回前， 基金管理人将至少", "page": 103, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2896": {"text": "每周公告一次基金资产净值和各类基金份额的基金份额净值；", "page": 103, "section": null, "tags": []}, "B2897": {"text": "2.在开始办理基金份额申购或者赎回之后， 基金管理人将在每个开放日后的2个工作日", "page": 103, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2898": {"text": "内，通过网站、基金份额发售网点以及其他媒介，披露开放日各类基金份额的的基金份额", "page": 103, "section": null, "tags": []}, "B2899": {"text": "净值和基金份额累计净值；", "page": 103, "section": null, "tags": []}, "B2900": {"text": "3.基金管理人将公告半年度和年度最后一个工作日基金资产净值和各类基金份额的基", "page": 103, "section": null, "tags": []}, "B2901": {"text": "金份额净值。基金管理人应当在上述工作日后的2个工作日内，将基金资产净值、各类基", "page": 103, "section": null, "tags": []}, "B2902": {"text": "金份额的基金份额净值和基金份额累计净值登载在指定报刊和网站上。", "page": 103, "section": null, "tags": []}, "B2903": {"text": "1.基金合同的变更", "page": 103, "section": null, "tags": []}, "B2904": {"text": "（1）基金合同变更内容对基金合同当事人权利、义务产生重大影响的，应召开基金份", "page": 103, "section": null, "tags": []}, "B2905": {"text": "额持有人大会，基金合同变更的内容应经基金份额持有人大会决议同意。", "page": 103, "section": null, "tags": []}, "B2906": {"text": "1)终止基金合同；", "page": 103, "section": null, "tags": []}, "B2907": {"text": "2)转换基金运作方式；", "page": 103, "section": null, "tags": []}, "B2908": {"text": "3)变更基金类别；", "page": 103, "section": null, "tags": []}, "B2909": {"text": "4)变更基金投资目标、投资范围或投资策略；", "page": 103, "section": null, "tags": []}, "B2910": {"text": "5)变更基金份额持有人大会程序；", "page": 103, "section": null, "tags": []}, "B2911": {"text": "6)更换基金管理人、基金托管人；", "page": 103, "section": null, "tags": []}, "B2912": {"text": "7)提高基金管理人、基金托管人的报酬标准或提高销售服务费率，但基金合同及法律", "page": 103, "section": null, "tags": []}, "B2913": {"text": "法规要求提高该等报酬标准的除外； ；", "page": 103, "section": null, "tags": []}, "B2914": {"text": "8)本基金与其他基金的合并；", "page": 103, "section": null, "tags": []}, "B2915": {"text": "9)对基金合同当事人权利、义务产生重大影响的其他事项；", "page": 103, "section": null, "tags": []}, "B2916": {"text": "10)法律法规、基金合同或中国证监会规定的其他情形。", "page": 103, "section": null, "tags": []}, "B2917": {"text": "但出现下列情况时， 可不经基金份额持有人大会决议， 由基金管理人和基金托管人同意", "page": 103, "section": null, "tags": []}, "B2918": {"text": "变更后公布，并报中国证监会备案：", "page": 103, "section": null, "tags": []}, "B2919": {"text": "1)调低基金管理费、基金托管费和其他应由基金承担的费用；", "page": 103, "section": null, "tags": []}, "B2920": {"text": "2)在法律法规和本基金合同规定的范围内变更基金的申购费率、赎回费率和调低销售", "page": 103, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2921": {"text": "服务费率或变更收费方式；", "page": 103, "section": null, "tags": []}, "B2922": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 104, "section": null, "tags": ["市场风险"]}, "B2923": {"text": "100", "page": 104, "section": null, "tags": []}, "B2924": {"text": "3)因相应的法律法规发生变动必须对基金合同进行修改；", "page": 104, "section": null, "tags": []}, "B2925": {"text": "4)对基金合同的修改不涉及本基金合同当事人权利义务关系发生重大变化；", "page": 104, "section": null, "tags": []}, "B2926": {"text": "5)基金合同的修改对基金份额持有人利益无实质性不利影响；", "page": 104, "section": null, "tags": []}, "B2927": {"text": "6)按照法律法规或本基金合同规定不需召开基金份额持有人大会的其他情形。", "page": 104, "section": null, "tags": []}, "B2928": {"text": "（2）关于变更基金合同的基金份额持有人大会决议应报中国证监会核准或备案，并于", "page": 104, "section": null, "tags": []}, "B2929": {"text": "中国证监会核准或出具无异议意见后生效执行，并自生效之日起2日内在至少一种指定媒", "page": 104, "section": null, "tags": []}, "B2930": {"text": "介公告。", "page": 104, "section": null, "tags": []}, "B2931": {"text": "2．本基金合同的终止", "page": 104, "section": null, "tags": []}, "B2932": {"text": "有下列情形之一的，本基金合同经中国证监会核准后将终止：", "page": 104, "section": null, "tags": []}, "B2933": {"text": "（1）基金份额持有人大会决定终止的；", "page": 104, "section": null, "tags": []}, "B2934": {"text": "（2）基金管理人职责终止，而在6个月内无其他适当的基金管理公司承接其原有权利", "page": 104, "section": null, "tags": []}, "B2935": {"text": "义务；", "page": 104, "section": null, "tags": []}, "B2936": {"text": "（3） 基金托管人职责终止，而在6个月内无其他适当的托管机构承接其原有权利义务 ；", "page": 104, "section": null, "tags": []}, "B2937": {"text": "（4）中国证监会规定的其他情况。", "page": 104, "section": null, "tags": []}, "B2938": {"text": "3.基金财产的清算", "page": 104, "section": null, "tags": []}, "B2939": {"text": "（1）基金财产清算组", "page": 104, "section": null, "tags": []}, "B2940": {"text": "1)基金合同终止时，成立基金财产清算组，基金财产清算组在中国证监会的监督下进", "page": 104, "section": null, "tags": []}, "B2941": {"text": "行基金清算。在基金财产清算组接管基金财产之前，基金管理人和基金托管人应按照基金", "page": 104, "section": null, "tags": []}, "B2942": {"text": "合同和托管协议的规定继续履行保护基金财产安全的职责。", "page": 104, "section": null, "tags": []}, "B2943": {"text": "2)基金财产清算组成员由基金管理人、基金托管人、具有从事证券相关业务资格的注", "page": 104, "section": null, "tags": []}, "B2944": {"text": "册会计师、律师以及中国证监会指定的人员组成。基金财产清算组可以聘用必要的工作人", "page": 104, "section": null, "tags": []}, "B2945": {"text": "员。", "page": 104, "section": null, "tags": []}, "B2946": {"text": "3)基金财产清算组负责基金财产的保管、清理、估价、变现和分配。基金财产清算组", "page": 104, "section": null, "tags": ["流动性风险"]}, "B2947": {"text": "可以依法进行必要的民事活动。", "page": 104, "section": null, "tags": []}, "B2948": {"text": "（2）基金财产清算程序", "page": 104, "section": null, "tags": []}, "B2949": {"text": "基金合同终止， 应当按法律法规和本基金合同的有关规定对基金财产进行清算。 基金财", "page": 104, "section": null, "tags": []}, "B2950": {"text": "产清算程序主要包括：", "page": 104, "section": null, "tags": []}, "B2951": {"text": "1)基金合同终止后，发布基金财产清算公告；", "page": 104, "section": null, "tags": []}, "B2952": {"text": "2)基金合同终止时，由基金财产清算组统一接管基金财产；", "page": 104, "section": null, "tags": []}, "B2953": {"text": "3)对基金财产进行清理和确认；", "page": 104, "section": null, "tags": []}, "B2954": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 105, "section": null, "tags": ["市场风险"]}, "B2955": {"text": "101", "page": 105, "section": null, "tags": []}, "B2956": {"text": "4)对基金财产进行估价和变现；", "page": 105, "section": null, "tags": ["流动性风险"]}, "B2957": {"text": "5)聘请律师事务所出具法律意见书；", "page": 105, "section": null, "tags": []}, "B2958": {"text": "6)聘请会计师事务所对清算报告进行审计；", "page": 105, "section": null, "tags": []}, "B2959": {"text": "7)将基金财产清算结果报告中国证监会；", "page": 105, "section": null, "tags": []}, "B2960": {"text": "8)参加与基金财产有关的民事诉讼；", "page": 105, "section": null, "tags": []}, "B2961": {"text": "9)公布基金财产清算结果；", "page": 105, "section": null, "tags": []}, "B2962": {"text": "10)对基金剩余财产进行分配。", "page": 105, "section": null, "tags": []}, "B2963": {"text": "（3）清算费用", "page": 105, "section": null, "tags": []}, "B2964": {"text": "清算费用是指基金财产清算组在进行基金财产清算过程中发生的所有合理费用， 清算费", "page": 105, "section": null, "tags": []}, "B2965": {"text": "用由基金财产清算组优先从基金财产中支付。", "page": 105, "section": null, "tags": []}, "B2966": {"text": "（4）基金财产按下列顺序清偿：", "page": 105, "section": null, "tags": []}, "B2967": {"text": "1)支付清算费用；", "page": 105, "section": null, "tags": []}, "B2968": {"text": "2)交纳所欠税款；", "page": 105, "section": null, "tags": []}, "B2969": {"text": "3)清偿基金债务；", "page": 105, "section": null, "tags": []}, "B2970": {"text": "4)按基金份额持有人持有的基金份额比例进行分配。", "page": 105, "section": null, "tags": []}, "B2971": {"text": "基金财产未按前款1)－3)项规定清偿前，不分配给基金份额持有人。", "page": 105, "section": null, "tags": []}, "B2972": {"text": "（5）基金财产清算的公告", "page": 105, "section": null, "tags": []}, "B2973": {"text": "基金财产清算公告于基金合同终止并报中国证监会备案后5个工作日内由基金财产清", "page": 105, "section": null, "tags": []}, "B2974": {"text": "算组公告；清算过程中的有关重大事项须及时公告；基金财产清算结果经会计师事务所审", "page": 105, "section": null, "tags": []}, "B2975": {"text": "计，律师事务所出具法律意见书后，由基金财产清算组报中国证监会备案并公告。", "page": 105, "section": null, "tags": []}, "B2976": {"text": "（6）基金财产清算账册及文件的保存", "page": 105, "section": null, "tags": []}, "B2977": {"text": "基金财产清算账册及有关文件由基金托管人保存15年以上。", "page": 105, "section": null, "tags": []}, "B2978": {"text": "对于因基金合同的订立、内容、履行和解释或与基金合同有关的争议，基金合同当事人", "page": 105, "section": null, "tags": []}, "B2979": {"text": "应尽量通过协商、调解途径解决。不愿或者不能通过协商、调解解决的，任何一方均有权", "page": 105, "section": null, "tags": []}, "B2980": {"text": "将争议提交中国国际经济贸易仲裁委员会，按照中国国际经济贸易仲裁委员会届时有效的", "page": 105, "section": null, "tags": []}, "B2981": {"text": "仲裁规则进行仲裁。仲裁地点为北京市。仲裁裁决是终局的，对各方当事人均有约束力，", "page": 105, "section": null, "tags": []}, "B2982": {"text": "仲裁费用由败诉方承担。", "page": 105, "section": null, "tags": []}, "B2983": {"text": "争议处理期间，基金合同当事人应恪守各自的职责，继续忠实、勤勉、尽责地履行基金", "page": 105, "section": null, "tags": []}, "B2984": {"text": "合同规定的义务，维护基金份额持有人的合法权益。", "page": 105, "section": null, "tags": []}, "B2985": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 106, "section": null, "tags": ["市场风险"]}, "B2986": {"text": "102", "page": 106, "section": null, "tags": []}, "B2987": {"text": "本基金合同受中华人民共和国法律管辖。", "page": 106, "section": null, "tags": []}, "B2988": {"text": "基金合同是约定基金当事人之间、基金与基金当事人之间权利义务关系的法律文件。", "page": 106, "section": null, "tags": []}, "B2989": {"text": "1．本基金合同经基金管理人和基金托管人加盖公章以及双方法定代表人或其授权代表", "page": 106, "section": null, "tags": []}, "B2990": {"text": "签字，在基金募集结束，基金备案手续办理完毕，并获中国证监会书面确认后生效。基金", "page": 106, "section": null, "tags": []}, "B2991": {"text": "合同的有效期自其生效之日起至该基金财产清算结果报中国证监会备案并公告之日止。", "page": 106, "section": null, "tags": []}, "B2992": {"text": "2.本基金合同自生效之日起对包括基金管理人、 基金托管人和基金份额持有人在内的基", "page": 106, "section": null, "tags": []}, "B2993": {"text": "金合同各方当事人具有同等的法律约束力。", "page": 106, "section": null, "tags": []}, "B2994": {"text": "3.本基金合同正本一式八份， 除中国证监会和银行业监督管理机构各持两份外， 基金管", "page": 106, "section": null, "tags": []}, "B2995": {"text": "理人和基金托管人各持有两份。每份均具有同等的法律效力。", "page": 106, "section": null, "tags": []}, "B2996": {"text": "4.本基金合同可印制成册，供投资人在基金管理人、基金托管人、代销机构和登记结", "page": 106, "section": null, "tags": []}, "B2997": {"text": "算机构办公场所查阅，但其效力应以基金合同正本为准。", "page": 106, "section": null, "tags": []}, "B2998": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 107, "section": null, "tags": ["市场风险"]}, "B2999": {"text": "103", "page": 107, "section": null, "tags": []}, "B3000": {"text": "二十二、基金托管协议内容摘要", "page": 107, "section": null, "tags": []}, "B3001": {"text": "1．基金管理人", "page": 107, "section": null, "tags": []}, "B3002": {"text": "名称：华宝基金管理有限公司", "page": 107, "section": null, "tags": []}, "B3003": {"text": "住所：中国（上海）自由贸易试验区世纪大道100号上海环球金融中心58楼", "page": 107, "section": null, "tags": []}, "B3004": {"text": "办公地址：中国（上海）自由贸易试验区世纪大道100号上海环球金融中心58楼", "page": 107, "section": null, "tags": []}, "B3005": {"text": "邮政编码：200120", "page": 107, "section": null, "tags": []}, "B3006": {"text": "法定代表人：XIAOYI HELEN HUANG（黄小薏）", "page": 107, "section": null, "tags": []}, "B3007": {"text": "成立时间：2003年3月7日", "page": 107, "section": null, "tags": []}, "B3008": {"text": "批准设立机关及批准设立文号：中国证券监督管理委员会 中国证监会证监基金字", "page": 107, "section": null, "tags": []}, "B3009": {"text": "[2003]19号", "page": 107, "section": null, "tags": []}, "B3010": {"text": "组织形式：有限责任公司（中外合资）", "page": 107, "section": null, "tags": []}, "B3011": {"text": "注册资本：1.5亿元人民币", "page": 107, "section": null, "tags": []}, "B3012": {"text": "存续期间：持续经营", "page": 107, "section": null, "tags": []}, "B3013": {"text": "经营范围：基金管理业务、发起设立基金及中国证券监督管理委员会（以下简称“中", "page": 107, "section": null, "tags": []}, "B3014": {"text": "国证监会”）批准的其他业务", "page": 107, "section": null, "tags": []}, "B3015": {"text": "2．基金托管人", "page": 107, "section": null, "tags": []}, "B3016": {"text": "名称：中国建设银行股份有限公司(简称：中国建设银行)", "page": 107, "section": null, "tags": []}, "B3017": {"text": "住所：北京市西城区金融大街25号", "page": 107, "section": null, "tags": []}, "B3018": {"text": "办公地址：北京市西城区闹市口大街1号院1号楼", "page": 107, "section": null, "tags": []}, "B3019": {"text": "邮政编码：100033", "page": 107, "section": null, "tags": []}, "B3020": {"text": "法定代表人：王洪章", "page": 107, "section": null, "tags": []}, "B3021": {"text": "成立日期：2004年09月17日", "page": 107, "section": null, "tags": []}, "B3022": {"text": "基金托管业务批准文号：中国证监会证监基字[1998]12号", "page": 107, "section": null, "tags": []}, "B3023": {"text": "组织形式：股份有限公司", "page": 107, "section": null, "tags": []}, "B3024": {"text": "注册资本：贰仟伍佰亿壹仟零玖拾柒万柒仟肆佰捌拾陆元整", "page": 107, "section": null, "tags": []}, "B3025": {"text": "存续期间：持续经营", "page": 107, "section": null, "tags": []}, "B3026": {"text": "经营范围：吸收公众存款；发放短期、中期、长期贷款；办理国内外结算；办理票据", "page": 107, "section": null, "tags": []}, "B3027": {"text": "承兑与贴现；发行金融债券；代理发行、代理兑付、承销政府债券；买卖政府债券、金融债", "page": 107, "section": null, "tags": []}, "B3028": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 108, "section": null, "tags": ["市场风险"]}, "B3029": {"text": "104", "page": 108, "section": null, "tags": []}, "B3030": {"text": "券；从事同业拆借；买卖、代理买卖外汇；从事银行卡业务；提供信用证服务及担保；代理", "page": 108, "section": null, "tags": ["信用风险"]}, "B3031": {"text": "收付款项及代理保险业务；提供保管箱服务；经中国银行业监督管理机构等监管部门批准的", "page": 108, "section": null, "tags": []}, "B3032": {"text": "其他业务。", "page": 108, "section": null, "tags": []}, "B3033": {"text": "一）基金托管人对基金管理人的业务监督、核查", "page": 108, "section": null, "tags": []}, "B3034": {"text": "1.基金托管人根据有关法律法规的规定及基金合同的约定，对基金投资范围、投资对", "page": 108, "section": null, "tags": []}, "B3035": {"text": "象进行监督。", "page": 108, "section": null, "tags": []}, "B3036": {"text": "基金合同明确约定基金投资风格或证券选择标准的，基金管理人应按照基金托管人要", "page": 108, "section": null, "tags": []}, "B3037": {"text": "求的格式提供投资品种池，以便基金托管人运用相关技术系统，对基金实际投资是否符合基", "page": 108, "section": null, "tags": []}, "B3038": {"text": "金合同关于证券选择标准的约定进行监督，对存在疑义的事项进行核查。", "page": 108, "section": null, "tags": []}, "B3039": {"text": "本基金主要投资于： （1）标普石油天然气上游股票指数成份股、备选成份股； （2）跟踪", "page": 108, "section": null, "tags": ["市场风险"]}, "B3040": {"text": "标普石油天然气上游股票指数的公募基金、上市交易型基金等； （3） 固定收益类证券、银行", "page": 108, "section": null, "tags": ["市场风险"]}, "B3041": {"text": "存款、现金等货币市场工具以及中国证监会允许本基金投资的其他产品或金融工具。", "page": 108, "section": null, "tags": []}, "B3042": {"text": "本基金投资于标普石油天然气上游股票指数成份股、 备选成份股的比例不低于基金资产", "page": 108, "section": null, "tags": ["市场风险"]}, "B3043": {"text": "净值的80%，投资于跟踪标普石油天然气上游股票指数的公募基金、上市交易型基金的比例", "page": 108, "section": null, "tags": ["市场风险"]}, "B3044": {"text": "不超过基金资产净值的10%；投资于现金或者到期日在一年以内的政府债券的比例不低于基", "page": 108, "section": null, "tags": []}, "B3045": {"text": "金资产净值的5%。", "page": 108, "section": null, "tags": []}, "B3046": {"text": "如法律法规或监管机构以后允许基金投资其他品种或变更投资比例限制， 基金管理人在", "page": 108, "section": null, "tags": []}, "B3047": {"text": "履行适当程序后，可以相应调整本基金的投资范围、投资比例规定。", "page": 108, "section": null, "tags": []}, "B3048": {"text": "在本基金正式运作前，基金管理人向基金托管人提供“标的指数成份股、备选成份股", "page": 108, "section": null, "tags": ["市场风险"]}, "B3049": {"text": "及相关基金”，并每季度更新一次。如遇标的指数临时调整其成份股，则临时调整前述名单", "page": 108, "section": null, "tags": ["市场风险"]}, "B3050": {"text": "并及时提供给基金托管人。", "page": 108, "section": null, "tags": []}, "B3051": {"text": "为了便于本基金所投资相关基金的清算和托管业务，本基金投资范围中所涉及的非场", "page": 108, "section": null, "tags": []}, "B3052": {"text": "内交易的基金仅通过本基金境外托管人认可的交易系统购买。", "page": 108, "section": null, "tags": ["汇率与跨境风险"]}, "B3053": {"text": "2.基金托管人根据有关法律法规的规定及基金合同的约定，对基金投资、融资比例进", "page": 108, "section": null, "tags": []}, "B3054": {"text": "行监督。基金托管人按下述比例和调整期限进行监督：", "page": 108, "section": null, "tags": []}, "B3055": {"text": "1）本基金持有同一家银行的存款不得超过基金净值的20%。银行应当是中资商业银行", "page": 108, "section": null, "tags": []}, "B3056": {"text": "在境外设立的分行或在最近一个会计年度达到中国证监会认可的信用评级机构评级的境外", "page": 108, "section": null, "tags": ["信用风险", "汇率与跨境风险"]}, "B3057": {"text": "银行，但在基金托管账户的存款不受此限制。", "page": 108, "section": null, "tags": []}, "B3058": {"text": "2）本基金持有与中国证监会签署双边监管合作谅解备忘录国家或地区以外的其他国家", "page": 108, "section": null, "tags": []}, "B3059": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 109, "section": null, "tags": ["市场风险"]}, "B3060": {"text": "105", "page": 109, "section": null, "tags": []}, "B3061": {"text": "或地区证券市场挂牌交易的证券资产（包括金融衍生产品）不得超过基金资产净值的10%，", "page": 109, "section": null, "tags": []}, "B3062": {"text": "其中持有任一国家或地区市场的证券资产不得超过基金资产净值的3%。", "page": 109, "section": null, "tags": []}, "B3063": {"text": "3）基金不得购买证券用于控制或影响发行该证券的机构或其管理层。", "page": 109, "section": null, "tags": []}, "B3064": {"text": "4）本基金持有非流动性资产市值不得超过基金净值的10%。前项非流动性资产是指法", "page": 109, "section": null, "tags": ["流动性风险"]}, "B3065": {"text": "律或基金合同规定的流通受限证券以及中国证监会认定的其他资产。", "page": 109, "section": null, "tags": []}, "B3066": {"text": "5）本基金持有境外基金的市值合计不得超过基金净值的10%。持有货币市场基金可以", "page": 109, "section": null, "tags": ["汇率与跨境风险"]}, "B3067": {"text": "不受上述限制。", "page": 109, "section": null, "tags": []}, "B3068": {"text": "6）基金管理人管理的全部基金持有任何一只境外基金，不得超过该境外基金总份额的", "page": 109, "section": null, "tags": ["汇率与跨境风险"]}, "B3069": {"text": "20%。", "page": 109, "section": null, "tags": []}, "B3070": {"text": "7）本基金主动投资于流动性受限资产的市值合计不得超过基金资产净值的15%；因证", "page": 109, "section": null, "tags": ["流动性风险"]}, "B3071": {"text": "券市场波动、上市公司股票停牌、基金规模变动等基金管理人之外的因素致使基金不符合前", "page": 109, "section": null, "tags": ["市场风险"]}, "B3072": {"text": "述比例限制的，基金管理人不得主动新增流动性受限资产的投资；", "page": 109, "section": null, "tags": ["流动性风险"]}, "B3073": {"text": "8）本基金与私募类证券资管产品及中国证监会认定的其他主体为交易对手开展逆回购", "page": 109, "section": null, "tags": []}, "B3074": {"text": "交易的，可接受质押品的资质要求应当与基金合同约定的投资范围保持一致；", "page": 109, "section": null, "tags": []}, "B3075": {"text": "基金管理人应当在基金合同生效后6 个月内使基金的投资组合比例符合基金合同的有", "page": 109, "section": null, "tags": []}, "B3076": {"text": "关约定。若基金超过上述1）-6）项投资比例限制，应当在超过比例后30个工作日内采用", "page": 109, "section": null, "tags": []}, "B3077": {"text": "合理的商业措施减仓以符合投资比例限制要求。", "page": 109, "section": null, "tags": []}, "B3078": {"text": "若因将来法律法规或中国证监会的相关规定发生修改或变更，致使本基金投资限制中", "page": 109, "section": null, "tags": []}, "B3079": {"text": "前述1)至8)项中的任何限制规定被修改或取消的，基金管理人在履行适当程序后，本基金", "page": 109, "section": null, "tags": []}, "B3080": {"text": "可相应调整投资限制规定。", "page": 109, "section": null, "tags": []}, "B3081": {"text": "3.基金托管人根据有关法律法规的规定及基金合同的约定，对本托管协议第十七条第", "page": 109, "section": null, "tags": []}, "B3082": {"text": "九款第1）至第8）项及第11）至第12）项的基金投资禁止行为进行监督。基金托管人通过", "page": 109, "section": null, "tags": []}, "B3083": {"text": "事后监督方式对基金管理人基金投资禁止行为进行监督。", "page": 109, "section": null, "tags": []}, "B3084": {"text": "4.基金托管人履行本条第（二）项及第(三)项监督义务的方式为事后监督。即基金托", "page": 109, "section": null, "tags": []}, "B3085": {"text": "管人履行上述监督义务的方式仅限于在发现基金管理人已经执行完毕的投资指令违反上述", "page": 109, "section": null, "tags": []}, "B3086": {"text": "约定后，按照本协议约定通知基金管理人和/或监管部门。", "page": 109, "section": null, "tags": []}, "B3087": {"text": "5.投资远期的风险控制", "page": 109, "section": null, "tags": []}, "B3088": {"text": "（1）流动性风险控制", "page": 109, "section": null, "tags": ["流动性风险"]}, "B3089": {"text": "1）基金管理人负责远期交易的流动性风险控制，并对远期交易资金的流动性承担责", "page": 109, "section": null, "tags": ["流动性风险"]}, "B3090": {"text": "任。", "page": 109, "section": null, "tags": []}, "B3091": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 110, "section": null, "tags": ["市场风险"]}, "B3092": {"text": "106", "page": 110, "section": null, "tags": []}, "B3093": {"text": "2）基金管理人提前或延期执行远期合约时，基金管理人需保证本基金有可用现金头", "page": 110, "section": null, "tags": []}, "B3094": {"text": "寸，否则认为本基金是因为流动性不足而违约，由此给本基金造成的手续费、违约金及资产", "page": 110, "section": null, "tags": ["流动性风险", "信用风险"]}, "B3095": {"text": "估值方面的损失由基金管理人承担。", "page": 110, "section": null, "tags": []}, "B3096": {"text": "（2）基金管理人投资远期等金融衍生产品，应严格遵守国家相关法律法规，控制投资", "page": 110, "section": null, "tags": []}, "B3097": {"text": "风险。", "page": 110, "section": null, "tags": []}, "B3098": {"text": "6.基金托管人根据有关法律法规的规定及基金合同的约定，对基金资产净值计算、基", "page": 110, "section": null, "tags": []}, "B3099": {"text": "金份额净值计算、应收资金到账、基金费用开支及收入确定、基金收益分配、相关信息披露、", "page": 110, "section": null, "tags": []}, "B3100": {"text": "基金宣传推介材料中登载基金业绩表现数据等进行监督和核查。", "page": 110, "section": null, "tags": []}, "B3101": {"text": "7.基金托管人发现基金管理人的上述事项及投资指令或实际投资运作违反法律法规、", "page": 110, "section": null, "tags": []}, "B3102": {"text": "基金合同和本托管协议的规定，应及时以书面形式通知基金管理人限期纠正。基金管理人应", "page": 110, "section": null, "tags": []}, "B3103": {"text": "积极配合和协助基金托管人的监督和核查。 基金管理人收到通知后应在下一工作日前及时核", "page": 110, "section": null, "tags": []}, "B3104": {"text": "对并以书面形式给基金托管人发出回函，就基金托管人的疑义进行解释或举证，说明违规原", "page": 110, "section": null, "tags": []}, "B3105": {"text": "因及纠正期限，并保证在规定期限内及时改正。在上述规定期限内， 基金托管人有权随时", "page": 110, "section": null, "tags": []}, "B3106": {"text": "对通知事项进行复查， 督促基金管理人改正。基金管理人对基金托管人通知的违规事项未", "page": 110, "section": null, "tags": []}, "B3107": {"text": "能在限期内纠正的，基金托管人应报告中国证监会。", "page": 110, "section": null, "tags": []}, "B3108": {"text": "8.基金管理人有义务配合和协助基金托管人依照法律法规、基金合同和本托管协议对", "page": 110, "section": null, "tags": []}, "B3109": {"text": "基金业务执行核查。 对基金托管人发出的书面提示， 基金管理人应在规定时间内答复并改正，", "page": 110, "section": null, "tags": []}, "B3110": {"text": "或就基金托管人的疑义进行解释或举证；对基金托管人按照法律法规、基金合同和本托管协", "page": 110, "section": null, "tags": []}, "B3111": {"text": "议的要求需向中国证监会报送基金监督报告的事项， 基金管理人应积极配合提供相关数据资", "page": 110, "section": null, "tags": []}, "B3112": {"text": "料和制度等。", "page": 110, "section": null, "tags": []}, "B3113": {"text": "9.若基金托管人发现基金管理人依据交易程序已经生效的指令违反法律、行政法规和", "page": 110, "section": null, "tags": []}, "B3114": {"text": "其他有关规定，或者违反基金合同约定的，应当立即通知基金管理人，由此造成的损失由基", "page": 110, "section": null, "tags": []}, "B3115": {"text": "金管理人承担。", "page": 110, "section": null, "tags": []}, "B3116": {"text": "10.基金托管人发现基金管理人有重大违规行为，应及时报告中国证监会，同时通知基", "page": 110, "section": null, "tags": []}, "B3117": {"text": "金管理人限期纠正，并将纠正结果报告中国证监会。基金管理人无正当理由，拒绝、阻挠对", "page": 110, "section": null, "tags": []}, "B3118": {"text": "方根据本托管协议规定行使监督权，或采取拖延、欺诈等手段妨碍对方进行有效监督，情节", "page": 110, "section": null, "tags": []}, "B3119": {"text": "严重或经基金托管人提出警告仍不改正的，基金托管人应报告中国证监会。", "page": 110, "section": null, "tags": []}, "B3120": {"text": "二）基金管理人对基金托管人的业务核查", "page": 110, "section": null, "tags": []}, "B3121": {"text": "1.基金管理人对基金托管人履行托管职责情况进行核查，核查事项包括基金托管人安", "page": 110, "section": null, "tags": []}, "B3122": {"text": "全保管基金财产、开设基金财产的资金账户和证券账户、复核基金管理人计算的基金资产净", "page": 110, "section": null, "tags": []}, "B3123": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 111, "section": null, "tags": ["市场风险"]}, "B3124": {"text": "107", "page": 111, "section": null, "tags": []}, "B3125": {"text": "值和基金份额净值、根据基金管理人指令办理清算交收、相关信息披露和监督基金投资运作", "page": 111, "section": null, "tags": []}, "B3126": {"text": "等行为。", "page": 111, "section": null, "tags": []}, "B3127": {"text": "2.基金管理人发现基金托管人擅自挪用基金财产、未对基金财产实行分账管理、未执", "page": 111, "section": null, "tags": []}, "B3128": {"text": "行或无故延迟执行基金管理人资金划拨指令、泄露基金投资信息等违反《基金法》 、 《试行办", "page": 111, "section": null, "tags": []}, "B3129": {"text": "法》 、基金合同、本协议及其他有关规定时，应及时以书面形式通知基金托管人限期纠正。", "page": 111, "section": null, "tags": []}, "B3130": {"text": "基金托管人收到通知后应在下一个工作日之前核对并以书面形式给基金管理人发出回函， 说", "page": 111, "section": null, "tags": []}, "B3131": {"text": "明违规原因及纠正期限，并保证在规定期限内及时改正。在上述规定期限内，基金管理人有", "page": 111, "section": null, "tags": []}, "B3132": {"text": "权随时对通知事项进行复查， 督促基金托管人改正。基金托管人应积极配合基金管理人的", "page": 111, "section": null, "tags": []}, "B3133": {"text": "核查行为，包括但不限于：提交相关资料以供基金管理人核查托管财产的完整性和真实性，", "page": 111, "section": null, "tags": []}, "B3134": {"text": "在规定时间内答复基金管理人并改正。", "page": 111, "section": null, "tags": []}, "B3135": {"text": "3.基金管理人发现基金托管人有重大违规行为，应及时报告中国证监会，同时通知基", "page": 111, "section": null, "tags": []}, "B3136": {"text": "金托管人限期纠正，并将纠正结果报告中国证监会。基金托管人无正当理由，拒绝、阻挠对", "page": 111, "section": null, "tags": []}, "B3137": {"text": "方根据本协议规定行使监督权，或采取拖延、欺诈等手段妨碍对方进行有效监督，情节严重", "page": 111, "section": null, "tags": []}, "B3138": {"text": "或经基金管理人提出警告仍不改正的，基金管理人应报告中国证监会。", "page": 111, "section": null, "tags": []}, "B3139": {"text": "1．基金财产保管的原则", "page": 111, "section": null, "tags": []}, "B3140": {"text": "（1）基金财产应保管于基金托管人或基金托管人委托或同意存放的机构处", "page": 111, "section": null, "tags": []}, "B3141": {"text": "（2）基金财产应独立于基金管理人、基金托管人的固有财产。", "page": 111, "section": null, "tags": []}, "B3142": {"text": "（3）基金托管人应安全保管基金财产。", "page": 111, "section": null, "tags": []}, "B3143": {"text": "（4）基金托管人按照规定开设基金财产的资金账户和证券账户。", "page": 111, "section": null, "tags": []}, "B3144": {"text": "（5） 基金托管人对所托管的不同基金财产分别设置账户， 确保基金财产的完整与独立。", "page": 111, "section": null, "tags": []}, "B3145": {"text": "（6） 基金托管人根据基金管理人的指令， 按照基金合同和本协议的约定保管基金财产，", "page": 111, "section": null, "tags": []}, "B3146": {"text": "并按指令进行结算，如有特殊情况双方可另行协商解决。", "page": 111, "section": null, "tags": []}, "B3147": {"text": "（7）基金托管人在因依法解散、被依法撤销或者被依法宣告清盘或破产等原因进行终", "page": 111, "section": null, "tags": []}, "B3148": {"text": "止清算时，不得将托管证券及其收益归入其清算财产；基金管理人和基金托管人理解现金于", "page": 111, "section": null, "tags": []}, "B3149": {"text": "存入现金账户时构成基金托管人、境外托管人的等额债务，除非法律法规及撤销或清盘程序", "page": 111, "section": null, "tags": ["汇率与跨境风险"]}, "B3150": {"text": "明文许可该等现金不归于清算财产外， 该等现金归入清算财产并不构成基金托管人违反托管", "page": 111, "section": null, "tags": []}, "B3151": {"text": "协议的规定。", "page": 111, "section": null, "tags": []}, "B3152": {"text": "（8） 托管人或其境外托管人应按照有关市场的适用法律、法规和市场惯例，开立账户、", "page": 111, "section": null, "tags": ["汇率与跨境风险"]}, "B3153": {"text": "支付现金、办理证券登记等托管业务。", "page": 111, "section": null, "tags": []}, "B3154": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 112, "section": null, "tags": ["市场风险"]}, "B3155": {"text": "108", "page": 112, "section": null, "tags": []}, "B3156": {"text": "2.基金募集期间及募集资金的验资", "page": 112, "section": null, "tags": []}, "B3157": {"text": "（1）基金募集期间募集的资金应存于基金管理人在基金托管人的营业机构开立的“基", "page": 112, "section": null, "tags": []}, "B3158": {"text": "金募集专户”。该账户由基金管理人委托的登记结算机构开立并管理。", "page": 112, "section": null, "tags": []}, "B3159": {"text": "（2）基金募集期满或基金停止募集时，募集的基金份额总额、基金募集金额、基金份", "page": 112, "section": null, "tags": []}, "B3160": {"text": "额持有人人数符合《基金法》 、 《运作办法》 、 《试行办法》 等有关规定后，基金管理人应将属", "page": 112, "section": null, "tags": []}, "B3161": {"text": "于基金财产的全部资金划入基金托管人开立的基金银行账户，同时在规定时间内，聘请具有", "page": 112, "section": null, "tags": []}, "B3162": {"text": "从事证券相关业务资格的会计师事务所进行验资，出具验资报告。出具的验资报告由参加验", "page": 112, "section": null, "tags": []}, "B3163": {"text": "资的2名或2名以上中国注册会计师签字方为有效。", "page": 112, "section": null, "tags": []}, "B3164": {"text": "（3）若基金募集期限届满，未能达到基金合同生效的条件，由基金管理人按规定办理", "page": 112, "section": null, "tags": []}, "B3165": {"text": "退款等事宜。", "page": 112, "section": null, "tags": []}, "B3166": {"text": "3.基金资金账户的开立和管理", "page": 112, "section": null, "tags": []}, "B3167": {"text": "（1）基金托管人可以本基金的名义在其营业机构开立基金的银行账户，并根据基金管", "page": 112, "section": null, "tags": []}, "B3168": {"text": "理人合法合规的指令办理资金收付。 本基金的银行预留印鉴由基金托管人保管和供境内资金", "page": 112, "section": null, "tags": []}, "B3169": {"text": "划拨使用。基金托管人可委托境外托管人开立资金账户（境外） ，境外托管人根据基金托管", "page": 112, "section": null, "tags": ["汇率与跨境风险"]}, "B3170": {"text": "人的指令办理境外资金收付。", "page": 112, "section": null, "tags": ["汇率与跨境风险"]}, "B3171": {"text": "（2）基金资金账户的开立和使用，限于满足开展本基金业务的需要。基金托管人和基", "page": 112, "section": null, "tags": []}, "B3172": {"text": "金管理人不得假借本基金的名义开立任何其他银行账户；亦不得使用基金的任何账户进行本", "page": 112, "section": null, "tags": []}, "B3173": {"text": "基金业务以外的活动。", "page": 112, "section": null, "tags": []}, "B3174": {"text": "4.基金证券账户的开立和管理", "page": 112, "section": null, "tags": []}, "B3175": {"text": "基金托管人委托境外托管人在境外，根据当地市场法律法规规定，开立和管理证券账", "page": 112, "section": null, "tags": ["汇率与跨境风险"]}, "B3176": {"text": "户。", "page": 112, "section": null, "tags": []}, "B3177": {"text": "5.境内远期投资账户的开立", "page": 112, "section": null, "tags": []}, "B3178": {"text": "境内托管人以基金名义在交易对手处开立保证金账户，并将相关账户的信息发送基金", "page": 112, "section": null, "tags": ["杠杆风险"]}, "B3179": {"text": "管理人。", "page": 112, "section": null, "tags": []}, "B3180": {"text": "6.其他账户的开立和管理", "page": 112, "section": null, "tags": []}, "B3181": {"text": "（1）因业务发展需要而开立的其他账户，可以根据投资所在国家或地区法律法规和基", "page": 112, "section": null, "tags": []}, "B3182": {"text": "金合同的规定，由基金托管人或其委托机构负责开立。", "page": 112, "section": null, "tags": []}, "B3183": {"text": "（2）投资所在国家或地区法律法规对相关账户的开立和管理另有规定的，从其规定办", "page": 112, "section": null, "tags": []}, "B3184": {"text": "理。", "page": 112, "section": null, "tags": []}, "B3185": {"text": "7.基金财产投资的有关有价凭证等的保管", "page": 112, "section": null, "tags": []}, "B3186": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 113, "section": null, "tags": ["市场风险"]}, "B3187": {"text": "109", "page": 113, "section": null, "tags": []}, "B3188": {"text": "基金财产投资的境外有关实物证券、银行存款定期存单等有价凭证由基金托管人委托", "page": 113, "section": null, "tags": ["汇率与跨境风险"]}, "B3189": {"text": "境外托管代理人存放于其保管库。 基金托管人对由基金托管人以外机构实际有效控制的证券", "page": 113, "section": null, "tags": ["汇率与跨境风险"]}, "B3190": {"text": "不承担保管责任。", "page": 113, "section": null, "tags": []}, "B3191": {"text": "8.基金财产投资境内银行存款的保管责任", "page": 113, "section": null, "tags": []}, "B3192": {"text": "（1）基金管理人负责对本基金存款银行的评估与研究，建立健全银行定期存款的业务", "page": 113, "section": null, "tags": []}, "B3193": {"text": "流程、岗位职责、风险控制措施和监察稽核制度，切实防范有关风险。", "page": 113, "section": null, "tags": []}, "B3194": {"text": "1）基金管理人负责控制信用风险。信用风险主要包括存款银行的信用等级、存款银", "page": 113, "section": null, "tags": ["信用风险"]}, "B3195": {"text": "行的支付能力等涉及到存款银行选择方面的风险。 因选择存款银行不当造成基金财产损失的，", "page": 113, "section": null, "tags": []}, "B3196": {"text": "由基金管理人承担责任。", "page": 113, "section": null, "tags": []}, "B3197": {"text": "2）基金管理人负责控制流动性风险，并承担因控制不力而造成的损失。流动性风险", "page": 113, "section": null, "tags": ["流动性风险"]}, "B3198": {"text": "主要包括基金管理人要求全部提前支取、 部分提前支取或到期支取而存款银行未能及时兑付", "page": 113, "section": null, "tags": []}, "B3199": {"text": "的风险、基金投资银行存款不能满足基金正常结算业务的风险、因全部提前支取或部分提前", "page": 113, "section": null, "tags": []}, "B3200": {"text": "支取而涉及的利息损失影响估值等涉及到基金流动性方面的风险。", "page": 113, "section": null, "tags": ["流动性风险"]}, "B3201": {"text": "3）基金管理人须加强内部风险控制制度的建设。如因基金管理人员工的个人行为导", "page": 113, "section": null, "tags": []}, "B3202": {"text": "致基金财产受到损失的，需由基金管理人承担由此造成的损失。", "page": 113, "section": null, "tags": []}, "B3203": {"text": "4）基金管理人投资银行存款时，应就相关事宜在更新招募说明书中予以披露，进行", "page": 113, "section": null, "tags": []}, "B3204": {"text": "风险揭示。", "page": 113, "section": null, "tags": []}, "B3205": {"text": "基金托管人负责对本基金银行定期存款业务的监督与核查，审查、复核相关协议、账", "page": 113, "section": null, "tags": []}, "B3206": {"text": "户资料、投资指令、存款证实书等有关文件，切实履行托管职责。", "page": 113, "section": null, "tags": []}, "B3207": {"text": "（2）基金管理人在投资银行存款之前，需与存款银行总行(本基金托管人除外)或其授", "page": 113, "section": null, "tags": []}, "B3208": {"text": "权分行签订总体合作协议。如将资金存放于存款银行总行，则应与其签订具体存款协议；如", "page": 113, "section": null, "tags": []}, "B3209": {"text": "将资金存放于其授权分行书面指定的分支机构， 则存款银行总行应出具承诺函确认对存款承", "page": 113, "section": null, "tags": []}, "B3210": {"text": "担偿付义务，承诺函中需明确定期存款的金额、期限、利率、具体存款银行名称等与基金定", "page": 113, "section": null, "tags": ["市场风险"]}, "B3211": {"text": "期存款有重要关系的事项，并由存款银行签订具体存款协议。具体存款协议应包括但不限于", "page": 113, "section": null, "tags": []}, "B3212": {"text": "以下内容：", "page": 113, "section": null, "tags": []}, "B3213": {"text": "1）存款账户必须以基金名义开立，并加盖本基金公章和基金管理人公章，账户名称", "page": 113, "section": null, "tags": []}, "B3214": {"text": "为基金名称。", "page": 113, "section": null, "tags": []}, "B3215": {"text": "2）协议须约定存款类型、期限、利率、金额、账号、起止时间，存款银行经办行名", "page": 113, "section": null, "tags": ["市场风险"]}, "B3216": {"text": "称、地址及进款账户。", "page": 113, "section": null, "tags": []}, "B3217": {"text": "3）协议须约定基金托管人经办行名称、地址和账户，且本基金账户为唯一回款账户。", "page": 113, "section": null, "tags": []}, "B3218": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 114, "section": null, "tags": ["市场风险"]}, "B3219": {"text": "110", "page": 114, "section": null, "tags": []}, "B3220": {"text": "4）资金汇划须通过人民银行支付结算系统，存款银行经办行须满足基金托管人的查", "page": 114, "section": null, "tags": []}, "B3221": {"text": "询要求，在查复内容中须明确资金到账时间、金额、所入账户名称、账号。", "page": 114, "section": null, "tags": []}, "B3222": {"text": "5）定期存款存续期间，存款银行经办行须向基金托管人提供实时查询定期存款余额", "page": 114, "section": null, "tags": []}, "B3223": {"text": "的途径并确保查询。", "page": 114, "section": null, "tags": []}, "B3224": {"text": "6）未支取存款受损责任由存款银行承担。", "page": 114, "section": null, "tags": []}, "B3225": {"text": "7）如办理定期存款凭证挂失，须由经基金管理人和基金托管人分别授权的人员持授", "page": 114, "section": null, "tags": []}, "B3226": {"text": "权委托书共同办理。", "page": 114, "section": null, "tags": []}, "B3227": {"text": "8）为防范特殊情况下的流动性风险，存款银行须提供部分提前支取时的支付保证承", "page": 114, "section": null, "tags": ["流动性风险"]}, "B3228": {"text": "诺和利息计付等具体安排。", "page": 114, "section": null, "tags": []}, "B3229": {"text": "（3）办理基金投资银行存款的开户、全部提前支取、部分提前支取或到期支取，需由", "page": 114, "section": null, "tags": []}, "B3230": {"text": "基金管理人和基金托管人的授权代表持授权委托书共同全程办理， 基金管理人和基金托管人", "page": 114, "section": null, "tags": []}, "B3231": {"text": "还要将授权委托书的复印件交由对方备份。 基金管理人上述事项授权人员与基金管理人负责", "page": 114, "section": null, "tags": []}, "B3232": {"text": "洽谈存款事宜并签订存款协议的人员不能为同一人。 基金管理人不得单独申请存款凭证挂失。", "page": 114, "section": null, "tags": []}, "B3233": {"text": "（4）本基金投资于银行存款后，基金管理人全部提前支取、部分提前支取或到期支取", "page": 114, "section": null, "tags": []}, "B3234": {"text": "时，需提前发送投资指令到基金托管人处，以便基金托管人有足够的时间履行相应的业务操", "page": 114, "section": null, "tags": []}, "B3235": {"text": "作程序。如基金管理人提前支取或部分提前支取定期存款，基金管理人负责补足已提取资金", "page": 114, "section": null, "tags": []}, "B3236": {"text": "部分的息差(即本基金已计提的资金利息和提前支取时收到的资金利息差额)。", "page": 114, "section": null, "tags": []}, "B3237": {"text": "（5）本基金投资定期存款的期限不得超过一年(含一年)，且到期后不得展期。", "page": 114, "section": null, "tags": []}, "B3238": {"text": "（6）本基金投资于银行存款时，应本着便于基金的安全保管和日常监督核查的原则，", "page": 114, "section": null, "tags": []}, "B3239": {"text": "尽量选择基金托管人营业地址所在地的分支机构。", "page": 114, "section": null, "tags": []}, "B3240": {"text": "9．与基金财产有关的重大合同的保管", "page": 114, "section": null, "tags": []}, "B3241": {"text": "与基金财产有关的重大合同的签署，由基金管理人负责。由基金管理人代表基金签署", "page": 114, "section": null, "tags": []}, "B3242": {"text": "的、与基金财产有关的重大合同的原件分别由基金管理人、基金托管人保管。除本协议另有", "page": 114, "section": null, "tags": []}, "B3243": {"text": "规定外，基金管理人代表基金签署的与基金财产有关的重大合同，基金管理人应保证基金管", "page": 114, "section": null, "tags": []}, "B3244": {"text": "理人和基金托管人至少各持有一份正本的原件。 上述重大合同的保管期限为基金合同终止后", "page": 114, "section": null, "tags": []}, "B3245": {"text": "15年。基金管理人与相关方签订的有关金融衍生产品的合同，应该发送复印件给基金托管", "page": 114, "section": null, "tags": []}, "B3246": {"text": "人，以便基金托管人保存完整的基金档案资料。", "page": 114, "section": null, "tags": []}, "B3247": {"text": "一）基金资产净值的计算、复核与完成的时间及程序", "page": 114, "section": null, "tags": []}, "B3248": {"text": "1.基金资产净值", "page": 114, "section": null, "tags": []}, "B3249": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 115, "section": null, "tags": ["市场风险"]}, "B3250": {"text": "111", "page": 115, "section": null, "tags": []}, "B3251": {"text": "基金资产净值是指基金资产总值减去负债（含各项有关税收）后的金额。", "page": 115, "section": null, "tags": []}, "B3252": {"text": "基金份额净值是指基金资产净值除以基金份额总数， 基金份额净值的计算精确到0.001", "page": 115, "section": null, "tags": []}, "B3253": {"text": "元，小数点后第四位四舍五入。国家另有规定的，从其规定。", "page": 115, "section": null, "tags": []}, "B3254": {"text": "2.复核程序", "page": 115, "section": null, "tags": []}, "B3255": {"text": "用于基金信息披露的基金资产净值和基金份额净值由基金管理人负责计算，基金托管", "page": 115, "section": null, "tags": []}, "B3256": {"text": "人负责进行复核。 基金管理人应于每个开放日估值时间点计算基金净值并发送给基金托管人。", "page": 115, "section": null, "tags": []}, "B3257": {"text": "基金托管人对净值计算结果复核确认后发送给基金管理人， 由基金管理人对基金净值予以公", "page": 115, "section": null, "tags": []}, "B3258": {"text": "布。", "page": 115, "section": null, "tags": []}, "B3259": {"text": "3.根据有关法律法规，基金资产净值计算和基金会计核算的义务由基金管理人承担。", "page": 115, "section": null, "tags": []}, "B3260": {"text": "本基金的基金会计责任方由基金管理人担任，因此，就与本基金有关的会计问题，如经相关", "page": 115, "section": null, "tags": []}, "B3261": {"text": "各方在平等基础上充分讨论后，仍无法达成一致意见的，按照基金管理人对基金资产净值的", "page": 115, "section": null, "tags": []}, "B3262": {"text": "计算结果对外予以公布。", "page": 115, "section": null, "tags": []}, "B3263": {"text": "二）基金资产估值方法和特殊情形的处理", "page": 115, "section": null, "tags": []}, "B3264": {"text": "1.估值对象", "page": 115, "section": null, "tags": []}, "B3265": {"text": "基金所拥有的股票、基金、债券和银行存款本息、应收款项、其它投资等资产和负债。", "page": 115, "section": null, "tags": []}, "B3266": {"text": "2.估值时间", "page": 115, "section": null, "tags": []}, "B3267": {"text": "本基金合同生效后，每个开放日以及国家法律法规规定需要对外披露基金净值的非开", "page": 115, "section": null, "tags": []}, "B3268": {"text": "放日对基金资产进行估值，T+1日完成T日估值。", "page": 115, "section": null, "tags": []}, "B3269": {"text": "3.估值方法", "page": 115, "section": null, "tags": []}, "B3270": {"text": "（1）股票估值方法", "page": 115, "section": null, "tags": []}, "B3271": {"text": "1）上市流通股票按估值日其所在证券交易所的收盘价估值；估值日无交易的，以最近", "page": 115, "section": null, "tags": []}, "B3272": {"text": "交易日的收盘价估值。", "page": 115, "section": null, "tags": []}, "B3273": {"text": "2）未上市股票的估值", "page": 115, "section": null, "tags": []}, "B3274": {"text": "A 送股、转增股、配股和增发等方式发行的股票，按估值日在交易所挂牌的同一股票的", "page": 115, "section": null, "tags": []}, "B3275": {"text": "收盘价估值，该日无交易的，以最近交易日的收盘价估值；", "page": 115, "section": null, "tags": []}, "B3276": {"text": "B 首次发行且未上市的股票，按成本价估值；首次发行且有明确锁定期的股票，同一股", "page": 115, "section": null, "tags": []}, "B3277": {"text": "票在交易所上市后，按交易所上市的同一股票的市价估值。", "page": 115, "section": null, "tags": []}, "B3278": {"text": "（2）基金估值方法", "page": 115, "section": null, "tags": []}, "B3279": {"text": "1）上市流通的基金按估值日其所在证券交易所的收盘价估值；估值日无交易的，以最", "page": 115, "section": null, "tags": []}, "B3280": {"text": "近交易日的收盘价估值。", "page": 115, "section": null, "tags": []}, "B3281": {"text": "2）其他基金按最近交易日的基金份额净值估值。", "page": 115, "section": null, "tags": []}, "B3282": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 116, "section": null, "tags": ["市场风险"]}, "B3283": {"text": "112", "page": 116, "section": null, "tags": []}, "B3284": {"text": "若基金价格无法通过公开信息取得的，由基金管理人负责从其经纪商处取得，并及时", "page": 116, "section": null, "tags": []}, "B3285": {"text": "通过书面形式告知基金托管人。", "page": 116, "section": null, "tags": []}, "B3286": {"text": "（3）债券估值方法", "page": 116, "section": null, "tags": []}, "B3287": {"text": "1）对于上市流通的债券，证券交易所市场实行净价交易的债券按估值日其所在证券交", "page": 116, "section": null, "tags": []}, "B3288": {"text": "易所的收盘价估值；估值日无交易的，以最近交易日的收盘价估值。证券交易所市场未实行", "page": 116, "section": null, "tags": []}, "B3289": {"text": "净价交易的债券按估值日收盘价减去债券收盘价中所含的债券应收利息得到的净价进行估", "page": 116, "section": null, "tags": []}, "B3290": {"text": "值，估值日没有交易的，按最近交易日债券收盘价减去所含的最近交易日债券应收利息后得", "page": 116, "section": null, "tags": []}, "B3291": {"text": "到的净价估值。", "page": 116, "section": null, "tags": []}, "B3292": {"text": "2）对于非上市债券，参照主要做市商或其他权威价格提供机构的报价进行估值。若债", "page": 116, "section": null, "tags": []}, "B3293": {"text": "券价格无法通过公开信息取得的，由基金管理人负责从其经纪商处取得，并及时通过书面形", "page": 116, "section": null, "tags": []}, "B3294": {"text": "式告知基金托管人。", "page": 116, "section": null, "tags": []}, "B3295": {"text": "（4）存托凭证估值方法", "page": 116, "section": null, "tags": ["机制特有风险"]}, "B3296": {"text": "公开挂牌的存托凭证按其所在证券交易所的最近交易日的收盘价估值。", "page": 116, "section": null, "tags": ["机制特有风险"]}, "B3297": {"text": "（5）汇率", "page": 116, "section": null, "tags": ["汇率与跨境风险"]}, "B3298": {"text": "本基金外币资产价值计算中，所涉及人民币对美元、港元、欧元、英镑和日元的汇率", "page": 116, "section": null, "tags": ["汇率与跨境风险"]}, "B3299": {"text": "应当以基金估值日中国人民银行或其授权机构公布的人民币汇率为准。 涉及其他货币对人民", "page": 116, "section": null, "tags": ["汇率与跨境风险"]}, "B3300": {"text": "币的汇率， 采用彭博金融终端提供的估值日各种货币对美元折算率并采用套算的方法进行折", "page": 116, "section": null, "tags": ["汇率与跨境风险"]}, "B3301": {"text": "算。", "page": 116, "section": null, "tags": []}, "B3302": {"text": "（6）税收", "page": 116, "section": null, "tags": []}, "B3303": {"text": "对于按照中国法律法规和基金投资所在地的法律法规规定应交纳的各项税金，本基金", "page": 116, "section": null, "tags": []}, "B3304": {"text": "将按权责发生制原则进行估值；对于因税收规定调整或其他原因导致基金实际交纳税金与估", "page": 116, "section": null, "tags": []}, "B3305": {"text": "算的应交税金有差异的，基金将在相关税金调整日或实际支付日进行相应的估值调整。", "page": 116, "section": null, "tags": []}, "B3306": {"text": "对于非代扣代缴的税收，基金管理人可聘请税收顾问对相关投资市场的税收情况给予", "page": 116, "section": null, "tags": []}, "B3307": {"text": "意见和建议。境外托管人根据基金管理人的指示具体协调基金在海外税务的申报、缴纳及索", "page": 116, "section": null, "tags": ["汇率与跨境风险"]}, "B3308": {"text": "取税收返还等相关工作。 基金管理人或其聘请的税务顾问对最终税务的处理的真实准确负责。", "page": 116, "section": null, "tags": []}, "B3309": {"text": "（7）在任何情况下，基金管理人如采用本款第1－8项规定的方法对基金资产进行估", "page": 116, "section": null, "tags": []}, "B3310": {"text": "值，均应被认为采用了适当的估值方法。但是，如果基金管理人认为按本款第1－8项规定", "page": 116, "section": null, "tags": []}, "B3311": {"text": "的方法对基金资产进行估值不能客观反映其公允价值的，基金管理人可根据具体情况，并与", "page": 116, "section": null, "tags": []}, "B3312": {"text": "基金托管人商定后，按最能反映公允价值的价格估值；", "page": 116, "section": null, "tags": []}, "B3313": {"text": "（8）国家有最新规定的，按其规定进行估值。", "page": 116, "section": null, "tags": []}, "B3314": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 117, "section": null, "tags": ["市场风险"]}, "B3315": {"text": "113", "page": 117, "section": null, "tags": []}, "B3316": {"text": "三）基金份额净值错误的处理方式", "page": 117, "section": null, "tags": []}, "B3317": {"text": "1.差错类型", "page": 117, "section": null, "tags": []}, "B3318": {"text": "基金运作过程中，如果由于基金管理人或基金托管人、或登记结算机构、或代销机构、", "page": 117, "section": null, "tags": []}, "B3319": {"text": "或投资人自身的过错造成差错，导致其他当事人遭受损失的，过错的责任人应当对由于该差", "page": 117, "section": null, "tags": []}, "B3320": {"text": "错遭受损失的当事人（ “受损方”）按下述“差错处理原则”给予赔偿并承担相关责任。", "page": 117, "section": null, "tags": []}, "B3321": {"text": "上述差错的主要类型包括但不限于：资料申报差错、数据传输差错、数据计算差错、", "page": 117, "section": null, "tags": []}, "B3322": {"text": "系统故障差错、下达指令差错等；对于因技术原因引起的差错，若系同行业现有技术水平无", "page": 117, "section": null, "tags": []}, "B3323": {"text": "法预见、无法避免、无法抗拒，则属不可抗力，按照下述规定执行。", "page": 117, "section": null, "tags": []}, "B3324": {"text": "由于不可抗力原因造成投资人的交易资料灭失或被错误处理或造成其他差错，因不可", "page": 117, "section": null, "tags": []}, "B3325": {"text": "抗力原因出现差错的当事人不对其他当事人承担赔偿责任， 但因该差错取得不当得利的当事", "page": 117, "section": null, "tags": []}, "B3326": {"text": "人仍应负有返还不当得利的义务。", "page": 117, "section": null, "tags": []}, "B3327": {"text": "2.差错处理原则", "page": 117, "section": null, "tags": []}, "B3328": {"text": "因基金估值错误给基金投资人造成的损失应由基金托管人和基金管理人协商共同承担，", "page": 117, "section": null, "tags": []}, "B3329": {"text": "基金托管人和基金管理人对不应由其承担的责任，有权根据过错原则，向过错人追偿，基金", "page": 117, "section": null, "tags": []}, "B3330": {"text": "合同的当事人应将按照以下约定处理。", "page": 117, "section": null, "tags": []}, "B3331": {"text": "（1）差错已发生，但尚未给当事人造成损失时，差错责任方应及时协调各方，及时进", "page": 117, "section": null, "tags": []}, "B3332": {"text": "行更正，因更正差错发生的费用由差错责任方承担；由于差错责任方未及时更正已产生的差", "page": 117, "section": null, "tags": []}, "B3333": {"text": "错，给当事人造成的损失由差错责任方承担；若差错责任方已经积极协调，并且有协助义务", "page": 117, "section": null, "tags": []}, "B3334": {"text": "的当事人有足够的时间进行更正而未更正，则有协助义务的当事人应当承担相应赔偿责任。", "page": 117, "section": null, "tags": []}, "B3335": {"text": "差错责任方应对更正的情况向有关当事人进行确认，确保差错已得到更正。", "page": 117, "section": null, "tags": []}, "B3336": {"text": "（2）差错的责任方对可能导致有关当事人的直接损失负责，不对间接损失负责，并且", "page": 117, "section": null, "tags": []}, "B3337": {"text": "仅对差错的有关直接当事人负责，不对第三方负责。", "page": 117, "section": null, "tags": []}, "B3338": {"text": "（3）因差错而获得不当得利的当事人负有及时返还不当得利的义务。但差错责任方仍", "page": 117, "section": null, "tags": []}, "B3339": {"text": "应对差错负责， 如果由于获得不当得利的当事人不返还或不全部返还不当得利造成其他当事", "page": 117, "section": null, "tags": []}, "B3340": {"text": "人的利益损失，则差错责任方应赔偿受损方的损失，并在其支付的赔偿金额的范围内对获得", "page": 117, "section": null, "tags": []}, "B3341": {"text": "不当得利的当事人享有要求交付不当得利的权利；如果获得不当得利的当事人已经将此部分", "page": 117, "section": null, "tags": []}, "B3342": {"text": "不当得利返还给受损方， 则受损方应当将其已经获得的赔偿额加上已经获得的不当得利返还", "page": 117, "section": null, "tags": []}, "B3343": {"text": "的总和超过其实际损失的差额部分支付给差错责任方。", "page": 117, "section": null, "tags": []}, "B3344": {"text": "（4） 基金份额净值计算差错小于基金份额净值0.5%时，基金管理人与基金托管人应在", "page": 117, "section": null, "tags": []}, "B3345": {"text": "发现日对账务进行更正调整，不做追溯处理。", "page": 117, "section": null, "tags": []}, "B3346": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 118, "section": null, "tags": ["市场风险"]}, "B3347": {"text": "114", "page": 118, "section": null, "tags": []}, "B3348": {"text": "（5）差错责任方拒绝进行赔偿时，如果因基金管理人过错造成基金资产损失时，基金", "page": 118, "section": null, "tags": []}, "B3349": {"text": "托管人应为基金的利益向基金管理人追偿，如果因基金托管人过错造成基金资产损失时，基", "page": 118, "section": null, "tags": []}, "B3350": {"text": "金管理人应为基金的利益向基金托管人追偿。 除基金管理人和托管人之外的第三方造成基金", "page": 118, "section": null, "tags": []}, "B3351": {"text": "资产的损失，并拒绝进行赔偿时，由基金管理人负责向差错方追偿。", "page": 118, "section": null, "tags": []}, "B3352": {"text": "（6）如果出现差错的当事人未按规定对受损方进行赔偿，并且依据法律法规、基金合", "page": 118, "section": null, "tags": []}, "B3353": {"text": "同或其他规定，基金管理人自行或依据法院判决、仲裁裁决对受损方承担了赔偿责任，则基", "page": 118, "section": null, "tags": []}, "B3354": {"text": "金管理人有权向出现过错的当事人进行追索， 并有权要求其赔偿或补偿由此发生的费用和遭", "page": 118, "section": null, "tags": []}, "B3355": {"text": "受的直接损失。", "page": 118, "section": null, "tags": []}, "B3356": {"text": "（7）按法律法规规定的其他原则处理差错。", "page": 118, "section": null, "tags": []}, "B3357": {"text": "3.差错处理程序", "page": 118, "section": null, "tags": []}, "B3358": {"text": "差错被发现后，有关的当事人应当及时进行处理，处理的程序如下：", "page": 118, "section": null, "tags": []}, "B3359": {"text": "（1）查明差错发生的原因，列明所有的当事人，并根据差错发生的原因确定差错的责", "page": 118, "section": null, "tags": []}, "B3360": {"text": "任方；", "page": 118, "section": null, "tags": []}, "B3361": {"text": "（2）根据差错处理原则或当事人协商的方法对因差错造成的损失进行评估；", "page": 118, "section": null, "tags": []}, "B3362": {"text": "（3）根据差错处理原则或当事人协商的方法由差错的责任方进行更正和赔偿损失；其", "page": 118, "section": null, "tags": []}, "B3363": {"text": "中基金份额净值计算差错小于基金份额净值0.5%时，基金管理人与基金托管人应在发现日", "page": 118, "section": null, "tags": []}, "B3364": {"text": "对账务进行更正调整，不做追溯处理 ； 基金份额净值计算差错达到或超过基金份额净值0.5%", "page": 118, "section": null, "tags": []}, "B3365": {"text": "时，基金管理人应当公告、通报基金托管人并报中国证监会备案；", "page": 118, "section": null, "tags": []}, "B3366": {"text": "（4）根据差错处理的方法，需要修改基金登记结算机构的交易数据的，由基金登记结", "page": 118, "section": null, "tags": []}, "B3367": {"text": "算机构进行更正，并就差错的更正向有关当事人进行确认。", "page": 118, "section": null, "tags": []}, "B3368": {"text": "4.特殊情况的处理", "page": 118, "section": null, "tags": []}, "B3369": {"text": "（1）基金管理人或基金托管人按上述估值方法进行估值时，所造成的误差不作为基金", "page": 118, "section": null, "tags": []}, "B3370": {"text": "资产估值错误处理。", "page": 118, "section": null, "tags": []}, "B3371": {"text": "（2）对于因税收规定调整或其他原因导致基金实际交纳税金与基金按照权责发生制进", "page": 118, "section": null, "tags": []}, "B3372": {"text": "行估值的应交税金有差异的，相关估值调整不作为基金资产估值错误处理。", "page": 118, "section": null, "tags": []}, "B3373": {"text": "(3)全球投资涉及不同市场及时区， 由于时差、通讯或其他非可控的客观原因，在本基", "page": 118, "section": null, "tags": []}, "B3374": {"text": "金管理人和本基金托管人协商一致的时间点前无法确认的交易， 导致的对基金资产净值的影", "page": 118, "section": null, "tags": []}, "B3375": {"text": "响，不作为基金资产估值错误处理。", "page": 118, "section": null, "tags": []}, "B3376": {"text": "（4） 由于不可抗力原因，或由于各家数据服务机构发送的数据错误，本基金管理人和", "page": 118, "section": null, "tags": []}, "B3377": {"text": "本基金托管人虽然已经采取必要、适当、合理的措施进行检查，但未能发现错误的，由此造", "page": 118, "section": null, "tags": []}, "B3378": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 119, "section": null, "tags": ["市场风险"]}, "B3379": {"text": "115", "page": 119, "section": null, "tags": []}, "B3380": {"text": "成的基金资产估值错误，本基金管理人和本基金托管人可以免除赔偿责任。但基金托管人应", "page": 119, "section": null, "tags": []}, "B3381": {"text": "当积极采取必要的措施消除由此造成的影响。", "page": 119, "section": null, "tags": []}, "B3382": {"text": "四）暂停估值与公告基金份额净值的情形", "page": 119, "section": null, "tags": []}, "B3383": {"text": "1.基金投资涉及的证券交易市场遇法定节假日或因其他原因停市时；", "page": 119, "section": null, "tags": []}, "B3384": {"text": "2.因不可抗力或其它情形致使基金管理人、基金托管人无法准确评估基金资产价值时；", "page": 119, "section": null, "tags": []}, "B3385": {"text": "3.占基金相当比例的投资品种的估值出现重大转变，而基金管理人为保障投资人的利", "page": 119, "section": null, "tags": []}, "B3386": {"text": "益，决定延迟估值；", "page": 119, "section": null, "tags": []}, "B3387": {"text": "4.如出现基金管理人认为属于紧急事故的任何情况，会导致基金管理人不能出售或无", "page": 119, "section": null, "tags": []}, "B3388": {"text": "法评估基金资产的；", "page": 119, "section": null, "tags": []}, "B3389": {"text": "5.当前一估值日基金资产净值50%以上的资产出现无可参考的活跃市场价格且采用估", "page": 119, "section": null, "tags": []}, "B3390": {"text": "值技术仍导致公允价值存在重大不确定性时，经与基金托管人协商确认后，应当暂停基金估", "page": 119, "section": null, "tags": []}, "B3391": {"text": "值；", "page": 119, "section": null, "tags": []}, "B3392": {"text": "6.中国证监会和基金合同认定的其它情形。", "page": 119, "section": null, "tags": []}, "B3393": {"text": "五）基金会计制度", "page": 119, "section": null, "tags": []}, "B3394": {"text": "按国家有关部门规定的会计制度执行。", "page": 119, "section": null, "tags": []}, "B3395": {"text": "六）基金账册的建立", "page": 119, "section": null, "tags": []}, "B3396": {"text": "基金管理人进行基金会计核算并编制基金财务会计报告。基金托管人和基金管理人分", "page": 119, "section": null, "tags": []}, "B3397": {"text": "别独立地设置、记录和保管本基金的全套账册. 若基金管理人和基金托管人对会计处理方法", "page": 119, "section": null, "tags": []}, "B3398": {"text": "存在分歧，应以基金管理人的处理方法为准。若当日核对不符，暂时无法查找到错账的原因", "page": 119, "section": null, "tags": []}, "B3399": {"text": "而影响到基金净值信息的计算和公告的，以基金管理人的账册为准。", "page": 119, "section": null, "tags": []}, "B3400": {"text": "七）基金财务报表与报告的编制和复核", "page": 119, "section": null, "tags": []}, "B3401": {"text": "1.财务报表的编制", "page": 119, "section": null, "tags": []}, "B3402": {"text": "基金财务报表由基金管理人编制，基金托管人复核。", "page": 119, "section": null, "tags": []}, "B3403": {"text": "2.报表复核", "page": 119, "section": null, "tags": []}, "B3404": {"text": "基金托管人在收到基金管理人编制的基金财务报表后，进行独立的复核。核对不符时，", "page": 119, "section": null, "tags": []}, "B3405": {"text": "应及时通知基金管理人共同查出原因，进行调整，直至双方数据完全一致。", "page": 119, "section": null, "tags": []}, "B3406": {"text": "3.财务报表的编制与复核时间安排", "page": 119, "section": null, "tags": []}, "B3407": {"text": "基金管理人应当在上半年结束之日起两个月日内完成基金中期报告的编制；在每年结", "page": 119, "section": null, "tags": []}, "B3408": {"text": "束之日起三个月内完成基金年度报告的编制。 基金年度报告中的财务会计报告应当经过审计。", "page": 119, "section": null, "tags": []}, "B3409": {"text": "基金合同生效不足两个月的，基金管理人可以不编制当期中期报告或者年度报告。", "page": 119, "section": null, "tags": []}, "B3410": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 120, "section": null, "tags": ["市场风险"]}, "B3411": {"text": "116", "page": 120, "section": null, "tags": []}, "B3412": {"text": "基金管理人应及时完成报表编制，将有关报表提供基金托管人复核；基金托管人在复", "page": 120, "section": null, "tags": []}, "B3413": {"text": "核过程中，发现双方的报表存在不符时，基金管理人和基金托管人应共同查明原因，进行调", "page": 120, "section": null, "tags": []}, "B3414": {"text": "整，调整以国家有关规定为准。", "page": 120, "section": null, "tags": []}, "B3415": {"text": "基金管理人应留足充分的时间，便于基金托管人复核相关报表及报告。", "page": 120, "section": null, "tags": []}, "B3416": {"text": "基金份额持有人名册至少应包括基金份额持有人的名称和持有的基金份额。 基金份额持", "page": 120, "section": null, "tags": []}, "B3417": {"text": "有人名册由基金登记结算机构根据基金管理人的指令编制和保管， 基金管理人和基金托管人", "page": 120, "section": null, "tags": []}, "B3418": {"text": "应分别保管基金份额持有人名册，保存期不少于15年。如不能妥善保管，则按相关法规承", "page": 120, "section": null, "tags": []}, "B3419": {"text": "担责任。", "page": 120, "section": null, "tags": []}, "B3420": {"text": "在基金托管人要求或编制中报告和年报前，基金管理人应将有关资料送交基金托管人，", "page": 120, "section": null, "tags": []}, "B3421": {"text": "不得无故拒绝或延误提供，并保证其真实性、准确性和完整性。基金托管人不得将所保管的", "page": 120, "section": null, "tags": []}, "B3422": {"text": "基金份额持有人名册用于基金托管业务以外的其他用途，并应遵守保密义务，除非法律、法", "page": 120, "section": null, "tags": []}, "B3423": {"text": "规、规章另有规定，有权机关另有要求。", "page": 120, "section": null, "tags": []}, "B3424": {"text": "因本协议产生或与之相关的争议，双方当事人应通过协商、调解解决，协商、调解不", "page": 120, "section": null, "tags": []}, "B3425": {"text": "能解决的，任何一方均有权将争议提交中国国际经济贸易仲裁委员会，仲裁地点为北京市，", "page": 120, "section": null, "tags": []}, "B3426": {"text": "按照中国国际经济贸易仲裁委员会届时有效的仲裁规则进行仲裁。仲裁裁决是终局的，对当", "page": 120, "section": null, "tags": []}, "B3427": {"text": "事人均有约束力，仲裁费用由败诉方承担。", "page": 120, "section": null, "tags": []}, "B3428": {"text": "争议处理期间，双方当事人应恪守基金管理人和基金托管人职责，各自继续忠实、勤", "page": 120, "section": null, "tags": []}, "B3429": {"text": "勉、尽责地履行基金合同和本托管协议规定的义务，维护基金份额持有人的合法权益。", "page": 120, "section": null, "tags": []}, "B3430": {"text": "本协议受中华人民共和国法律管辖。", "page": 120, "section": null, "tags": []}, "B3431": {"text": "1．托管协议的变更程序", "page": 120, "section": null, "tags": []}, "B3432": {"text": "本协议双方当事人经协商一致，可以对协议进行修改。修改后的新协议，其内容不得", "page": 120, "section": null, "tags": []}, "B3433": {"text": "与基金合同的规定有任何冲突。基金托管协议的变更报中国证监会核准或备案后生效。", "page": 120, "section": null, "tags": []}, "B3434": {"text": "2.基金托管协议终止出现的情形", "page": 120, "section": null, "tags": []}, "B3435": {"text": "（1）基金合同终止；", "page": 120, "section": null, "tags": []}, "B3436": {"text": "（2）基金托管人解散、依法被撤销、破产或由其他基金托管人接管基金资产；", "page": 120, "section": null, "tags": []}, "B3437": {"text": "（3）基金管理人解散、依法被撤销、破产或由其他基金管理人接管基金管理权；", "page": 120, "section": null, "tags": []}, "B3438": {"text": "（4）发生法律法规或基金合同规定的终止事项。", "page": 120, "section": null, "tags": []}, "B3439": {"text": "3.基金财产的清算", "page": 120, "section": null, "tags": []}, "B3440": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 121, "section": null, "tags": ["市场风险"]}, "B3441": {"text": "117", "page": 121, "section": null, "tags": []}, "B3442": {"text": "（1）基金财产清算组", "page": 121, "section": null, "tags": []}, "B3443": {"text": "1)基金合同终止时，成立基金财产清算组，基金财产清算组在中国证监会的监督下进", "page": 121, "section": null, "tags": []}, "B3444": {"text": "行基金清算。", "page": 121, "section": null, "tags": []}, "B3445": {"text": "2)基金财产清算组成员由基金管理人、基金托管人、具有从事证券相关业务资格的注", "page": 121, "section": null, "tags": []}, "B3446": {"text": "册会计师、 律师以及中国证监会指定的人员组成。 基金财产清算组可以聘用必要的工作人员。", "page": 121, "section": null, "tags": []}, "B3447": {"text": "3)在基金财产清算过程中，基金管理人和基金托管人应各自履行职责，继续忠实、勤", "page": 121, "section": null, "tags": []}, "B3448": {"text": "勉、尽责地履行基金合同和本托管协议规定的义务，维护基金份额持有人的合法权益。", "page": 121, "section": null, "tags": []}, "B3449": {"text": "4)基金财产清算组负责基金财产的保管、清理、估价、变现和分配。基金财产清算组", "page": 121, "section": null, "tags": ["流动性风险"]}, "B3450": {"text": "可以依法进行必要的民事活动。", "page": 121, "section": null, "tags": []}, "B3451": {"text": "（2）基金财产清算程序", "page": 121, "section": null, "tags": []}, "B3452": {"text": "基金合同终止，应当按法律法规和本基金合同的有关规定对基金财产进行清算。基金", "page": 121, "section": null, "tags": []}, "B3453": {"text": "财产清算程序主要包括：", "page": 121, "section": null, "tags": []}, "B3454": {"text": "1)基金合同终止后，发布基金财产清算公告；", "page": 121, "section": null, "tags": []}, "B3455": {"text": "2)基金合同终止时，由基金财产清算组统一接管基金财产；", "page": 121, "section": null, "tags": []}, "B3456": {"text": "3)对基金财产进行清理和确认；", "page": 121, "section": null, "tags": []}, "B3457": {"text": "4)对基金财产进行估价和变现；", "page": 121, "section": null, "tags": ["流动性风险"]}, "B3458": {"text": "5)聘请律师事务所出具法律意见书；", "page": 121, "section": null, "tags": []}, "B3459": {"text": "6)聘请会计师事务所对清算报告进行审计；", "page": 121, "section": null, "tags": []}, "B3460": {"text": "7)将基金财产清算结果报告中国证监会；", "page": 121, "section": null, "tags": []}, "B3461": {"text": "8)参加与基金财产有关的民事诉讼；", "page": 121, "section": null, "tags": []}, "B3462": {"text": "9)公布基金财产清算结果；", "page": 121, "section": null, "tags": []}, "B3463": {"text": "10)对基金剩余财产进行分配。", "page": 121, "section": null, "tags": []}, "B3464": {"text": "（3）清算费用", "page": 121, "section": null, "tags": []}, "B3465": {"text": "清算费用是指基金财产清算组在进行基金财产清算过程中发生的所有合理费用，清算", "page": 121, "section": null, "tags": []}, "B3466": {"text": "费用由基金财产清算组优先从基金财产中支付。", "page": 121, "section": null, "tags": []}, "B3467": {"text": "（4）基金财产按下列顺序清偿：", "page": 121, "section": null, "tags": []}, "B3468": {"text": "1)支付清算费用；", "page": 121, "section": null, "tags": []}, "B3469": {"text": "2)交纳所欠税款；", "page": 121, "section": null, "tags": []}, "B3470": {"text": "3)清偿基金债务；", "page": 121, "section": null, "tags": []}, "B3471": {"text": "4)按基金份额持有人持有的基金份额比例进行分配。", "page": 121, "section": null, "tags": []}, "B3472": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 122, "section": null, "tags": ["市场风险"]}, "B3473": {"text": "118", "page": 122, "section": null, "tags": []}, "B3474": {"text": "基金财产未按前款1)－3)项规定清偿前，不分配给基金份额持有人。", "page": 122, "section": null, "tags": []}, "B3475": {"text": "（5）基金财产清算的公告", "page": 122, "section": null, "tags": []}, "B3476": {"text": "基金财产清算公告于基金合同终止并报中国证监会备案后5个工作日内由基金财产清", "page": 122, "section": null, "tags": []}, "B3477": {"text": "算组公告；清算过程中的有关重大事项须及时公告；基金财产清算结果经会计师事务所审计，", "page": 122, "section": null, "tags": []}, "B3478": {"text": "律师事务所出具法律意见书后，由基金财产清算组报中国证监会备案并公告。", "page": 122, "section": null, "tags": []}, "B3479": {"text": "（6）基金财产清算账册及文件的保存", "page": 122, "section": null, "tags": []}, "B3480": {"text": "基金财产清算账册及有关文件由基金托管人保存15年以上。", "page": 122, "section": null, "tags": []}, "B3481": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 123, "section": null, "tags": ["市场风险"]}, "B3482": {"text": "119", "page": 123, "section": null, "tags": []}, "B3483": {"text": "二十三、对基金份额持有人的服务", "page": 123, "section": null, "tags": []}, "B3484": {"text": "基金管理人承诺为基金份额持有人提供一系列的服务。 基金管理人有权根据基金份额持", "page": 123, "section": null, "tags": []}, "B3485": {"text": "有人的需要和市场的变化，增加或变更服务项目及内容。主要服务内容如下：", "page": 123, "section": null, "tags": []}, "B3486": {"text": "投资人更改个人信息资料， 请及时到原开立华宝基金账户的销售网点或其网上交易系统", "page": 123, "section": null, "tags": []}, "B3487": {"text": "更改。", "page": 123, "section": null, "tags": []}, "B3488": {"text": "在从销售机构获取准确的客户地址、邮编和电子邮箱地址的前提下", "page": 123, "section": null, "tags": []}, "B3489": {"text": "基金管理人将在每月度结束后的3个工作日内，向已经定制了电子对账单服务的基金份", "page": 123, "section": null, "tags": []}, "B3490": {"text": "额持有人提供电子对账单。如基金持有人因特殊原因需要获取指定期间的纸质对账单，可拨", "page": 123, "section": null, "tags": []}, "B3491": {"text": "打我公司客服电话400-700-5588（免长途话费） 、021-38924558，按“0”转人工服务，提供", "page": 123, "section": null, "tags": []}, "B3492": {"text": "姓名、开户证件号码或基金账号、邮寄地址、邮政编码、联系电话，客服人员核对信息无误", "page": 123, "section": null, "tags": []}, "B3493": {"text": "后，为基金持有人免费邮寄纸质对账单。", "page": 123, "section": null, "tags": []}, "B3494": {"text": "3．其他相关的信息资料", "page": 123, "section": null, "tags": []}, "B3495": {"text": "1、定义", "page": 123, "section": null, "tags": []}, "B3496": {"text": "本基金的＂定期定额投资计划＂是指投资人可通过本基金管理人指定的销售机构提交", "page": 123, "section": null, "tags": []}, "B3497": {"text": "申请，约定每月扣款时间、扣款金额，由指定的销售机构于每月约定扣款日在投资人指定资", "page": 123, "section": null, "tags": []}, "B3498": {"text": "金账户内自动完成扣款和基金申购申请的一种长期投资方式。投资者在办理本业务的同时，", "page": 123, "section": null, "tags": ["机制特有风险"]}, "B3499": {"text": "仍然可以进行日常申购、赎回业务。具体实施时间和业务规则将在本基金开放申购赎回后公", "page": 123, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B3500": {"text": "告。", "page": 123, "section": null, "tags": []}, "B3501": {"text": "2、办理时间", "page": 123, "section": null, "tags": []}, "B3502": {"text": "本业务申请受理时间为开放式基金法定开放日9：30－15：00", "page": 123, "section": null, "tags": []}, "B3503": {"text": "3、办理场所", "page": 123, "section": null, "tags": []}, "B3504": {"text": "目前， 我公司直销e网金、 部分代销机构已开通本基金人民币份额的定期定额投资业务。", "page": 123, "section": null, "tags": []}, "B3505": {"text": "其中，中国建设银行只接受个人投资者的申请。", "page": 123, "section": null, "tags": []}, "B3506": {"text": "美元份额定期定额投资业务的销售机构仅有中国建设银行。 各销售机构开始办理基金定", "page": 123, "section": null, "tags": []}, "B3507": {"text": "期定额投资业务的时间、网点等信息，请以销售机构的规定为准。", "page": 123, "section": null, "tags": []}, "B3508": {"text": "具体代销机构将另行公告。", "page": 123, "section": null, "tags": []}, "B3509": {"text": "4、申请方式", "page": 123, "section": null, "tags": []}, "B3510": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 124, "section": null, "tags": ["市场风险"]}, "B3511": {"text": "120", "page": 124, "section": null, "tags": []}, "B3512": {"text": "（1）凡申请办理本业务的投资者，须先开立本公司开放式基金账户（已开户者除外） ，", "page": 124, "section": null, "tags": []}, "B3513": {"text": "具体开户程序应遵循销售机构的相关规定。", "page": 124, "section": null, "tags": []}, "B3514": {"text": "（2）已开立本公司开放式基金账户的投资者，请到销售机构的各营业网点申请办理此", "page": 124, "section": null, "tags": []}, "B3515": {"text": "项业务，具体办理程序应遵循各销售机构的相关规定。", "page": 124, "section": null, "tags": []}, "B3516": {"text": "5、扣款日期", "page": 124, "section": null, "tags": []}, "B3517": {"text": "投资者应遵循销售机构的规定并与销售机构约定每月固定扣款日期。 如果在约定的扣款", "page": 124, "section": null, "tags": []}, "B3518": {"text": "日前投资者开办定期定额投资业务的申请得到成功确认， 则首次扣款日为当月， 否则为次月。", "page": 124, "section": null, "tags": []}, "B3519": {"text": "6、扣款方式", "page": 124, "section": null, "tags": []}, "B3520": {"text": "销售机构将按照投资者申请时所约定的每月固定扣款日、扣款金额扣款，若遇非基金开", "page": 124, "section": null, "tags": []}, "B3521": {"text": "放日则顺延到下一基金开放日；如因投资者提交变更、解约等申请而使扣款信息与注册登记", "page": 124, "section": null, "tags": []}, "B3522": {"text": "机构确认的约定信息不符或基金管理人发布暂停定期定额投资业务公告等情况， 则此次扣款", "page": 124, "section": null, "tags": []}, "B3523": {"text": "不成功。投资者需指定一个销售机构认可的资金账户作为每月固定扣款账户。如投资者账户", "page": 124, "section": null, "tags": []}, "B3524": {"text": "余额不足的，应遵循相关销售机构的规定处理。", "page": 124, "section": null, "tags": []}, "B3525": {"text": "7、申购费率", "page": 124, "section": null, "tags": ["机制特有风险"]}, "B3526": {"text": "如无另行规定(详细情况请参见各销售机构相关业务公告)， 定期定额申购费率及计费方", "page": 124, "section": null, "tags": ["机制特有风险"]}, "B3527": {"text": "式等同于正常的申购业务。", "page": 124, "section": null, "tags": ["机制特有风险"]}, "B3528": {"text": "8、交易确认", "page": 124, "section": null, "tags": []}, "B3529": {"text": "每月实际扣款日即为基金申购申请日，并以该日（T日）的基金份额净值为基准计算申", "page": 124, "section": null, "tags": ["机制特有风险"]}, "B3530": {"text": "购份额，投资者可自T+3工作日起查询本基金定期定额申购确认情况。", "page": 124, "section": null, "tags": ["机制特有风险"]}, "B3531": {"text": "9、本业务的变更和终止", "page": 124, "section": null, "tags": []}, "B3532": {"text": "（1）投资者变更每月扣款金额、扣款日期、扣款账户等信息，须到原销售网点申请办", "page": 124, "section": null, "tags": []}, "B3533": {"text": "理业务变更手续，具体办理程序应遵各销售机构的相关规定；", "page": 124, "section": null, "tags": []}, "B3534": {"text": "（2）投资者终止本业务，须到销售机构申请办理业务终止手续，具体办理程序应遵循", "page": 124, "section": null, "tags": []}, "B3535": {"text": "各销售机构的相关规定；", "page": 124, "section": null, "tags": []}, "B3536": {"text": "（3）本业务变更和终止的生效日应遵循各销售机构的具体规定。", "page": 124, "section": null, "tags": []}, "B3537": {"text": "基金管理人可以根据相关法律法规以及基金合同的规定， 在条件成熟的情况下提供本基", "page": 124, "section": null, "tags": []}, "B3538": {"text": "金与基金管理人管理的其他基金之间的转换服务。基金转换可以收取一定的转换费，相关规", "page": 124, "section": null, "tags": []}, "B3539": {"text": "则由基金管理人届时根据相关法律法规及基金合同的规定制定并公告， 并提前告知基金托管", "page": 124, "section": null, "tags": []}, "B3540": {"text": "人与相关机构。", "page": 124, "section": null, "tags": []}, "B3541": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 125, "section": null, "tags": ["市场风险"]}, "B3542": {"text": "121", "page": 125, "section": null, "tags": []}, "B3543": {"text": "基金管理人利用自己的网站（www.fsfund.com） 为基金投资人提供网上查询、网上资讯", "page": 125, "section": null, "tags": []}, "B3544": {"text": "服务。", "page": 125, "section": null, "tags": []}, "B3545": {"text": "1．投资人如果想了解申购与赎回的交易情况、基金账户份额、基金产品与服务等信息，", "page": 125, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B3546": {"text": "可拨打华宝基金管理有限公司如下电话：", "page": 125, "section": null, "tags": []}, "B3547": {"text": "电话呼叫中心：021—38924558（未开通4007电话地区） 、4007005588， 该电话可转人", "page": 125, "section": null, "tags": []}, "B3548": {"text": "工座席。", "page": 125, "section": null, "tags": []}, "B3549": {"text": "直销中心电话：021-38505731、021-38505732", "page": 125, "section": null, "tags": []}, "B3550": {"text": "传真：021-50499663、50988055", "page": 125, "section": null, "tags": []}, "B3551": {"text": "2．互联网站", "page": 125, "section": null, "tags": []}, "B3552": {"text": "公司网址：www.fsfund.com", "page": 125, "section": null, "tags": []}, "B3553": {"text": "电子信箱：fsf@fsfund.com", "page": 125, "section": null, "tags": []}, "B3554": {"text": "投资人可以通过基金管理人提供的呼叫中心人工座席、书信、电子邮件、传真等渠道对", "page": 125, "section": null, "tags": []}, "B3555": {"text": "基金管理人和销售机构所提供的服务进行投诉或提出建议。 投资人还可以通过代销机构的服", "page": 125, "section": null, "tags": []}, "B3556": {"text": "务电话对该代销机构提供的服务进行投诉。", "page": 125, "section": null, "tags": []}, "B3557": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 126, "section": null, "tags": ["市场风险"]}, "B3558": {"text": "122", "page": 126, "section": null, "tags": []}, "B3559": {"text": "二十四、其他应披露事项", "page": 126, "section": null, "tags": []}, "B3560": {"text": "本报告期内，本基金在指定媒介刊登的公告如下：", "page": 126, "section": null, "tags": []}, "B3561": {"text": "公告日期 公告名称", "page": 126, "section": null, "tags": []}, "B3562": {"text": "2022/02/28 关于华宝标普石油天然气上游股票指数证券投资基金(LOF)C类新增交通银", "page": 126, "section": null, "tags": ["市场风险"]}, "B3563": {"text": "行为代销机构的公告", "page": 126, "section": null, "tags": []}, "B3564": {"text": "2022/02/17 华宝标普石油天然气上游股票指数证券投资基金（LOF） 因基金投资的主要市", "page": 126, "section": null, "tags": ["市场风险"]}, "B3565": {"text":
