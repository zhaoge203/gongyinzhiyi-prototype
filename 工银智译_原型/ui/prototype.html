]}, "B074": {"text": "放时间", "page": 3, "section": null, "tags": []}, "B075": {"text": "封闭期过后每个工作日为开放日，开放日的 9:00 至 17:00 为开放", "page": 3, "section": null, "tags": []}, "B076": {"text": "时间。", "page": 3, "section": null, "tags": []}, "B077": {"text": "申购/赎回时", "page": 3, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B078": {"text": "1.封闭期过后，本份额客户可于开放日的09:00 至 17:00 进行申购", "page": 3, "section": null, "tags": ["机制特有风险"]}, "B079": {"text": "或赎回(赎回份额需满足【最短持有期限】条件)，投资管理人在开", "page": 3, "section": null, "tags": ["流动性风险"]}, "B080": {"text": "放日后 2 个工作日内确认客户申购或赎回是否成功。开放日内", "page": 3, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B081": {"text": "09:00 至 17:00 可对当日开放时间内提交的申赎申请进行撤单。代", "page": 3, "section": null, "tags": []}, "B082": {"text": "理销售机构实际受理撤单时间与说明书不一致的，具体以代理销", "page": 3, "section": null, "tags": []}, "B083": {"text": "售机构对客展示页面为准。2.支持客户预约申购或赎回，预约申", "page": 3, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B084": {"text": "请至下一开放时间未撤销则转为正式申购或赎回申请。客户在开放", "page": 3, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B085": {"text": "日的开放时间内提出申购或赎回申请，则该日视为申请当日；客户", "page": 3, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B086": {"text": "在开放日的非开放时间内或非开放日提交的申赎申请，转为正式申", "page": 3, "section": null, "tags": []}, "B087": {"text": "赎申请的日期（如有）为申请当日。正式申购或赎回申请的撤单规", "page": 3, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B088": {"text": "则同开放日当日申购或赎回申请的撤单规则。代理销售机构实际", "page": 3, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B089": {"text": "申赎预约规则与说明书不一致的，具体以代理销售机构为准。", "page": 3, "section": null, "tags": []}, "B090": {"text": "申购/赎回规", "page": 3, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B091": {"text": "本理财产品采用金额申购、份额赎回的原则，即申购以金额申请，", "page": 3, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B092": {"text": "赎回以份额申请。", "page": 3, "section": null, "tags": ["流动性风险"]}, "B093": {"text": "产品申购确", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B094": {"text": "1.申购遵循“未知价”原则，即申购金额按申购申请当日产品单位", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B095": {"text": "净值折算份额，投资管理人在申购申请当日后2 个工作日内确认客", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B096": {"text": "户申购是否成功。若申购不成功，申购的投资资金将于确认日后 3", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B097": {"text": "个工作日内返还至客户账户。2.理财产品某类份额申购份额=理财", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B098": {"text": "产品该类份额申购金额/申购申请当日理财产品该类份额单位净", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B099": {"text": "值，申购份额保留至 0.01 份理财产品份额，小数点后两位以下四", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B100": {"text": "舍五入。3.为满足监管要求，如新增申购使得单一投资者持有份额", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B101": {"text": "比例超过 50%，投资管理人将不再接受超出部分的申购申请。非因", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B102": {"text": "投资管理人主观因素导致突破前款规定比例限制的，在单一投资者", "page": 4, "section": null, "tags": []}, "B103": {"text": "持有比例降至 50%以下之前，投资管理人将不再接受该投资者对该", "page": 4, "section": null, "tags": []}, "B104": {"text": "理财产品的申购申请。投资者持有份额的计算以工银理财登记为", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B105": {"text": "准。", "page": 4, "section": null, "tags": []}, "B106": {"text": "产品赎回确", "page": 4, "section": null, "tags": ["流动性风险"]}, "B107": {"text": "1.赎回按照“未知价”原则，即赎回金额按照客户实际赎回份额与", "page": 4, "section": null, "tags": ["流动性风险"]}, "B108": {"text": "赎回申请当日产品单位净值计算，投资管理人在赎回申请当日后 2", "page": 4, "section": null, "tags": ["流动性风险"]}, "B109": {"text": "个工作日内确认客户赎回是否成功，赎回的资金将于赎回申请当日", "page": 4, "section": null, "tags": ["流动性风险"]}, "B110": {"text": "后 3 个工作日内到账。 2.理财产品某类份额赎回金额＝理财产品", "page": 4, "section": null, "tags": ["流动性风险"]}, "B111": {"text": "该类份额赎回份额×赎回申请当日理财产品该类份额单位净值，赎", "page": 4, "section": null, "tags": ["流动性风险"]}, "B112": {"text": "回金额保留至小数点后两位，小数点后两位以下四舍五入。", "page": 4, "section": null, "tags": []}, "B113": {"text": "投资管理人 工银理财有限责任公司", "page": 4, "section": null, "tags": []}, "B114": {"text": "理财产品托", "page": 4, "section": null, "tags": []}, "B115": {"text": "管人", "page": 4, "section": null, "tags": []}, "B116": {"text": "中国工商银行股份有限公司，产品托管人主要负责依法依规提供账", "page": 4, "section": null, "tags": []}, "B117": {"text": "户开立、财产保管、清算交割、会计核算、资产估值、信息披露、", "page": 4, "section": null, "tags": []}, "B118": {"text": "投资监督以及托管合同约定的相关服务。", "page": 4, "section": null, "tags": []}, "B119": {"text": "认购费率", "page": 4, "section": null, "tags": []}, "B120": {"text": "（年） 0％（年）", "page": 4, "section": null, "tags": []}, "B121": {"text": "申购费率", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B122": {"text": "（年） 0％（年）", "page": 4, "section": null, "tags": []}, "B123": {"text": "赎回费率", "page": 4, "section": null, "tags": ["流动性风险"]}, "B124": {"text": "（年） 0％（年）", "page": 4, "section": null, "tags": []}, "B125": {"text": "托管费率", "page": 4, "section": null, "tags": []}, "B126": {"text": "（年） 0.02％（年）", "page": 4, "section": null, "tags": []}, "B127": {"text": "销售服务费 F 份额：0.30％（年）。", "page": 4, "section": null, "tags": []}, "B128": {"text": "率（年）", "page": 5, "section": null, "tags": []}, "B129": {"text": "固定管理费", "page": 5, "section": null, "tags": []}, "B130": {"text": "率（年） 0.10％（年）", "page": 5, "section": null, "tags": []}, "B131": {"text": "浮动管理费", "page": 5, "section": null, "tags": []}, "B132": {"text": "率（年） 本产品暂不收取浮动管理费。", "page": 5, "section": null, "tags": []}, "B133": {"text": "业绩比较基", "page": 5, "section": null, "tags": []}, "B134": {"text": "本产品业绩比较基准（年化）为 2.5％-3.0％，业绩比较基准由投", "page": 5, "section": null, "tags": []}, "B135": {"text": "资管理人依据理财产品的投资范围及比例、投资策略，并综合考量", "page": 5, "section": null, "tags": []}, "B136": {"text": "市场环境等因素测算。 本理财产品为固定收益类产品，产品主要", "page": 5, "section": null, "tags": []}, "B137": {"text": "投资于固定收益类资产，挖掘固收市场投资机会，适度配置权益类", "page": 5, "section": null, "tags": []}, "B138": {"text": "等资产，防控投资风险。 业绩比较基准测算：以产品投资存款类", "page": 5, "section": null, "tags": []}, "B139": {"text": "及货币市场工具类 0％-50％，利率债 0％-50％，信用债 50％", "page": 5, "section": null, "tags": ["市场风险", "信用风险"]}, "B140": {"text": "-100％，债券型基金 0％-80％，非标准化债权资产 0％-50％（不", "page": 5, "section": null, "tags": []}, "B141": {"text": "含），权益类资产0-5％、衍生品类资产 0-5％，杠杆率 100％-130％", "page": 5, "section": null, "tags": ["杠杆风险"]}, "B142": {"text": "为例，业绩比较基准参考：货币市场工具、现金等流动性较高的资", "page": 5, "section": null, "tags": ["流动性风险"]}, "B143": {"text": "产，可参考中债（0-1 年）国债财富指数、中证货币基金指数收益", "page": 5, "section": null, "tags": ["市场风险"]}, "B144": {"text": "等，含信用债、利率债等债券类资产，可结合产品期限参考“中债", "page": 5, "section": null, "tags": ["市场风险", "信用风险"]}, "B145": {"text": "-高信用等级中期票据全价(1-3 年)指数年化收益率（万得代码：", "page": 5, "section": null, "tags": ["市场风险", "信用风险"]}, "B146": {"text": "CBA03423）”含权益类资产，可参考沪深 300 指数收益率等，含非", "page": 5, "section": null, "tags": ["市场风险"]}, "B147": {"text": "标债权类资产，可参考期限匹配的非标资产收益率等，考虑资本利", "page": 5, "section": null, "tags": []}, "B148": {"text": "得收益并结合产品投资策略、产品费用等进行测算。(产品示例仅", "page": 5, "section": null, "tags": []}, "B149": {"text": "供参考，具体投资比例可根据各类资产的收益水平、流动性特征、", "page": 5, "section": null, "tags": ["流动性风险"]}, "B150": {"text": "信用风险等因素动态调整，投资范围、投资限制、投资策略详见产", "page": 5, "section": null, "tags": ["信用风险"]}, "B151": {"text": "品说明书。) 业绩比较基准是本机构基于产品性质、投资策略、", "page": 5, "section": null, "tags": []}, "B152": {"text": "过往经验等因素对产品设定的投资目标，不是预期收益率，不代", "page": 5, "section": null, "tags": []}, "B153": {"text": "表产品的未来表现和实际收益，不构成对产品收益的承诺。业绩", "page": 5, "section": null, "tags": []}, "B154": {"text": "比较基准仅用于评价投资结果和测算业绩报酬，当监管政策、市场", "page": 5, "section": null, "tags": []}, "B155": {"text": "环境、产品性质等因素发生变化，投资管理人在符合监管政策要求", "page": 5, "section": null, "tags": []}, "B156": {"text": "下可调整产品业绩比较基准，并提前通过本产品说明书信息披露章", "page": 5, "section": null, "tags": []}, "B157": {"text": "节约定的信息披露渠道公布调整情况和调整原因。", "page": 5, "section": null, "tags": []}, "B158": {"text": "购买金额 1 元起购，以 1 元的整数倍递增", "page": 5, "section": null, "tags": []}, "B159": {"text": "理财账户最", "page": 5, "section": null, "tags": []}, "B160": {"text": "低保留份额", "page": 5, "section": null, "tags": []}, "B161": {"text": "1 份，当剩余份额不足 1 份时，应一次性申请赎回其持有的全部理", "page": 5, "section": null, "tags": ["流动性风险"]}, "B162": {"text": "财份额。", "page": 5, "section": null, "tags": []}, "B163": {"text": "巨额赎回", "page": 5, "section": null, "tags": ["流动性风险"]}, "B164": {"text": "巨额赎回，是指开放式理财产品单个开放日净赎回申请（赎回申请", "page": 5, "section": null, "tags": ["流动性风险"]}, "B165": {"text": "份额总数扣除认、申购申请份额总数）超过前一日终理财产品总份", "page": 5, "section": null, "tags": ["机制特有风险"]}, "B166": {"text": "额的 10％的赎回行为，监管机构另有规定的除外。", "page": 5, "section": null, "tags": ["流动性风险"]}, "B167": {"text": "当投资管理人认为支付投资者的赎回申请有困难或认为支付投资", "page": 6, "section": null, "tags": ["流动性风险"]}, "B168": {"text": "人的赎回申请可能会对理财产品净值造成较大波动时，在当日接受", "page": 6, "section": null, "tags": ["流动性风险"]}, "B169": {"text": "赎回比例不低于理财产品总份额的 10％的前提下，投资管理人对", "page": 6, "section": null, "tags": ["流动性风险"]}, "B170": {"text": "其余赎回申请予以暂停接受或延期办理。对于接受赎回部分，按照", "page": 6, "section": null, "tags": ["流动性风险"]}, "B171": {"text": "正常赎回流程办理。", "page": 6, "section": null, "tags": ["流动性风险"]}, "B172": {"text": "对该产品单个份额持有人的赎回申请，投资管理人将按照其申请占", "page": 6, "section": null, "tags": ["流动性风险"]}, "B173": {"text": "当日申请赎回总份额的比例，确定该份额持有人当日办理的赎回份", "page": 6, "section": null, "tags": ["流动性风险"]}, "B174": {"text": "额。理财产品份额持有人可以在申请赎回时选择将当日未获办理部", "page": 6, "section": null, "tags": ["流动性风险"]}, "B175": {"text": "分予以撤销。理财产品份额持有人未选择撤销的，投资管理人可以", "page": 6, "section": null, "tags": []}, "B176": {"text": "予以拒绝办理。", "page": 6, "section": null, "tags": []}, "B177": {"text": "开放式理财产品连续 2 个以上开放日发生巨额赎回的，对于已经接", "page": 6, "section": null, "tags": ["流动性风险"]}, "B178": {"text": "受的赎回申请，投资管理人可以延缓支付赎回款项，但延缓期限不", "page": 6, "section": null, "tags": ["流动性风险"]}, "B179": {"text": "得超过 20 个工作日。", "page": 6, "section": null, "tags": []}, "B180": {"text": "若监管有最新规定的，投资管理人将按照最新规定执行。", "page": 6, "section": null, "tags": []}, "B181": {"text": "单位净值", "page": 6, "section": null, "tags": []}, "B182": {"text": "1.单位净值为提取相关税费（包括但不限于产品该类份额应缴增值", "page": 6, "section": null, "tags": []}, "B183": {"text": "税、应付销售服务费、托管费、固定管理费等）后的理财产品该类", "page": 6, "section": null, "tags": []}, "B184": {"text": "份额单位净值。 2.产品存续期内，每个申购开放日的产品单位净", "page": 6, "section": null, "tags": ["机制特有风险"]}, "B185": {"text": "值于该日后的 2 个工作日之内公布，如遇特殊情况以工银理财有限", "page": 6, "section": null, "tags": []}, "B186": {"text": "责任公司公告为准。", "page": 6, "section": null, "tags": []}, "B187": {"text": "分红规则", "page": 6, "section": null, "tags": []}, "B188": {"text": "当产品单位净值达到一定金额时，投资管理人有权对产品进行分", "page": 6, "section": null, "tags": []}, "B189": {"text": "红，分配方式为现金分配，投资管理人将根据理财计划投资收益情", "page": 6, "section": null, "tags": []}, "B190": {"text": "况决定分配基准日、当次分配比例和金额，并至少提前 3 个工作日", "page": 6, "section": null, "tags": []}, "B191": {"text": "发布信息披露报告。", "page": 6, "section": null, "tags": []}, "B192": {"text": "提前终止", "page": 6, "section": null, "tags": []}, "B193": {"text": "当产品份额低于 5000 万份时或本销售代码对应的产品份额低于", "page": 6, "section": null, "tags": []}, "B194": {"text": "5000 万份时，工银理财有限责任公司有权终止本产品或本销售代", "page": 6, "section": null, "tags": []}, "B195": {"text": "码对应的所有产品份额，并至少于终止日前 3 个工作日进行信息披", "page": 6, "section": null, "tags": []}, "B196": {"text": "露。终止日后 3 个工作日内将客户理财资金划入客户账户。终止日", "page": 6, "section": null, "tags": []}, "B197": {"text": "至资金实际到账日之间，客户资金不计息。为保护客户权益，在本", "page": 6, "section": null, "tags": []}, "B198": {"text": "产品存续期间投资管理人亦有权根据市场或监管政策变化情况提", "page": 6, "section": null, "tags": []}, "B199": {"text": "前终止本产品。除本说明书另有约定的情形外，客户不得提前终止", "page": 6, "section": null, "tags": []}, "B200": {"text": "本产品。", "page": 6, "section": null, "tags": []}, "B201": {"text": "募集期/开放", "page": 6, "section": null, "tags": []}, "B202": {"text": "期是否允许", "page": 6, "section": null, "tags": []}, "B203": {"text": "撤单", "page": 6, "section": null, "tags": []}, "B204": {"text": "税款 支付给客户的理财收益的应纳税款由客户自行申报及缴纳。", "page": 7, "section": null, "tags": []}, "B205": {"text": "其他规定", "page": 7, "section": null, "tags": []}, "B206": {"text": "客户在募集期及开放预约期或开放期因购买本产品冻结资金在申", "page": 7, "section": null, "tags": []}, "B207": {"text": "请日至扣款日之间按照账户计息规则计息，但利息不计入购买本金", "page": 7, "section": null, "tags": []}, "B208": {"text": "份额；开放日至赎回资金到账日之间不计利息。客户若购买本产品", "page": 7, "section": null, "tags": ["流动性风险"]}, "B209": {"text": "后欲办理销户或调整理财交易账户等操作，需确保在全额赎回本产", "page": 7, "section": null, "tags": ["流动性风险"]}, "B210": {"text": "品份额后办理。", "page": 7, "section": null, "tags": []}, "B211": {"text": "二、投资范围", "page": 7, "section": null, "tags": []}, "B212": {"text": "本产品主要投资于以下符合监管要求的各类资产：一是固定收益类资产，包括但", "page": 7, "section": null, "tags": []}, "B213": {"text": "不限于存款类资产，同业拆借、债券回购、债券借贷、存单质押等货币市场工具", "page": 7, "section": null, "tags": []}, "B214": {"text": "类投资品，利率债、同业存单、中高等级信用债，非标准化债权等；二是权益类", "page": 7, "section": null, "tags": ["市场风险", "信用风险"]}, "B215": {"text": "资产，包括但不限于优先股等；三是金融衍生品类资产，包括但不限于符合监管", "page": 7, "section": null, "tags": []}, "B216": {"text": "要求的金融衍生品类资产等，仅以套期保值为目的。", "page": 7, "section": null, "tags": []}, "B217": {"text": "本产品可以投资于以上述资产为投资对象的货币基金、债券基金、股票型基金、", "page": 7, "section": null, "tags": []}, "B218": {"text": "混合型基金，及其他符合监管要求的公募证券投资基金。", "page": 7, "section": null, "tags": []}, "B219": {"text": "直接和间接各投资资产种类占总投资资产的计划投资比例如下：", "page": 7, "section": null, "tags": []}, "B220": {"text": "资产类别 资产种类 投资比例", "page": 7, "section": null, "tags": []}, "B221": {"text": "固定收益类", "page": 7, "section": null, "tags": []}, "B222": {"text": "存款类资产，同业拆借、债券回购、债券借贷、存", "page": 7, "section": null, "tags": []}, "B223": {"text": "单质押等货币市场工具类投资品", "page": 7, "section": null, "tags": []}, "B224": {"text": "80%-100%利率债、同业存单、中高等级信用债", "page": 7, "section": null, "tags": ["市场风险", "信用风险"]}, "B225": {"text": "非标准化债权等其他符合监管要求的债权类资产", "page": 7, "section": null, "tags": []}, "B226": {"text": "权益类", "page": 7, "section": null, "tags": []}, "B227": {"text": "优先股 0%-20%", "page": 7, "section": null, "tags": []}, "B228": {"text": "其他符合监管要求的权益类资产 0%-10%", "page": 7, "section": null, "tags": []}, "B229": {"text": "金融衍生品类资", "page": 7, "section": null, "tags": []}, "B230": {"text": "产 符合监管要求的金融衍生品类资产 0%-5%", "page": 7, "section": null, "tags": []}, "B231": {"text": "如遇市场变化导致各类投资品投资比例暂时超出以上范围，为保护投资者利益，", "page": 7, "section": null, "tags": []}, "B232": {"text": "工银理财有限责任公司将在 15 个工作日内调整至上述比例范围。", "page": 7, "section": null, "tags": []}, "B233": {"text": "本产品所投资的资产或资产组合均严格经过工银理财有限责任公司审批流程审", "page": 8, "section": null, "tags": []}, "B234": {"text": "批和筛选，在投资时达到可投资标准。", "page": 8, "section": null, "tags": []}, "B235": {"text": "三、投资目标", "page": 8, "section": null, "tags": []}, "B236": {"text": "本产品投资目标是在追求业绩稳健的基础上，力争为产品份额持有人创造更好的", "page": 8, "section": null, "tags": []}, "B237": {"text": "投资收益。", "page": 8, "section": null, "tags": []}, "B238": {"text": "四、投资限制", "page": 8, "section": null, "tags": []}, "B239": {"text": "本产品所投资的资产或资产组合均严格经过工银理财有限责任公司审批流程审", "page": 8, "section": null, "tags": []}, "B240": {"text": "批和筛选，在投资时达到可投资标准。除本说明书特别约定外，资产或资产组合", "page": 8, "section": null, "tags": []}, "B241": {"text": "拟投资的各类债券信用评级均在 AA 级（含）以上。", "page": 8, "section": null, "tags": ["信用风险"]}, "B242": {"text": "理机构认可的其他证券的，单只证券的市值不得超过产品净资产的 10%；国债、", "page": 8, "section": null, "tags": []}, "B243": {"text": "地方政府债券、中央银行票据、政府机构债券、政策性金融债券以及完全按照有", "page": 8, "section": null, "tags": []}, "B244": {"text": "关指数的构成比例进行投资的除外；", "page": 8, "section": null, "tags": ["市场风险"]}, "B245": {"text": "不符合上述规定投资比例的，投资管理人应当在 10 个交易日内进行调整。", "page": 8, "section": null, "tags": []}, "B246": {"text": "五、投资管理人、销售机构、托管机构、理财投资合作机构的基本信息", "page": 8, "section": null, "tags": []}, "B247": {"text": "本产品的投资管理人为工银理财有限责任公司。工银理财有限责任公司接受客户", "page": 8, "section": null, "tags": []}, "B248": {"text": "的委托和授权，按照本产品说明书约定的投资方向和方式，进行投资和资产管理，", "page": 8, "section": null, "tags": []}, "B249": {"text": "代表理财产品签订投资和资产管理过程中涉及到的协议、合同等文本。", "page": 8, "section": null, "tags": []}, "B250": {"text": "F 份额：", "page": 8, "section": null, "tags": []}, "B251": {"text": "名称：中国银行股份有限公司（简称“中国银行”）", "page": 8, "section": null, "tags": []}, "B252": {"text": "住所：北京市西城区复兴门内大街 1 号（100032）", "page": 8, "section": null, "tags": []}, "B253": {"text": "主要职责：销售机构负责提供理财产品宣传推广、投资者风险承受能力评估和投", "page": 8, "section": null, "tags": []}, "B254": {"text": "资者适当性管理、理财产品份额认购/申购/赎回、协助理财产品管理人与投资者", "page": 8, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B255": {"text": "签订理财产品销售文件、协助投资者与产品管理人沟通及进行信息披露、接受投", "page": 8, "section": null, "tags": []}, "B256": {"text": "资者咨询和投资者维护等销售服务。", "page": 8, "section": null, "tags": []}, "B257": {"text": "名称：中国工商银行股份有限公司（简称“工商银行”）", "page": 8, "section": null, "tags": []}, "B258": {"text": "住所：北京市西城区复兴门内大街 55 号（100032）", "page": 8, "section": null, "tags": []}, "B259": {"text": "理财投资合作机构包括但不限于理财产品所投资资产管理产品的发行机构、根据", "page": 9, "section": null, "tags": []}, "B260": {"text": "合同约定从事理财产品受托投资的机构以及与理财产品投资管理相关的投资顾", "page": 9, "section": null, "tags": []}, "B261": {"text": "问等。主要职责：理财投资合作机构为进行受托资金的投资管理，根据合同约定", "page": 9, "section": null, "tags": []}, "B262": {"text": "从事受托投资或提供投资顾问等服务，具体职责以投资管理人与投资合作机构签", "page": 9, "section": null, "tags": []}, "B263": {"text": "署的合同为准。本理财产品投资合作机构可能包括但不限于:中信证券资产管理", "page": 9, "section": null, "tags": []}, "B264": {"text": "有限公司，投资管理人可根据产品实际运作情况，在符合监管要求的前提下调整", "page": 9, "section": null, "tags": []}, "B265": {"text": "理财投资合作机构。", "page": 9, "section": null, "tags": []}, "B266": {"text": "六、理财产品单位净值及份额的计算", "page": 9, "section": null, "tags": []}, "B267": {"text": "理财产品总净值=理财产品认申购总金额+理财产品所获总收益-理财产品总税费", "page": 9, "section": null, "tags": ["机制特有风险"]}, "B268": {"text": "（包括但不限于产品应缴增值税、应付销售服务费、托管费、管理费等）-理财", "page": 9, "section": null, "tags": []}, "B269": {"text": "产品累计终止、赎回和现金分红总金额（如有）。", "page": 9, "section": null, "tags": ["流动性风险"]}, "B270": {"text": "理财产品某类份额总净值：理财产品某类份额总净值=理财产品某类份额认申购", "page": 9, "section": null, "tags": ["机制特有风险"]}, "B271": {"text": "总金额+理财产品某类份额所获总收益-理财产品某类份额总税费（包括但不限于", "page": 9, "section": null, "tags": []}, "B272": {"text": "该类份额应缴增值税、应付销售服务费、托管费、管理费等）-理财产品某类份", "page": 9, "section": null, "tags": []}, "B273": {"text": "额累计终止、赎回和现金分红总金额（如有）。", "page": 9, "section": null, "tags": ["流动性风险"]}, "B274": {"text": "理财产品某类份额的单位净值=理财产品该类份额总净值/理财产品该类份额总", "page": 9, "section": null, "tags": []}, "B275": {"text": "存续份额。产品份额单位净值单位为元，计算结果保留至小数点后四位，第五位", "page": 9, "section": null, "tags": []}, "B276": {"text": "四舍五入。", "page": 9, "section": null, "tags": []}, "B277": {"text": "理财产品某类份额申购份额=理财产品该类份额申购金额/申购申请当日理财产", "page": 9, "section": null, "tags": ["机制特有风险"]}, "B278": {"text": "品该类份额单位净值，申购份额保留至 0.01 份理财产品份额，小数点后两位以", "page": 9, "section": null, "tags": ["机制特有风险"]}, "B279": {"text": "下四舍五入。", "page": 9, "section": null, "tags": []}, "B280": {"text": "单位净值为提取相关税费（包括但不限于产品该类份额应缴增值税、应付销售服", "page": 9, "section": null, "tags": []}, "B281": {"text": "务费、托管费、固定管理费等）后的理财产品该类份额单位净值。", "page": 9, "section": null, "tags": []}, "B282": {"text": "七、认购、申购", "page": 9, "section": null, "tags": ["机制特有风险"]}, "B283": {"text": "1、认购期为 2021 年 12 月 2 日-2021 年 12 月 8 日，根据市场情况，投资管理人", "page": 9, "section": null, "tags": []}, "B284": {"text": "有权提前结束认购并相应调整相关日期。", "page": 9, "section": null, "tags": []}, "B285": {"text": "2、认购费率为 0%。", "page": 9, "section": null, "tags": []}, "B286": {"text": "认购份额＝认购金额/1 元", "page": 9, "section": null, "tags": []}, "B287": {"text": "认购份额保留至 0.01 份理财产品份额，小数点后两位以下四舍五入。", "page": 9, "section": null, "tags": []}, "B288": {"text": "1、本产品开放日为产品封闭期结束后的每个工作日，F 份额开放时间为开放日", "page": 10, "section": null, "tags": []}, "B289": {"text": "的 9:00 至 17:00。客户可在开放日开放时间提交申购申请，非开放时间提交的", "page": 10, "section": null, "tags": ["机制特有风险"]}, "B290": {"text": "申购、赎回申请属于预约交易自动延至下一开放日处理。", "page": 10, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B291": {"text": "2、当规模达到上限或投资管理人认为申购会影响到客户利益时，将暂停申购, 并", "page": 10, "section": null, "tags": ["机制特有风险"]}, "B292": {"text": "进行相应公告。", "page": 10, "section": null, "tags": []}, "B293": {"text": "3、不可抗力原因导致本理财产品无法正常运作时，或发生其他投资管理人认为", "page": 10, "section": null, "tags": []}, "B294": {"text": "需要暂停接受投资人的认申购申请的情况，投资管理人有权拒绝或暂停认申购。", "page": 10, "section": null, "tags": ["机制特有风险"]}, "B295": {"text": "4、申购费率为 0%。", "page": 10, "section": null, "tags": ["机制特有风险"]}, "B296": {"text": "理财产品某类份额申购份额=理财产品该类份额申购金额/申购申请当日理财产", "page": 10, "section": null, "tags": ["机制特有风险"]}, "B297": {"text": "品该类份额单位净值，申购份额保留至 0.01 份理财产品份额，小数点后两位以", "page": 10, "section": null, "tags": ["机制特有风险"]}, "B298": {"text": "下四舍五入。", "page": 10, "section": null, "tags": []}, "B299": {"text": "5、为满足监管要求，如新增申购使得单一投资者持有份额比例超过 50%，投资", "page": 10, "section": null, "tags": ["机制特有风险"]}, "B300": {"text": "管理人将不再接受超出部分的申购申请。非因投资管理人主观因素导致突破前款", "page": 10, "section": null, "tags": ["机制特有风险"]}, "B301": {"text": "规定比例限制的，在单一投资者持有比例降至 50%以下之前，投资管理人将不再", "page": 10, "section": null, "tags": []}, "B302": {"text": "接受该投资者对该理财产品的申购申请。投资者持有份额的计算以工银理财登记", "page": 10, "section": null, "tags": ["机制特有风险"]}, "B303": {"text": "为准。", "page": 10, "section": null, "tags": []}, "B304": {"text": "八、赎回、提前终止及收益分配", "page": 10, "section": null, "tags": ["流动性风险"]}, "B305": {"text": "1、产品封闭期结束后，客户可于开放日办理赎回业务。", "page": 10, "section": null, "tags": ["流动性风险"]}, "B306": {"text": "2、赎回费率为 0%。", "page": 10, "section": null, "tags": ["流动性风险"]}, "B307": {"text": "3、每笔赎回申请不得低于 1 份产品份额。如果份额持有人某笔赎回将导致其持", "page": 10, "section": null, "tags": ["流动性风险"]}, "B308": {"text": "有的本产品份额不足 1 份的，工银理财有限责任公司有权视为份额持有人一次性", "page": 10, "section": null, "tags": []}, "B309": {"text": "赎回全部剩余份额。", "page": 10, "section": null, "tags": ["流动性风险"]}, "B310": {"text": "4、巨额赎回：", "page": 10, "section": null, "tags": ["流动性风险"]}, "B311": {"text": "巨额赎回，是指开放式理财产品单个开放日净赎回申请（赎回申请份额总数扣除", "page": 10, "section": null, "tags": ["流动性风险"]}, "B312": {"text": "认、申购申请份额总数）超过前一日终理财产品总份额的 10％的赎回行为，监", "page": 10, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B313": {"text": "管机构另有规定的除外。", "page": 10, "section": null, "tags": []}, "B314": {"text": "当投资管理人认为支付投资者的赎回申请有困难或认为支付投资人的赎回申请", "page": 10, "section": null, "tags": ["流动性风险"]}, "B315": {"text": "可能会对理财产品净值造成较大波动时，在当日接受赎回比例不低于理财产品总", "page": 10, "section": null, "tags": ["流动性风险"]}, "B316": {"text": "份额的 10％的前提下，投资管理人对其余赎回申请予以暂停接受或延期办理。", "page": 10, "section": null, "tags": ["流动性风险"]}, "B317": {"text": "对于接受赎回部分，按照正常赎回流程办理。", "page": 10, "section": null, "tags": ["流动性风险"]}, "B318": {"text": "对该产品单个份额持有人的赎回申请，投资管理人将按照其申请占当日申请赎回", "page": 10, "section": null, "tags": ["流动性风险"]}, "B319": {"text": "总份额的比例，确定该份额持有人当日办理的赎回份额。理财产品份额持有人可", "page": 10, "section": null, "tags": ["流动性风险"]}, "B320": {"text": "以在申请赎回时选择将当日未获办理部分予以撤销。理财产品份额持有人未选择", "page": 10, "section": null, "tags": ["流动性风险"]}, "B321": {"text": "撤销的，投资管理人可以予以拒绝办理。", "page": 10, "section": null, "tags": []}, "B322": {"text": "开放式理财产品连续 2 个以上开放日发生巨额赎回的，对于已经接受的赎回申请，", "page": 11, "section": null, "tags": ["流动性风险"]}, "B323": {"text": "投资管理人可以延缓支付赎回款项，但延缓期限不得超过 20 个工作日。", "page": 11, "section": null, "tags": ["流动性风险"]}, "B324": {"text": "若监管有最新规定的，投资管理人将按照最新规定执行。理财产品连续两个开放", "page": 11, "section": null, "tags": []}, "B325": {"text": "日（含）以上发生巨额赎回，工银理财有限责任公司有权依据产品运作情况暂停", "page": 11, "section": null, "tags": ["流动性风险"]}, "B326": {"text": "接受所有客户的赎回申请，并最迟于次一工作日通过销售机构网站、相关营业网", "page": 11, "section": null, "tags": ["流动性风险"]}, "B327": {"text": "点、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息披露渠道发布相", "page": 11, "section": null, "tags": []}, "B328": {"text": "关信息。客户根据工银理财有限责任公司披露的开放日可重新进行申购和赎回。", "page": 11, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B329": {"text": "5、不可抗力原因导致本理财产品无法正常运作时，或发生其他投资管理人认为", "page": 11, "section": null, "tags": []}, "B330": {"text": "需要暂停接受投资人的赎回申请的情况，投资管理人有权拒绝或暂停赎回。", "page": 11, "section": null, "tags": ["流动性风险"]}, "B331": {"text": "1、本产品无固定期限，当产品份额低于 5000 万份时或本销售代码对应的产品份", "page": 11, "section": null, "tags": []}, "B332": {"text": "额低于 5000 万份时，本产品投资管理人有权提前终止理财产品或本销售代码对", "page": 11, "section": null, "tags": []}, "B333": {"text": "应的所有产品份额。为保护客户权益，工银理财有权根据市场变动情况以及法律", "page": 11, "section": null, "tags": []}, "B334": {"text": "法规、监管政策变化情况提前终止本理财产品。提前终止时按客户持有的产品份", "page": 11, "section": null, "tags": []}, "B335": {"text": "额和产品单位净值进行一次性分配。", "page": 11, "section": null, "tags": []}, "B336": {"text": "2、收益分配", "page": 11, "section": null, "tags": []}, "B337": {"text": "在提前终止日，按客户持有的产品份额和产品单位净值之乘积向客户进行分配，", "page": 11, "section": null, "tags": []}, "B338": {"text": "分配时不收取赎回费。", "page": 11, "section": null, "tags": ["流动性风险"]}, "B339": {"text": "九、暂停申购、赎回的情形", "page": 11, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B340": {"text": "当接受申购申请可能对理财产品存量投资者利益构成潜在重大不利影响时，或者", "page": 11, "section": null, "tags": ["机制特有风险"]}, "B341": {"text": "基于投资运作与风险控制需要，投资管理人有权采取暂停申购等措施，以及监管", "page": 11, "section": null, "tags": ["机制特有风险"]}, "B342": {"text": "机构规定的其他措施，切实保护存量产品份额持有人的合法权益。", "page": 11, "section": null, "tags": []}, "B343": {"text": "发生以下情形时，管理人可以暂停接受投资者的申购申请：1）投资者申购申请", "page": 11, "section": null, "tags": ["机制特有风险"]}, "B344": {"text": "超过产品规模上限；2）产品资产规模过大，继续接受申购可能对产品业绩产生", "page": 11, "section": null, "tags": ["机制特有风险"]}, "B345": {"text": "负面影响，从而损害现有产品份额持有人的利益；3）当投资管理人认为某笔申", "page": 11, "section": null, "tags": []}, "B346": {"text": "购申请会有损于其他产品份额持有人利益时；4）发生产品说明书约定的暂停估", "page": 11, "section": null, "tags": []}, "B347": {"text": "值的情形时；5）法律法规规定或监管机构认定的其他情形。", "page": 11, "section": null, "tags": []}, "B348": {"text": "当产品连续 2 个开放日（含）以上发生巨额赎回或者连续 5 个开放日（含）累计", "page": 11, "section": null, "tags": ["流动性风险"]}, "B349": {"text": "净赎回占 5 个开放日（含）前产品总份额的 15%以上或者连续 10 个开放日（含）", "page": 11, "section": null, "tags": ["流动性风险"]}, "B350": {"text": "累计净赎回占 10 个开放日（含）前产品总份额的 25%以上时，投资管理人有权", "page": 11, "section": null, "tags": ["流动性风险"]}, "B351": {"text": "于下一个工作日起暂停接受客户的申购申请，客户根据工银理财有限责任公司披", "page": 11, "section": null, "tags": ["机制特有风险"]}, "B352": {"text": "露的开放日可重新进行申购。", "page": 11, "section": null, "tags": ["机制特有风险"]}, "B353": {"text": "产品存续过程中，若投资管理人拟新增说明书未约定的其他申购流动性风险应对", "page": 11, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B354": {"text": "措施的，投资管理人将修改产品说明书并提前在销售机构网站、网上银行、相关", "page": 11, "section": null, "tags": []}, "B355": {"text": "营业网点、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息披露渠道", "page": 12, "section": null, "tags": []}, "B356": {"text": "发布相关信息。", "page": 12, "section": null, "tags": []}, "B357": {"text": "为应对理财产品赎回流动性风险，投资管理人有权采取暂停接受赎回申请、对已", "page": 12, "section": null, "tags": ["流动性风险"]}, "B358": {"text": "经接受的赎回申请延缓支付赎回款项等措施，以及监管机构规定的其他流动性风", "page": 12, "section": null, "tags": ["流动性风险"]}, "B359": {"text": "险应对措施，切实保护存量产品份额持有人的合法权益。", "page": 12, "section": null, "tags": []}, "B360": {"text": "发生以下情形时，投资管理人可暂停接受投资者的全部或部分赎回申请：1）发", "page": 12, "section": null, "tags": ["流动性风险"]}, "B361": {"text": "生产品说明书约定的暂停估值的情形时；2）当日发生巨额赎回时；3）发生继续", "page": 12, "section": null, "tags": ["流动性风险"]}, "B362": {"text": "接受赎回申请将损害产品存量投资者利益的情形；4）法律法规规定或监管机构", "page": 12, "section": null, "tags": ["流动性风险"]}, "B363": {"text": "认定的其他情形。", "page": 12, "section": null, "tags": []}, "B364": {"text": "当产品连续 2 个开放日（含）以上发生巨额赎回或者连续 5 个开放日（含）累计", "page": 12, "section": null, "tags": ["流动性风险"]}, "B365": {"text": "净赎回占 5 个开放日（含）前产品总份额的 15%以上或者连续 10 个开放日（含）", "page": 12, "section": null, "tags": ["流动性风险"]}, "B366": {"text": "累计净赎回占 10 个开放日（含）前产品总份额的 25%以上时，投资管理人有权", "page": 12, "section": null, "tags": ["流动性风险"]}, "B367": {"text": "于下一个工作日起暂停接受客户的赎回申请，客户根据工银理财有限责任公司披", "page": 12, "section": null, "tags": ["流动性风险"]}, "B368": {"text": "露的开放日可重新进行赎回。", "page": 12, "section": null, "tags": ["流动性风险"]}, "B369": {"text": "发生以下情形时，投资管理人对已接受的赎回申请，可延缓支付赎回款项：1）", "page": 12, "section": null, "tags": ["流动性风险"]}, "B370": {"text": "因不可抗力等原因，导致投资管理人接受赎回申请后无法及时兑付；2）连续 2", "page": 12, "section": null, "tags": ["流动性风险"]}, "B371": {"text": "个（含）以上开放日发生巨额赎回的；3）当前一估值日产品资产净值 50%以上", "page": 12, "section": null, "tags": ["流动性风险"]}, "B372": {"text": "的资产不具备活跃交易市场或者在活跃市场中无报价，且不能采用估值技术可靠", "page": 12, "section": null, "tags": []}, "B373": {"text": "计量公允价值时；4）法律法规规定或监管机构认定的其他情形。在发生以上第", "page": 12, "section": null, "tags": []}, "B374": {"text": "2）种情形时，延缓支付赎回款项的期限不得超过 20 个工作日。", "page": 12, "section": null, "tags": ["流动性风险"]}, "B375": {"text": "产品存续过程中，若投资管理人拟新增说明书未约定的其他赎回流动性风险应对", "page": 12, "section": null, "tags": ["流动性风险"]}, "B376": {"text": "措施的，投资管理人将修改产品说明书并提前在销售机构网站、网上银行、相关", "page": 12, "section": null, "tags": []}, "B377": {"text": "营业网点、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息披露渠道", "page": 12, "section": null, "tags": []}, "B378": {"text": "发布相关信息。", "page": 12, "section": null, "tags": []}, "B379": {"text": "十、理财产品费用", "page": 12, "section": null, "tags": []}, "B380": {"text": "1.托管费", "page": 12, "section": null, "tags": []}, "B381": {"text": "本理财产品的托管费每日计提，计算方法如下：", "page": 12, "section": null, "tags": []}, "B382": {"text": "A＝B×C÷365", "page": 12, "section": null, "tags": []}, "B383": {"text": "A 为每个自然日应计提的托管费", "page": 12, "section": null, "tags": []}, "B384": {"text": "B 为前一自然日产品资产净值（在产品成立日，B 为初始净值）", "page": 12, "section": null, "tags": []}, "B385": {"text": "C 为托管费率", "page": 12, "section": null, "tags": []}, "B386": {"text": "托管费支付给理财产品托管人", "page": 12, "section": null, "tags": []}, "B387": {"text": "2.销售服务费", "page": 12, "section": null, "tags": []}, "B388": {"text": "本理财产品各类份额的销售服务费每日计提，计算方法如下：", "page": 12, "section": null, "tags": []}, "B389": {"text": "D＝B×F÷365", "page": 12, "section": null, "tags": []}, "B390": {"text": "D 为每个自然日应计提的该类份额销售服务费", "page": 12, "section": null, "tags": []}, "B391": {"text": "B 为前一自然日理财产品该类份额资产净值（在产品成立日，B 为初始净值）", "page": 12, "section": null, "tags": []}, "B392": {"text": "F 为该类份额销售服务费率", "page": 13, "section": null, "tags": []}, "B393": {"text": "销售服务费支付给理财产品销售机构", "page": 13, "section": null, "tags": []}, "B394": {"text": "3.固定管理费", "page": 13, "section": null, "tags": []}, "B395": {"text": "本理财产品的固定管理费每日计提，计算方法如下：", "page": 13, "section": null, "tags": []}, "B396": {"text": "G＝B×I÷365", "page": 13, "section": null, "tags": []}, "B397": {"text": "G 为每个自然日应计提的固定管理费", "page": 13, "section": null, "tags": []}, "B398": {"text": "B 为前一自然日产品资产净值（在产品成立日，B 为初始净值）", "page": 13, "section": null, "tags": []}, "B399": {"text": "I 为固定管理费率", "page": 13, "section": null, "tags": []}, "B400": {"text": "固定管理费支付给理财产品管理人", "page": 13, "section": null, "tags": []}, "B401": {"text": "4.浮动管理费", "page": 13, "section": null, "tags": []}, "B402": {"text": "本产品不收取浮动管理费。", "page": 13, "section": null, "tags": []}, "B403": {"text": "5. 认购费、申购费、赎回费", "page": 13, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B404": {"text": "本产品不收取认购费、申购费、赎回费。", "page": 13, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B405": {"text": "6. 产品在实际运作中，还将按照实际情况承担包括但不限于银行划拨手续费、", "page": 13, "section": null, "tags": []}, "B406": {"text": "资产交易相关费用（包括但不限于交易佣金、撮合费用等）、理财产品验资费、", "page": 13, "section": null, "tags": []}, "B407": {"text": "审计费、律师费、信息披露费、清算费、执行费用、投后管理费、税费等其他", "page": 13, "section": null, "tags": []}, "B408": {"text": "费用。", "page": 13, "section": null, "tags": []}, "B409": {"text": "7. 产品管理人有权根据相关法律和国家政策的规定、市场情况等，对本理财产", "page": 13, "section": null, "tags": []}, "B410": {"text": "品费用名目、收费条件、收费标准和收费方式进行调整，并按照本产品说明书", "page": 13, "section": null, "tags": []}, "B411": {"text": "“信息披露”章节约定的方式向投资者进行披露。其中，对于增加费用名目、", "page": 13, "section": null, "tags": []}, "B412": {"text": "提高收费标准等对投资者利益产生实质影响的情形，投资者如不同意调整的，", "page": 13, "section": null, "tags": []}, "B413": {"text": "可在产品管理人信息披露的补充或修改后的相关业务调整生效前赎回本产品", "page": 13, "section": null, "tags": ["流动性风险"]}, "B414": {"text": "（此种情况下产品管理人将可能开放特殊赎回期间，具体以届时产品管理人的", "page": 13, "section": null, "tags": ["流动性风险"]}, "B415": {"text": "信息披露为准），逾期未赎回或部分赎回的视为同意接受前述调整且继续持有", "page": 13, "section": null, "tags": ["流动性风险"]}, "B416": {"text": "本产品。对于产品费率实行阶段性优惠情形，以产品信息披露为准。", "page": 13, "section": null, "tags": []}, "B417": {"text": "十一、理财产品估值", "page": 13, "section": null, "tags": []}, "B418": {"text": "本理财产品估值日为封闭期间的每周三（如遇非工作日，则本周不披露净值）及", "page": 13, "section": null, "tags": []}, "B419": {"text": "封闭期结束后的每个工作日（即开放日），根据产品持有的资产价格变化对估值", "page": 13, "section": null, "tags": []}, "B420": {"text": "日产品进行估值并于估值日的后 2 个工作日内进行披露。", "page": 13, "section": null, "tags": []}, "B421": {"text": "理财产品所拥有的债券和银行存款本息、应收款项、其它投资等资产及负债。", "page": 13, "section": null, "tags": []}, "B422": {"text": "本理财产品实行净值化管理，按照《企业会计准则》等监管要求确认和计量理财", "page": 14, "section": null, "tags": []}, "B423": {"text": "产品的资产与负债，生成理财产品净值。其中，金融工具的公允价值确定遵循以", "page": 14, "section": null, "tags": []}, "B424": {"text": "下基本原则：", "page": 14, "section": null, "tags": []}, "B425": {"text": "1.公允价值计量原则", "page": 14, "section": null, "tags": []}, "B426": {"text": "估值应及时反映金融工具的风险和收益。", "page": 14, "section": null, "tags": []}, "B427": {"text": "2.一致性原则", "page": 14, "section": null, "tags": []}, "B428": {"text": "同类型产品中同一类别金融工具应采用一致的估值方法。估值方法一经确定，应", "page": 14, "section": null, "tags": []}, "B429": {"text": "保持稳定，不能随意变更，除非变更估值方法能使估值结果在当前情况下同样或", "page": 14, "section": null, "tags": []}, "B430": {"text": "者更能代表公允价值。", "page": 14, "section": null, "tags": []}, "B431": {"text": "3.审慎性原则", "page": 14, "section": null, "tags": []}, "B432": {"text": "充分审慎考虑影响估值结果的风险因素，确保估值方法、模型、假设、参数来源", "page": 14, "section": null, "tags": []}, "B433": {"text": "及估值结果的合理性。", "page": 14, "section": null, "tags": []}, "B434": {"text": "4.可靠性原则", "page": 14, "section": null, "tags": []}, "B435": {"text": "进行公允价值评估时，尽可能运用相关的、可靠的、可观察的估值参数进行估值，", "page": 14, "section": null, "tags": []}, "B436": {"text": "确保估值的可靠性。", "page": 14, "section": null, "tags": []}, "B437": {"text": "理财产品所投资各类资产原则上按照公允价值估值，具体估值方法如下：", "page": 14, "section": null, "tags": []}, "B438": {"text": "估值方法中列示的资产品种不代表投资管理人的实际 投向，本理财产品投资范", "page": 14, "section": null, "tags": []}, "B439": {"text": "围以“投资范围”章节表述为准。", "page": 14, "section": null, "tags": []}, "B440": {"text": "理财产品所投资各类资产原则上按照公允价值估值，具体估值方法如下：", "page": 14, "section": null, "tags": []}, "B441": {"text": "1、货币市场工具类资产的估值", "page": 14, "section": null, "tags": []}, "B442": {"text": "银行存款及回购（包含正、逆回购），以本金列示，按商定利率在实际持有期间", "page": 14, "section": null, "tags": ["市场风险"]}, "B443": {"text": "内逐日计提利息；在上述表述无法真实反映公允价值的情况下，按照国家法律、", "page": 14, "section": null, "tags": []}, "B444": {"text": "法规和部门规章的最新规定，采用合理的估值技术确定公允价值。", "page": 14, "section": null, "tags": []}, "B445": {"text": "2、债券及同业存单类资产的估值", "page": 14, "section": null, "tags": []}, "B446": {"text": "原则上按照公允价值估值，未上市投资品由投资管理人和理财产品托管人协商确", "page": 14, "section": null, "tags": []}, "B447": {"text": "定的估值方法估值。", "page": 14, "section": null, "tags": []}, "B448": {"text": "3、股权类估值：", "page": 14, "section": null, "tags": []}, "B449": {"text": "（1）上市流通股票按估值日其所在证券交易所的收盘价估值；估值日无交易，", "page": 14, "section": null, "tags": []}, "B450": {"text": "且最近交易日后未发生影响公允价值计量的重大事件的，以最近交易日的收盘价", "page": 14, "section": null, "tags": []}, "B451": {"text": "估值；", "page": 14, "section": null, "tags": []}, "B452": {"text": "（2）未上市股票的估值：", "page": 15, "section": null, "tags": []}, "B453": {"text": "A.送股、转增股、配股和公开增发新股等发行未上市的股票，按估值日在证券交", "page": 15, "section": null, "tags": ["机制特有风险"]}, "B454": {"text": "易所挂牌的同一股票的市价估值；", "page": 15, "section": null, "tags": []}, "B455": {"text": "B.首次公开发行有明确锁定期的股票，同一股票在交易所上市后，按交易所上市", "page": 15, "section": null, "tags": []}, "B456": {"text": "的同一股票的市价估值；", "page": 15, "section": null, "tags": []}, "B457": {"text": "C.首次发行未上市的股票，按发行价格进行估值；", "page": 15, "section": null, "tags": []}, "B458": {"text": "D.因持有股票而享有的配股权，采用估值技术确定公允价值。", "page": 15, "section": null, "tags": []}, "B459": {"text": "(3)非上市股权的估值：", "page": 15, "section": null, "tags": []}, "B460": {"text": "非上市股权类资产，按照国家最新规定，采用合理的估值技术进行估值。", "page": 15, "section": null, "tags": []}, "B461": {"text": "4、债权类资产的估值", "page": 15, "section": null, "tags": []}, "B462": {"text": "债权类资产，按市价法估值。市价法不能确定其公允价值的，采用估值技术进行", "page": 15, "section": null, "tags": []}, "B463": {"text": "估值。", "page": 15, "section": null, "tags": []}, "B464": {"text": "5、证券投资基金的估值", "page": 15, "section": null, "tags": []}, "B465": {"text": "（1）投资于非上市基金", "page": 15, "section": null, "tags": []}, "B466": {"text": "1）境内非货币市场基金，按所投资基金估值日的份额净值估值。估值日未披露", "page": 15, "section": null, "tags": []}, "B467": {"text": "净值，以其最近公布的基金份额净值为基础估值。", "page": 15, "section": null, "tags": []}, "B468": {"text": "2）境内货币市场基金，按所投资基金前一估值日后至估值日期间（含节假日）", "page": 15, "section": null, "tags": []}, "B469": {"text": "的万份收益计提估值日基金收益。", "page": 15, "section": null, "tags": []}, "B470": {"text": "（2）投资于交易所上市基金", "page": 15, "section": null, "tags": []}, "B471": {"text": "1）ETF基金、境内上市开放式基金（LOF）、境内上市定期开放式基金、封闭式", "page": 15, "section": null, "tags": []}, "B472": {"text": "基金，按所投资基金估值日的收盘价估值。", "page": 15, "section": null, "tags": []}, "B473": {"text": "2）境内上市交易型货币市场基金，如所投资基金披露份额净值，则按所投资基", "page": 15, "section": null, "tags": []}, "B474": {"text": "金估值日的份额净值估值；如所投资基金披露万份（百份）收益，则按所投资基", "page": 15, "section": null, "tags": []}, "B475": {"text": "金前一估值日后至估值日期间（含节假日）的万份（百份）收益计提估值日基金", "page": 15, "section": null, "tags": []}, "B476": {"text": "收益。", "page": 15, "section": null, "tags": []}, "B477": {"text": "3） 如遇所投资基金不公布基金份额净值、进行折算或拆分、估值日无交易等特", "page": 15, "section": null, "tags": []}, "B478": {"text": "殊情况 ，以其最近公布的基金份额净值或收盘价为基础估值。", "page": 15, "section": null, "tags": []}, "B479": {"text": "6、其他资产类估值", "page": 15, "section": null, "tags": []}, "B480": {"text": "其他资产存在并可以确定公允价值的，以公允价值计算，公允价值不能确定的，", "page": 15, "section": null, "tags": []}, "B481": {"text": "按照国家最新规定进行估值。", "page": 15, "section": null, "tags": []}, "B482": {"text": "7、以摊余成本法计量或以公允价值计量且其变动计入其他综合收益的资产，需", "page": 16, "section": null, "tags": []}, "B483": {"text": "按照会计准则规定采用合理的减值计量模型或第三方减值计量结果进行减值计", "page": 16, "section": null, "tags": []}, "B484": {"text": "提。计提减值不等同于金融资产已发生损失，仅为对未来风险的审慎预期。", "page": 16, "section": null, "tags": []}, "B485": {"text": "8、国家有最新规定的，按其规定进行估值。", "page": 16, "section": null, "tags": []}, "B486": {"text": "9、在任何情况下，投资管理人与理财产品托管人所共同认可的估值方式均视为", "page": 16, "section": null, "tags": []}, "B487": {"text": "客观、公允的估值方法。该产品估值均以产品公布的估值结果为准。", "page": 16, "section": null, "tags": []}, "B488": {"text": "10、产品存续期间，若关于产品估值的监管规定发生变化，则本产品估值方法也", "page": 16, "section": null, "tags": []}, "B489": {"text": "随之调整，工银理财有限责任公司将在调整前发布相关信息披露报告。", "page": 16, "section": null, "tags": []}, "B490": {"text": "11、当前一估值日产品资产净值 50%以上的资产不具备活跃交易市场或者在活跃", "page": 16, "section": null, "tags": []}, "B491": {"text": "市场中无报价，且不能采用估值技术可靠计量公允价值时，投资管理人应当暂停", "page": 16, "section": null, "tags": []}, "B492": {"text": "该产品估值，并按照监管规定采取相应措施。", "page": 16, "section": null, "tags": []}, "B493": {"text": "十二、支付安排", "page": 16, "section": null, "tags": []}, "B494": {"text": "投资管理人在赎回日后3个工作日内或产品提前终止日后3个工作日内将客户赎", "page": 16, "section": null, "tags": ["流动性风险"]}, "B495": {"text": "回金额划转至客户指定账户。", "page": 16, "section": null, "tags": []}, "B496": {"text": "十三、信息披露", "page": 16, "section": null, "tags": []}, "B497": {"text": "1、本理财产品成立后，理财产品投资管理人在每个估值日后 2 个工作日内通过", "page": 16, "section": null, "tags": []}, "B498": {"text": "销售机构网站、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息披露", "page": 16, "section": null, "tags": []}, "B499": {"text": "渠道披露估值日的理财产品单位净值及其他重要信息（如有）。", "page": 16, "section": null, "tags": []}, "B500": {"text": "2、在发生巨额赎回以致工银理财有限责任公司暂停接受客户赎回申请时，工银", "page": 16, "section": null, "tags": ["流动性风险"]}, "B501": {"text": "理财有限责任公司最迟于次一工作日通过销售机构网站、相关营业网点、产品管", "page": 16, "section": null, "tags": []}, "B502": {"text": "理人的官方网站（wm.icbc.com.cn）或行业统一信息披露渠道发布相关信息。", "page": 16, "section": null, "tags": []}, "B503": {"text": "3、如投资管理人决定提前终止本理财产品，将于提前终止日的前 3 个工作日，", "page": 16, "section": null, "tags": []}, "B504": {"text": "在销售机构网站、相关营业网点、产品管理人的官方网站（wm.icbc.com.cn）或", "page": 16, "section": null, "tags": []}, "B505": {"text": "行业统一信息披露渠道发布相关信息。", "page": 16, "section": null, "tags": []}, "B506": {"text": "4、本产品正常成立后 5 个工作日内，工银理财有限责任公司将在销售机构网站、", "page": 16, "section": null, "tags": []}, "B507": {"text": "相关营业网点、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息披露", "page": 16, "section": null, "tags": []}, "B508": {"text": "渠道发布产品成立报告。", "page": 16, "section": null, "tags": []}, "B509": {"text": "5、本产品终止后 5 个工作日内，工银理财有限责任公司将在销售机构网站、相", "page": 16, "section": null, "tags": []}, "B510": {"text": "关营业网点、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息披露渠", "page": 16, "section": null, "tags": []}, "B511": {"text": "道发布产品到期报告。", "page": 16, "section": null, "tags": []}, "B512": {"text": "6、投资管理人应当在每季度结束之日起十五个工作日内，编制完成产品季度报", "page": 16, "section": null, "tags": []}, "B513": {"text": "告，向客户披露投资状况、投资表现、风险状况等信息，并将季度报告正文通过", "page": 16, "section": null, "tags": []}, "B514": {"text": "销售机构网站、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息披露", "page": 16, "section": null, "tags": []}, "B515": {"text": "渠道进行公告。", "page": 16, "section": null, "tags": []}, "B516": {"text": "7、投资管理人应当在上半年结束之日起六十个工作日内，编制完成产品半年度", "page": 17, "section": null, "tags": []}, "B517": {"text": "报告，向客户披露投资状况、投资表现、风险状况等信息，并将半年度报告正文", "page": 17, "section": null, "tags": []}, "B518": {"text": "通过销售机构网站、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息", "page": 17, "section": null, "tags": []}, "B519": {"text": "披露渠道进行公告。", "page": 17, "section": null, "tags": []}, "B520": {"text": "8、投资管理人应当在每年结束之日起九十个工作日内，编制完成产品年度报告，", "page": 17, "section": null, "tags": []}, "B521": {"text": "向客户披露投资状况、投资表现、风险状况等信息，并将年度报告正文通过销售", "page": 17, "section": null, "tags": []}, "B522": {"text": "机构网站、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息披露渠道", "page": 17, "section": null, "tags": []}, "B523": {"text": "进行公告。", "page": 17, "section": null, "tags": []}, "B524": {"text": "9、逢半年，半年报与当季季度报告合并；逢年末，年度报告与半年度报告合并。", "page": 17, "section": null, "tags": []}, "B525": {"text": "理财产品成立不足 90 个工作日或者剩余存续期不超过 90 个工作日的，工银理财", "page": 17, "section": null, "tags": []}, "B526": {"text": "有限责任公司可以不编制理财产品当期的季度、半年和年度报告。", "page": 17, "section": null, "tags": []}, "B527": {"text": "本理财产品在运作管理过程中，发生包括但不限于以下可能对理财产品份额持有", "page": 17, "section": null, "tags": []}, "B528": {"text": "人权益及理财产品份额的交易价格产生重大影响的事项之一时，工银理财有限责", "page": 17, "section": null, "tags": []}, "B529": {"text": "任公司可视情况选择以下一种或多种方式告知客户：销售机构网站、相关营业网", "page": 17, "section": null, "tags": []}, "B530": {"text": "点、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息披露渠道发布、", "page": 17, "section": null, "tags": []}, "B531": {"text": "电子邮件、电话、以信函形式邮寄、手机短信等，并在 2 个工作日内发布重大事", "page": 17, "section": null, "tags": []}, "B532": {"text": "项公告。", "page": 17, "section": null, "tags": []}, "B533": {"text": "1、终止理财产品；", "page": 17, "section": null, "tags": []}, "B534": {"text": "2、转换理财产品运作方式；", "page": 17, "section": null, "tags": []}, "B535": {"text": "3、更换理财产品托管人；", "page": 17, "section": null, "tags": []}, "B536": {"text": "4、理财产品认购期延长；", "page": 17, "section": null, "tags": []}, "B537": {"text": "5、涉及理财产品管理业务、理财产品财产、理财产品托管业务的重大诉讼；", "page": 17, "section": null, "tags": []}, "B538": {"text": "6、理财产品投资管理人、理财产品托管人、投资顾问受到监管部门的调查；", "page": 17, "section": null, "tags": []}, "B539": {"text": "7、理财产品收益分配事项；", "page": 17, "section": null, "tags": []}, "B540": {"text": "8、投资管理费、理财产品托管费及销售服务费等费用计提标准、计提方式和费", "page": 17, "section": null, "tags": []}, "B541": {"text": "率发生变更；", "page": 17, "section": null, "tags": []}, "B542": {"text": "9、理财产品单位净值计价错误达理财产品单位净值百分之零点五；", "page": 17, "section": null, "tags": []}, "B543": {"text": "10、变更理财产品份额发售机构；", "page": 17, "section": null, "tags": []}, "B544": {"text": "11、理财产品暂停估值；", "page": 17, "section": null, "tags": []}, "B545": {"text": "12、其它应披露的事项。", "page": 17, "section": null, "tags": []}, "B546": {"text": "关营业网点、产品管理人的官方网站（wm.icbc.com.cn）或行业统一信息披露渠", "page": 17, "section": null, "tags": []}, "B547": {"text": "道发布相关信息，对本产品的业绩比较基准、投资范围、投资品种、投资比例或", "page": 18, "section": null, "tags": []}, "B548": {"text": "产品说明书其他条款进行补充、说明和修改。客户如不同意补充或修改后的说明", "page": 18, "section": null, "tags": []}, "B549": {"text": "书，可根据工银理财有限责任公司的通知或公告在补充或修改生效前赎回本产品，", "page": 18, "section": null, "tags": ["流动性风险"]}, "B550": {"text": "客户理财资金和收益（如有）将在赎回日后 3 个工作日内划转至客户账户。", "page": 18, "section": null, "tags": ["流动性风险"]}, "B551": {"text": "包括发生巨额赎回）、延缓支付赎回款项等措施后，工银理财有限责任公司应当", "page": 18, "section": null, "tags": ["流动性风险"]}, "B552": {"text": "在 3 个交易日内告知该理财产品的投资者，并说明运用相关措施的原因、拟采取", "page": 18, "section": null, "tags": []}, "B553": {"text": "的应对安排等。", "page": 18, "section": null, "tags": []}, "B554": {"text": "投资者可通过本产品约定的信息披露渠道进行查询。", "page": 18, "section": null, "tags": []}, "B555": {"text": "十四、风险揭示", "page": 18, "section": null, "tags": []}, "B556": {"text": "本产品类型是“固定收益类、非保本浮动收益型”，根据法律法规及监管规章", "page": 18, "section": null, "tags": []}, "B557": {"text": "的有关规定，特向您提示如下：与银行存款比较，本产品存在投资风险，您的", "page": 18, "section": null, "tags": []}, "B558": {"text": "本金和收益可能会因市场变动等原因而蒙受损失，您应充分认识投资风险，谨", "page": 18, "section": null, "tags": []}, "B559": {"text": "慎投资。本理财产品可能面临的风险主要包括：", "page": 18, "section": null, "tags": []}, "B560": {"text": "法规发生变化，影响本产品的发行、投资和兑付等，可能影响本产品的投资运", "page": 18, "section": null, "tags": []}, "B561": {"text": "作和到期收益，甚至本金损失。", "page": 18, "section": null, "tags": []}, "B562": {"text": "人的信用违约。若出现上述情况，客户将面临本金和收益遭受损失的风险。", "page": 18, "section": null, "tags": ["信用风险"]}, "B563": {"text": "资的资产价格发生波动，从而影响本产品的收益，客户面临本金和收益遭受损", "page": 18, "section": null, "tags": []}, "B564": {"text": "失的风险。", "page": 18, "section": null, "tags": []}, "B565": {"text": "易时间内进行申购、赎回，且不得在产品最短持有期内提前赎回本产品。如果", "page": 18, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B566": {"text": "客户产生流动性需求，可能面临理财产品不能随时变现、持有期与资金需求日", "page": 18, "section": null, "tags": ["流动性风险"]}, "B567": {"text": "不匹配的流动性风险。在理财产品存续期内的开放日，如发生巨额赎回的，投", "page": 18, "section": null, "tags": ["流动性风险"]}, "B568": {"text": "资管理人有权拒绝超额部分的赎回申请，或者发生产品说明书约定的暂停认（申）", "page": 18, "section": null, "tags": ["流动性风险"]}, "B569": {"text": "购、暂停赎回或延缓支付赎回款项等情形时，存在投资者超过限额的认（申）", "page": 18, "section": null, "tags": ["流动性风险"]}, "B570": {"text": "购申请被部分或全部拒绝、不能及时赎回或赎回资金延期到账的风险，由此均", "page": 18, "section": null, "tags": ["流动性风险"]}, "B571": {"text": "可能影响投资者的资金流动性安排，带来流动性风险。", "page": 18, "section": null, "tags": ["流动性风险"]}, "B572": {"text": "素导致本产品不能成立的情形，客户将面临再投资风险。", "page": 18, "section": null, "tags": []}, "B573": {"text": "公司有可能在产品份额低于5000万份情况下提前终止本产品。为保护客户权益，", "page": 18, "section": null, "tags": []}, "B574": {"text": "工银理财有限责任公司有权根据市场变动情况以及法律法规、监管政策变化情", "page": 18, "section": null, "tags": []}, "B575": {"text": "况提前终止本理财产品。客户可能面临不能按预期期限取得收益的风险以及再", "page": 18, "section": null, "tags": []}, "B576": {"text": "投资风险。", "page": 18, "section": null, "tags": []}, "B577": {"text": "限制，可能会影响本产品的投资管理，从而影响本产品的到期收益，甚至本金", "page": 19, "section": null, "tags": []}, "B578": {"text": "损失。", "page": 19, "section": null, "tags": []}, "B579": {"text": "时支付本金和收益，则客户面临产品期限延期、调整、无法及时赎回等风险。", "page": 19, "section": null, "tags": ["流动性风险"]}, "B580": {"text": "机构等在业务操作过程中，因操作失误或违反操作规程而引起的风险。", "page": 19, "section": null, "tags": []}, "B581": {"text": "能克服的不可抗力事件或系统故障、通讯故障、投资市场停止交易等意外事件", "page": 19, "section": null, "tags": []}, "B582": {"text": "的出现，可能对本产品的成立、投资、兑付、信息披露、公告通知等造成影响，", "page": 19, "section": null, "tags": []}, "B583": {"text": "客户将面临本金和收益遭受损失的风险。对于由不可抗力及意外事件风险导致", "page": 19, "section": null, "tags": []}, "B584": {"text": "的任何损失，客户须自行承担，工银理财有限责任公司对此不承担任何责任，", "page": 19, "section": null, "tags": []}, "B585": {"text": "但应以适当的方式通知投资者，并采取必要的补救措施以减少有关损失。", "page": 19, "section": null, "tags": []}, "B586": {"text": "品信息披露，客户应充分关注并及时主动查询工银理财有限责任公司披露的本", "page": 19, "section": null, "tags": []}, "B587": {"text": "产品相关信息。客户预留的有效联系方式发生变更的，亦应及时通知销售机构。", "page": 19, "section": null, "tags": []}, "B588": {"text": "如客户未及时查询相关信息，或预留联系方式变更未及时通知销售机构，导致", "page": 19, "section": null, "tags": []}, "B589": {"text": "工银理财有限责任公司在其认为需要时无法及时联系到客户的，可能会影响客", "page": 19, "section": null, "tags": []}, "B590": {"text": "户的投资决策，因此而产生的责任和风险由客户自行承担。", "page": 19, "section": null, "tags": []}, "B591": {"text": "其中固定收益类资产投资比例不低于 80%，本产品的流动性主要受固定收益类资", "page": 19, "section": null, "tags": ["流动性风险"]}, "B592": {"text": "产影响。", "page": 19, "section": null, "tags": []}, "B593": {"text": "固定收益类资产中，产品主要投资存款类资产，同业拆借、债券回购、债券借", "page": 19, "section": null, "tags": []}, "B594": {"text": "贷、存单质押等货币市场工具类投资品，利率债、同业存单、中高等级信用债，", "page": 19, "section": null, "tags": ["市场风险", "信用风险"]}, "B595": {"text": "非标准化债权等。", "page": 19, "section": null, "tags": []}, "B596": {"text": "一般情况下，上述资产大多具有规范的交易场所，市场透明度较高，运作方式", "page": 19, "section": null, "tags": []}, "B597": {"text": "规范，历史流动性状况良好，可以支持本产品的投资和应对日常申赎的需要。", "page": 19, "section": null, "tags": ["流动性风险"]}, "B598": {"text": "非标准化债权资产（如有）由于未在银行间和交易所市场交易，交易活跃度、", "page": 19, "section": null, "tags": []}, "B599": {"text": "透明度以及流动性程度远低于标准化债券。管理人在资产配置时已充分考虑此", "page": 19, "section": null, "tags": ["流动性风险"]}, "B600": {"text": "类资产特性，最大程度防范流动性风险。", "page": 19, "section": null, "tags": ["流动性风险"]}, "B601": {"text": "在遵守本产品有关投资限制与投资比例的前提下，结合市场流动性特点，本产", "page": 19, "section": null, "tags": ["流动性风险"]}, "B602": {"text": "品将合理安排组合流动性，统筹考虑投资者申购赎回特征和客户大额资金流向", "page": 19, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B603": {"text": "特征，以确定本产品在不同投资品种的配置比例，确保流动性充裕。", "page": 19, "section": null, "tags": ["流动性风险"]}, "B604": {"text": "若标的债券的债项或主体出现信用风险舆情，标的资产流动性将迅速恶化，资", "page": 19, "section": null, "tags": ["流动性风险", "信用风险"]}, "B605": {"text": "产难以短时间在二级市场以估值附近价格变现，可能出现大幅折价卖出的情况，", "page": 19, "section": null, "tags": ["流动性风险"]}, "B606": {"text": "进而引起产品净值短时间剧烈下挫。除非系统性风险外，若市场出现资金面紧", "page": 19, "section": null, "tags": []}, "B607": {"text": "张或出现由个券违约引起的系统性信用危机，债券市场整体流动性会遭受更大", "page": 19, "section": null, "tags": ["流动性风险", "信用风险"]}, "B608": {"text": "范围、更长期限的冲击，同样为资产以合理价格变现带来不利影响。", "page": 19, "section": null, "tags": ["流动性风险"]}, "B609": {"text": "极端情况下，产品可能存在以下流动性风险：一是投资管理人建仓或进行组合", "page": 20, "section": null, "tags": ["流动性风险"]}, "B610": {"text": "调整时，可能由于特定投资标的流动性相对不足而无法按预期的价格买进或卖", "page": 20, "section": null, "tags": ["流动性风险"]}, "B611": {"text": "出；二是为应付投资者的赎回，产品被迫以不适当的价格卖出债券或其他资产。", "page": 20, "section": null, "tags": ["流动性风险"]}, "B612": {"text": "两者均可能使产品净值受到不利影响。", "page": 20, "section": null, "tags": []}, "B613": {"text": "管理人高度重视组合的流动性风险，关注投资组合中债券、现金等资产的配置", "page": 20, "section": null, "tags": ["流动性风险"]}, "B614": {"text": "情况，以及单一证券、券种与行业的集中度，合理配置资产，认真分析产品的", "page": 20, "section": null, "tags": []}, "B615": {"text": "持有人结构、资产规模、投资组合的流动性情况，对市场交易状况和投资者行", "page": 20, "section": null, "tags": ["流动性风险"]}, "B616": {"text": "为相关联的流动性风险进行充分的评估与检测，防止片面追求短期收益而忽视", "page": 20, "section": null, "tags": ["流动性风险"]}, "B617": {"text": "流动性风险控制。", "page": 20, "section": null, "tags": ["流动性风险"]}, "B618": {"text": "十五、个人信息处理与保护", "page": 20, "section": null, "tags": []}, "B619": {"text": "1.为订立、履行理财产品销售合同及履行法定义务、监管要求所必需，产品管理", "page": 20, "section": null, "tags": []}, "B620": {"text": "人可直接或通过代理销售机构获取、使用、存储、统计分析、或以其他方式处理", "page": 20, "section": null, "tags": []}, "B621": {"text": "投资者的个人信息如下（统称“投资者信息”；其中，敏感个人信息已加粗显示，", "page": 20, "section": null, "tags": []}, "B622": {"text": "可能对个人权益产生更重大的影响），用于开户、理财产品管理、理财产品登记、", "page": 20, "section": null, "tags": []}, "B623": {"text": "理财产品交易、客户服务、反洗钱、非居民涉税信息报送、监管报送等目的，而", "page": 20, "section": null, "tags": []}, "B624": {"text": "无需取得投资者的同意。如果投资者拒绝提供该等信息，则产品管理人不能依法", "page": 20, "section": null, "tags": []}, "B625": {"text": "为投资者提供理财产品销售文件相关产品与服务。", "page": 20, "section": null, "tags": []}, "B626": {"text": "（1）基础信息：姓名、性别、出生日期、国籍、职业、现居国家或地区、手机", "page": 20, "section": null, "tags": []}, "B627": {"text": "号、常住地址、工作单位地址等信息，具体以投资者所交易的理财产品为准。", "page": 20, "section": null, "tags": []}, "B628": {"text": "（2）身份证件信息：证件类型、证件号码、有效期限。", "page": 20, "section": null, "tags": []}, "B629": {"text": "（注：身份证件信息是用于在理财产品各业务环节中确定投资者的唯一身份。）", "page": 20, "section": null, "tags": []}, "B630": {"text": "（3）财产信息：收入来源和数额、资产、债务、财务状况等财产信息。", "page": 20, "section": null, "tags": []}, "B631": {"text": "（注：财产信息是用于依法开展反洗钱调查。）", "page": 20, "section": null, "tags": []}, "B632": {"text": "（4）金融账户信息：认（申）购和赎回理财产品的银行账户账号及开户行名称、", "page": 20, "section": null, "tags": ["流动性风险"]}, "B633": {"text": "代码、所在地，理财交易账号，理财账户（TA）账号等。", "page": 20, "section": null, "tags": []}, "B634": {"text": "（注：金融账户信息是用于理财产品交易中的资金流转。）", "page": 20, "section": null, "tags": []}, "B635": {"text": "（5）交易信息：理财产品的开户申请、认（申）购申请、赎回申请、开户确认、", "page": 20, "section": null, "tags": ["流动性风险"]}, "B636": {"text": "认（申）购确认、赎回确认、分红确认（如有）等各类交易环节所涉的信息，", "page": 20, "section": null, "tags": ["流动性风险"]}, "B637": {"text": "包括交易申请及确认的时间、交易所涉的理财产品金额及份额等，具体以各类", "page": 20, "section": null, "tags": []}, "B638": {"text": "交易发生时的文件或在线页面中展示的信息为准。", "page": 20, "section": null, "tags": []}, "B639": {"text": "（注：交易信息是理财产品各类交易环节过程中产生的信息，用于记录交易内容、", "page": 20, "section": null, "tags": []}, "B640": {"text": "实现理财产品交易。）", "page": 20, "section": null, "tags": []}, "B641": {"text": "（6）在投资者与理财产品管理人建立业务过程中及服务过程中产生、获取、保", "page": 20, "section": null, "tags": []}, "B642": {"text": "存的其他与业务相关的个人信息及法律法规规定的其他必要信息。", "page": 20, "section": null, "tags": []}, "B643": {"text": "2.产品管理人可在实现处理目的所需时间内或法律法规要求的保存期限内，保存", "page": 20, "section": null, "tags": []}, "B644": {"text": "投资者信息，投资者信息的保存期限不少于 20 年，若监管有最新规定的，按照", "page": 20, "section": null, "tags": []}, "B645": {"text": "最新规定执行。投资者信息将仅在中国境内进行存储及处理。", "page": 20, "section": null, "tags": []}, "B646": {"text": "3.产品管理人就订立、履行销售文件过程中获知的投资者信息承担保密义务。非", "page": 20, "section": null, "tags": []}, "B647": {"text": "经投资者事先同意，不得向第三方披露，但法律法规或监管规定另有要求或允许", "page": 20, "section": null, "tags": []}, "B648": {"text": "的除外。产品管理人可在下列场景向第三方披露投资者信息：", "page": 20, "section": null, "tags": []}, "B649": {"text": "（1）当投资者通过代理销售机构购买产品管理人的理财产品，为履行理财产品", "page": 21, "section": null, "tags": []}, "B650": {"text": "投资协议、代理销售协议所必需，产品管理人可与该代理销售机构共享投资者信", "page": 21, "section": null, "tags": []}, "B651": {"text": "息，用于理财产品的销售与交易；", "page": 21, "section": null, "tags": []}, "B652": {"text": "（2）为履行法定义务和监管要求所必需，产品管理人可自行或通过本理财产品", "page": 21, "section": null, "tags": []}, "B653": {"text": "的投资合作机构（包括但不限于理财产品投资的资管计划、信托计划、基金的受", "page": 21, "section": null, "tags": []}, "B654": {"text": "托人或管理人、支付结算服务银行机构、相关投资顾问等），向监管机构、司法", "page": 21, "section": null, "tags": []}, "B655": {"text": "机构、登记机构、自律组织提供其所要求的投资者信息，用于理财产品的监管、", "page": 21, "section": null, "tags": []}, "B656": {"text": "登记、调查；", "page": 21, "section": null, "tags": []}, "B657": {"text": "（3）产品管理人可委托第三方提供数据处理服务，并依法对该等受托方进行监", "page": 21, "section": null, "tags": []}, "B658": {"text": "督。产品管理人可以委托银行业理财登记托管中心有限公司提供系统对接、数据", "page": 21, "section": null, "tags": []}, "B659": {"text": "传输、数据统计、数据存储服务。产品管理人可以基于为客户服务之目，委托第", "page": 21, "section": null, "tags": []}, "B660": {"text": "三方专业机构使用投资者相关必要信息。产品管理人承诺将向有关第三方明确其", "page": 21, "section": null, "tags": []}, "B661": {"text": "保护投资人信息的职责并要求第三方承担相应的保密义务。", "page": 21, "section": null, "tags": []}, "B662": {"text": "4. 投资者对其个人信息依据《个人信息保护法》享有知情、决定、查阅、复制、", "page": 21, "section": null, "tags": []}, "B663": {"text": "更正、补充等权利，并可以通过销售机构/购买渠道联系产品管理人行使该等权", "page": 21, "section": null, "tags": []}, "B664": {"text": "利。", "page": 21, "section": null, "tags": []}, "B665": {"text": "5. 产品管理人将严格遵守法律法规和监管规定，采取合适的技术措施和管理措", "page": 21, "section": null, "tags": []}, "B666": {"text": "施保护投资者信息的安全，避免数据安全事件。", "page": 21, "section": null, "tags": []}, "B667": {"text": "十六、重要须知", "page": 21, "section": null, "tags": []}, "B668": {"text": "规定可以购买本理财产品的客户发售。客户保证理财资金系其合法拥有，且不", "page": 21, "section": null, "tags": []}, "B669": {"text": "违反任何法律、法规、监管规定及公司章程的规定。", "page": 21, "section": null, "tags": []}, "B670": {"text": "的用语，业绩比较基准仅作为计算超额管理费(如有)的依据，不构成工银理财", "page": 21, "section": null, "tags": []}, "B671": {"text": "有限责任公司对该理财产品的任何收益承诺。", "page": 21, "section": null, "tags": []}, "B672": {"text": "十七、特别提示", "page": 21, "section": null, "tags": []}, "B673": {"text": "本产品业绩比较基准仅供客户参考，并不作为工银理财有限责任公司向客户支", "page": 21, "section": null, "tags": []}, "B674": {"text": "付本产品收益的承诺；客户所能获得的最终收益以工银理财有限责任公司的实", "page": 21, "section": null, "tags": []}, "B675": {"text": "际支付为准。客户在投资前，请仔细阅读本产品说明书，并作出独立的投资决", "page": 21, "section": null, "tags": []}, "B676": {"text": "策。", "page": 21, "section": null, "tags": []}, "B677": {"text": "工银理财有限责任公司将恪守勤勉尽责的原则，合理配置财产组合，为客户提", "page": 21, "section": null, "tags": []}, "B678": {"text": "供专业化的理财服务。对于首次购买我公司理财产品客户，我司将自动为您开", "page": 21, "section": null, "tags": []}, "B679": {"text": "立理财产品份额登记账户。", "page": 21, "section": null, "tags": []}, "B680": {"text": "根据财政部、国家税务总局相关税收监管政策的规定，理财产品运营过程中发", "page": 21, "section": null, "tags": []}, "B681": {"text": "生的增值税应税行为，以管理人为增值税纳税人，计算并缴纳增值税及附加税", "page": 21, "section": null, "tags": []}, "B682": {"text": "费。工银理财有限责任公司作为理财产品投资管理人,将按照相关规定计算应缴", "page": 21, "section": null, "tags": []}, "B683": {"text": "纳的税费，并从理财产品财产中支付。后续国家法律法规如对相关税收政策进", "page": 21, "section": null, "tags": []}, "B684": {"text": "行调整，工银理财有权根据税收政策相应调整理财产品运营过程中发生的税费", "page": 22, "section": null, "tags": []}, "B685": {"text": "的承担方式。", "page": 22, "section": null, "tags": []}, "B686": {"text": "客户应密切关注工银理财有限责任公司与本理财产品有关的信息公告，以免造", "page": 22, "section": null, "tags": []}, "B687": {"text": "成不必要的损失。", "page": 22, "section": null, "tags": []}, "B688": {"text": "十八、咨询（投诉）方式：", "page": 22, "section": null, "tags": []}, "B689": {"text": "如果您对所购买的理财产品有任何建议或意见，可以通过以下方式联系销售机", : []}, "B048": {"text": "册的跟踪同一标的指数的公募基金、已与中国证监会签署双边监管合", "page": 2, "section": "基金投资与净值表现", "tags": ["市场风险"]}, "B049": {"text": "作谅解备忘录的国家或地区证券市场挂牌交易的普通股、优先股、存", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B050": {"text": "托凭证(包括全球存托凭证、 美国存托凭证等)、 房地产信托凭证、 政府", "page": 2, "section": "基金投资与净值表现", "tags": ["机制特有风险"]}, "B051": {"text": "债券、公司债券、可转换债券、住房按揭支持证券、资产支持证券等", "page": 2, "section": "基金投资与净值表现", "tags": ["机制特有风险"]}, "B052": {"text": "及经中国证监会认可的国际金融组织发行的证券、银行存款、货币市", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B053": {"text": "场工具、经中国证监会认可的境外交易所上市交易的期权、期货等金", "page": 2, "section": "基金投资与净值表现", "tags": ["杠杆风险", "汇率与跨境风险"]}, "B054": {"text": "融衍生产品和法律法规或中国证监会允许基金投资的其他金融工具。", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B055": {"text": "如法律法规或监管机构以后允许基金投资其他品种，在履行适当程序", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B056": {"text": "后，本基金可以将其纳入投资范围，其投资原则及投资比例按法律法", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B057": {"text": "规或监管机构的相关规定执行。", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B058": {"text": "本基金投资于目标ETF的资产不低于基金资产净值的90%； 现金或到期", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B059": {"text": "日在一年以内的政府债券不低于基金资产净值的5%， 现金不包括结算", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B060": {"text": "备付金、存出保证金、应收申购款等。若法律法规的相关规定发生变", "page": 2, "section": "基金投资与净值表现", "tags": ["杠杆风险", "机制特有风险"]}, "B061": {"text": "更或监管机构允许，本基金可对上述资产配置比例进行调整。", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B062": {"text": "本基金的标的指数为纳斯达克100指数，及其未来可能发生的变更。", "page": 2, "section": "基金投资与净值表现", "tags": ["市场风险"]}, "B063": {"text": "主要投资策略", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B064": {"text": "本基金为易方达纳斯达克100ETF的联接基金， 主要通过投资于易方达", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B065": {"text": "纳斯达克100ETF实现对业绩比较基准的紧密跟踪， 力争将日均跟踪偏", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B066": {"text": "离度控制在0.35%以内，年化跟踪误差控制在4%以内。主要投资策略", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B067": {"text": "包括目标ETF投资策略、股票投资策略、金融衍生品投资策略等。", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B068": {"text": "业绩比较基准 纳斯达克 100指数收益率 (使用估值汇率折算 )×95%+活期存款利率", "page": 2, "section": "基金投资与净值表现", "tags": ["市场风险", "汇率与跨境风险"]}, "B069": {"text": "(税后)×5%", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B070": {"text": "风险收益特征", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B071": {"text": "本基金为ETF联接基金， 预期风险与预期收益水平高于混合型基金、 债", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B072": {"text": "券型基金与货币市场基金。本基金主要通过投资于易方达纳斯达克", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B073": {"text": "100ETF实现对业绩比较基准的紧密跟踪。因此，本基金的业绩表现与", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B074": {"text": "纳斯达克100指数的表现密切相关。", "page": 2, "section": "基金投资与净值表现", "tags": ["市场风险"]}, "B075": {"text": "此外， 本基金主要通过投资于易方达纳斯达克100ETF间接投资于美国", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B076": {"text": "证券市场，需承担汇率风险以及境外市场的风险。", "page": 2, "section": "基金投资与净值表现", "tags": ["汇率与跨境风险"]}, "B077": {"text": "注：投资者可阅读《招募说明书》基金的投资章节了解详细情况。", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B078": {"text": "投资组合资产配置图表", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B079": {"text": "区域配置图表", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B080": {"text": "本基金2025年12月31日未持有各个国家（地区）证券市场的权益投资。", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B081": {"text": "3 / 5", "page": 3, "section": "基金投资与净值表现", "tags": []}, "B082": {"text": "注： 基金合同生效当年期间的相关数据按实际存续期计算。 基金的过往业绩不代表未来表现。", "page": 3, "section": "基金投资与净值表现", "tags": []}, "B083": {"text": "以下费用在认购/申购/赎回基金过程中收取：", "page": 3, "section": "投资本基金涉及的费用", "tags": ["流动性风险", "机制特有风险"]}, "B084": {"text": "费用类型 份额（S）或金额（M）", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B085": {"text": "/持有期限（N）", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B086": {"text": "收费方式", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B087": {"text": "/费率 备注", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B088": {"text": "申购费 （前", "page": 3, "section": "投资本基金涉及的费用", "tags": ["机制特有风险"]}, "B089": {"text": "收费）", "page": 3, "section":   } else if(tab==='compare'){
    h+='<div style="overflow-x:auto">'+cmpTable('')+'</div><div class="note">与右侧表格联动：'
      +'点上方产品按钮即可更换比对对象。横向比较是本平台区别于单产品解读的核心能力：'
      +'投资者真正要回答的问题是「A 和 B 我该选哪个」。</div>';
  } else {
    (it.glossary||[]).forEach(function(g,i){
      h+='<div class="card"><div class="txt">'+esc(g)+'</div><div class="meta">'+
         srcLine(cur, (it.glossary_sources||[])[i])+'</div></div>';
    });
  }
  document.getElementById('screen').innerHTML=h;
  var t=D.trace[cur]||{};
  document.getElementById('trace').textContent=(t.log||[]).join('\n');
}
document.querySelectorAll('.tabs button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); tab=b.dataset.tab; render();
  };
});
document.querySelectorAll('.pick button').forEach(function(b){
  b.onclick=function(){
    var p=b.dataset.p, i=sel.indexOf(p);
    if(i>=0){ if(sel.length>1){ sel.splice(i,1); b.classList.remove('on'); } }
    else { sel.push(p); b.classList.add('on'); }
    cur=p; render(); renderCmp();
  };
});
render(); renderCmp();
</script></body></html>
