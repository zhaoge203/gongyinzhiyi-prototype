ction": null, "tags": ["机制特有风险"]}, "B827": {"text": "申购份额计算公式如下：", "page": 32, "section": null, "tags": ["机制特有风险"]}, "B828": {"text": "净申购金额＝申购金额/（1＋申购费率）", "page": 32, "section": null, "tags": ["机制特有风险"]}, "B829": {"text": "申购手续费＝申购金额－净申购金额", "page": 32, "section": null, "tags": ["机制特有风险"]}, "B830": {"text": "申购份额＝净申购金额/申购当日基金单位净值", "page": 32, "section": null, "tags": ["机制特有风险"]}, "B831": {"text": "例一：投资人通过场内申购A类人民币份额的计算", "page": 32, "section": null, "tags": ["机制特有风险"]}, "B832": {"text": "某投资人投资6，000元通过场内申购本基金A类人民币份额，其对应的场内申购费率", "page": 32, "section": null, "tags": ["机制特有风险"]}, "B833": {"text": "为1.5%，假设申购当日A类人民币份额为1.0601元，则其可得到的A类人民币份额为：", "page": 32, "section": null, "tags": ["机制特有风险"]}, "B834": {"text": "净申购金额＝6，000/（1＋1.5%）＝5，911.33元", "page": 32, "section": null, "tags": ["机制特有风险"]}, "B835": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 33, "section": null, "tags": ["市场风险"]}, "B836": {"text": "29", "page": 33, "section": null, "tags": []}, "B837": {"text": "申购费用＝6，000－5，911.33＝88.67元", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B838": {"text": "申购份额＝5，911.33/1.0601＝5，576份（保留至整数位）", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B839": {"text": "即：投资人投资6，000元从场内申购本基金A类人民币份额，假设申购当日A类人民", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B840": {"text": "币份额为1.0601元，则其可得到5，576份A类人民币份额。", "page": 33, "section": null, "tags": []}, "B841": {"text": "例二：投资人通过场外申购A类人民币份额的计算", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B842": {"text": "某投资人投资6，000元通过场外申购本基金A类人民币份额，其对应的场外申购费率", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B843": {"text": "为1. 5%，假设申购当日A类人民币份额净值为1.0601元，则其可得到的A类人民币份额为 ：", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B844": {"text": "净申购金额＝6，000/（1＋1.5%）＝5，911.33元", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B845": {"text": "申购费用＝6，000－5，911.33＝88.67元", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B846": {"text": "申购份额＝5，911.33/1.0601＝5，576.20份", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B847": {"text": "即：投资人投资6，000元申购本基金A类人民币份额，假设申购当日A类人民币份额", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B848": {"text": "为1.0601元，则其可得到5，576. 20份A类人民币份额。", "page": 33, "section": null, "tags": []}, "B849": {"text": "例三：投资人通过场外申购C类人民币份额的计算", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B850": {"text": "某投资人投资6，000元通过场外申购本基金C类人民币份额，不收取申购费，假设申", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B851": {"text": "购当日A类人民币份额净值为1.0601元，则其可得到的C类人民币份额为：", "page": 33, "section": null, "tags": []}, "B852": {"text": "申购费用＝0元", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B853": {"text": "申购份额＝6，000/1.0601＝5,659.84份", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B854": {"text": "2)赎回金额的计算", "page": 33, "section": null, "tags": ["流动性风险"]}, "B855": {"text": "赎回金额计算公式如下：", "page": 33, "section": null, "tags": ["流动性风险"]}, "B856": {"text": "赎回总金额＝赎回份额×赎回当日基金单位净值", "page": 33, "section": null, "tags": ["流动性风险"]}, "B857": {"text": "赎回手续费＝赎回总金额×赎回费率", "page": 33, "section": null, "tags": ["流动性风险"]}, "B858": {"text": "净赎回金额＝赎回总金额－赎回手续费", "page": 33, "section": null, "tags": ["流动性风险"]}, "B859": {"text": "例四：投资人通过场内赎回A类人民币份额的计算", "page": 33, "section": null, "tags": ["流动性风险"]}, "B860": {"text": "某投资人从深交所场内赎回本基金10，000份A类人民币份额，持有期限为六个月，赎", "page": 33, "section": null, "tags": ["流动性风险"]}, "B861": {"text": "回费率为0.5%，假设赎回当日A类人民币份额为1.1482元，则其可得到的净赎回金额为：", "page": 33, "section": null, "tags": ["流动性风险"]}, "B862": {"text": "赎回总金额＝10，000×1.1482＝11，482元", "page": 33, "section": null, "tags": ["流动性风险"]}, "B863": {"text": "赎回费用＝11，482×0.5%＝57. 41元", "page": 33, "section": null, "tags": ["流动性风险"]}, "B864": {"text": "净赎回金额＝11，482－57. 41＝11，424.59元", "page": 33, "section": null, "tags": ["流动性风险"]}, "B865": {"text": "即：投资人从深交所场内赎回本基金10，000份A类人民币份额，假设赎回当日A类人", "page": 33, "section": null, "tags": ["流动性风险"]}, "B866": {"text": "民币份额为1.1482元，则其可得到的净赎回金额为为11，424.59元。", "page": 33, "section": null, "tags": ["流动性风险"]}, "B867": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 34, "section": null, "tags": ["市场风险"]}, "B868": {"text": "30", "page": 34, "section": null, "tags": []}, "B869": {"text": "例五：投资人通过场外赎回A类人民币份额的计算", "page": 34, "section": null, "tags": ["流动性风险"]}, "B870": {"text": "某投资人赎回本基金10，000份A类人民币份额，持有时间为一年六个月，对应的赎回", "page": 34, "section": null, "tags": ["流动性风险"]}, "B871": {"text": "费率为0.25%，假设赎回当日A类人民币份额是1.1482元，则其可得到的净赎回金额为：", "page": 34, "section": null, "tags": ["流动性风险"]}, "B872": {"text": "赎回总金额＝10，000×1.1482＝11，482元", "page": 34, "section": null, "tags": ["流动性风险"]}, "B873": {"text": "赎回费用＝11，482×0.25%＝28.71元", "page": 34, "section": null, "tags": ["流动性风险"]}, "B874": {"text": "净赎回金额＝11，482－28.71＝11，453.29元", "page": 34, "section": null, "tags": ["流动性风险"]}, "B875": {"text": "即：某投资人持有10，000份本基金A类人民币份额，持有时间为一年六个月，假设赎", "page": 34, "section": null, "tags": []}, "B876": {"text": "回当日本基金A类人民币份额净值是1.1482元， 则其可得到的净赎回金额为11，453.29元。", "page": 34, "section": null, "tags": ["流动性风险"]}, "B877": {"text": "4．不从本类别基金资产中计提销售服务费，收取申购费且以人民币申购的基金份额确", "page": 34, "section": null, "tags": ["机制特有风险"]}, "B878": {"text": "认为A类人民币份额，从本类别基金资产中计提销售服务费，但不收取申购费且以人民币申", "page": 34, "section": null, "tags": ["机制特有风险"]}, "B879": {"text": "购的基金份额确认为C类人民币份额，不从本类别基金资产中计提销售服务费，收取申购费", "page": 34, "section": null, "tags": ["机制特有风险"]}, "B880": {"text": "且以美元申购的基金份额确认为A类美元份额。", "page": 34, "section": null, "tags": ["机制特有风险"]}, "B881": {"text": "1．投资人T日场外申购基金成功后，正常情况下，登记结算机构在T＋2日为投资者增", "page": 34, "section": null, "tags": ["机制特有风险"]}, "B882": {"text": "加权益并办理登记结算手续，投资者自T＋3日起有权赎回该部分基金份额。", "page": 34, "section": null, "tags": ["流动性风险"]}, "B883": {"text": "2．投资人T日场外赎回基金成功后，正常情况下，登记结算机构在T＋2日为投资者扣", "page": 34, "section": null, "tags": ["流动性风险"]}, "B884": {"text": "除权益并办理相应的登记结算手续。", "page": 34, "section": null, "tags": []}, "B885": {"text": "3.本基金场内申购和赎回的登记结算业务， 按照深圳证券交易所及中国证券登记结算有", "page": 34, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B886": {"text": "限责任公司的有关规定处理。", "page": 34, "section": null, "tags": []}, "B887": {"text": "4．基金管理人可在法律法规允许的范围内，对上述登记结算办理时间进行调整，并最", "page": 34, "section": null, "tags": []}, "B888": {"text": "迟于开始实施前按照《信息披露办法》的有关规定在指定媒介上公告。", "page": 34, "section": null, "tags": []}, "B889": {"text": "发生下列情况时，基金管理人可拒绝或暂停接受投资人的申购申请：", "page": 34, "section": null, "tags": ["机制特有风险"]}, "B890": {"text": "1.因不可抗力导致基金无法正常运作或者因不可抗力导致基金管理人无法接受投资人", "page": 34, "section": null, "tags": []}, "B891": {"text": "的申购申请。", "page": 34, "section": null, "tags": ["机制特有风险"]}, "B892": {"text": "2．证券交易所交易时间非正常停市，导致基金管理人无法计算当日基金资产净值。", "page": 34, "section": null, "tags": []}, "B893": {"text": "3.本基金所涉及外汇市场正常或非正常停市， 可能影响本基金投资或导致基金管理人无", "page": 34, "section": null, "tags": []}, "B894": {"text": "法计算当日基金资产净值。", "page": 34, "section": null, "tags": []}, "B895": {"text": "4.发生本基金合同规定的暂停基金资产估值情况时， 基金管理人可暂停接收投资者的申", "page": 34, "section": null, "tags": []}, "B896": {"text": "购申请。当前一估值日基金资产净值50%以上的资产出现无可参考的活跃市场价格且采用估", "page": 34, "section": null, "tags": []}, "B897": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 35, "section": null, "tags": ["市场风险"]}, "B898": {"text": "31", "page": 35, "section": null, "tags": []}, "B899": {"text": "值技术仍导致公允价值存在重大不确定性时，经与基金托管人协商确认后，基金管理人应当", "page": 35, "section": null, "tags": []}, "B900": {"text": "暂停接受基金申购申请。", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B901": {"text": "5.本基金的资产规模达到监管机构核定的本基金境外证券投资额度。", "page": 35, "section": null, "tags": ["汇率与跨境风险"]}, "B902": {"text": "6.基金管理人认为接受某笔或某些申购申请可能会影响或损害现有基金份额持有人利", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B903": {"text": "益时。", "page": 35, "section": null, "tags": []}, "B904": {"text": "7.因基金收益分配、或基金投资组合内某个或某些证券进行权益分派等原因，使基金管", "page": 35, "section": null, "tags": []}, "B905": {"text": "理人认为短期内继续接受申购可能会影响或损害现有基金份额持有人利益的。", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B906": {"text": "8.基金管理人认为接受某笔或某些申购申请可能会影响或损害现有基金份额持有人利", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B907": {"text": "益时。", "page": 35, "section": null, "tags": []}, "B908": {"text": "9.基金资产规模过大，使基金管理人无法找到合适的投资品种，或其他可能对基金业绩", "page": 35, "section": null, "tags": []}, "B909": {"text": "产生负面影响，从而损害现有基金份额持有人利益的情形。", "page": 35, "section": null, "tags": []}, "B910": {"text": "10. 基金投资所处的主要市场休市时或本基金的资产组合中的重要部分发生暂停交易或", "page": 35, "section": null, "tags": []}, "B911": {"text": "其他重大事件，继续接受申购可能会影响或损害其他基金份额持有人利益时。", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B912": {"text": "11. 基金管理人、基金托管人、基金销售机构、登记结算机构或深圳证券交易所的技术", "page": 35, "section": null, "tags": []}, "B913": {"text": "保障等异常情况发生导致基金销售系统或基金登记结算系统或基金会计系统无法正常运行。", "page": 35, "section": null, "tags": []}, "B914": {"text": "12.基金管理人接受某笔或者某些申购申请有可能导致单一投资者持有基金份额数的比", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B915": {"text": "例达到或者超过基金份额总数的50%，或者变相规避50%集中度的情形时。", "page": 35, "section": null, "tags": []}, "B916": {"text": "13.申请超过基金管理人设定的基金总规模、单日净申购比例上限、单一投资者单日或", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B917": {"text": "单笔申购金额上限的。", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B918": {"text": "14.法律法规规定或中国证监会认定的其他情形。", "page": 35, "section": null, "tags": []}, "B919": {"text": "发生上述除第8、12、13项以外的暂停申购情形且基金管理人决定暂停接受申购申请时，", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B920": {"text": "基金管理人应当根据有关规定在指定媒介上刊登暂停申购公告。 如果投资人的申购申请被拒", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B921": {"text": "绝，被拒绝的申购款项将退还给投资人。在暂停申购的情况消除时，基金管理人应及时恢复", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B922": {"text": "申购业务的办理。", "page": 35, "section": null, "tags": ["机制特有风险"]}, "B923": {"text": "发生下列情形时，基金管理人可暂停接受投资人的赎回申请或延缓支付赎回款项：", "page": 35, "section": null, "tags": ["流动性风险"]}, "B924": {"text": "1.因不可抗力导致基金无法正常运作或者因不可抗力导致基金管理人不能支付赎回款", "page": 35, "section": null, "tags": ["流动性风险"]}, "B925": {"text": "项。", "page": 35, "section": null, "tags": []}, "B926": {"text": "2.证券交易所交易时间非正常停市，导致基金管理人无法计算当日基金资产净值。", "page": 35, "section": null, "tags": []}, "B927": {"text": "3.本基金所涉及外汇市场正常或非正常停市， 可能影响本基金投资或导致基金管理人无", "page": 35, "section": null, "tags": []}, "B928": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 36, "section": null, "tags": ["市场风险"]}, "B929": {"text": "32", "page": 36, "section": null, "tags": []}, "B930": {"text": "法计算当日基金资产净值和基金份额净值。", "page": 36, "section": null, "tags": []}, "B931": {"text": "4.连续两个或两个以上开放日发生巨额赎回。", "page": 36, "section": null, "tags": ["流动性风险"]}, "B932": {"text": "5.发生本基金合同规定的暂停基金资产估值情况时， 基金管理人可暂停接受投资者的赎", "page": 36, "section": null, "tags": []}, "B933": {"text": "回申请或延缓支付赎回款项。当前一估值日基金资产净值50%以上的资产出现无可参考的活", "page": 36, "section": null, "tags": ["流动性风险"]}, "B934": {"text": "跃市场价格且采用估值技术仍导致公允价值存在重大不确定性时， 经与基金托管人协商确认", "page": 36, "section": null, "tags": []}, "B935": {"text": "后，基金管理人应当暂停接受基金赎回申请或延缓支付赎回款项。", "page": 36, "section": null, "tags": ["流动性风险"]}, "B936": {"text": "6. 基金投资所处的主要市场休市时或本基金的资产组合中的重要部分发生暂停交易或", "page": 36, "section": null, "tags": []}, "B937": {"text": "其他重大事件，继续接受赎回可能会影响或损害其他基金份额持有人利益时。", "page": 36, "section": null, "tags": ["流动性风险"]}, "B938": {"text": "7.法律法规规定或中国证监会认定的其他情形。", "page": 36, "section": null, "tags": []}, "B939": {"text": "发生上述情形且基金管理人决定暂停接受投资人的赎回申请或延缓支付赎回款项时， 场", "page": 36, "section": null, "tags": ["流动性风险"]}, "B940": {"text": "外情况下，基金管理人应在当日报中国证监会备案，已接受的赎回申请，基金管理人应足额", "page": 36, "section": null, "tags": ["流动性风险"]}, "B941": {"text": "支付；如暂时不能足额支付，应将可支付部分按单个账户申请量占申请总量的比例分配给赎", "page": 36, "section": null, "tags": []}, "B942": {"text": "回申请人，未支付部分可延期支付，并以后续开放日的基金份额净值为依据计算赎回金额。", "page": 36, "section": null, "tags": ["流动性风险"]}, "B943": {"text": "若连续两个或两个以上开放日发生巨额赎回，延期支付最长不得超过正常支付时间20个工", "page": 36, "section": null, "tags": ["流动性风险"]}, "B944": {"text": "作日，并在指定媒介上公告。投资人在申请赎回时可事先选择将当日可能未获受理部分予以", "page": 36, "section": null, "tags": ["流动性风险"]}, "B945": {"text": "撤销。在暂停赎回的情况消除时，基金管理人应及时恢复赎回业务的办理并予以公告。场内", "page": 36, "section": null, "tags": ["流动性风险"]}, "B946": {"text": "情况下，按照深圳证券交易所及中国证券登记结算有限责任公司的有关规定办理。在暂停赎", "page": 36, "section": null, "tags": []}, "B947": {"text": "回的情况消除时，基金管理人应及时恢复赎回业务的办理并予以公告。", "page": 36, "section": null, "tags": ["流动性风险"]}, "B948": {"text": "1.巨额赎回的认定", "page": 36, "section": null, "tags": ["流动性风险"]}, "B949": {"text": "若本基金单个开放日内的基金份额净赎回申请(赎回申请份额总数加上基金转换中转出", "page": 36, "section": null, "tags": ["流动性风险"]}, "B950": {"text": "申请份额总数后扣除申购申请份额总数及基金转换中转入申请份额总数后的余额)超过上一", "page": 36, "section": null, "tags": ["机制特有风险"]}, "B951": {"text": "开放日的基金总份额的10%，即认为是发生了巨额赎回。", "page": 36, "section": null, "tags": ["流动性风险"]}, "B952": {"text": "2.巨额赎回的处理方式", "page": 36, "section": null, "tags": ["流动性风险"]}, "B953": {"text": "（1）场外巨额赎回的处理", "page": 36, "section": null, "tags": ["流动性风险"]}, "B954": {"text": "当基金出现巨额场外赎回时， 基金管理人可以根据基金当时的资产组合状况决定全额赎", "page": 36, "section": null, "tags": ["流动性风险"]}, "B955": {"text": "回或部分延期赎回。", "page": 36, "section": null, "tags": ["流动性风险"]}, "B956": {"text": "1)全额赎回：当基金管理人认为有能力支付投资人的全部赎回申请时，按正常赎回程序", "page": 36, "section": null, "tags": ["流动性风险"]}, "B957": {"text": "执行。", "page": 36, "section": null, "tags": []}, "B958": {"text": "2)部分延期赎回：当基金管理人认为支付投资人的赎回申请有困难或认为因支付投资人", "page": 36, "section": null, "tags": ["流动性风险"]}, "B959": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 37, "section": null, "tags": ["市场风险"]}, "B960": {"text": "33", "page": 37, "section": null, "tags": []}, "B961": {"text": "的赎回申请而进行的财产变现可能会对基金资产净值造成较大波动时， 基金管理人在当日接", "page": 37, "section": null, "tags": ["流动性风险"]}, "B962": {"text": "受赎回比例不低于上一开放日基金总份额的10％的前提下，可对其余赎回申请延期办理。", "page": 37, "section": null, "tags": ["流动性风险"]}, "B963": {"text": "在单个基金份额持有人超过基金总份额20%以上的赎回申请情形下，本基金将按照以下", "page": 37, "section": null, "tags": ["流动性风险"]}, "B964": {"text": "规则实施延期办理赎回申请：若发生巨额赎回，存在单个基金份额持有人超过基金总份额", "page": 37, "section": null, "tags": ["流动性风险"]}, "B965": {"text": "20%以上（“大额赎回申请人”）的赎回申请情形，基金管理人可以按照保护其他赎回申请", "page": 37, "section": null, "tags": ["流动性风险"]}, "B966": {"text": "人（“普通赎回申请人”） 利益的原则，优先确认普通赎回申请人的赎回申请，在当日可接", "page": 37, "section": null, "tags": ["流动性风险"]}, "B967": {"text": "受赎回的范围内对普通赎回申请人的赎回申请予以全部确认或按单个账户赎回申请量占普", "page": 37, "section": null, "tags": ["流动性风险"]}, "B968": {"text": "通赎回申请人赎回申请总量的比例确认；在普通赎回申请人的赎回申请全部确认且当日接受", "page": 37, "section": null, "tags": ["流动性风险"]}, "B969": {"text": "赎回比例不低于上一开放日基金总份额的10%的前提下，在仍可接受赎回申请的范围内对大", "page": 37, "section": null, "tags": ["流动性风险"]}, "B970": {"text": "额赎回申请人的赎回申请按比例确认。", "page": 37, "section": null, "tags": ["流动性风险"]}, "B971": {"text": "对于未能赎回部分，投资人在提交赎回申请时可以选择延期赎回或取消赎回。选择延期", "page": 37, "section": null, "tags": ["流动性风险"]}, "B972": {"text": "赎回的，将自动转入下一个开放日继续赎回，直到全部赎回为止；选择取消赎回的，当日未", "page": 37, "section": null, "tags": ["流动性风险"]}, "B973": {"text": "获受理的部分赎回申请将被撤销。延期的赎回申请与下一开放日赎回申请一并处理，无优先", "page": 37, "section": null, "tags": ["流动性风险"]}, "B974": {"text": "权并以下一开放日对应份额类别的基金份额净值为基础计算赎回金额，以此类推，直到全部", "page": 37, "section": null, "tags": ["流动性风险"]}, "B975": {"text": "赎回为止。如投资人在提交赎回申请时未作明确选择，投资人未能赎回部分作自动延期赎回", "page": 37, "section": null, "tags": ["流动性风险"]}, "B976": {"text": "处理。部分延期赎回不受单笔赎回最低份额的限制。", "page": 37, "section": null, "tags": ["流动性风险"]}, "B977": {"text": "3)暂停赎回：连续2日以上(含本数)发生巨额赎回，如基金管理人认为有必要，可暂停", "page": 37, "section": null, "tags": ["流动性风险"]}, "B978": {"text": "接受基金的赎回申请；已经接受的赎回申请可以延缓支付赎回款项，但不得超过20个工作", "page": 37, "section": null, "tags": ["流动性风险"]}, "B979": {"text": "日，并应当在指定媒介上进行公告。", "page": 37, "section": null, "tags": []}, "B980": {"text": "（2）场内巨额赎回的处理", "page": 37, "section": null, "tags": ["流动性风险"]}, "B981": {"text": "巨额赎回业务的场内处理， 按照深圳证券交易所及中国证券登记结算有限责任公司的有", "page": 37, "section": null, "tags": ["流动性风险"]}, "B982": {"text": "关规定办理。", "page": 37, "section": null, "tags": []}, "B983": {"text": "3.巨额赎回的公告", "page": 37, "section": null, "tags": ["流动性风险"]}, "B984": {"text": "当发生上述延期赎回并延期办理时，基金管理人应当通过邮寄、传真或者本招募说明书", "page": 37, "section": null, "tags": ["流动性风险"]}, "B985": {"text": "规定的其他方式在3个交易日内通知基金份额持有人，说明有关处理方法，并在2日内在指", "page": 37, "section": null, "tags": []}, "B986": {"text": "定媒介上刊登公告。", "page": 37, "section": null, "tags": []}, "B987": {"text": "1.发生上述暂停申购或赎回情况的， 基金管理人应在规定期限内在指定媒介上刊登暂停", "page": 37, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B988": {"text": "公告。", "page": 37, "section": null, "tags": []}, "B989": {"text": "2.如发生暂停的时间为1日，基金管理人应于重新开放日，在指定媒介上刊登基金重新", "page": 37, "section": null, "tags": []}, "B990": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 38, "section": null, "tags": ["市场风险"]}, "B991": {"text": "34", "page": 38, "section": null, "tags": []}, "B992": {"text": "开放申购或赎回公告，并公布最近1个开放日各类基金份额的基金份额净值。", "page": 38, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B993": {"text": "3. 如发生暂停的时间超过1日，暂停结束，基金重新开放申购或赎回时，基金管理人", "page": 38, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B994": {"text": "应按照 《信息披露管理办法》 的有关规定， 在指定媒介上刊登基金重新开放申购或赎回公告，", "page": 38, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B995": {"text": "并公告最近1个开放日各类基金份额的基金份额净值。", "page": 38, "section": null, "tags": []}, "B996": {"text": "基金管理人可以根据相关法律法规以及本基金合同的规定决定开办本基金与基金管理", "page": 38, "section": null, "tags": []}, "B997": {"text": "人管理的、且由同一登记结算机构办理登记结算的其他基金之间的转换业务，基金转换可以", "page": 38, "section": null, "tags": []}, "B998": {"text": "收取一定的转换费， 相关规则由基金管理人届时根据相关法律法规及本基金合同的规定制定", "page": 38, "section": null, "tags": []}, "B999": {"text": "并公告，并提前告知基金托管人与相关机构。", "page": 38, "section": null, "tags": []}, "B1000": {"text": "除非基金管理人在未来条件成熟后另行公告开通相关业务， 本基金不同基金份额类别之", "page": 38, "section": null, "tags": []}, "B1001": {"text": "间不得互相转换。", "page": 38, "section": null, "tags": []}, "B1002": {"text": "基金的非交易过户是指基金登记结算机构受理继承、 捐赠和司法强制执行而产生的非交", "page": 38, "section": null, "tags": []}, "B1003": {"text": "易过户以及登记结算机构认可、符合法律法规的其它非交易过户。无论在上述何种情况下，", "page": 38, "section": null, "tags": []}, "B1004": {"text": "接受划转的主体必须是依法可以持有本基金基金份额的投资人。", "page": 38, "section": null, "tags": []}, "B1005": {"text": "继承是指基金份额持有人死亡，其持有的基金份额由其合法的继承人继承；捐赠指基金", "page": 38, "section": null, "tags": []}, "B1006": {"text": "份额持有人将其合法持有的基金份额捐赠给福利性质的基金会或社会团体；司法强制执行是", "page": 38, "section": null, "tags": []}, "B1007": {"text": "指司法机构依据生效司法文书将基金份额持有人持有的基金份额强制划转给其他自然人、 法", "page": 38, "section": null, "tags": []}, "B1008": {"text": "人或其他组织。办理非交易过户必须提供基金登记结算机构要求提供的相关资料，对于符合", "page": 38, "section": null, "tags": []}, "B1009": {"text": "条件的非交易过户申请按基金登记结算机构的规定办理， 并按基金登记结算机构规定的标准", "page": 38, "section": null, "tags": []}, "B1010": {"text": "收费。", "page": 38, "section": null, "tags": []}, "B1011": {"text": "基金份额持有人可办理已持有基金份额在不同销售机构之间的转托管， 基金销售机构可", "page": 38, "section": null, "tags": []}, "B1012": {"text": "以按照规定的标准收取转托管费。", "page": 38, "section": null, "tags": []}, "B1013": {"text": "本基金A类人民币份额的转托管包括系统内转托管和跨系统转托管。", "page": 38, "section": null, "tags": []}, "B1014": {"text": "1.系统内转托管", "page": 38, "section": null, "tags": []}, "B1015": {"text": "（1）系统内转托管是指基金份额持有人将持有的A类人民币份额在注册登记系统内不", "page": 38, "section": null, "tags": []}, "B1016": {"text": "同销售机构（网点）之间或证券登记结算系统内不同会员单位（交易单元）之间进行转托管", "page": 38, "section": null, "tags": []}, "B1017": {"text": "的行为。", "page": 38, "section": null, "tags": []}, "B1018": {"text": "（2）A类人民币份额登记在注册登记系统的基金份额持有人在变更办理基金赎回业务", "page": 38, "section": null, "tags": ["流动性风险"]}, "B1019": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 39, "section": null, "tags": ["市场风险"]}, "B1020": {"text": "35", "page": 39, "section": null, "tags": []}, "B1021": {"text": "的销售机构（网点）时，销售机构（网点）之间不能通存通兑的，可办理已持有基金份额的", "page": 39, "section": null, "tags": []}, "B1022": {"text": "系统内转托管。", "page": 39, "section": null, "tags": []}, "B1023": {"text": "（3）A类人民币份额登记在证券登记结算系统的基金份额持有人在变更办理上市交易", "page": 39, "section": null, "tags": []}, "B1024": {"text": "的会员单位（交易单元）时，可办理已持有基金份额的系统内转托管。", "page": 39, "section": null, "tags": []}, "B1025": {"text": "2.跨系统转托管", "page": 39, "section": null, "tags": []}, "B1026": {"text": "（1）跨系统转托管是指基金份额持有人将持有的A类人民币份额在注册登记系统和证", "page": 39, "section": null, "tags": []}, "B1027": {"text": "券登记结算系统之间进行转托管的行为。", "page": 39, "section": null, "tags": []}, "B1028": {"text": "（2）本基金A类人民币份额跨系统转托管的具体业务按照中国证券登记结算有限责任", "page": 39, "section": null, "tags": []}, "B1029": {"text": "公司及深圳证券交易所的相关规定办理。", "page": 39, "section": null, "tags": []}, "B1030": {"text": "（3）除非基金管理人另行公告，本基金不支持基金份额持有人将持有的基金份额在中", "page": 39, "section": null, "tags": []}, "B1031": {"text": "国证券登记结算有限责任公司的注册登记系统或登记结算系统与华宝基金管理有限公司注", "page": 39, "section": null, "tags": []}, "B1032": {"text": "册登记系统之间进行转托管。", "page": 39, "section": null, "tags": []}, "B1033": {"text": "（4）基金销售机构可以按照相关规定向基金份额持有人收取转托管费。", "page": 39, "section": null, "tags": []}, "B1034": {"text": "基金管理人可以为投资人办理定期定额投资计划， 具体规则由基金管理人在届时发布公", "page": 39, "section": null, "tags": []}, "B1035": {"text": "告或更新的招募说明书中确定。 投资人在办理定期定额投资计划时可自行约定每期扣款金额，", "page": 39, "section": null, "tags": []}, "B1036": {"text": "但每期扣款金额必须不低于基金管理人在相关公告或更新的招募说明书中所规定的定期定", "page": 39, "section": null, "tags": []}, "B1037": {"text": "额投资计划最低申购金额。", "page": 39, "section": null, "tags": ["机制特有风险"]}, "B1038": {"text": "基金份额的冻结和解冻业务，由登记结算机构办理。", "page": 39, "section": null, "tags": []}, "B1039": {"text": "登记结算机构只受理国家有权机关依法要求的基金份额的冻结与解冻， 以及登记结算机", "page": 39, "section": null, "tags": []}, "B1040": {"text": "构认可、符合法律法规的其他情况下的基金份额的冻结与解冻。基金份额被冻结的，被冻结", "page": 39, "section": null, "tags": []}, "B1041": {"text": "部分所产生的权益按照法律法规、监管规章以及国家有权机关的要求决定是否冻结。", "page": 39, "section": null, "tags": []}, "B1042": {"text": "当基金份额处于冻结状态时， 登记结算机构或其他机构有权拒绝该部分基金份额的赎回、", "page": 39, "section": null, "tags": ["流动性风险"]}, "B1043": {"text": "转出、非交易过户以及基金的转托管申请。", "page": 39, "section": null, "tags": []}, "B1044": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 40, "section": null, "tags": ["市场风险"]}, "B1045": {"text": "36", "page": 40, "section": null, "tags": []}, "B1046": {"text": "九、基金的投资", "page": 40, "section": null, "tags": []}, "B1047": {"text": "通过严格的指数化投资策略，实现基金投资组合对标的指数的有效跟踪，力争控制净值", "page": 40, "section": null, "tags": ["市场风险"]}, "B1048": {"text": "增长率与业绩比较基准之间的日均跟踪偏离度的绝对值不超过0.5%，年化跟踪误差不超过", "page": 40, "section": null, "tags": []}, "B1049": {"text": "5%（以美元资产计价）。", "page": 40, "section": null, "tags": []}, "B1050": {"text": "本基金标的指数为标普石油天然气上游股票指数（S&P Oil & Gas Exploration &", "page": 40, "section": null, "tags": ["市场风险"]}, "B1051": {"text": "Production Select Industry Index），该指数是基于标普全市场指数（S&P Total Markets", "page": 40, "section": null, "tags": ["市场风险"]}, "B1052": {"text": "IndexTM）的精选子行业指数之一，选择在美国主要交易所（纽约证券交易所、美国证券交", "page": 40, "section": null, "tags": ["市场风险"]}, "B1053": {"text": "易所、纳斯达克等） 上市的石油天然气勘探、采掘和生产等上游行业的公司为标的，采用等", "page": 40, "section": null, "tags": []}, "B1054": {"text": "市值加权的方法计算。", "page": 40, "section": null, "tags": []}, "B1055": {"text": "本基金主要投资于：（1）标普石油天然气上游股票指数成份股、备选成份股；（2）跟", "page": 40, "section": null, "tags": ["市场风险"]}, "B1056": {"text": "踪标普石油天然气上游股票指数的公募基金、上市交易型基金等；（3）固定收益类证券、", "page": 40, "section": null, "tags": ["市场风险"]}, "B1057": {"text": "银行存款、现金等货币市场工具以及中国证监会允许本基金投资的其他产品或金融工具。", "page": 40, "section": null, "tags": []}, "B1058": {"text": "本基金投资于标普石油天然气上游股票指数成份股、 备选成份股的比例不低于基金资产", "page": 40, "section": null, "tags": ["市场风险"]}, "B1059": {"text": "净值的80%，投资于跟踪标普石油天然气上游股票指数的公募基金、上市交易型基金的比例", "page": 40, "section": null, "tags": ["市场风险"]}, "B1060": {"text": "不超过基金资产净值的10%；投资于现金或者到期日在一年以内的政府债券的比例不低于基", "page": 40, "section": null, "tags": []}, "B1061": {"text": "金资产净值的5%。", "page": 40, "section": null, "tags": []}, "B1062": {"text": "如法律法规或监管机构以后允许基金投资其他品种或变更投资比例限制， 基金管理人在", "page": 40, "section": null, "tags": []}, "B1063": {"text": "履行适当程序后，可以相应调整本基金的投资范围、投资比例规定。", "page": 40, "section": null, "tags": []}, "B1064": {"text": "本基金原则上采取完全复制策略， 即按照标的指数的成份股构成及其权重构建基金股票", "page": 40, "section": null, "tags": ["市场风险"]}, "B1065": {"text": "投资组合，并根据标的指数成份股及其权重的变动进行相应调整。但在因特殊情况（如股票", "page": 40, "section": null, "tags": ["市场风险"]}, "B1066": {"text": "停牌、流动性不足） 导致无法获得足够数量的股票时，基金管理人将使用其他合理方法进行", "page": 40, "section": null, "tags": ["流动性风险"]}, "B1067": {"text": "适当的替代，追求尽可能贴近目标指数的表现。本基金运作过程中，当标的指数成份股发生", "page": 40, "section": null, "tags": ["市场风险"]}, "B1068": {"text": "明显负面事件面临退市，且指数编制机构暂未作出调整的，基金管理人应当按照持有人利益", "page": 40, "section": null, "tags": ["市场风险"]}, "B1069": {"text": "优先的原则，履行内部决策程序后及时对相关成份股进行调整。", "page": 40, "section": null, "tags": []}, "B1070": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 41, "section": null, "tags": ["市场风险"]}, "B1071": {"text": "37", "page": 41, "section": null, "tags": []}, "B1072": {"text": "本基金还可能将一定比例的基金资产投资于与标的指数相关的公募基金、 上市交易型基", "page": 41, "section": null, "tags": ["市场风险"]}, "B1073": {"text": "金，以优化投资组合的建立，达到节约交易成本和有效追踪标的指数表现的目的。", "page": 41, "section": null, "tags": ["市场风险"]}, "B1074": {"text": "本基金在投资的过程中，造成跟踪误差的原因主要有以下几方面：", "page": 41, "section": null, "tags": []}, "B1075": {"text": "1．开放式基金日常运作过程中必须保有一定比例的现金资产；", "page": 41, "section": null, "tags": []}, "B1076": {"text": "2．基金投资组合的权重与目标指数的成分股的权重可能在调整周期当中出现不一致；", "page": 41, "section": null, "tags": ["市场风险"]}, "B1077": {"text": "3．基金补券过程中股票买卖价格与股票收盘价存在差异；", "page": 41, "section": null, "tags": []}, "B1078": {"text": "4．各种交易费用及基金运作过程中所产生的费用和开支；", "page": 41, "section": null, "tags": []}, "B1079": {"text": "5．成分股红利再投资等。", "page": 41, "section": null, "tags": []}, "B1080": {"text": "基金管理人会定期对跟踪误差进行归因分析， 为基金投资组合下一步的调整及跟踪目标", "page": 41, "section": null, "tags": []}, "B1081": {"text": "指数偏离风险的控制提供量化决策依据。同时，为更好地实现本基金的投资目标，本基金还", "page": 41, "section": null, "tags": ["市场风险"]}, "B1082": {"text": "将在条件允许的情况下，适当开展证券借贷业务，以期降低跟踪误差水平。", "page": 41, "section": null, "tags": []}, "B1083": {"text": "同时，本基金基于流动性管理及策略性投资的需要，将适当投资于美国短期国债和其他", "page": 41, "section": null, "tags": ["流动性风险"]}, "B1084": {"text": "货币市场工具，固定收益投资的目的是在保证基金资产流动性的同时有效利用基金资产，提", "page": 41, "section": null, "tags": ["流动性风险"]}, "B1085": {"text": "高基金资产的投资收益。", "page": 41, "section": null, "tags": []}, "B1086": {"text": "本基金采用完全复制法进行指数化投资， 按照成份股在标普石油天然气上游股票指数中", "page": 41, "section": null, "tags": ["市场风险"]}, "B1087": {"text": "的基准权重构建指数化投资组合。当预期成份股发生调整和成份股发生配股、增发、分红等", "page": 41, "section": null, "tags": ["市场风险"]}, "B1088": {"text": "行为时，以及因基金的申购和赎回对本基金跟踪标的指数的效果可能带来影响时，基金管理", "page": 41, "section": null, "tags": ["流动性风险", "市场风险", "机制特有风险"]}, "B1089": {"text": "人会在10个交易日内对投资组合进行适当调整，以便实现对跟踪误差的有效控制。", "page": 41, "section": null, "tags": []}, "B1090": {"text": "1．标的指数定期调整", "page": 41, "section": null, "tags": ["市场风险"]}, "B1091": {"text": "根据标的指数的编制规则及调整公告，本基金在指数成份股调整生效前，分析并确定组", "page": 41, "section": null, "tags": ["市场风险"]}, "B1092": {"text": "合调整策略，及时进行投资组合的优化调整，减少流动性冲击，尽量减少标的指数成份股变", "page": 41, "section": null, "tags": ["流动性风险", "市场风险"]}, "B1093": {"text": "动所带来的跟踪偏离度和跟踪误差。", "page": 41, "section": null, "tags": []}, "B1094": {"text": "2．成份股公司信息的日常跟踪与分析", "page": 41, "section": null, "tags": []}, "B1095": {"text": "跟踪标的指数成份股公司信息（如：股本变化、分红、配股、增发、停牌、复牌等），", "page": 41, "section": null, "tags": ["市场风险"]}, "B1096": {"text": "以及成份股公司其他重大信息，分析这些信息对指数的影响，并根据这些信息确定基金投资", "page": 41, "section": null, "tags": ["市场风险"]}, "B1097": {"text": "组合每日交易策略。", "page": 41, "section": null, "tags": []}, "B1098": {"text": "3．标的指数成份股票临时调整", "page": 41, "section": null, "tags": ["市场风险"]}, "B1099": {"text": "在标的指数成份股票调整周期内，若出现成份股票临时调整的情形，本基金管理人将密", "page": 41, "section": null, "tags": ["市场风险"]}, "B1100": {"text": "切关注样本股票的调整，并及时制定相应的投资组合调整策略。", "page": 41, "section": null, "tags": []}, "B1101": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 42, "section": null, "tags": ["市场风险"]}, "B1102": {"text": "38", "page": 42, "section": null, "tags": []}, "B1103": {"text": "4．申购赎回情况的跟踪与分析", "page": 42, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1104": {"text": "跟踪本基金申购和赎回信息，结合基金的现金头寸管理，分析其对组合的影响，制定交", "page": 42, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1105": {"text": "易策略以应对基金的申购赎回。", "page": 42, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1106": {"text": "5．跟踪偏离度的监控与管理", "page": 42, "section": null, "tags": []}, "B1107": {"text": "每日跟踪基金组合与标的指数表现的偏离度，每月末、季度末定期分析基金的实际组合", "page": 42, "section": null, "tags": ["市场风险"]}, "B1108": {"text": "与标的指数表现的累计偏离度、跟踪误差变化情况及其原因，并优化跟踪偏离度管理方案。", "page": 42, "section": null, "tags": ["市场风险"]}, "B1109": {"text": "在正常情况下，本基金日均跟踪偏离度的绝对值不超过 0.5%，年跟踪误差不超过5%（以美", "page": 42, "section": null, "tags": []}, "B1110": {"text": "元资产计价）。 如因指数编制规则调整或其他因素导致跟踪偏离度和跟踪误差超过上述范围，", "page": 42, "section": null, "tags": ["市场风险"]}, "B1111": {"text": "基金管理人将采取合理措施避免跟踪偏离度、跟踪误差进一步扩大。", "page": 42, "section": null, "tags": []}, "B1112": {"text": "本基金的业绩比较基准为：标普石油天然气上游股票指数（全收益指数）", "page": 42, "section": null, "tags": ["市场风险"]}, "B1113": {"text": "标普石油天然气上游股票指数（S&P Oil & Gas Exploration & Production Select", "page": 42, "section": null, "tags": ["市场风险"]}, "B1114": {"text": "Industry Index）是基于标普全市场指数（S&P Total Markets IndexTM）的精选子行业指数", "page": 42, "section": null, "tags": ["市场风险"]}, "B1115": {"text": "之一，选择在美国主要交易所（纽约证券交易所、美国证券交易所、纳斯达克等） 上市的石", "page": 42, "section": null, "tags": []}, "B1116": {"text": "油天然气勘探、采掘和生产等上游行业的公司为标的，采用等市值加权的方法计算。", "page": 42, "section": null, "tags": []}, "B1117": {"text": "未来若出现标的指数不符合要求 （不包括因成份股价格波动等指数编制方法变动之外的", "page": 42, "section": null, "tags": ["市场风险"]}, "B1118": {"text": "因素致使标的指数不符合要求的情形） 、指数编制机构退出等情形，基金管理人应当自该情", "page": 42, "section": null, "tags": ["市场风险"]}, "B1119": {"text": "形发生之日起十个工作日内向中国证监会报告并提出解决方案， 如对基金份额持有人利益有", "page": 42, "section": null, "tags": []}, "B1120": {"text": "实质性影响，则在6个月内召集基金份额持有人大会进行表决。", "page": 42, "section": null, "tags": []}, "B1121": {"text": "自指数编制机构停止标的指数的编制及发布至解决方案确定期间， 基金管理人应按照指", "page": 42, "section": null, "tags": ["市场风险"]}, "B1122": {"text": "数编制机构提供的最近一个交易日的指数信息遵循基金份额持有人利益优先原则维持基金", "page": 42, "section": null, "tags": ["市场风险"]}, "B1123": {"text": "投资运作。", "page": 42, "section": null, "tags": []}, "B1124": {"text": "本基金是一只美国股票指数型证券投资基金，风险与预期收益高于混合型基金、债券基", "page": 42, "section": null, "tags": ["市场风险"]}, "B1125": {"text": "金以及货币市场基金，属于预期风险较高的产品。", "page": 42, "section": null, "tags": []}, "B1126": {"text": "本基金在投资策略上兼顾投资原则以及开放式基金的固有特点， 通过分散投资降低基金", "page": 42, "section": null, "tags": []}, "B1127": {"text": "财产的非系统性风险，保持基金组合良好的流动性。基金的投资组合将遵循以下限制：", "page": 42, "section": null, "tags": ["流动性风险"]}, "B1128": {"text": "1．本基金持有同一家银行的存款不得超过基金净值的20%。银行应当是中资商业银行", "page": 42, "section": null, "tags": []}, "B1129": {"text": "在境外设立的分行或在最近一个会计年度达到中国证监会认可的信用评级机构评级的境外", "page": 42, "section": null, "tags": ["信用风险", "汇率与跨境风险"]}, "B1130": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 43, "section": null, "tags": ["市场风险"]}, "B1131": {"text": "39", "page": 43, "section": null, "tags": []}, "B1132": {"text": "银行，但在基金托管账户的存款不受此限制。", "page": 43, "section": null, "tags": []}, "B1133": {"text": "2．本基金持有与中国证监会签署双边监管合作谅解备忘录国家或地区以外的其他国家", "page": 43, "section": null, "tags": []}, "B1134": {"text": "或地区证券市场挂牌交易的证券资产（包括金融衍生产品）不得超过基金资产净值的10%，", "page": 43, "section": null, "tags": []}, "B1135": {"text": "其中持有任一国家或地区市场的证券资产不得超过基金资产净值的3%。", "page": 43, "section": null, "tags": []}, "B1136": {"text": "3．基金不得购买证券用于控制或影响发行该证券的机构或其管理层。", "page": 43, "section": null, "tags": []}, "B1137": {"text": "4．本基金持有非流动性资产市值不得超过基金净值的10%。前项非流动性资产是指法", "page": 43, "section": null, "tags": ["流动性风险"]}, "B1138": {"text": "律或基金合同规定的流通受限证券以及中国证监会认定的其他资产。", "page": 43, "section": null, "tags": []}, "B1139": {"text": "5．本基金持有境外基金的市值合计不得超过基金净值的10%。持有货币市场基金可以", "page": 43, "section": null, "tags": ["汇率与跨境风险"]}, "B1140": {"text": "不受上述限制。", "page": 43, "section": null, "tags": []}, "B1141": {"text": "6．基金管理人管理的全部基金持有任何一只境外基金，不得超过该境外基金总份额的", "page": 43, "section": null, "tags": ["汇率与跨境风险"]}, "B1142": {"text": "20%。", "page": 43, "section": null, "tags": []}, "B1143": {"text": "7．为应付赎回、交易清算等临时用途借入现金的比例不得超过基金资产净值的10%。", "page": 43, "section": null, "tags": ["流动性风险"]}, "B1144": {"text": "8．金融衍生品投资", "page": 43, "section": null, "tags": []}, "B1145": {"text": "为有效管理投资组合和规避风险，本基金可适当投资于衍生金融工具。金融衍生品投资", "page": 43, "section": null, "tags": []}, "B1146": {"text": "应当符合法律法规及中国证监会的有关规定。", "page": 43, "section": null, "tags": []}, "B1147": {"text": "（1）本基金的金融衍生品全部敞口不得高于基金资产净值的20%。", "page": 43, "section": null, "tags": []}, "B1148": {"text": "（2）本基金投资衍生品支付的保证金、投资期权支付或收取的期权费、投资柜台交易", "page": 43, "section": null, "tags": ["杠杆风险"]}, "B1149": {"text": "衍生品支付的初始费用的总额不得高于基金资产净值的10%。", "page": 43, "section": null, "tags": []}, "B1150": {"text": "（3）本基金投资于远期合约、互换等柜台交易金融衍生品任一交易对手方的市值计价", "page": 43, "section": null, "tags": []}, "B1151": {"text": "敞口不得超过基金资产净值的20％。", "page": 43, "section": null, "tags": []}, "B1152": {"text": "9．本基金主动投资于流动性受限资产的市值合计不得超过基金资产净值的15%；因证", "page": 43, "section": null, "tags": ["流动性风险"]}, "B1153": {"text": "券市场波动、上市公司股票停牌、基金规模变动等基金管理人之外的因素致使基金不符合前", "page": 43, "section": null, "tags": ["市场风险"]}, "B1154": {"text": "述比例限制的，基金管理人不得主动新增流动性受限资产的投资；", "page": 43, "section": null, "tags": ["流动性风险"]}, "B1155": {"text": "10． 本基金与私募类证券资管产品及中国证监会认定的其他主体为交易对手开展逆回购", "page": 43, "section": null, "tags": []}, "B1156": {"text": "交易的，可接受质押品的资质要求应当与基金合同约定的投资范围保持一致；", "page": 43, "section": null, "tags": []}, "B1157": {"text": "11．相关法律法规、基金合同及中国证监会的其他规定。", "page": 43, "section": null, "tags": []}, "B1158": {"text": "基金管理人应当在基金合同生效后6 个月内使基金的投资组合比例符合基金合同的有", "page": 43, "section": null, "tags": []}, "B1159": {"text": "关约定。若基金超过上述1-8项投资比例限制，应当在超过比例后30个工作日内采用合理", "page": 43, "section": null, "tags": []}, "B1160": {"text": "的商业措施减仓以符合投资比例限制要求。", "page": 43, "section": null, "tags": []}, "B1161": {"text": "若因将来法律法规或中国证监会的相关规定发生修改或变更， 致使本基金投资限制中前", "page": 43, "section": null, "tags": []}, "B1162": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 44, "section": null, "tags": ["市场风险"]}, "B1163": {"text": "40", "page": 44, "section": null, "tags": []}, "B1164": {"text": "述1至10项中的任何限制规定被修改或取消的，基金管理人在履行适当程序后，本基金可", "page": 44, "section": null, "tags": []}, "B1165": {"text": "相应调整投资限制规定。", "page": 44, "section": null, "tags": []}, "B1166": {"text": "12.禁止行为", "page": 44, "section": null, "tags": []}, "B1167": {"text": "除中国证监会另有规定外，基金不得有下列行为：", "page": 44, "section": null, "tags": []}, "B1168": {"text": "（1）购买不动产。", "page": 44, "section": null, "tags": []}, "B1169": {"text": "（2）购买房地产抵押按揭。", "page": 44, "section": null, "tags": []}, "B1170": {"text": "（3）购买贵重金属或代表贵重金属的凭证。", "page": 44, "section": null, "tags": []}, "B1171": {"text": "（4）购买实物商品。", "page": 44, "section": null, "tags": []}, "B1172": {"text": "（5）除应付赎回、交易清算等临时用途以外，借入现金。该临时用途借入现金的比例", "page": 44, "section": null, "tags": ["流动性风险"]}, "B1173": {"text": "不得超过基金、集合计划资产净值的10%。", "page": 44, "section": null, "tags": []}, "B1174": {"text": "（6）利用融资购买证券，但投资金融衍生品除外。", "page": 44, "section": null, "tags": []}, "B1175": {"text": "（7）参与未持有基础资产的卖空交易。", "page": 44, "section": null, "tags": []}, "B1176": {"text": "（8）从事证券承销业务。", "page": 44, "section": null, "tags": []}, "B1177": {"text": "（9）不公平对待不同客户或不同投资组合。", "page": 44, "section": null, "tags": []}, "B1178": {"text": "（10）除法律法规规定以外，向任何第三方泄露客户资料。", "page": 44, "section": null, "tags": []}, "B1179": {"text": "（11）中国证监会禁止的其他行为。", "page": 44, "section": null, "tags": []}, "B1180": {"text": "1．基金管理人按照国家有关规定代表基金独立行使债权人权利，保护基金投资者的利", "page": 44, "section": null, "tags": []}, "B1181": {"text": "益。", "page": 44, "section": null, "tags": []}, "B1182": {"text": "2．有利于基金财产的安全与增值。", "page": 44, "section": null, "tags": []}, "B1183": {"text": "1．经纪商选择标准", "page": 44, "section": null, "tags": []}, "B1184": {"text": "（1）交易执行能力：能够公平对待所有客户，实现最佳价格成交，可靠、诚信、及时", "page": 44, "section": null, "tags": []}, "B1185": {"text": "成交，具备充分流动性，交易差错少等；", "page": 44, "section": null, "tags": ["流动性风险"]}, "B1186": {"text": "（2）研究支持服务：能够针对本基金业务需要，提供高质量的研究报告和较为全面的", "page": 44, "section": null, "tags": []}, "B1187": {"text": "服务，包括举办推介会、拜访公司、及时沟通市场情况、承接专项研究、协助交易评价等；", "page": 44, "section": null, "tags": []}, "B1188": {"text": "（3）财务实力：净资产、总市值、受托资产等指标处于行业前列，或具有明显的安全", "page": 44, "section": null, "tags": []}, "B1189": {"text": "边际；", "page": 44, "section": null, "tags": []}, "B1190": {"text": "（4）后台便利性和可靠性：交易和清算支持多种方案，软件再开发的能力强，系统稳", "page": 44, "section": null, "tags": []}, "B1191": {"text": "定安全等；", "page": 44, "section": null, "tags": []}, "B1192": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 45, "section": null, "tags": ["市场风险"]}, "B1193": {"text": "41", "page": 45, "section": null, "tags": []}, "B1194": {"text": "（5）组织框架和业务构成：具有战略规划和定位，能够积极推动多边业务合作，最大", "page": 45, "section": null, "tags": []}, "B1195": {"text": "限度地调动整体资源，为基金投资赢取机会；", "page": 45, "section": null, "tags": []}, "B1196": {"text": "（6）其他有利于基金持有人利益的商业合作考虑。", "page": 45, "section": null, "tags": []}, "B1197": {"text": "2．交易量分配", "page": 45, "section": null, "tags": []}, "B1198": {"text": "基金管理人将根据上述标准对经纪商进行综合考察， 选取最适合基金投资业务的经纪商", "page": 45, "section": null, "tags": []}, "B1199": {"text": "合作，并根据综合考察结果分配基金在各个经纪商的交易量。", "page": 45, "section": null, "tags": []}, "B1200": {"text": "3．佣金管理", "page": 45, "section": null, "tags": []}, "B1201": {"text": "基金管理人将根据经纪商提供的服务内容和服务质量， 按照最佳市场惯例原则确定佣金", "page": 45, "section": null, "tags": []}, "B1202": {"text": "费率。交易佣金如有折扣或返还，应归入基金资产。", "page": 45, "section": null, "tags": []}, "B1203": {"text": "本基金的投资组合报告所载的数据截至2021年12月31日，本报告中所列财务数据未", "page": 45, "section": null, "tags": []}, "B1204": {"text": "经审计。", "page": 45, "section": null, "tags": []}, "B1205": {"text": "1、报告期末基金资产组合情况", "page": 45, "section": null, "tags": []}, "B1206": {"text": "序号 项目 金额(人民币元)", "page": 45, "section": null, "tags": []}, "B1207": {"text": "占基金总资产的比例（%", "page": 45, "section": null, "tags": []}, "B1208": {"text": "1 权益投资 2,739,939,253.75 92.85", "page": 45, "section": null, "tags": []}, "B1209": {"text": "其中：普通股 2,739,939,253.75 92.85", "page": 45, "section": null, "tags": []}, "B1210": {"text": "优先股 - -", "page": 45, "section": null, "tags": []}, "B1211": {"text": "存托凭证 - -", "page": 45, "section": null, "tags": ["机制特有风险"]}, "B1212": {"text": "房地产信托凭证 - -", "page": 45, "section": null, "tags": []}, "B1213": {"text": "2 基金投资 - -", "page": 45, "section": null, "tags": []}, "B1214": {"text": "3 固定收益投资 - -", "page": 45, "section": null, "tags": []}, "B1215": {"text": "其中：债券 - -", "page": 45, "section": null, "tags": []}, "B1216": {"text": "资产支持证券 - -", "page": 45, "section": null, "tags": ["机制特有风险"]}, "B1217": {"text": "4 金融衍生品投资 - -", "page": 45, "section": null, "tags": []}, "B1218": {"text": "其中：远期 - -", "page": 45, "section": null, "tags": []}, "B1219": {"text": "期货 - -", "page": 45, "section": null, "tags": ["杠杆风险"]}, "B1220": {"text": "期权 - -", "page": 45, "section": null, "tags": []}, "B1221": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 46, "section": null, "tags": ["市场风险"]}, "B1222": {"text": "42", " ags": []}, "B1474": {"text": "E为前一日基金资产净值", "page": 51, "section": null, "tags": []}, "B1475": {"text": "基金管理费每日计提， 按月支付。 由基金管理人向基金托管人发送基金管理费划付指令，", "page": 51, "section": null, "tags": []}, "B1476": {"text": "经基金托管人复核后于次月首日起3个工作日内从基金财产中一次性支付给基金管理人， 若", "page": 51, "section": null, "tags": []}, "B1477": {"text": "遇法定节假日、休息日或不可抗力致使无法按时支付的，支付日期顺延。", "page": 51, "section": null, "tags": []}, "B1478": {"text": "2.基金托管人的托管费", "page": 51, "section": null, "tags": []}, "B1479": {"text": "在通常情况下，基金托管费按前一日基金资产净值的0.28%年费率计提。计算方法如下 ：", "page": 51, "section": null, "tags": []}, "B1480": {"text": "H＝E×0.28%÷当年天数", "page": 51, "section": null, "tags": []}, "B1481": {"text": "H为每日应计提的基金托管费", "page": 51, "section": null, "tags": []}, "B1482": {"text": "E为前一日基金资产净值", "page": 51, "section": null, "tags": []}, "B1483": {"text": "基金托管费每日计提， 按月支付。 由基金管理人向基金托管人发送基金托管费划付指令，", "page": 51, "section": null, "tags": []}, "B1484": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 52, "section": null, "tags": ["市场风险"]}, "B1485": {"text": "48", "page": 52, "section": null, "tags": []}, "B1486": {"text": "经基金托管人复核后于次月首日起3个工作日内从基金财产中一次性支付给基金托管人， 若", "page": 52, "section": null, "tags": []}, "B1487": {"text": "遇法定节假日、休息日或不可抗力致使无法按时支付的，支付日期顺延。", "page": 52, "section": null, "tags": []}, "B1488": {"text": "3、C类人民币份额的销售服务费", "page": 52, "section": null, "tags": []}, "B1489": {"text": "本基金A类人民币份额和A类美元份额不收取销售服务费，C类人民币份额的销售服务", "page": 52, "section": null, "tags": []}, "B1490": {"text": "费年费率为0.40%。", "page": 52, "section": null, "tags": []}, "B1491": {"text": "本基金C类人民币份额的销售服务费按前一日C类人民币份额基金资产净值的0.40%", "page": 52, "section": null, "tags": []}, "B1492": {"text": "的年费率计提。销售服务费的计算方法如下：", "page": 52, "section": null, "tags": []}, "B1493": {"text": "H＝E×0.40%÷当年天数", "page": 52, "section": null, "tags": []}, "B1494": {"text": "H为C类人民币份额每日应计提的基金销售服务费", "page": 52, "section": null, "tags": []}, "B1495": {"text": "E为C类人民币份额前一日的基金资产净值", "page": 52, "section": null, "tags": []}, "B1496": {"text": "销售服务费每日计提，逐日累计至每个月月末，按月支付。由基金管理人向基金托管人", "page": 52, "section": null, "tags": []}, "B1497": {"text": "发送销售服务费划付指令， 经基金托管人复核后于次月首日起3个工作日内从基金财产中一", "page": 52, "section": null, "tags": []}, "B1498": {"text": "次性支付给基金管理人。若遇法定节假日、休息日或不可抗力致使无法按时支付的，顺延至", "page": 52, "section": null, "tags": []}, "B1499": {"text": "最近可支付日支付。", "page": 52, "section": null, "tags": []}, "B1500": {"text": "4. 基金的指数许可使用费", "page": 52, "section": null, "tags": ["市场风险"]}, "B1501": {"text": "标的指数许可使用费按照基金管理人与指数许可方签署的指数许可使用合同的约定从", "page": 52, "section": null, "tags": ["市场风险"]}, "B1502": {"text": "基金财产中支付。", "page": 52, "section": null, "tags": []}, "B1503": {"text": "5.除管理费和托管费之外的基金费用， 由基金托管人根据其他有关法规及相应协议的规", "page": 52, "section": null, "tags": []}, "B1504": {"text": "定，按费用支出金额支付，列入或摊入当期基金费用。", "page": 52, "section": null, "tags": []}, "B1505": {"text": "基金管理人和基金托管人因未履行或未完全履行义务导致的费用支出或基金财产的损", "page": 52, "section": null, "tags": []}, "B1506": {"text": "失，以及处理与基金运作无关的事项发生的费用等不列入基金费用。基金合同生效前所发生", "page": 52, "section": null, "tags": []}, "B1507": {"text": "的信息披露费、律师费和会计师费以及其他费用不从基金财产中支付。", "page": 52, "section": null, "tags": []}, "B1508": {"text": "基金管理人必须最迟于新的费率实施日2日前在指定媒介上刊登公告。", "page": 52, "section": null, "tags": []}, "B1509": {"text": "基金根据国家法律法规和基金投资所在地的法律法规规定，履行纳税义务。", "page": 52, "section": null, "tags": []}, "B1510": {"text": "基金份额持有人根据中国法律法规规定，履行纳税义务。", "page": 52, "section": null, "tags": []}, "B1511": {"text": "除因基金管理人或基金托管人疏忽、故意行为导致的基金在税收方面造成的损失外，基", "page": 52, "section": null, "tags": []}, "B1512": {"text": "金管理人和基金托管人不承担责任。", "page": 52, "section": null, "tags": []}, "B1513": {"text": "对于非代扣代缴的税收， 基金管理人应聘请税收顾问对相关投资市场的税收情况给予", "page": 52, "section": null, "tags": []}, "B1514": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 53, "section": null, "tags": ["市场风险"]}, "B1515": {"text": "49", "page": 53, "section": null, "tags": []}, "B1516": {"text": "意见和建议。境外托管银行根据基金管理人的指示具体协调基金在海外税务的申报、缴纳及", "page": 53, "section": null, "tags": ["汇率与跨境风险"]}, "B1517": {"text": "索取税收返还等相关工作。 基金管理人或其聘请的税务顾问对最终税务的处理的真实准确负", "page": 53, "section": null, "tags": []}, "B1518": {"text": "责。", "page": 53, "section": null, "tags": []}, "B1519": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 54, "section": null, "tags": ["市场风险"]}, "B1520": {"text": "50", "page": 54, "section": null, "tags": []}, "B1521": {"text": "十二、基金财产", "page": 54, "section": null, "tags": []}, "B1522": {"text": "基金资产总值是指基金拥有的各类有价证券、银行存款本息、基金应收申购款以及其他", "page": 54, "section": null, "tags": ["机制特有风险"]}, "B1523": {"text": "资产的价值总和。", "page": 54, "section": null, "tags": []}, "B1524": {"text": "基金资产净值是指基金资产总值减去负债（含各项有关税收）后的净资产值。", "page": 54, "section": null, "tags": []}, "B1525": {"text": "根据投资所在地规定及境外托管人的相关要求，基金托管人、境外托管人可以以基金名", "page": 54, "section": null, "tags": ["汇率与跨境风险"]}, "B1526": {"text": "义或托管人名义开立证券账户和现金账户， 保证上述账户与基金托管人及境外托管人的财产", "page": 54, "section": null, "tags": ["汇率与跨境风险"]}, "B1527": {"text": "独立，并与基金托管人及境外托管人的其他托管账户相独立", "page": 54, "section": null, "tags": ["汇率与跨境风险"]}, "B1528": {"text": "基金财产独立于基金管理人、基金托管人固有财产，并由基金托管人和/或境外托管人", "page": 54, "section": null, "tags": ["汇率与跨境风险"]}, "B1529": {"text": "保管。基金管理人、基金托管人因基金财产的管理、运用或者其他情形而取得的财产和收益", "page": 54, "section": null, "tags": []}, "B1530": {"text": "归入基金财产。基金管理人、基金托管人可以按基金合同的约定收取管理费、托管费以及其", "page": 54, "section": null, "tags": []}, "B1531": {"text": "他基金合同约定的费用。基金财产的债权、不得与基金管理人、基金托管人固有财产的债务", "page": 54, "section": null, "tags": []}, "B1532": {"text": "相抵销，不同基金财产的债权债务，不得相互抵销。基金管理人、基金托管人以其自有资产", "page": 54, "section": null, "tags": []}, "B1533": {"text": "承担法律责任，其债权人不得对基金财产行使请求冻结、扣押和其他权利。", "page": 54, "section": null, "tags": []}, "B1534": {"text": "基金管理人、基金托管人因依法解散、被依法撤销或者被依法宣告破产等原因进行清算", "page": 54, "section": null, "tags": []}, "B1535": {"text": "的，基金财产不属于其清算财产。", "page": 54, "section": null, "tags": []}, "B1536": {"text": "除依据《基金法》 、 《运作办法》 、 《试行办法》 和基金合同及其他有关规定处分外，基金", "page": 54, "section": null, "tags": []}, "B1537": {"text": "财产不得被处分。非因基金财产本身承担的债务，不得对基金财产强制执行。", "page": 54, "section": null, "tags": []}, "B1538": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 55, "section": null, "tags": ["市场风险"]}, "B1539": {"text": "51", "page": 55, "section": null, "tags": []}, "B1540": {"text": "十三、基金资产估值", "page": 55, "section": null, "tags": []}, "B1541": {"text": "基金所拥有的股票、基金、债券和银行存款本息、应收款项、其它投资等资产。", "page": 55, "section": null, "tags": []}, "B1542": {"text": "本基金合同生效后， 每个开放日以及国家法律法规规定需要对外披露基金净值的非开放", "page": 55, "section": null, "tags": []}, "B1543": {"text": "日对基金资产进行估值，T+1日完成T日估值。", "page": 55, "section": null, "tags": []}, "B1544": {"text": "1．股票估值方法", "page": 55, "section": null, "tags": []}, "B1545": {"text": "（1）上市流通股票按估值日其所在证券交易所的收盘价估值；估值日无交易的，以最", "page": 55, "section": null, "tags": []}, "B1546": {"text": "近交易日的收盘价估值。", "page": 55, "section": null, "tags": []}, "B1547": {"text": "（2）未上市股票的估值", "page": 55, "section": null, "tags": []}, "B1548": {"text": "①送股、转增股、配股和增发等方式发行的股票，按估值日在交易所挂牌的同一股票的", "page": 55, "section": null, "tags": []}, "B1549": {"text": "收盘价估值，该日无交易的，以最近交易日的收盘价估值；", "page": 55, "section": null, "tags": []}, "B1550": {"text": "②首次发行且未上市的股票，按成本价估值；首次发行且有明确锁定期的股票，同一股", "page": 55, "section": null, "tags": []}, "B1551": {"text": "票在交易所上市后，按交易所上市的同一股票的市价估值。", "page": 55, "section": null, "tags": []}, "B1552": {"text": "2.基金估值方法", "page": 55, "section": null, "tags": []}, "B1553": {"text": "（1）上市流通的基金按估值日其所在证券交易所的收盘价估值；估值日无交易的，以", "page": 55, "section": null, "tags": []}, "B1554": {"text": "最近交易日的收盘价估值。", "page": 55, "section": null, "tags": []}, "B1555": {"text": "（2）其他基金按最近交易日的基金份额净值估值。", "page": 55, "section": null, "tags": []}, "B1556": {"text": "若基金价格无法通过公开信息取得的，由基金管理人负责从其经纪商处取得，并及时通", "page": 55, "section": null, "tags": []}, "B1557": {"text": "过书面形式告知基金托管人。", "page": 55, "section": null, "tags": []}, "B1558": {"text": "3.债券估值方法", "page": 55, "section": null, "tags": []}, "B1559": {"text": "（1）对于上市流通的债券，证券交易所市场实行净价交易的债券按估值日其所在证券", "page": 55, "section": null, "tags": []}, "B1560": {"text": "交易所的收盘价估值；估值日无交易的，以最近交易日的收盘价估值。证券交易所市场未实", "page": 55, "section": null, "tags": []}, "B1561": {"text": "行净价交易的债券按估值日收盘价减去债券收盘价中所含的债券应收利息得到的净价进行", "page": 55, "section": null, "tags": []}, "B1562": {"text": "估值，估值日没有交易的，按最近交易日债券收盘价减去所含的最近交易日债券应收利息后", "page": 55, "section": null, "tags": []}, "B1563": {"text": "得到的净价估值。", "page": 55, "section": null, "tags": []}, "B1564": {"text": "（2）对于非上市债券，参照主要做市商或其他权威价格提供机构的报价进行估值。若", "page": 55, "section": null, "tags": []}, "B1565": {"text": "债券价格无法通过公开信息取得的，由基金管理人负责从其经纪商处取得，并及时通过书面", "page": 55, "section": null, "tags": []}, "B1566": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 56, "section": null, "tags": ["市场风险"]}, "B1567": {"text": "52", "page": 56, "section": null, "tags": []}, "B1568": {"text": "形式告知基金托管人。", "page": 56, "section": null, "tags": []}, "B1569": {"text": "4.存托凭证估值方法", "page": 56, "section": null, "tags": ["机制特有风险"]}, "B1570": {"text": "公开挂牌的存托凭证按其所在证券交易所的最近交易日的收盘价估值。", "page": 56, "section": null, "tags": ["机制特有风险"]}, "B1571": {"text": "5.汇率", "page": 56, "section": null, "tags": ["汇率与跨境风险"]}, "B1572": {"text": "本基金外币资产价值计算中，所涉及人民币对美元、港元、欧元、英镑和日元的汇率应", "page": 56, "section": null, "tags": ["汇率与跨境风险"]}, "B1573": {"text": "当以基金估值日中国人民银行或其授权机构公布的人民币汇率为准。 涉及其他货币对人民币", "page": 56, "section": null, "tags": ["汇率与跨境风险"]}, "B1574": {"text": "的汇率， 采用彭博金融终端提供的估值日各种货币对美元折算率并采用套算的方法进行折算。", "page": 56, "section": null, "tags": ["汇率与跨境风险"]}, "B1575": {"text": "6.税收", "page": 56, "section": null, "tags": []}, "B1576": {"text": "对于按照中国法律法规和基金投资所在地的法律法规规定应交纳的各项税金， 本基金将", "page": 56, "section": null, "tags": []}, "B1577": {"text": "按权责发生制原则进行估值；对于因税收规定调整或其他原因导致基金实际交纳税金与估算", "page": 56, "section": null, "tags": []}, "B1578": {"text": "的应交税金有差异的，基金将在相关税金调整日或实际支付日进行相应的估值调整。", "page": 56, "section": null, "tags": []}, "B1579": {"text": "对于非代扣代缴的税收， 基金管理人可聘请税收顾问对相关投资市场的税收情况给予意", "page": 56, "section": null, "tags": []}, "B1580": {"text": "见和建议。境外托管人根据基金管理人的指示具体协调基金在海外税务的申报、缴纳及索取", "page": 56, "section": null, "tags": ["汇率与跨境风险"]}, "B1581": {"text": "税收返还等相关工作。基金管理人或其聘请的税务顾问对最终税务的处理的真实准确负责。", "page": 56, "section": null, "tags": []}, "B1582": {"text": "7.在任何情况下，基金管理人如采用本款第1－8项规定的方法对基金资产进行估值，", "page": 56, "section": null, "tags": []}, "B1583": {"text": "均应被认为采用了适当的估值方法。但是，如果基金管理人认为按本款第1－8项规定的方", "page": 56, "section": null, "tags": []}, "B1584": {"text": "法对基金资产进行估值不能客观反映其公允价值的，基金管理人可根据具体情况，并与基金", "page": 56, "section": null, "tags": []}, "B1585": {"text": "托管人商定后，按最能反映公允价值的价格估值；", "page": 56, "section": null, "tags": []}, "B1586": {"text": "8.国家有最新规定的，按其规定进行估值。", "page": 56, "section": null, "tags": []}, "B1587": {"text": "1.差错类型", "page": 56, "section": null, "tags": []}, "B1588": {"text": "基金运作过程中，如果由于基金管理人或基金托管人、或登记结算机构、或代销机构、", "page": 56, "section": null, "tags": []}, "B1589": {"text": "或投资人自身的过错造成差错，导致其他当事人遭受损失的，过错的责任人应当对由于该差", "page": 56, "section": null, "tags": []}, "B1590": {"text": "错遭受损失的当事人（ “受损方”）按下述“差错处理原则”给予赔偿并承担相关责任。", "page": 56, "section": null, "tags": []}, "B1591": {"text": "上述差错的主要类型包括但不限于：资料申报差错、数据传输差错、数据计算差错、系", "page": 56, "section": null, "tags": []}, "B1592": {"text": "统故障差错、下达指令差错等；对于因技术原因引起的差错，若系同行业现有技术水平无法", "page": 56, "section": null, "tags": []}, "B1593": {"text": "预见、无法避免、无法抗拒，则属不可抗力，按照下述规定执行。", "page": 56, "section": null, "tags": []}, "B1594": {"text": "由于不可抗力原因造成投资人的交易资料灭失或被错误处理或造成其他差错， 因不可抗", "page": 56, "section": null, "tags": []}, "B1595": {"text": "力原因出现差错的当事人不对其他当事人承担赔偿责任， 但因该差错取得不当得利的当事人", "page": 56, "section": null, "tags": []}, "B1596": {"text": "仍应负有返还不当得利的义务。", "page": 56, "section": null, "tags": []}, "B1597": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 57, "section": null, "tags": ["市场风险"]}, "B1598": {"text": "53", "page": 57, "section": null, "tags": []}, "B1599": {"text": "2.差错处理原则", "page": 57, "section": null, "tags": []}, "B1600": {"text": "因基金估值错误给基金投资人造成的损失应由基金托管人和基金管理人协商共同承担，", "page": 57, "section": null, "tags": []}, "B1601": {"text": "基金托管人和基金管理人对不应由其承担的责任，有权根据过错原则，向过错人追偿，基金", "page": 57, "section": null, "tags": []}, "B1602": {"text": "合同的当事人应将按照以下约定处理。", "page": 57, "section": null, "tags": []}, "B1603": {"text": "（1）差错已发生，但尚未给当事人造成损失时，差错责任方应及时协调各方，及时进", "page": 57, "section": null, "tags": []}, "B1604": {"text": "行更正，因更正差错发生的费用由差错责任方承担；由于差错责任方未及时更正已产生的差", "page": 57, "section": null, "tags": []}, "B1605": {"text": "错，给当事人造成的损失由差错责任方承担；若差错责任方已经积极协调，并且有协助义务", "page": 57, "section": null, "tags": []}, "B1606": {"text": "的当事人有足够的时间进行更正而未更正，则有协助义务的当事人应当承担相应赔偿责任。", "page": 57, "section": null, "tags": []}, "B1607": {"text": "差错责任方应对更正的情况向有关当事人进行确认，确保差错已得到更正。", "page": 57, "section": null, "tags": []}, "B1608": {"text": "（2）差错的责任方对可能导致有关当事人的直接损失负责，不对间接损失负责，并且", "page": 57, "section": null, "tags": []}, "B1609": {"text": "仅对差错的有关直接当事人负责，不对第三方负责。", "page": 57, "section": null, "tags": []}, "B1610": {"text": "（3）因差错而获得不当得利的当事人负有及时返还不当得利的义务。但差错责任方仍", "page": 57, "section": null, "tags": []}, "B1611": {"text": "应对差错负责， 如果由于获得不当得利的当事人不返还或不全部返还不当得利造成其他当事", "page": 57, "section": null, "tags": []}, "B1612": {"text": "人的利益损失，则差错责任方应赔偿受损方的损失，并在其支付的赔偿金额的范围内对获得", "page": 57, "section": null, "tags": []}, "B1613": {"text": "不当得利的当事人享有要求交付不当得利的权利；如果获得不当得利的当事人已经将此部分", "page": 57, "section": null, "tags": []}, "B1614": {"text": "不当得利返还给受损方， 则受损方应当将其已经获得的赔偿额加上已经获得的不当得利返还", "page": 57, "section": null, "tags": []}, "B1615": {"text": "的总和超过其实际损失的差额部分支付给差错责任方。", "page": 57, "section": null, "tags": []}, "B1616": {"text": "（4）基金份额净值计算差错小于基金份额净值0.5%时（含人民币份额或美元份额的基", "page": 57, "section": null, "tags": []}, "B1617": {"text": "金份额净值，下同） ，基金管理人与基金托管人应在发现日对账务进行更正调整，不做追溯", "page": 57, "section": null, "tags": []}, "B1618": {"text": "处理。", "page": 57, "section": null, "tags": []}, "B1619": {"text": "（5）差错责任方拒绝进行赔偿时，如果因基金管理人过错造成基金资产损失时，基金", "page": 57, "section": null, "tags": []}, "B1620": {"text": "托管人应为基金的利益向基金管理人追偿，如果因基金托管人过错造成基金资产损失时，基", "page": 57, "section": null, "tags": []}, "B1621": {"text": "金管理人应为基金的利益向基金托管人追偿。 除基金管理人和托管人之外的第三方造成基金", "page": 57, "section": null, "tags": []}, "B1622": {"text": "资产的损失，并拒绝进行赔偿时，由基金管理人负责向差错方追偿。", "page": 57, "section": null, "tags": []}, "B1623": {"text": "（6）如果出现差错的当事人未按规定对受损方进行赔偿，并且依据法律法规、基金合", "page": 57, "section": null, "tags": []}, "B1624": {"text": "同或其他规定，基金管理人自行或依据法院判决、仲裁裁决对受损方承担了赔偿责任，则基", "page": 57, "section": null, "tags": []}, "B1625": {"text": "金管理人有权向出现过错的当事人进行追索， 并有权要求其赔偿或补偿由此发生的费用和遭", "page": 57, "section": null, "tags": []}, "B1626": {"text": "受的直接损失。", "page": 57, "section": null, "tags": []}, "B1627": {"text": "（7）按法律法规规定的其他原则处理差错。", "page": 57, "section": null, "tags": []}, "B1628": {"text": "3.差错处理程序", "page": 57, "section": null, "tags": []}, "B1629": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 58, "section": null, "tags": ["市场风险"]}, "B1630": {"text": "54", "page": 58, "section": null, "tags": []}, "B1631": {"text": "差错被发现后，有关的当事人应当及时进行处理，处理的程序如下：", "page": 58, "section": null, "tags": []}, "B1632": {"text": "（1）查明差错发生的原因，列明所有的当事人，并根据差错发生的原因确定差错的责", "page": 58, "section": null, "tags": []}, "B1633": {"text": "任方；", "page": 58, "section": null, "tags": []}, "B1634": {"text": "（2）根据差错处理原则或当事人协商的方法对因差错造成的损失进行评估；", "page": 58, "section": null, "tags": []}, "B1635": {"text": "（3）根据差错处理原则或当事人协商的方法由差错的责任方进行更正和赔偿损失；其", "page": 58, "section": null, "tags": []}, "B1636": {"text": "中基金份额净值计算差错小于基金份额净值0.5%时，基金管理人与基金托管人应在发现日", "page": 58, "section": null, "tags": []}, "B1637": {"text": "对账务进行更正调整，不做追溯处理 ； 基金份额净值计算差错达到或超过基金份额净值0.5%", "page": 58, "section": null, "tags": []}, "B1638": {"text": "时，基金管理人应当公告、通报基金托管人并报中国证监会备案；", "page": 58, "section": null, "tags": []}, "B1639": {"text": "（4）根据差错处理的方法，需要修改基金登记结算机构的交易数据的，由基金登记结", "page": 58, "section": null, "tags": []}, "B1640": {"text": "算机构进行更正，并就差错的更正向有关当事人进行确认。", "page": 58, "section": null, "tags": []}, "B1641": {"text": "4．基金净值的确认", "page": 58, "section": null, "tags": []}, "B1642": {"text": "用于基金信息披露的基金资产净值和基金份额净值由基金管理人负责计算， 基金托管人", "page": 58, "section": null, "tags": []}, "B1643": {"text": "负责进行复核。基金管理人应于每个开放日估值时间点计算基金净值并发送给基金托管人。", "page": 58, "section": null, "tags": []}, "B1644": {"text": "基金托管人对净值计算结果复核确认后发送给基金管理人， 由基金管理人对基金净值予以公", "page": 58, "section": null, "tags": []}, "B1645": {"text": "布。", "page": 58, "section": null, "tags": []}, "B1646": {"text": "5.特殊情况的处理", "page": 58, "section": null, "tags": []}, "B1647": {"text": "（1）基金管理人或基金托管人按上述估值方法进行估值时，所造成的误差不作为基金", "page": 58, "section": null, "tags": []}, "B1648": {"text": "资产估值错误处理。", "page": 58, "section": null, "tags": []}, "B1649": {"text": "（2）对于因税收规定调整或其他原因导致基金实际交纳税金与基金按照权责发生制进", "page": 58, "section": null, "tags": []}, "B1650": {"text": "行估值的应交税金有差异的，相关估值调整不作为基金资产估值错误处理。", "page": 58, "section": null, "tags": []}, "B1651": {"text": "（3）全球投资涉及不同市场及时区，由于时差、通讯或其他非可控的客观原因，在本", "page": 58, "section": null, "tags": []}, "B1652": {"text": "基金管理人和本基金托管人协商一致的时间点前无法确认的交易， 导致的对基金资产净值的", "page": 58, "section": null, "tags": []}, "B1653": {"text": "影响，不作为基金资产估值错误处理。", "page": 58, "section": null, "tags": []}, "B1654": {"text": "（4） 由于不可抗力原因，或由于各家数据服务机构发送的数据错误，本基金管理人和", "page": 58, "section": null, "tags": []}, "B1655": {"text": "本基金托管人虽然已经采取必要、适当、合理的措施进行检查，但未能发现错误的，由此造", "page": 58, "section": null, "tags": []}, "B1656": {"text": "成的基金资产估值错误，本基金管理人和本基金托管人可以免除赔偿责任。但基金托管人应", "page": 58, "section": null, "tags": []}, "B1657": {"text": "当积极采取必要的措施消除由此造成的影响。", "page": 58, "section": null, "tags": []}, "B1658": {"text": "1.基金投资涉及的主要证券交易市场遇法定节假日或因其他原因停市时；", "page": 58, "section": null, "tags": []}, "B1659": {"text": "2.因不可抗力或其它情形致使基金管理人、基金托管人无法准确评估基金资产价值时；", "page": 58, "section": null, "tags": []}, "B1660": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 59, "section": null, "tags": ["市场风险"]}, "B1661": {"text": "55", "page": 59, "section": null, "tags": []}, "B1662": {"text": "3.占基金相当比例的投资品种的估值出现重大转变， 而基金管理人为保障投资人的利益，", "page": 59, "section": null, "tags": []}, "B1663": {"text": "决定延迟估值；", "page": 59, "section": null, "tags": []}, "B1664": {"text": "4.如出现基金管理人认为属于紧急事故的任何情况， 会导致基金管理人不能出售或无法", "page": 59, "section": null, "tags": []}, "B1665": {"text": "评估基金资产的；", "page": 59, "section": null, "tags": []}, "B1666": {"text": "5.当前一估值日基金资产净值50%以上的资产出现无可参考的活跃市场价格且采用估", "page": 59, "section": null, "tags": []}, "B1667": {"text": "值技术仍导致公允价值存在重大不确定性时，经与基金托管人协商确认后，应当暂停基金估", "page": 59, "section": null, "tags": []}, "B1668": {"text": "值；", "page": 59, "section": null, "tags": []}, "B1669": {"text": "6.中国证监会和基金合同认定的其它情形。", "page": 59, "section": null, "tags": []}, "B1670": {"text": "十四、基金收益与分配", "page": 59, "section": null, "tags": []}, "B1671": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 60, "section": null, "tags": ["市场风险"]}, "B1672": {"text": "56", "page": 60, "section": null, "tags": []}, "B1673": {"text": "基金利润指基金利息收入、投资收益、公允价值变动收益和其他收入扣除相关基金费用", "page": 60, "section": null, "tags": []}, "B1674": {"text": "后的余额；基金已实现收益指基金利润减去公允价值变动收益后的余额。", "page": 60, "section": null, "tags": []}, "B1675": {"text": "基金可供分配利润指截至收益分配基准日（即可供分配利润计算截止日） 基金未分配利", "page": 60, "section": null, "tags": []}, "B1676": {"text": "润与未分配利润中已实现收益的孰低数。", "page": 60, "section": null, "tags": []}, "B1677": {"text": "本基金收益分配应遵循下列原则：", "page": 60, "section": null, "tags": []}, "B1678": {"text": "1、 本基金同一类别的每份基金份额享有同等分配权， 但由于本基金A类人民币份额和A", "page": 60, "section": null, "tags": []}, "B1679": {"text": "类美元份额不收取销售服务费，而C类人民币份额收取销售服务费，各基金份额类别对应的", "page": 60, "section": null, "tags": []}, "B1680": {"text": "可供分配利润将有所不同；", "page": 60, "section": null, "tags": []}, "B1681": {"text": "2.收益分配时所发生的银行转账或其他手续费用由投资人自行承担。 当投资人的现金红", "page": 60, "section": null, "tags": []}, "B1682": {"text": "利小于一定金额，不足以支付银行转账或其他手续费用时，基金注册登记机构可将投资人的", "page": 60, "section": null, "tags": []}, "B1683": {"text": "现金红利按除息日对应份额类别的基金份额净值自动转为基金份额；", "page": 60, "section": null, "tags": []}, "B1684": {"text": "3. 在符合有关基金分红条件的前提下，本基金收益每年最多分配6次，每次基金收益", "page": 60, "section": null, "tags": []}, "B1685": {"text": "分配比例不低于收益分配基准日可供分配利润的10%；", "page": 60, "section": null, "tags": []}, "B1686": {"text": "4.若基金合同生效不满3个月则可不进行收益分配；", "page": 60, "section": null, "tags": []}, "B1687": {"text": "5.本基金收益分配方式分为现金分红，A类美元份额以美元进行现金分红，A类人民币", "page": 60, "section": null, "tags": []}, "B1688": {"text": "份额和C类人民币份额以人民币进行现金分红；", "page": 60, "section": null, "tags": []}, "B1689": {"text": "6. 基金红利发放日距离收益分配基准日（即可供分配利润计算截止日）的时间不得超", "page": 60, "section": null, "tags": []}, "B1690": {"text": "过15个工作日；", "page": 60, "section": null, "tags": []}, "B1691": {"text": "7. 基金收益分配后每一人民币份额的基金份额净值不能低于面值，即基金收益分配基", "page": 60, "section": null, "tags": []}, "B1692": {"text": "准日A类人民币份额和C类人民币份额的基金份额净值减去每单位基金份额收益分配金额", "page": 60, "section": null, "tags": []}, "B1693": {"text": "后不能低于面值；对于A类美元份额，由于汇率因素影响，存在收益分配后A类美元份额的", "page": 60, "section": null, "tags": ["汇率与跨境风险"]}, "B1694": {"text": "基金份额净值低于对应的基金份额面值的可能；", "page": 60, "section": null, "tags": []}, "B1695": {"text": "8．法律法规或监管机构另有规定的从其规定。", "page": 60, "section": null, "tags": []}, "B1696": {"text": "在不影响基金份额持有人利益的情况下， 基金管理人可在法律法规允许的前提下酌情调", "page": 60, "section": null, "tags": []}, "B1697": {"text": "整以上基金收益分配原则，此项调整不需要召开基金份额持有人大会，但应于变更实施日前", "page": 60, "section": null, "tags": []}, "B1698": {"text": "在指定媒介上公告。", "page": 60, "section": null, "tags": []}, "B1699": {"text": "基金收益分配方案中应载明收益分配基准日（即可供分配利润计算截止日） 以及该日的", "page": 60, "section": null, "tags": []}, "B1700": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 61, "section": null, "tags": ["市场风险"]}, "B1701": {"text": "57", "page": 61, "section": null, "tags": []}, "B1702": {"text": "可供分配利润、基金收益分配对象、分配原则、分配时间、分配数额及比例、分配方式、支", "page": 61, "section": null, "tags": []}, "B1703": {"text": "付方式等内容。", "page": 61, "section": null, "tags": []}, "B1704": {"text": "1.基金收益分配方案由基金管理人拟订，由基金托管人复核，依照《信息披露办法》 的", "page": 61, "section": null, "tags": []}, "B1705": {"text": "有关规定在指定媒介上公告；", "page": 61, "section": null, "tags": []}, "B1706": {"text": "2.在收益分配方案公布后， 基金管理人依据具体方案的规定就支付的现金红利向基金托", "page": 61, "section": null, "tags": []}, "B1707": {"text": "管人发送划款指令，基金托管人按照基金管理人的指令及时进行分红资金的划付。", "page": 61, "section": null, "tags": []}, "B1708": {"text": "3.法律法规或监管机关另有规定的，从其规定。", "page": 61, "section": null, "tags": []}, "B1709": {"text": "十五、基金的会计与审计", "page": 61, "section": null, "tags": []}, "B1710": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 62, "section": null, "tags": ["市场风险"]}, "B1711": {"text": "58", "page": 62, "section": null, "tags": []}, "B1712": {"text": "1.基金管理人为本基金的会计责任方；", "page": 62, "section": null, "tags": []}, "B1713": {"text": "2.本基金的会计年度为公历每年的1月1日至12月31日；", "page": 62, "section": null, "tags": []}, "B1714": {"text": "3.本基金的会计核算以人民币为记账本位币，以人民币元为记账单位；", "page": 62, "section": null, "tags": []}, "B1715": {"text": "4.会计制度执行国家有关的会计制度；", "page": 62, "section": null, "tags": []}, "B1716": {"text": "5.本基金独立建账、独立核算；", "page": 62, "section": null, "tags": []}, "B1717": {"text": "6.基金管理人保留完整的会计账目、凭证并进行日常的会计核算，按照有关规定编制基", "page": 62, "section": null, "tags": []}, "B1718": {"text": "金会计报表；", "page": 62, "section": null, "tags": []}, "B1719": {"text": "7.基金托管人定期与基金管理人就基金的会计核算、报表编制等进行核对并书面确认。", "page": 62, "section": null, "tags": []}, "B1720": {"text": "1.基金管理人聘请具有证券、 期货相关从业资格的会计师事务所及其注册会计师对本基", "page": 62, "section": null, "tags": ["杠杆风险"]}, "B1721": {"text": "金年度财务报表及其他规定事项进行审计。会计师事务所及其注册会计师与基金管理人、基", "page": 62, "section": null, "tags": []}, "B1722": {"text": "金托管人相互独立。", "page": 62, "section": null, "tags": []}, "B1723": {"text": "2.会计师事务所更换经办注册会计师时，应事先征得基金管理人同意。", "page": 62, "section": null, "tags": []}, "B1724": {"text": "3.基金管理人(或基金托管人)认为有充足理由更换会计师事务所，经基金托管人(或基", "page": 62, "section": null, "tags": []}, "B1725": {"text": "金管理人)同意后可以更换。就更换会计师事务所，基金管理人应当依照《信息披露办法》", "page": 62, "section": null, "tags": []}, "B1726": {"text": "的有关规定在指定媒介上公告。", "page": 62, "section": null, "tags": []}, "B1727": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 63, "section": null, "tags": ["市场风险"]}, "B1728": {"text": "59", "page": 63, "section": null, "tags": []}, "B1729": {"text": "十六、基金的信息披露", "page": 63, "section": null, "tags": []}, "B1730": {"text": "基金的信息披露应符合《基金法》 、 《试行办法》 、 《信息披露办法》 、基金合同及其他有", "page": 63, "section": null, "tags": []}, "B1731": {"text": "关规定。基金管理人、基金托管人和其他基金信息披露义务人应当以保护基金份额持有人利", "page": 63, "section": null, "tags": []}, "B1732": {"text": "益为根本出发点，依法披露基金信息，并保证所披露信息的真实性、准确性、完整性、及时", "page": 63, "section": null, "tags": []}, "B1733": {"text": "性、简明性和易得性。", "page": 63, "section": null, "tags": []}, "B1734": {"text": "本基金信息披露义务人包括基金管理人、基金托管人、召集基金份额持有人大会的基金", "page": 63, "section": null, "tags": []}, "B1735": {"text": "份额持有人等法律、 行政法规和中国证监会规定的自然人、 法人和非法人组织。 基金管理人、", "page": 63, "section": null, "tags": []}, "B1736": {"text": "基金托管人和其他基金信息披露义务人应按规定将应予披露的基金信息披露事项在规定时", "page": 63, "section": null, "tags": []}, "B1737": {"text": "间内通过中国证监会指定的全国性报刊（以下简称“指定报刊”）及指定互联网网站（以下", "page": 63, "section": null, "tags": []}, "B1738": {"text": "简称“指定网站”）等媒介披露，并保证基金投资者能够按照《基金合同》约定的时间和方", "page": 63, "section": null, "tags": []}, "B1739": {"text": "式查阅或者复制公开披露的信息资料。", "page": 63, "section": null, "tags": []}, "B1740": {"text": "本基金信息披露义务人承诺公开披露的基金信息，不得有下列行为：", "page": 63, "section": null, "tags": []}, "B1741": {"text": "1.虚假记载、误导性陈述或者重大遗漏；", "page": 63, "section": null, "tags": []}, "B1742": {"text": "2.对证券投资业绩进行预测；", "page": 63, "section": null, "tags": []}, "B1743": {"text": "3.违规承诺收益或者承担损失；", "page": 63, "section": null, "tags": []}, "B1744": {"text": "4.诋毁其他基金管理人、基金托管人或者基金份额发售机构；", "page": 63, "section": null, "tags": []}, "B1745": {"text": "5.登载任何自然人、法人和非法人组织的祝贺性、恭维性或推荐性的文字；", "page": 63, "section": null, "tags": []}, "B1746": {"text": "6.中国证监会禁止的其他行为。", "page": 63, "section": null, "tags": []}, "B1747": {"text": "本基金公开披露的信息采用中文文本。同时采用外文文本的，基金信息披露义务人应保", "page": 63, "section": null, "tags": []}, "B1748": {"text": "证不同文本的内容一致。不同文本之间发生歧义的，以中文文本为准。", "page": 63, "section": null, "tags": []}, "B1749": {"text": "本基金可以人民币、美元等主要外汇币种计算并披露净值及相关信息。涉及币种之间转", "page": 63, "section": null, "tags": []}, "B1750": {"text": "换的，应当披露汇率数据来源，并保持一致性。如果出现改变，应当予以披露并说明改变的", "page": 63, "section": null, "tags": ["汇率与跨境风险"]}, "B1751": {"text": "理由。 人民币对主要外汇的汇率应当以报告期末最后一个估值日中国人民银行或其授权机构", "page": 63, "section": null, "tags": ["汇率与跨境风险"]}, "B1752": {"text": "公布的人民币汇率中间价为准。", "page": 63, "section": null, "tags": ["汇率与跨境风险"]}, "B1753": {"text": "本基金除特别说明外，货币单位为人民币元。", "page": 63, "section": null, "tags": []}, "B1754": {"text": "公开披露的基金信息包括：", "page": 63, "section": null, "tags": []}, "B1755": {"text": "招募说明书是基金向社会公开发售时对基金情况进行说明的法律文件。", "page": 63, "section": null, "tags": []}, "B1756": {"text": "基金管理人按照《基金法》 、 《信息披露办法》 、基金合同编制并在基金份额发售的3日", "page": 63, "section": null, "tags": []}, "B1757": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 64, "section": null, "tags": ["市场风险"]}, "B1758": {"text": "60", "page": 64, "section": null, "tags": []}, "B1759": {"text": "前，将基金招募说明书登载在指定报刊和网站上。基金合同生效后，基金招募说明书的信息", "page": 64, "section": null, "tags": []}, "B1760": {"text": "发生重大变更的，基金管理人应当在三个工作日内，更新基金招募说明书并登载在指定网站", "page": 64, "section": null, "tags": []}, "B1761": {"text": "上 ； 基金招募说明书其他信息发生变更的，基金管理人至少每年更新一次。基金终止运作的，", "page": 64, "section": null, "tags": []}, "B1762": {"text": "基金管理人不再更新基金招募说明书。", "page": 64, "section": null, "tags": []}, "B1763": {"text": "基金管理人应在基金份额发售的3日前，将基金合同摘要登载在指定报刊和网站上；基", "page": 64, "section": null, "tags": []}, "B1764": {"text": "金管理人、基金托管人应将基金合同、托管协议登载在各自网站上。", "page": 64, "section": null, "tags": []}, "B1765": {"text": "基金产品资料概要是基金招募说明书的摘要文件， 用于向投资者提供简明的基金概要信", "page": 64, "section": null, "tags": []}, "B1766": {"text": "息。 《基金合同》生效后，基金产品资料概要的信息发生重大变更的，基金管理人应当在三", "page": 64, "section": null, "tags": []}, "B1767": {"text": "个工作日内，更新基金产品资料概要，并登载在指定网站及基金销售机构网站或营业网点；", "page": 64, "section": null, "tags": []}, "B1768": {"text": "基金产品资料概要其他信息发生变更的，基金管理人至少每年更新一次。基金终止运作的，", "page": 64, "section": null, "tags": []}, "B1769": {"text": "基金管理人不再更新基金产品资料概要。", "page": 64, "section": null, "tags": []}, "B1770": {"text": "基金管理人将按照《基金法》 、 《信息披露办法》 的有关规定，就基金份额发售的具体事", "page": 64, "section": null, "tags": []}, "B1771": {"text": "宜编制基金份额发售公告，并在披露招募说明书的当日登载于指定报刊和网站上。", "page": 64, "section": null, "tags": []}, "B1772": {"text": "基金管理人将在基金合同生效的次日在指定报刊和网站上登载基金合同生效公告。 基金", "page": 64, "section": null, "tags": []}, "B1773": {"text": "合同生效公告中将说明基金募集情况。", "page": 64, "section": null, "tags": []}, "B1774": {"text": "1.本基金的基金合同生效后，在开始办理基金份额申购或者赎回前，基金管理人将至少", "page": 64, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1775": {"text": "每周在指定网站披露一次各类基金份额的基金份额净值和各类基金份额累计净值；", "page": 64, "section": null, "tags": []}, "B1776": {"text": "2. 在开始办理基金份额申购或者赎回后，基金管理人应当在不晚于每个开放日后的第", "page": 64, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1777": {"text": "二个工作日，通过指定网站、销售机构网站或者营业网点披露开放日的各类基金份额的基金", "page": 64, "section": null, "tags": []}, "B1778": {"text": "份额净值和基金份额累计净值；", "page": 64, "section": null, "tags": []}, "B1779": {"text": "3. 基金管理人应当在不晚于半年度和年度最后一日后的第二个工作日，在指定网站披", "page": 64, "section": null, "tags": []}, "B1780": {"text": "露半年度和年度最后一日的各类基金份额的基金份额净值和基金份额累计净值。", "page": 64, "section": null, "tags": []}, "B1781": {"text": "基金管理人应当在本基金的基金合同、 招募说明书等信息披露文件上载明各类基金份额", "page": 64, "section": null, "tags": []}, "B1782": {"text": "申购、赎回价格的计算方式及有关申购、赎回费率，并保证投资者能够在基金销售机构网站", "page": 64, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1783": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 65, "section": null, "tags": ["市场风险"]}, "B1784": {"text": "61", "page": 65, "section": null, "tags": []}, "B1785": {"text": "或营业网点查阅或者复制前述信息资料。", "page": 65, "section": null, "tags": []}, "B1786": {"text": "基金份额获准在证券交易所上市交易的，基金管理人应当在基金份额上市交易的3 个工", "page": 65, "section": null, "tags": []}, "B1787": {"text": "作日前，将基金份额上市交易公告书登载在指定报刊和网站上。", "page": 65, "section": null, "tags": []}, "B1788": {"text": "1. 基金管理人应当在每年结束之日起三个月内，编制完成基金年度报告，将年度报告", "page": 65, "section": null, "tags": []}, "B1789": {"text": "登载在指定网站上，并将年度报告提示性公告登载在指定报刊上。基金年度报告中的财务会", "page": 65, "section": null, "tags": []}, "B1790": {"text": "计报告应当经过具有证券、期货相关业务资格的会计师事务所审计。", "page": 65, "section": null, "tags": ["杠杆风险"]}, "B1791": {"text": "2. 基金管理人应当在上半年结束之日起两个月内，编制完成基金中期报告，将中期报", "page": 65, "section": null, "tags": []}, "B1792": {"text": "告登载在指定网站上，并将中期报告提示性公告登载在指定报刊上。", "page": 65, "section": null, "tags": []}, "B1793": {"text": "3. 基金管理人应当在季度结束之日起15个工作日内，编制完成基金季度报告，将季度", "page": 65, "section": null, "tags": []}, "B1794": {"text": "报告登载在指定网站上，并将季度报告提示性公告登载在指定报刊上。", "page": 65, "section": null, "tags": []}, "B1795": {"text": "4.基金合同生效不足2个月的，本基金管理人可以不编制当期季度报告、中期报告或者", "page": 65, "section": null, "tags": []}, "B1796": {"text": "年度报告。", "page": 65, "section": null, "tags": []}, "B1797": {"text": "5.报告期内出现单一投资者持有基金份额达到或超过基金总份额20%的情形，为保障其", "page": 65, "section": null, "tags": []}, "B1798": {"text": "他投资者利益，基金管理人至少应当在定期报告“影响投资者决策的其他重要信息”项下披", "page": 65, "section": null, "tags": []}, "B1799": {"text": "露该投资者的类别、报告期末持有份额及占比、报告期内持有份额变化情况及本基金的特有", "page": 65, "section": null, "tags": []}, "B1800": {"text": "风险，中国证监会认定的特殊情形除外。", "page": 65, "section": null, "tags": []}, "B1801": {"text": "6.本基金持续运作过程中， 应当在基金年度报告和中期报告中披露基金组合资产情况及", "page": 65, "section": null, "tags": []}, "B1802": {"text": "其流动性风险分析等。", "page": 65, "section": null, "tags": ["流动性风险"]}, "B1803": {"text": "7.法律法规或中国证监会另有规定的，从其规定。", "page": 65, "section": null, "tags": []}, "B1804": {"text": "在基金运作过程中发生如下可能对基金份额持有人权益或者基金份额的价格产生重大", "page": 65, "section": null, "tags": []}, "B1805": {"text": "影响的事件时，有关信息披露义务人应当在2日内编制临时报告书，并登载在指定报刊和指", "page": 65, "section": null, "tags": []}, "B1806": {"text": "定网站上：", "page": 65, "section": null, "tags": []}, "B1807": {"text": "1．基金份额持有人大会的召开及决定的事项；", "page": 65, "section": null, "tags": []}, "B1808": {"text": "2． 《基金合同》终止、基金清算；", "page": 65, "section": null, "tags": []}, "B1809": {"text": "3．转换基金运作方式、基金合并；", "page": 65, "section": null, "tags": []}, "B1810": {"text": "4．更换基金管理人、基金托管人、境外托管人、境外投资顾问或基金份额登记机构，", "page": 65, "section": null, "tags": ["汇率与跨境风险"]}, "B1811": {"text": "基金改聘会计师事务所；", "page": 65, "section": null, "tags": []}, "B1812": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 66, "section": null, "tags": ["市场风险"]}, "B1813": {"text": "62", "page": 66, "section": null, "tags": []}, "B1814": {"text": "5．基金管理人委托基金服务机构代为办理基金的份额登记、核算、估值等事项，基金", "page": 66, "section": null, "tags": []}, "B1815": {"text": "托管人委托基金服务机构代为办理基金的核算、估值、复核等事项；", "page": 66, "section": null, "tags": []}, "B1816": {"text": "6．基金管理人、基金托管人的法定名称、住所发生变更；", "page": 66, "section": null, "tags": []}, "B1817": {"text": "7．基金管理人变更持有百分之五以上股权的股东、基金管理人的实际控制人变更；", "page": 66, "section": null, "tags": []}, "B1818": {"text": "8．基金募集期延长或提前结束募集；", "page": 66, "section": null, "tags": []}, "B1819": {"text": "9．基金管理人的高级管理人员、基金经理和基金托管人专门基金托管部门负责人发生", "page": 66, "section": null, "tags": []}, "B1820": {"text": "变动；", "page": 66, "section": null, "tags": []}, "B1821": {"text": "10．基金管理人的董事在最近12个月内变更超过百分之五十，基金管理人、基金托管", "page": 66, "section": null, "tags": []}, "B1822": {"text": "人专门基金托管部门的主要业务人员在最近12个月内变动超过百分之三十；", "page": 66, "section": null, "tags": []}, "B1823": {"text": "11．涉及基金财产、基金管理业务、基金托管业务的诉讼或仲裁；", "page": 66, "section": null, "tags": []}, "B1824": {"text": "12．基金管理人或其高级管理人员、基金经理因基金管理业务相关行为受到重大行政处", "page": 66, "section": null, "tags": []}, "B1825": {"text": "罚、刑事处罚，基金托管人或其专门基金托管部门负责人因基金托管业务相关行为受到重大", "page": 66, "section": null, "tags": []}, "B1826": {"text": "行政处罚、刑事处罚；", "page": 66, "section": null, "tags": []}, "B1827": {"text": "13．基金管理人运用基金财产买卖基金管理人、基金托管人及其控股股东、实际控制人", "page": 66, "section": null, "tags": []}, "B1828": {"text": "或者与其有重大利害关系的公司发行的证券或者承销期内承销的证券， 或者从事其他重大关", "page": 66, "section": null, "tags": []}, "B1829": {"text": "联交易事项，但中国证监会另有规定的除外；", "page": 66, "section": null, "tags": []}, "B1830": {"text": "14．基金收益分配事项；", "page": 66, "section": null, "tags": []}, "B1831": {"text": "15．管理费、托管费、销售服务费、申购费、赎回费等费用计提标准、计提方式和费率", "page": 66, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1832": {"text": "发生变更；", "page": 66, "section": null, "tags": []}, "B1833": {"text": "16．任一类基金份额净值计价错误达基金份额净值百分之零点五；", "page": 66, "section": null, "tags": []}, "B1834": {"text": "17.基金开始办理申购、赎回；", "page": 66, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1835": {"text": "18.基金发生巨额赎回并延期办理；", "page": 66, "section": null, "tags": ["流动性风险"]}, "B1836": {"text": "19.基金连续发生巨额赎回并暂停接受赎回申请或延缓支付赎回款项；", "page": 66, "section": null, "tags": ["流动性风险"]}, "B1837": {"text": "20.基金暂停接受申购、赎回申请或重新接受申购、赎回申请；", "page": 66, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1838": {"text": "21.基金份额的拆分；", "page": 66, "section": null, "tags": []}, "B1839": {"text": "22.本基金接受其它币种的申购、赎回；", "page": 66, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1840": {"text": "23.基金A类人民币份额暂停上市、恢复上市或终止上市；", "page": 66, "section": null, "tags": []}, "B1841": {"text": "24.基金推出新业务或服务；", "page": 66, "section": null, "tags": []}, "B1842": {"text": "25.发生涉及基金申购、赎回事项调整或潜在影响投资者赎回等重大事项时；", "page": 66, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1843": {"text": "26、本基金增加或变更份额类别设置；", "page": 66, "section": null, "tags": []}, "B1844": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 67, "section": null, "tags": ["市场风险"]}, "B1845": {"text": "63", "page": 67, "section": null, "tags": []}, "B1846": {"text": "27. 基金信息披露义务人认为可能对基金份额持有人权益或者基金份额的价格产生重大", "page": 67, "section": null, "tags": []}, "B1847": {"text": "影响的其他事项或中国证监会规定的其他事项。", "page": 67, "section": null, "tags": []}, "B1848": {"text": "在本基金合同存续期限内， 任何公共媒介中出现的或者在市场上流传的消息可能对基金", "page": 67, "section": null, "tags": []}, "B1849": {"text": "份额价格产生误导性影响或者引起较大波动，以及可能损害基金份额持有人权益的，相关信", "page": 67, "section": null, "tags": []}, "B1850": {"text": "息披露义务人知悉后应当立即对该消息进行公开澄清， 并将有关情况立即报告中国证监会和", "page": 67, "section": null, "tags": []}, "B1851": {"text": "基金上市交易的证券交易所。", "page": 67, "section": null, "tags": []}, "B1852": {"text": "基金份额持有人大会决定的事项，应当依法报中国证监会核准或者备案，并予以公告。", "page": 67, "section": null, "tags": []}, "B1853": {"text": "召开基金份额持有人大会的，召集人应当至少提前30日公告基金份额持有人大会的召开时", "page": 67, "section": null, "tags": []}, "B1854": {"text": "间、会议形式、审议事项、议事程序和表决方式等事项。", "page": 67, "section": null, "tags": []}, "B1855": {"text": "基金份额持有人依法自行召集基金份额持有人大会，基金管理人、基金托管人对基金份", "page": 67, "section": null, "tags": []}, "B1856": {"text": "额持有人大会决定的事项不依法履行信息披露义务的，召集人应当履行相关信息披露义务。", "page": 67, "section": null, "tags": []}, "B1857": {"text": "基金合同终止的， 基金管理人应当依法组织基金财产清算小组对基金财产进行清算并作", "page": 67, "section": null, "tags": []}, "B1858": {"text": "出清算报告。基金财产清算小组应当将清算报告登载在指定网站上，并将清算报告提示性公", "page": 67, "section": null, "tags": []}, "B1859": {"text": "告登载在指定报刊上。", "page": 67, "section": null, "tags": []}, "B1860": {"text": "基金管理人、基金托管人除按法律法规要求披露信息外，也可着眼于为投资者决策提供", "page": 67, "section": null, "tags": []}, "B1861": {"text": "有用信息的角度，在保证公平对待投资者、不误导投资者、不影响基金正常投资操作的前提", "page": 67, "section": null, "tags": []}, "B1862": {"text": "下，自主提升信息披露服务的质量。具体要求应当符合中国证监会及自律规则的相关规定。", "page": 67, "section": null, "tags": []}, "B1863": {"text": "前述自主披露如产生信息披露费用，该费用不得从基金财产中列支。", "page": 67, "section": null, "tags": []}, "B1864": {"text": "依法必须披露的信息发布后，基金管理人、基金托管人应当按照相关法律法规规定将信息置", "page": 67, "section": null, "tags": []}, "B1865": {"text": "备于各自住所和基金上市交易的证券交易所，供社会公众查阅、复制。", "page": 67, "section": null, "tags": []}, "B1866": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 68, "section": null, "tags": ["市场风险"]}, "B1867": {"text": "64", "page": 68, "section": null, "tags": []}, "B1868": {"text": "十七、基金合同的变更、终止与基金财产清算", "page": 68, "section": null, "tags": []}, "B1869": {"text": "1.基金合同变更内容对基金合同当事人权利、义务产生重大影响的，应召开基金份额持", "page": 68, "section": null, "tags": []}, "B1870": {"text": "有人大会，基金合同变更的内容应经基金份额持有人大会决议同意。", "page": 68, "section": null, "tags": []}, "B1871": {"text": "(1)终止基金合同；", "page": 68, "section": null, "tags": []}, "B1872": {"text": "(2)转换基金运作方式；", "page": 68, "section": null, "tags": []}, "B1873": {"text": "(3)变更基金类别；", "page": 68, "section": null, "tags": []}, "B1874": {"text": "(4)变更基金投资目标、投资范围或投资策略；", "page": 68, "section": null, "tags": []}, "B1875": {"text": "(5)变更基金份额持有人大会程序；", "page": 68, "section": null, "tags": []}, "B1876": {"text": "(6)更换基金管理人、基金托管人；", "page": 68, "section": null, "tags": []}, "B1877": {"text": "(7)提高基金管理人、基金托管人的报酬标准或提高销售服务费率。但根据基金合同及", "page": 68, "section": null, "tags": []}, "B1878": {"text": "适用的相关规定提高该等报酬标准的除外；", "page": 68, "section": null, "tags": []}, "B1879": {"text": "(8)本基金与其他基金的合并；", "page": 68, "section": null, "tags": []}, "B1880": {"text": "(9)对基金合同当事人权利、义务产生重大影响的其他事项；", "page": 68, "section": null, "tags": []}, "B1881": {"text": "(10)法律法规、基金合同或中国证监会规定的其他情形。", "page": 68, "section": null, "tags": []}, "B1882": {"text": "但出现下列情况时，可不经基金份额持有人大会决议，由基金管理人和基金托管人同意", "page": 68, "section": null, "tags": []}, "B1883": {"text": "变更后公布，并报中国证监会备案：", "page": 68, "section": null, "tags": []}, "B1884": {"text": "(1)调低基金管理费、基金托管费和其他应由基金承担的费用；", "page": 68, "section": null, "tags": []}, "B1885": {"text": "(2)在法律法规和本基金合同规定的范围内变更基金的申购费率、赎回费率和调低销售", "page": 68, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1886": {"text": "服务费率或变更收费方式；", "page": 68, "section": null, "tags": []}, "B1887": {"text": "(3)因相应的法律法规发生变动必须对基金合同进行修改；", "page": 68, "section": null, "tags": []}, "B1888": {"text": "(4)对基金合同的修改不涉及本基金合同当事人权利义务关系发生重大变化；", "page": 68, "section": null, "tags": []}, "B1889": {"text": "(5)基金合同的修改对基金份额持有人利益无实质性不利影响；", "page": 68, "section": null, "tags": []}, "B1890": {"text": "(6)按照法律法规或本基金合同规定不需召开基金份额持有人大会的其他情形。", "page": 68, "section": null, "tags": []}, "B1891": {"text": "2. 关于《基金合同》变更的基金份额持有人大会决议自持有人大会决议通过后生效，", "page": 68, "section": null, "tags": []}, "B1892": {"text": "自决议生效后两日内在指定媒介公告，并在决议生效5日内报中国证监会备案。", "page": 68, "section": null, "tags": []}, "B1893": {"text": "有下列情形之一的，本基金合同经中国证监会核准后将终止：", "page": 68, "section": null, "tags": []}, "B1894": {"text": "1.基金份额持有人大会决定终止的；", "page": 68, "section": null, "tags": []}, "B1895": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 69, "section": null, "tags": ["市场风险"]}, "B1896": {"text": "65", "page": 69, "section": null, "tags": []}, "B1897": {"text": "2.基金管理人职责终止， 而在6个月内无其他适当的基金管理公司承接其原有权利义务 ；", "page": 69, "section": null, "tags": []}, "B1898": {"text": "3.基金托管人职责终止，而在6个月内无其他适当的托管机构承接其原有权利义务；", "page": 69, "section": null, "tags": []}, "B1899": {"text": "4.中国证监会规定的其他情况。", "page": 69, "section": null, "tags": []}, "B1900": {"text": "1.基金财产清算组", "page": 69, "section": null, "tags": []}, "B1901": {"text": "(1)基金合同终止时，成立基金财产清算组，基金财产清算组在中国证监会的监督下进", "page": 69, "section": null, "tags": []}, "B1902": {"text": "行基金清算。在基金财产清算组接管基金财产之前，基金管理人和基金托管人应按照基金合", "page": 69, "section": null, "tags": []}, "B1903": {"text": "同和托管协议的规定继续履行保护基金财产安全的职责。", "page": 69, "section": null, "tags": []}, "B1904": {"text": "(2)基金财产清算组成员由基金管理人、基金托管人、具有从事证券相关业务资格的注", "page": 69, "section": null, "tags": []}, "B1905": {"text": "册会计师、 律师以及中国证监会指定的人员组成。 基金财产清算组可以聘用必要的工作人员。", "page": 69, "section": null, "tags": []}, "B1906": {"text": "(3)基金财产清算组负责基金财产的保管、清理、估价、变现和分配。基金财产清算组", "page": 69, "section": null, "tags": ["流动性风险"]}, "B1907": {"text": "可以依法进行必要的民事活动。", "page": 69, "section": null, "tags": []}, "B1908": {"text": "2.基金财产清算程序", "page": 69, "section": null, "tags": []}, "B1909": {"text": "基金合同终止，应当按法律法规和本基金合同的有关规定对基金财产进行清算。基金财", "page": 69, "section": null, "tags": []}, "B1910": {"text": "产清算程序主要包括：", "page": 69, "section": null, "tags": []}, "B1911": {"text": "(1)基金合同终止后，发布基金财产清算公告；", "page": 69, "section": null, "tags": []}, "B1912": {"text": "(2)基金合同终止时，由基金财产清算组统一接管基金财产；", "page": 69, "section": null, "tags": []}, "B1913": {"text": "(3)对基金财产进行清理和确认；", "page": 69, "section": null, "tags": []}, "B1914": {"text": "(4)对基金财产进行估价和变现；", "page": 69, "section": null, "tags": ["流动性风险"]}, "B1915": {"text": "(5)聘请律师事务所出具法律意见书；", "page": 69, "section": null, "tags": []}, "B1916": {"text": "(6)聘请会计师事务所对清算报告进行审计；", "page": 69, "section": null, "tags": []}, "B1917": {"text": "(7)将基金财产清算结果报告中国证监会；", "page": 69, "section": null, "tags": []}, "B1918": {"text": "(8)参加与基金财产有关的民事诉讼；", "page": 69, "section": null, "tags": []}, "B1919": {"text": "(9)公布基金财产清算结果；", "page": 69, "section": null, "tags": []}, "B1920": {"text": "(10)对基金剩余财产进行分配。", "page": 69, "section": null, "tags": []}, "B1921": {"text": "3.清算费用", "page": 69, "section": null, "tags": []}, "B1922": {"text": "清算费用是指基金财产清算组在进行基金财产清算过程中发生的所有合理费用， 清算费", "page": 69, "section": null, "tags": []}, "B1923": {"text": "用由基金财产清算组优先从基金财产中支付。", "page": 69, "section": null, "tags": []}, "B1924": {"text": "4.基金
