财产按下列顺序清偿：", "page": 69, "section": null, "tags": []}, "B1925": {"text": "(1)支付清算费用；", "page": 69, "section": null, "tags": []}, "B1926": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 70, "section": null, "tags": ["市场风险"]}, "B1927": {"text": "66", "page": 70, "section": null, "tags": []}, "B1928": {"text": "(2)交纳所欠税款；", "page": 70, "section": null, "tags": []}, "B1929": {"text": "(3)清偿基金债务；", "page": 70, "section": null, "tags": []}, "B1930": {"text": "(4)按基金份额持有人持有的基金份额比例进行分配。", "page": 70, "section": null, "tags": []}, "B1931": {"text": "基金财产未按前款(1)－(3)项规定清偿前，不分配给基金份额持有人。", "page": 70, "section": null, "tags": []}, "B1932": {"text": "5.基金财产清算的公告", "page": 70, "section": null, "tags": []}, "B1933": {"text": "基金财产清算公告于基金合同终止并报中国证监会备案后5个工作日内由基金财产清", "page": 70, "section": null, "tags": []}, "B1934": {"text": "算组公告；清算过程中的有关重大事项须及时公告；基金财产清算结果经会计师事务所审计，", "page": 70, "section": null, "tags": []}, "B1935": {"text": "律师事务所出具法律意见书后，由基金财产清算组报中国证监会备案并公告。", "page": 70, "section": null, "tags": []}, "B1936": {"text": "6.基金财产清算账册及文件的保存", "page": 70, "section": null, "tags": []}, "B1937": {"text": "基金财产清算账册及有关文件由基金托管人保存15年以上。", "page": 70, "section": null, "tags": []}, "B1938": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 71, "section": null, "tags": ["市场风险"]}, "B1939": {"text": "67", "page": 71, "section": null, "tags": []}, "B1940": {"text": "十八、基金托管人", "page": 71, "section": null, "tags": []}, "B1941": {"text": "一、基金托管人情况", "page": 71, "section": null, "tags": []}, "B1942": {"text": "名称：中国建设银行股份有限公司(简称：中国建设银行)", "page": 71, "section": null, "tags": []}, "B1943": {"text": "住所：北京市西城区金融大街25号", "page": 71, "section": null, "tags": []}, "B1944": {"text": "办公地址：北京市西城区闹市口大街1号院1号楼", "page": 71, "section": null, "tags": []}, "B1945": {"text": "法定代表人：田国立", "page": 71, "section": null, "tags": []}, "B1946": {"text": "成立时间：2004年09月17日", "page": 71, "section": null, "tags": []}, "B1947": {"text": "组织形式：股份有限公司", "page": 71, "section": null, "tags": []}, "B1948": {"text": "注册资本：贰仟伍佰亿壹仟零玖拾柒万柒仟肆佰捌拾陆元整", "page": 71, "section": null, "tags": []}, "B1949": {"text": "存续期间：持续经营", "page": 71, "section": null, "tags": []}, "B1950": {"text": "基金托管资格批文及文号：中国证监会证监基字[1998]12号", "page": 71, "section": null, "tags": []}, "B1951": {"text": "联系人：李申", "page": 71, "section": null, "tags": []}, "B1952": {"text": "联系电话：(021) 6063 7102", "page": 71, "section": null, "tags": []}, "B1953": {"text": "中国建设银行总行设资产托管业务部， 下设综合处、 基金市场处、 证券保险资产市场处、", "page": 71, "section": null, "tags": []}, "B1954": {"text": "理财信托股权市场处、全球托管处、养老金托管处、新兴业务处、运营管理处、跨境托管运", "page": 71, "section": null, "tags": []}, "B1955": {"text": "营处、社保及大客户服务处、托管应用系统支持处、合规监督处等12个职能处室，在安徽", "page": 71, "section": null, "tags": []}, "B1956": {"text": "合肥设有托管运营中心，在上海设有托管运营中心上海分中心，共有员工300余人。", "page": 71, "section": null, "tags": []}, "B1957": {"text": "作为国内首批开办证券投资基金托管业务的商业银行，中国建设银行一直秉持“以客户", "page": 71, "section": null, "tags": []}, "B1958": {"text": "为中心”的经营理念，不断加强风险管理和内部控制，严格履行托管人的各项职责，切实维", "page": 71, "section": null, "tags": []}, "B1959": {"text": "护资产持有人的合法权益，为资产委托人提供高质量的托管服务。经过多年稳步发展，中国", "page": 71, "section": null, "tags": []}, "B1960": {"text": "建设银行托管资产规模不断扩大，托管业务品种不断增加，已形成包括证券投资基金、社保", "page": 71, "section": null, "tags": []}, "B1961": {"text": "基金、保险资金、基本养老个人账户、(R)QFII、(R)QDII、企业年金、职业年金、存托业务", "page": 71, "section": null, "tags": []}, "B1962": {"text": "等产品在内的托管业务体系，是目前国内托管业务品种最齐全的商业银行之一。截至2021", "page": 71, "section": null, "tags": []}, "B1963": {"text": "年三季度末，中国建设银行已托管1120只证券投资基金。中国建设银行专业高效的托管服", "page": 71, "section": null, "tags": []}, "B1964": {"text": "务能力和业务水平，赢得了业内的高度认同。截至目前，中国建设银行先后多次被《全球托", "page": 71, "section": null, "tags": []}, "B1965": {"text": "管人》 、 《财资》 、 《环球金融》杂志及《中国基金报》评选为“最佳托管银行”、连续多年", "page": 71, "section": null, "tags": []}, "B1966": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 72, "section": null, "tags": ["市场风险"]}, "B1967": {"text": "68", "page": 72, "section": null, "tags": []}, "B1968": {"text": "荣获中央国债登记结算有限责任公司（中债） “优秀资产托管机构”、银行间市场清算所股份", "page": 72, "section": null, "tags": []}, "B1969": {"text": "有限公司（上清所） “优秀托管银行”奖项、并在2017、2019、2020、2021年分别荣获《亚", "page": 72, "section": null, "tags": []}, "B1970": {"text": "洲银行家》 颁发的“最佳托管系统实施奖”、 “中国年度托管业务科技实施奖”、 “中国年度托", "page": 72, "section": null, "tags": []}, "B1971": {"text": "管银行（大型银行） ”以及“中国最佳数字化资产托管银行”奖项。", "page": 72, "section": null, "tags": []}, "B1972": {"text": "二、基金托管人的内部控制制度", "page": 72, "section": null, "tags": []}, "B1973": {"text": "中国建设银行托管业务确保贯彻落实国家有关法律法规及监管规定，勤勉尽责，恪尽职", "page": 72, "section": null, "tags": []}, "B1974": {"text": "守，保证托管资产的安全、完整，保障所托管基金的稳健运行，维护基金份额持有人利益；", "page": 72, "section": null, "tags": []}, "B1975": {"text": "规范业务操作，严格按规程进行业务处理和操作，有效管控托管业务风险；确保所披露信息", "page": 72, "section": null, "tags": []}, "B1976": {"text": "的完整、及时，保证客户信息不泄漏。", "page": 72, "section": null, "tags": []}, "B1977": {"text": "中国建设银行设有风险管理与内控管理委员会，负责全行风险管理与内部控制的研究、", "page": 72, "section": null, "tags": []}, "B1978": {"text": "议事和协调工作。内部控制管理部门是牵头内部控制管理的职能部门，牵头内部控制体系的", "page": 72, "section": null, "tags": []}, "B1979": {"text": "统筹规划、组织落实和检查评价。资产托管业务部设置专门负责内部控制工作的处室，配备", "page": 72, "section": null, "tags": []}, "B1980": {"text": "了专职内控合规人员负责托管业务的内控合规工作。", "page": 72, "section": null, "tags": []}, "B1981": {"text": "中国建设银行托管业务内部控制遵循全面性、重要性、制衡性、适应性和独立性原则。", "page": 72, "section": null, "tags": []}, "B1982": {"text": "1.全面性原则。 内部控制贯穿和渗透于托管业务各项流程和各个环节， 覆盖所有的机构、", "page": 72, "section": null, "tags": []}, "B1983": {"text": "岗位，约束所有托管业务人员。", "page": 72, "section": null, "tags": []}, "B1984": {"text": "2.重要性原则。内部控制在全面控制的基础上，关注重要的托管业务事项和高风险托管", "page": 72, "section": null, "tags": []}, "B1985": {"text": "业务领域。", "page": 72, "section": null, "tags": []}, "B1986": {"text": "3.制衡性原则。内部控制坚持风险为本、审慎经营的理念，设立托管机构和开办托管业", "page": 72, "section": null, "tags": []}, "B1987": {"text": "务均坚持内控优先，在组织机构、权责分配、业务流程等方面形成相互制约、相互监督的机", "page": 72, "section": null, "tags": []}, "B1988": {"text": "制。", "page": 72, "section": null, "tags": []}, "B1989": {"text": "4.适应性原则。内部控制与托管业务管理模式、业务规模、产品复杂程度、风险状况等", "page": 72, "section": null, "tags": []}, "B1990": {"text": "相匹配，并根据情况变化及时调整。", "page": 72, "section": null, "tags": []}, "B1991": {"text": "5.独立性原则。保证客户资产与建设银行自有资产、托管的其他资产相互独立，对不同", "page": 72, "section": null, "tags": []}, "B1992": {"text": "客户的资产分别设置账户、独立核算、分账管理。", "page": 72, "section": null, "tags": []}, "B1993": {"text": "1.托管资产保管控制。 严格按照法律法规和合同约定履行托管人安全保管可控制账户内", "page": 72, "section": null, "tags": []}, "B1994": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 73, "section": null, "tags": ["市场风险"]}, "B1995": {"text": "69", "page": 73, "section": null, "tags": []}, "B1996": {"text": "托管资产的职责，所托管资产与托管人自有资产、托管的其他资产严格分开，保证托管资产", "page": 73, "section": null, "tags": []}, "B1997": {"text": "的安全、独立和完整。", "page": 73, "section": null, "tags": []}, "B1998": {"text": "2.授权控制。托管业务纳入全行统一的授权管理体系，严格在授权范围内执行，严禁超", "page": 73, "section": null, "tags": []}, "B1999": {"text": "范围经营。明确业务处理岗位权限，各级人员在授权范围内行使职权和承担责任。明确不相", "page": 73, "section": null, "tags": []}, "B2000": {"text": "容岗位，实施相应的分离措施，形成各司其职、各负其责、相互制约的工作机制。", "page": 73, "section": null, "tags": []}, "B2001": {"text": "3.规章制度控制。制定系统化、规范化的托管业务管理制度，并定期重检与修订，持续", "page": 73, "section": null, "tags": []}, "B2002": {"text": "维持托管业务规章制度的适应性和有效性，严格保障托管业务规范运营。", "page": 73, "section": null, "tags": []}, "B2003": {"text": "4.流程控制。严格指令接收、清算、核算、监督的流程化管理，控制关键风险点。", "page": 73, "section": null, "tags": []}, "B2004": {"text": "5.信息系统控制。持续加强内控手段的新技术运用，提高内控自动化水平和有效性。", "page": 73, "section": null, "tags": []}, "B2005": {"text": "6.业务连续性控制。建立托管业务应急响应及恢复机制，实现对运营中断事件的快速响", "page": 73, "section": null, "tags": []}, "B2006": {"text": "应和及时处置。组织开展应急演练，保障托管业务持续运营。", "page": 73, "section": null, "tags": []}, "B2007": {"text": "7.运营环境控制。托管业务工作环境符合监管和控制要求，运营环境独立，录音、录像", "page": 73, "section": null, "tags": []}, "B2008": {"text": "及门禁持续有效。系统实现独立与隔离，建立安全的数据传输通道和数据备份机制，保障数", "page": 73, "section": null, "tags": []}, "B2009": {"text": "据传输和存储安全。", "page": 73, "section": null, "tags": []}, "B2010": {"text": "8.员工行为管理控制。明确员工行为守则，规范员工日常行为，加强职业道德和员工操", "page": 73, "section": null, "tags": []}, "B2011": {"text": "守教育，培育忠于所托、勤勉尽责的合规文化。", "page": 73, "section": null, "tags": []}, "B2012": {"text": "自2007年起，资产托管业务部连续聘请外部会计师事务所对托管业务进行内部控制审", "page": 73, "section": null, "tags": []}, "B2013": {"text": "计，均获无保留意见，并已经成为常规化的内控工作手段。", "page": 73, "section": null, "tags": []}, "B2014": {"text": "三、基金托管人对基金管理人运作基金进行监督的方法和程序", "page": 73, "section": null, "tags": []}, "B2015": {"text": "依照 《中华人民共和国证券投资基金法》 、 《公开募集证券投资基金运作管理办法》 、 《证", "page": 73, "section": null, "tags": []}, "B2016": {"text": "券投资基金托管业务管理办法》 及其配套法规和基金合同、托管协议的约定，监督所托管基", "page": 73, "section": null, "tags": []}, "B2017": {"text": "金的投资运作，对基金管理人运作基金的投资比例、投资范围、投资组合等情况进行监督。", "page": 73, "section": null, "tags": []}, "B2018": {"text": "在日常为基金投资运作所提供的基金清算和核算服务环节中， 对基金管理人发送的投资指令、", "page": 73, "section": null, "tags": []}, "B2019": {"text": "基金管理人对各基金费用的提取与开支情况进行检查监督。", "page": 73, "section": null, "tags": []}, "B2020": {"text": "基金托管人发现基金管理人的投资指令违反法律法规及基金托管协议的规定， 应当拒绝", "page": 73, "section": null, "tags": []}, "B2021": {"text": "执行，及时提示基金管理人，并依照法律法规的规定及时向中国证监会报告。基金托管人发", "page": 73, "section": null, "tags": []}, "B2022": {"text": "现基金管理人依据交易程序已经生效的指令违反法律法规、基金托管协议规定的，应当及时", "page": 73, "section": null, "tags": []}, "B2023": {"text": "提示基金管理人在规定期限内改正，并依照法律法规的规定及时向中国证监会报告。", "page": 73, "section": null, "tags": []}, "B2024": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 74, "section": null, "tags": ["市场风险"]}, "B2025": {"text": "70", "page": 74, "section": null, "tags": []}, "B2026": {"text": "每个工作日对基金投资运作比例等情况进行监督，如发现异常情况，向基金管理人进行", "page": 74, "section": null, "tags": []}, "B2027": {"text": "风险提示，与基金管理人进行情况核实，督促其改正，并依照法律法规的规定及时向中国证", "page": 74, "section": null, "tags": []}, "B2028": {"text": "监会报告。", "page": 74, "section": null, "tags": []}, "B2029": {"text": "基金管理人有义务配合和协助基金托管人的监督和核查，对基金托管人发出的提示，应", "page": 74, "section": null, "tags": []}, "B2030": {"text": "在规定时间内答复并改正；对基金托管人的合理疑义，应及时解释或举证；对基金托管人按", "page": 74, "section": null, "tags": []}, "B2031": {"text": "照法律法规和托管协议的要求需向中国证监会报告的事项， 应积极配合提供相关数据资料和", "page": 74, "section": null, "tags": []}, "B2032": {"text": "制度等。", "page": 74, "section": null, "tags": []}, "B2033": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 75, "section": null, "tags": ["市场风险"]}, "B2034": {"text": "71", "page": 75, "section": null, "tags": []}, "B2035": {"text": "十九、境外托管人", "page": 75, "section": null, "tags": ["汇率与跨境风险"]}, "B2036": {"text": "名称：纽约梅隆银行股份有限公司The Bank of New York Mellon Corporation", "page": 75, "section": null, "tags": []}, "B2037": {"text": "注册地址：240 Greenwich St, New York, New York 10286 USA", "page": 75, "section": null, "tags": []}, "B2038": {"text": "办公地址：240 Greenwich St, New York, New York 10286 USA", "page": 75, "section": null, "tags": []}, "B2039": {"text": "法定代表人：Thomas P. Gibbons (Chairman & CEO - 董事长兼首席执行官)", "page": 75, "section": null, "tags": []}, "B2040": {"text": "成立时间：1784年", "page": 75, "section": null, "tags": []}, "B2041": {"text": "纽约梅隆银行公司总部设在美国纽约240 Greenwich Street, 是美国历史最悠久的商业银", "page": 75, "section": null, "tags": []}, "B2042": {"text": "行，也是全球最大的金融服务公司之一。公司集多元化及其配套业务于一体，服务内容", "page": 75, "section": null, "tags": []}, "B2043": {"text": "包括资产管理、资产服务、发行人服务、清算服务、资金服务和财富管理。公司通过在", "page": 75, "section": null, "tags": []}, "B2044": {"text": "全球35个国家和地区设立的分支机构，为超过100个金融市场的投资提供证券托管服", "page": 75, "section": null, "tags": []}, "B2045": {"text": "务，为全球最大的托管行，并且是全球最大的资产管理服务提供商之一。公司在存托凭", "page": 75, "section": null, "tags": []}, "B2046": {"text": "证、公司信托、股东服务、清算贸易、融资服务、佣金管理等业务方面都位居全球前列，", "page": 75, "section": null, "tags": []}, "B2047": {"text": "并且是领先的美元现金管理、结算服务和全球支付服务供应公司。", "page": 75, "section": null, "tags": []}, "B2048": {"text": "截至2021年3月31日，纽约梅隆银行托管资产规模达41.7万亿美元，管理资产规模", "page": 75, "section": null, "tags": []}, "B2049": {"text": "为2.2万亿美元。", "page": 75, "section": null, "tags": []}, "B2050": {"text": "截至2021年3月31日，纽约梅隆银行股东权益为449亿美元，一级资本充足率为", "page": 75, "section": null, "tags": []}, "B2051": {"text": "15.2%。全球员工总人数为48,000。", "page": 75, "section": null, "tags": []}, "B2052": {"text": "信用等级: Aa1评级（穆迪） ，AA-（标普） （截至2021年3月31日）", "page": 75, "section": null, "tags": ["信用风险"]}, "B2053": {"text": "1、安全保管受托财产；", "page": 75, "section": null, "tags": []}, "B2054": {"text": "2、按照相关合同的约定，计算或复核受托资产的资产净值；", "page": 75, "section": null, "tags": []}, "B2055": {"text": "3、按照相关合同的约定，及时办理受托资产的清算、交割事宜；", "page": 75, "section": null, "tags": []}, "B2056": {"text": "4、按照相关合同的约定和所适用国家、地区法律法规的规定，开设受托资产的资金账", "page": 75, "section": null, "tags": []}, "B2057": {"text": "户以及证券账户；", "page": 75, "section": null, "tags": []}, "B2058": {"text": "5、按照相关合同的约定，提供与受托资产业务活动有关的会计记录、交易信息；", "page": 75, "section": null, "tags": []}, "B2059": {"text": "6、保存受托资产托管业务活动的记录、账册以及其他相关资料。", "page": 75, "section": null, "tags": []}, "B2060": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 76, "section": null, "tags": ["市场风险"]}, "B2061": {"text": "72", "page": 76, "section": null, "tags": []}, "B2062": {"text": "二十、相关服务机构", "page": 76, "section": null, "tags": []}, "B2063": {"text": "1．直销机构：", "page": 76, "section": null, "tags": []}, "B2064": {"text": "（1）直销柜台", "page": 76, "section": null, "tags": []}, "B2065": {"text": "本公司在上海开设直销柜台。", "page": 76, "section": null, "tags": []}, "B2066": {"text": "住所：中国（上海）自由贸易试验区世纪大道100号上海环球金融中心58楼", "page": 76, "section": null, "tags": []}, "B2067": {"text": "办公地址：上海市浦东新区浦电路370号宝钢大厦905室", "page": 76, "section": null, "tags": []}, "B2068": {"text": "法定代表人：XIAOYI HELEN HUANG（黄小薏）", "page": 76, "section": null, "tags": []}, "B2069": {"text": "直销柜台电话： 021-38505731、021-38505732", "page": 76, "section": null, "tags": []}, "B2070": {"text": "直销柜台传真：021-50499663、50988055", "page": 76, "section": null, "tags": []}, "B2071": {"text": "网址：", "page": 76, "section": null, "tags": []}, "B2072": {"text": "（2）直销e网金", "page": 76, "section": null, "tags": []}, "B2073": {"text": "投资者可以通过本公司网上交易直销e网金系统办理本基金的申购、 赎回、 转换等业务，", "page": 76, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2074": {"text": "具体交易细则请参阅本公司网站公告。网上交易网址：www.fsfund.com。", "page": 76, "section": null, "tags": []}, "B2075": {"text": "2．人民币份额代销机构", "page": 76, "section": null, "tags": []}, "B2076": {"text": "1）场外代销机构：", "page": 76, "section": null, "tags": []}, "B2077": {"text": "本基金的销售机构信息请详见基金管理人网站公示。 基金管理人可根据有关法律法规的", "page": 76, "section": null, "tags": []}, "B2078": {"text": "要求，选择其他符合要求的机构销售基金，并在基金管理人网站公示。", "page": 76, "section": null, "tags": []}, "B2079": {"text": "2）场内代销机构：具有基金代销业务资格的深圳证券交易所会员单位（具体名单可在", "page": 76, "section": null, "tags": []}, "B2080": {"text": "深交所网站查询）。", "page": 76, "section": null, "tags": []}, "B2081": {"text": "名称：通力律师事务所", "page": 76, "section": null, "tags": []}, "B2082": {"text": "住所：上海市银城中路68号时代金融中心19楼", "page": 76, "section": null, "tags": []}, "B2083": {"text": "办公地址：上海市银城中路68号时代金融中心19楼", "page": 76, "section": null, "tags": []}, "B2084": {"text": "负责人：韩炯", "page": 76, "section": null, "tags": []}, "B2085": {"text": "联系电话：(86 21) 3135 8666", "page": 76, "section": null, "tags": []}, "B2086": {"text": "传真: （86 21) 3135 8600", "page": 76, "section": null, "tags": []}, "B2087": {"text": "联系人：黎明", "page": 76, "section": null, "tags": []}, "B2088": {"text": "经办律师：吕红、黎明", "page": 76, "section": null, "tags": []}, "B2089": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 77, "section": null, "tags": ["市场风险"]}, "B2090": {"text": "73", "page": 77, "section": null, "tags": []}, "B2091": {"text": "名称：普华永道中天会计师事务所(特殊普通合伙)", "page": 77, "section": null, "tags": []}, "B2092": {"text": "注册地址：中国上海市浦东新区陆家嘴环路 1318 号星展银行大厦 507 单元 01 室", "page": 77, "section": null, "tags": []}, "B2093": {"text": "办公地址：中国上海市浦东新区东育路588 号前滩中心 42 楼", "page": 77, "section": null, "tags": []}, "B2094": {"text": "执行事务合伙人：李丹", "page": 77, "section": null, "tags": []}, "B2095": {"text": "联系电话：(021) 23238888", "page": 77, "section": null, "tags": []}, "B2096": {"text": "传真：(021) 23238800", "page": 77, "section": null, "tags": []}, "B2097": {"text": "联系人：林佳璐", "page": 77, "section": null, "tags": []}, "B2098": {"text": "经办注册会计师：陈熹、林佳璐", "page": 77, "section": null, "tags": []}, "B2099": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 78, "section": null, "tags": ["市场风险"]}, "B2100": {"text": "74", "page": 78, "section": null, "tags": []}, "B2101": {"text": "二十一、基金合同的内容摘要", "page": 78, "section": null, "tags": []}, "B2102": {"text": "1．基金管理人", "page": 78, "section": null, "tags": []}, "B2103": {"text": "（1）基金管理人基本情况", "page": 78, "section": null, "tags": []}, "B2104": {"text": "名称：华宝基金管理有限公司", "page": 78, "section": null, "tags": []}, "B2105": {"text": "住所：中国（上海）自由贸易试验区世纪大道100号上海环球金融中心58楼", "page": 78, "section": null, "tags": []}, "B2106": {"text": "法定代表人：XIAOYI HELEN HUANG（黄小薏）", "page": 78, "section": null, "tags": []}, "B2107": {"text": "成立日期： 2003年3月7日", "page": 78, "section": null, "tags": []}, "B2108": {"text": "批准设立机关：中国证券监督管理委员会", "page": 78, "section": null, "tags": []}, "B2109": {"text": "批准设立文号：中国证监会证监基金字[2003]19号", "page": 78, "section": null, "tags": []}, "B2110": {"text": "经营范围：发起设立基金、基金管理及中国证监会批准的其他业务", "page": 78, "section": null, "tags": []}, "B2111": {"text": "组织形式：有限责任公司", "page": 78, "section": null, "tags": []}, "B2112": {"text": "注册资本： 1.5亿元人民币", "page": 78, "section": null, "tags": []}, "B2113": {"text": "存续期间：持续经营", "page": 78, "section": null, "tags": []}, "B2114": {"text": "（2）基金管理人的权利", "page": 78, "section": null, "tags": []}, "B2115": {"text": "1）自本基金合同生效之日起，依照有关法律法规和本基金合同的规定独立运用基金财", "page": 78, "section": null, "tags": []}, "B2116": {"text": "产；", "page": 78, "section": null, "tags": []}, "B2117": {"text": "2）依照基金合同获得基金管理费以及法律法规规定或监管部门批准的其他收入；", "page": 78, "section": null, "tags": []}, "B2118": {"text": "3）发售基金份额；", "page": 78, "section": null, "tags": []}, "B2119": {"text": "4）依照有关规定行使因基金财产投资于证券所产生的权利；", "page": 78, "section": null, "tags": []}, "B2120": {"text": "5）在符合有关法律法规的前提下，制订和调整有关基金认购、申购、赎回、转换、非", "page": 78, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2121": {"text": "交易过户、转托管等业务的规则，在法律法规和本基金合同规定的范围内决定和调整基金", "page": 78, "section": null, "tags": []}, "B2122": {"text": "的除调高托管费率和管理费率之外的相关费率结构和收费方式；", "page": 78, "section": null, "tags": []}, "B2123": {"text": "6）根据有关规定，选择、更换或撤消证券经纪代理商以及证券登记机构，并对其行为", "page": 78, "section": null, "tags": []}, "B2124": {"text": "进行必要的监督；", "page": 78, "section": null, "tags": []}, "B2125": {"text": "7）根据本基金合同及有关规定监督基金托管人，对于基金托管人违反了本基金合同或", "page": 78, "section": null, "tags": []}, "B2126": {"text": "有关法律法规规定的行为，对基金财产、其他当事人的利益造成重大损失的情形，应及时", "page": 78, "section": null, "tags": []}, "B2127": {"text": "呈报中国证监会，并采取必要措施保护基金及相关当事人的利益；", "page": 78, "section": null, "tags": []}, "B2128": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 79, "section": null, "tags": ["市场风险"]}, "B2129": {"text": "75", "page": 79, "section": null, "tags": []}, "B2130": {"text": "8）在基金合同约定的范围内，拒绝或暂停受理申购、赎回和转换申请；", "page": 79, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2131": {"text": "9）在法律法规或监管机构允许的前提下，为基金的利益依法为基金进行融资、融券；", "page": 79, "section": null, "tags": []}, "B2132": {"text": "10） 自行担任或选择、更换登记结算机构，获取基金份额持有人名册，并对登记结算机", "page": 79, "section": null, "tags": []}, "B2133": {"text": "构的代理行为进行必要的监督和检查；", "page": 79, "section": null, "tags": []}, "B2134": {"text": "11） 选择、更换代销机构，并依据销售代理协议和有关法律法规，对其行为进行必要的", "page": 79, "section": null, "tags": []}, "B2135": {"text": "监督和检查；", "page": 79, "section": null, "tags": []}, "B2136": {"text": "12）选择、更换律师、审计师、证券经纪商或其他为基金提供服务的外部机构；", "page": 79, "section": null, "tags": []}, "B2137": {"text": "13）在基金托管人更换时，提名新的基金托管人；", "page": 79, "section": null, "tags": []}, "B2138": {"text": "14）依法召集基金份额持有人大会；", "page": 79, "section": null, "tags": []}, "B2139": {"text": "15）法律法规和基金合同规定的其他权利。", "page": 79, "section": null, "tags": []}, "B2140": {"text": "（3）基金管理人的义务", "page": 79, "section": null, "tags": []}, "B2141": {"text": "1）依法募集基金，办理或者委托经中国证监会认定的其他机构代为办理基金份额的发", "page": 79, "section": null, "tags": []}, "B2142": {"text": "售、申购、赎回和登记事宜；", "page": 79, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2143": {"text": "2）办理基金备案手续；", "page": 79, "section": null, "tags": []}, "B2144": {"text": "3）自基金合同生效之日起，以诚实信用、勤勉尽责的原则管理和运用基金财产，基于", "page": 79, "section": null, "tags": ["信用风险"]}, "B2145": {"text": "谨慎的原则，控制基金资产的流动性风险，保证基金资产正常运作；", "page": 79, "section": null, "tags": ["流动性风险"]}, "B2146": {"text": "4）配备足够的具有专业资格的人员进行基金投资分析、决策，以专业化的经营方式管", "page": 79, "section": null, "tags": []}, "B2147": {"text": "理和运作基金财产；", "page": 79, "section": null, "tags": []}, "B2148": {"text": "5）确保管理人或其委托的境外投资顾问发送的交易数据符合《基金法》 、 《试行办法》 、", "page": 79, "section": null, "tags": ["汇率与跨境风险"]}, "B2149": {"text": "基金合同及其他有关规定，并保证该数据真实、准确、完整，因数据原因造成基金资产或", "page": 79, "section": null, "tags": []}, "B2150": {"text": "其他当事人的财产损失，由基金管理人承担赔偿责任；", "page": 79, "section": null, "tags": []}, "B2151": {"text": "6）委托境外投资顾问进行境外证券投资的，境外投资顾问应符合《试行办法》规定的", "page": 79, "section": null, "tags": ["汇率与跨境风险"]}, "B2152": {"text": "有关条件；", "page": 79, "section": null, "tags": []}, "B2153": {"text": "7）承担受信责任，在挑选、委托投资顾问过程中，履行尽职调查义务；", "page": 79, "section": null, "tags": []}, "B2154": {"text": "8） 严格遵守境内有关法律法规、基金合同的规定，始终将基金持有人的利益置于首位，", "page": 79, "section": null, "tags": []}, "B2155": {"text": "以合理的依据提出投资建议，寻求基金的最佳交易执行，公平客观对待所有客户，始终按", "page": 79, "section": null, "tags": []}, "B2156": {"text": "照基金的投资目标、策略、政策、指引和限制实施投资决定，充分披露一切涉及利益冲突", "page": 79, "section": null, "tags": []}, "B2157": {"text": "的重要事实，尊重客户信息的机密性；", "page": 79, "section": null, "tags": []}, "B2158": {"text": "9）建立健全内部风险控制、监察与稽核、财务管理及人事管理等制度，保证所管理的", "page": 79, "section": null, "tags": []}, "B2159": {"text": "基金财产和管理人的财产相互独立，对所管理的不同基金分别管理，分别记账，进行证券", "page": 79, "section": null, "tags": []}, "B2160": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 80, "section": null, "tags": ["市场风险"]}, "B2161": {"text": "76", "page": 80, "section": null, "tags": []}, "B2162": {"text": "投资；", "page": 80, "section": null, "tags": []}, "B2163": {"text": "10） 确保基金投资于中国证监会规定的金融产品或工具；严格按照《基金法》 、 《试行办", "page": 80, "section": null, "tags": []}, "B2164": {"text": "法》 、基金合同及有关法律法规有关投资范围和比例限制的规定，确定清晰、可执行的投资", "page": 80, "section": null, "tags": []}, "B2165": {"text": "范围和投资比例，并在规定时间内，对超范围、超比例的投资进行调整，并承担相应的责", "page": 80, "section": null, "tags": []}, "B2166": {"text": "任；", "page": 80, "section": null, "tags": []}, "B2167": {"text": "11）确保基金管理人向基金托管人发送的基金认购、申购和赎回数据符合《基金法》 、", "page": 80, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2168": {"text": "《试行办法》 、基金合同及其他有关规定，并保证该数据的真实、准确和完整，因数据原因", "page": 80, "section": null, "tags": []}, "B2169": {"text": "造成基金财产或其他当事人损失的，由基金管理人负责赔偿；", "page": 80, "section": null, "tags": []}, "B2170": {"text": "12） 委托境外证券服务机构代理买卖证券的，应当严格履行受信责任，并按照有关规定", "page": 80, "section": null, "tags": ["汇率与跨境风险"]}, "B2171": {"text": "对投资交易的流程、信息披露、记录保存进行管理。", "page": 80, "section": null, "tags": []}, "B2172": {"text": "13）与境外证券服务机构之间的证券交易和研究服务安排，应当严格按照《试行办法》", "page": 80, "section": null, "tags": ["汇率与跨境风险"]}, "B2173": {"text": "第三十条规定的原则进行；", "page": 80, "section": null, "tags": []}, "B2174": {"text": "14）进行境外证券投资，应当遵守当地监管机构、交易所的有关法律法规规定。", "page": 80, "section": null, "tags": ["汇率与跨境风险"]}, "B2175": {"text": "15） 如需在托管人选择的机构之外保管、登记基金财产，应严格审查，保证基金财产的", "page": 80, "section": null, "tags": []}, "B2176": {"text": "安全，以及相关资产收益准确、按时归入基金财产；", "page": 80, "section": null, "tags": []}, "B2177": {"text": "16）严格按照全球投资表现标准(GIPS)选取投资业绩标准；", "page": 80, "section": null, "tags": []}, "B2178": {"text": "17）除依据《基金法》 、 《试行办法》 、基金合同及其他有关规定外，不得为自己及任何", "page": 80, "section": null, "tags": []}, "B2179": {"text": "第三人谋取利益，不得委托第三人运作基金财产；", "page": 80, "section": null, "tags": []}, "B2180": {"text": "18）依法接受基金托管人的监督；", "page": 80, "section": null, "tags": []}, "B2181": {"text": "19）计算并公告基金净值信息，确定各类基金份额申购、赎回价格；", "page": 80, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2182": {"text": "20） 采取适当合理的措施使计算基金份额认购、申购、赎回和注销价格的方法符合基金", "page": 80, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2183": {"text": "合同等法律文件的规定；", "page": 80, "section": null, "tags": []}, "B2184": {"text": "21） 按规定受理申购和赎回申请，严格控制基金投资产品的流动性风险，确保及时、足", "page": 80, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2185": {"text": "额支付赎回款项；", "page": 80, "section": null, "tags": ["流动性风险"]}, "B2186": {"text": "22）进行基金会计核算并编制基金财务会计报告；", "page": 80, "section": null, "tags": []}, "B2187": {"text": "23）编制季度报告、中期报告和年度报告；", "page": 80, "section": null, "tags": []}, "B2188": {"text": "24）及时复核基金托管人提供的公司行为信息；", "page": 80, "section": null, "tags": []}, "B2189": {"text": "25）严格按照《基金法》 、 《信息披露办法》 、 《试行办法》 、基金合同及其他有关规定，", "page": 80, "section": null, "tags": []}, "B2190": {"text": "履行信息披露及报告义务；", "page": 80, "section": null, "tags": []}, "B2191": {"text": "26） 保守基金商业秘密，不得泄露基金投资计划、投资意向等，除《基金法》 、 《试行办", "page": 80, "section": null, "tags": []}, "B2192": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 81, "section": null, "tags": ["市场风险"]}, "B2193": {"text": "77", "page": 81, "section": null, "tags": []}, "B2194": {"text": "法》和基金合同及其他有关规定另有规定外，在基金信息公开披露前应予保密，不得向他", "page": 81, "section": null, "tags": []}, "B2195": {"text": "人泄露；", "page": 81, "section": null, "tags": []}, "B2196": {"text": "27）按照基金合同的约定确定基金收益分配方案，及时向基金份额持有人分配收益；", "page": 81, "section": null, "tags": []}, "B2197": {"text": "28）依据《基金法》 、 《运作办法》 、基金合同及其他有关规定召集基金份额持有人大会", "page": 81, "section": null, "tags": []}, "B2198": {"text": "或配合基金托管人、基金份额持有人依法召集基金份额持有人大会；", "page": 81, "section": null, "tags": []}, "B2199": {"text": "29）保存基金财产管理业务活动的记录、账册、报表和其他相关资料；", "page": 81, "section": null, "tags": []}, "B2200": {"text": "30） 以基金管理人名义， 代表基金份额持有人利益行使诉讼权利或者实施其他法律行为 ；", "page": 81, "section": null, "tags": []}, "B2201": {"text": "31） 组织并参加基金财产清算小组，参与基金财产的保管、清理、估价、变现和分配；", "page": 81, "section": null, "tags": ["流动性风险"]}, "B2202": {"text": "32）授权投资顾问负责投资决策的，应当在协议中明确投资顾问由于本身差错、疏忽、", "page": 81, "section": null, "tags": []}, "B2203": {"text": "未履行职责等原因而导致财产受损时应当承担相应责任；", "page": 81, "section": null, "tags": []}, "B2204": {"text": "33） 因违反基金合同导致基金财产的损失或损害基金份额持有人合法权益， 应当承担赔", "page": 81, "section": null, "tags": []}, "B2205": {"text": "偿责任，其赔偿责任不因其退任而免除；", "page": 81, "section": null, "tags": []}, "B2206": {"text": "34） 基金托管人违反基金合同造成基金财产损失时， 应为基金份额持有人利益向基金托", "page": 81, "section": null, "tags": []}, "B2207": {"text": "管人追偿；", "page": 81, "section": null, "tags": []}, "B2208": {"text": "35）按规定向基金托管人提供基金份额持有人名册资料；", "page": 81, "section": null, "tags": []}, "B2209": {"text": "36） 面临解散、依法被撤销或者被依法宣告破产时，及时报告中国证监会并通知基金托", "page": 81, "section": null, "tags": []}, "B2210": {"text": "管人；", "page": 81, "section": null, "tags": []}, "B2211": {"text": "37）执行生效的基金份额持有人大会决议；", "page": 81, "section": null, "tags": []}, "B2212": {"text": "38）不从事任何有损基金及其他基金当事人利益的活动；", "page": 81, "section": null, "tags": []}, "B2213": {"text": "39） 依照法律法规为基金的利益对被投资公司行使股东权利， 为基金的利益行使因基金", "page": 81, "section": null, "tags": []}, "B2214": {"text": "财产投资于证券所产生的权利，不谋求对上市公司的控股和直接管理；", "page": 81, "section": null, "tags": []}, "B2215": {"text": "40）法律法规、中国证监会和基金合同规定的其他义务。", "page": 81, "section": null, "tags": []}, "B2216": {"text": "2．基金托管人", "page": 81, "section": null, "tags": []}, "B2217": {"text": "（1）基金托管人基本情况", "page": 81, "section": null, "tags": []}, "B2218": {"text": "名称：中国建设银行股份有限公司(简称：中国建设银行)", "page": 81, "section": null, "tags": []}, "B2219": {"text": "住所：北京市西城区金融大街25号", "page": 81, "section": null, "tags": []}, "B2220": {"text": "办公地址：北京市西城区闹市口大街1号院1号楼", "page": 81, "section": null, "tags": []}, "B2221": {"text": "邮政编码：100033", "page": 81, "section": null, "tags": []}, "B2222": {"text": "法定代表人：田国立", "page": 81, "section": null, "tags": []}, "B2223": {"text": "成立时间：2004年9月17日", "page": 81, "section": null, "tags": []}, "B2224": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 82, "section": null, "tags": ["市场风险"]}, "B2225": {"text": "78", "page": 82, "section": null, "tags": []}, "B2226": {"text": "基金托管业务批准文号：中国证监会证监基字[1998]12号", "page": 82, "section": null, "tags": []}, "B2227": {"text": "经营范围：吸收公众存款；发放短期、中期、长期贷款；办理国内外结算；办理票据承", "page": 82, "section": null, "tags": []}, "B2228": {"text": "兑与贴现；发行金融债券；代理发行、代理兑付、承销政府债券；买卖政府债券、金融债", "page": 82, "section": null, "tags": []}, "B2229": {"text": "券；从事同业拆借；买卖、代理买卖外汇；从事银行卡业务；提供信用证服务及担保；代", "page": 82, "section": null, "tags": ["信用风险"]}, "B2230": {"text": "理收付款项及代理保险业务；提供保管箱服务；经中国银行业监督管理机构等监管部门批", "page": 82, "section": null, "tags": []}, "B2231": {"text": "准的其他业务", "page": 82, "section": null, "tags": []}, "B2232": {"text": "组织形式：股份有限公司", "page": 82, "section": null, "tags": []}, "B2233": {"text": "注册资本：贰仟叁佰叁拾陆亿捌仟玖佰零捌万肆仟元", "page": 82, "section": null, "tags": []}, "B2234": {"text": "存续期间：持续经营", "page": 82, "section": null, "tags": []}, "B2235": {"text": "（2）基金托管人的权利", "page": 82, "section": null, "tags": []}, "B2236": {"text": "1）依基金合同约定获得基金托管费以及法律法规规定或监管部门批准的其他收入；", "page": 82, "section": null, "tags": []}, "B2237": {"text": "2）选择、更换负责境外资产托管业务的境外托管人；", "page": 82, "section": null, "tags": ["汇率与跨境风险"]}, "B2238": {"text": "3）监督基金管理人对本基金的投资运作；", "page": 82, "section": null, "tags": []}, "B2239": {"text": "4）自本基金合同生效之日起，依法保管基金资产；", "page": 82, "section": null, "tags": []}, "B2240": {"text": "5）在基金管理人更换时，提名新任基金管理人；", "page": 82, "section": null, "tags": []}, "B2241": {"text": "6）根据本基金合同及有关规定监督基金管理人，对于基金管理人违反本基金合同或有", "page": 82, "section": null, "tags": []}, "B2242": {"text": "关法律法规规定的行为，对基金资产、其他当事人的利益造成重大损失的情形，应及时呈", "page": 82, "section": null, "tags": []}, "B2243": {"text": "报中国证监会，并采取必要措施保护基金及相关当事人的利益；", "page": 82, "section": null, "tags": []}, "B2244": {"text": "7）依法召集基金份额持有人大会；", "page": 82, "section": null, "tags": []}, "B2245": {"text": "8）按规定取得基金份额持有人名册资料；", "page": 82, "section": null, "tags": []}, "B2246": {"text": "9）法律法规和基金合同规定的其他权利。", "page": 82, "section": null, "tags": []}, "B2247": {"text": "（3）基金托管人的义务", "page": 82, "section": null, "tags": []}, "B2248": {"text": "1）设立专门的基金托管部门，具有符合要求的营业场所，配备足够的、合格的熟悉基", "page": 82, "section": null, "tags": []}, "B2249": {"text": "金托管业务的专职人员，负责基金财产托管事宜；", "page": 82, "section": null, "tags": []}, "B2250": {"text": "2）对所托管的不同基金财产分别设置账户，确保基金财产的完整与独立；", "page": 82, "section": null, "tags": []}, "B2251": {"text": "3） 除依据《基金法》 、 《试行办法》 、基金合同及其他有关规定外，不得为自己及任何第", "page": 82, "section": null, "tags": []}, "B2252": {"text": "三人谋取利益；", "page": 82, "section": null, "tags": []}, "B2253": {"text": "4）保护持有人利益，按照规定对基金日常投资行为和资金汇出入情况实施监督，如发", "page": 82, "section": null, "tags": []}, "B2254": {"text": "现投资指令或资金汇出入违法、违规，应当及时向中国证监会、国家外汇局报告；", "page": 82, "section": null, "tags": []}, "B2255": {"text": "5）安全保管存放于基金托管人处的基金财产，准时将公司行为信息通知基金管理人，", "page": 82, "section": null, "tags": []}, "B2256": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 83, "section": null, "tags": ["市场风险"]}, "B2257": {"text": "79", "page": 83, "section": null, "tags": []}, "B2258": {"text": "确保基金及时收取所有应得收入；", "page": 83, "section": null, "tags": []}, "B2259": {"text": "6）按照规定监督基金管理人的投资运作，确保基金按照有关法律法规和基金合同约定", "page": 83, "section": null, "tags": []}, "B2260": {"text": "的投资目标和限制进行管理；", "page": 83, "section": null, "tags": []}, "B2261": {"text": "7）按照有关法律法规和基金合同的约定执行基金管理人、境外投资顾问的指令，及时", "page": 83, "section": null, "tags": ["汇率与跨境风险"]}, "B2262": {"text": "办理清算、交割事宜；", "page": 83, "section": null, "tags": []}, "B2263": {"text": "8）确保基金的份额净值按照有关法律法规和基金合同规定的方法进行计算；", "page": 83, "section": null, "tags": []}, "B2264": {"text": "9）确保基金按照有关法律法规和基金合同的规定进行申购、认购、赎回等日常交易；", "page": 83, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2265": {"text": "10）确保基金根据有关法律法规和基金合同确定并实施收益分配方案；", "page": 83, "section": null, "tags": []}, "B2266": {"text": "11）按照有关法律法规和基金合同的规定，基金托管人对由基金托管人或其委托的境", "page": 83, "section": null, "tags": []}, "B2267": {"text": "外托管人实际有效控制的证券承担安全保管责任；", "page": 83, "section": null, "tags": []}, "B2268": {"text": "12）每月结束后7个工作日内，向中国证监会和国家外汇局报告基金境外投资情况，", "page": 83, "section": null, "tags": ["汇率与跨境风险"]}, "B2269": {"text": "并按相关规定进行国际收支申报；", "page": 83, "section": null, "tags": []}, "B2270": {"text": "13）安全保管可以承担保管责任的基金资产，开设或委托开设资金账户和证券账户；", "page": 83, "section": null, "tags": []}, "B2271": {"text": "14）办理基金的有关结汇、售汇、收汇、付汇和人民币资金结算业务；", "page": 83, "section": null, "tags": []}, "B2272": {"text": "15）保存基金的资金汇出、汇入、兑换、收汇、付汇、资金往来、委托及成交记录等", "page": 83, "section": null, "tags": []}, "B2273": {"text": "相关资料，其保存的时间应当不少于20年；", "page": 83, "section": null, "tags": []}, "B2274": {"text": "16）保管由基金管理人代表基金签订的与基金有关的重大合同及有关凭证；", "page": 83, "section": null, "tags": []}, "B2275": {"text": "17）保守基金商业秘密，除《基金法》 、 《试行办法》 、基金合同及其他法律法规另有规", "page": 83, "section": null, "tags": []}, "B2276": {"text": "定外，在基金信息公开披露前应予保密，不得向他人泄露；", "page": 83, "section": null, "tags": []}, "B2277": {"text": "18） 对基金财务会计报告、季度报告、中期报告和年度报告出具意见，说明基金管理人", "page": 83, "section": null, "tags": []}, "B2278": {"text": "在各重要方面的运作是否严格按照基金合同的规定进行；如果基金管理人有未执行基金合", "page": 83, "section": null, "tags": []}, "B2279": {"text": "同规定的行为，还应当说明基金托管人是否采取了适当的措施；", "page": 83, "section": null, "tags": []}, "B2280": {"text": "19）保存基金托管业务活动的记录、账册、报表和其他相关资料；", "page": 83, "section": null, "tags": []}, "B2281": {"text": "20）办理与基金托管业务活动有关的信息披露事项；", "page": 83, "section": null, "tags": []}, "B2282": {"text": "21） 复核、审查基金管理人计算的各类基金资产净值、各类基金份额净值和基金份额申", "page": 83, "section": null, "tags": []}, "B2283": {"text": "购、赎回价格；", "page": 83, "section": null, "tags": ["流动性风险"]}, "B2284": {"text": "22）按规定制作相关账册并与基金管理人核对；", "page": 83, "section": null, "tags": []}, "B2285": {"text": "23）依据基金管理人的指令或有关规定向基金份额持有人支付基金收益和赎回款项；", "page": 83, "section": null, "tags": ["流动性风险"]}, "B2286": {"text": "24）按照规定召集基金份额持有人大会或配合基金份额持有人依法自行召集基金份额", "page": 83, "section": null, "tags": []}, "B2287": {"text": "持有人大会；", "page": 83, "section": null, "tags": []}, "B2288": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 84, "section": null, "tags": ["市场风险"]}, "B2289": {"text": "80", "page": 84, "section": null, "tags": []}, "B2290": {"text": "25） 因违反基金合同导致基金财产损失，应对直接损失承担赔偿责任，其赔偿责任不因", "page": 84, "section": null, "tags": []}, "B2291": {"text": "其退任而免除；", "page": 84, "section": null, "tags": []}, "B2292": {"text": "26）选择的境外托管人，应符合《试行办法》第十九条的规定；", "page": 84, "section": null, "tags": ["汇率与跨境风险"]}, "B2293": {"text": "27） 对基金的境外财产，可授权境外托管人代为履行其承担的受托人职责。境外托管人", "page": 84, "section": null, "tags": ["汇率与跨境风险"]}, "B2294": {"text": "在履行职责过程中，因本身过错、疏忽等原因而导致基金财产受损的，托管人应当承担相", "page": 84, "section": null, "tags": []}, "B2295": {"text": "应责任；", "page": 84, "section": null, "tags": []}, "B2296": {"text": "28）基金管理人因违反基金合同造成基金财产损失时，应为基金向基金管理人追偿；", "page": 84, "section": null, "tags": []}, "B2297": {"text": "29）参加基金财产清算小组，参与基金财产的保管、清理、估价、变现和分配；", "page": 84, "section": null, "tags": ["流动性风险"]}, "B2298": {"text": "30） 面临解散、依法被撤销或者被依法宣告破产时，及时报告中国证监会和银行业监督", "page": 84, "section": null, "tags": []}, "B2299": {"text": "管理机构，并通知基金管理人；", "page": 84, "section": null, "tags": []}, "B2300": {"text": "31）执行生效的基金份额持有人大会决议；", "page": 84, "section": null, "tags": []}, "B2301": {"text": "32）不从事任何有损基金及其他基金当事人利益的活动；", "page": 84, "section": null, "tags": []}, "B2302": {"text": "33）保存与基金托管人职责相关的基金份额持有人名册；", "page": 84, "section": null, "tags": []}, "B2303": {"text": "34） 法律法规、 中国证监会和国家外汇局根据审慎监管原则规定的其他职责以及基金合", "page": 84, "section": null, "tags": []}, "B2304": {"text": "同规定的其他义务。", "page": 84, "section": null, "tags": []}, "B2305": {"text": "因基金管理人原因造成基金托管人无法正常履行上述义务， 由基金管理人承担责任， 并", "page": 84, "section": null, "tags": []}, "B2306": {"text": "对造成的基金财产损失承担相关赔偿责任。", "page": 84, "section": null, "tags": []}, "B2307": {"text": "如适用的法律法规和规章制度不再要求托管人履行上述职责的， 托管人按照变更后的相", "page": 84, "section": null, "tags": []}, "B2308": {"text": "关规定履行职责。", "page": 84, "section": null, "tags": []}, "B2309": {"text": "3．基金份额持有人", "page": 84, "section": null, "tags": []}, "B2310": {"text": "（1） 基金份额持有人的权利", "page": 84, "section": null, "tags": []}, "B2311": {"text": "1）分享基金财产收益；", "page": 84, "section": null, "tags": []}, "B2312": {"text": "2）参与分配清算后的剩余基金财产；", "page": 84, "section": null, "tags": []}, "B2313": {"text": "3）依法申请赎回其持有的基金份额；", "page": 84, "section": null, "tags": ["流动性风险"]}, "B2314": {"text": "4）按照规定要求召开基金份额持有人大会；", "page": 84, "section": null, "tags": []}, "B2315": {"text": "5）出席或者委派代表出席基金份额持有人大会，对基金份额持有人大会审议事项行使", "page": 84, "section": null, "tags": []}, "B2316": {"text": "表决权；", "page": 84, "section": null, "tags": []}, "B2317": {"text": "6）查阅或者复制公开披露的基金信息资料；", "page": 84, "section": null, "tags": []}, "B2318": {"text": "7）监督基金管理人的投资运作；", "page": 84, "section": null, "tags": []}, "B2319": {"text": "8）对基金管理人、基金托管人、基金份额销售机构损害其合法权益的行为依法提起诉", "page": 84, "section": null, "tags": []}, "B2320": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 85, "section": null, "tags": ["市场风险"]}, "B2321": {"text": "81", "page": 85, "section": null, "tags": []}, "B2322": {"text": "讼；", "page": 85, "section": null, "tags": []}, "B2323": {"text": "9）法律法规和基金合同规定的其他权利。", "page": 85, "section": null, "tags": []}, "B2324": {"text": "同一基金份额类别每份基金份额具有同等的合法权益。", "page": 85, "section": null, "tags": []}, "B2325": {"text": "（2）基金份额持有人的义务", "page": 85, "section": null, "tags": []}, "B2326": {"text": "1）遵守法律法规、基金合同及其他有关规定；", "page": 85, "section": null, "tags": []}, "B2327": {"text": "2）遵守基金管理人、基金托管人、代销机构和登记结算机构关于开放式基金业务的相", "page": 85, "section": null, "tags": []}, "B2328": {"text": "关规则及规定；", "page": 85, "section": null, "tags": []}, "B2329": {"text": "3）交纳基金认购、申购款项及法律法规和基金合同所规定的费用；", "page": 85, "section": null, "tags": ["机制特有风险"]}, "B2330": {"text": "4）在持有的基金份额范围内，承担基金亏损或者基金合同终止的有限责任；", "page": 85, "section": null, "tags": []}, "B2331": {"text": "5）不从事任何有损基金及其他基金份额持有人合法权益的活动；", "page": 85, "section": null, "tags": []}, "B2332": {"text": "6）执行生效的基金份额持有人大会决议；", "page": 85, "section": null, "tags": []}, "B2333": {"text": "7）返还在基金交易过程中因任何原因，自基金管理人及基金管理人的代理人、基金托", "page": 85, "section": null, "tags": []}, "B2334": {"text": "管人、代销机构、其他基金份额持有人处获得的不当得利；", "page": 85, "section": null, "tags": []}, "B2335": {"text": "8）法律法规和基金合同规定的其他义务。", "page": 85, "section": null, "tags": []}, "B2336": {"text": "1． 基金份额持有人大会由基金份额持有人或基金份额持有人的合法授权代表共同组成。", "page": 85, "section": null, "tags": []}, "B2337": {"text": "基金份额持有人持有的每一基金份额具有同等的投票权。", "page": 85, "section": null, "tags": []}, "B2338": {"text": "2.召开事由", "page": 85, "section": null, "tags": []}, "B2339": {"text": "（1）当出现或需要决定下列事由之一的，经基金管理人、基金托管人提议或代表或持", "page": 85, "section": null, "tags": []}, "B2340": {"text": "有基金份额10%以上(含10%，下同)的基金份额持有人(以基金管理人收到提议当日的基金", "page": 85, "section": null, "tags": []}, "B2341": {"text": "份额计算，下同) 就同一事项提议时，应当召开基金份额持有人大会：", "page": 85, "section": null, "tags": []}, "B2342": {"text": "1)提前终止基金合同；", "page": 85, "section": null, "tags": []}, "B2343": {"text": "2)转换基金运作方式；", "page": 85, "section": null, "tags": []}, "B2344": {"text": "3)变更基金类别；", "page": 85, "section": null, "tags": []}, "B2345": {"text": "4)变更基金投资目标、 投资范围或投资策略 （法律法规和中国证监会另有规定的除外） ；", "page": 85, "section": null, "tags": []}, "B2346": {"text": "5)变更基金份额持有人大会程序；", "page": 85, "section": null, "tags": []}, "B2347": {"text": "6)更换基金管理人、基金托管人；", "page": 85, "section": null, "tags": []}, "B2348": {"text": "7)提高基金管理人、 基金托管人的报酬标准或提高销售服务费率， 但基金合同及法律法", "page": 85, "section": null, "tags": []}, "B2349": {"text": "规要求提高该等报酬标准的除外；", "page": 85, "section": null, "tags": []}, "B2350": {"text": "8)本基金与其他基金的合并；", "page": 85, "section": null, "tags": []}, "B2351": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 86, "section": null, "tags": ["市场风险"]}, "B2352": {"text": "82", "page": 86, "section": null, "tags": []}, "B2353": {"text": "9)对基金合同当事人权利、义务产生重大影响的其他事项；", "page": 86, "section": null, "tags": []}, "B2354": {"text": "10)法律法规、基金合同或中国证监会规定的其他情形。", "page": 86, "section": null, "tags": []}, "B2355": {"text": "（2）出现以下情形之一的，可由基金管理人和基金托管人协商后修改基金合同，不需", "page": 86, "section": null, "tags": []}, "B2356": {"text": "召开基金份额持有人大会：", "page": 86, "section": null, "tags": []}, "B2357": {"text": "1)调低基金管理费、基金托管费和其他应由基金承担的费用；", "page": 86, "section": null, "tags": []}, "B2358": {"text": "2)在法律法规和本基金合同规定的范围内变更基金的申购费率、赎回费率和调低销售", "page": 86, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2359": {"text": "服务费率或变更收费方式；", "page": 86, "section": null, "tags": []}, "B2360": {"text": "3）经中国证监会允许，基金推出新业务或服务；", "page": 86, "section": null, "tags": []}, "B2361": {"text": "4） 经中国证监会允许，基金管理人、登记结算机构、代销机构在法律法规规定的范围", "page": 86, "section": null, "tags": []}, "B2362": {"text": "内调整有关基金认购、申购、赎回、转换、非交易过户、转托管等业务的规则；", "page": 86, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2363": {"text": "5）在不违反法律法规规定的情况下，接受其它币种的申购、赎回；", "page": 86, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B2364": {"text": "6)因相应的法律法规发生变动必须对基金合同进行修改；", "page": 86, "section": null, "tags": []}, "B2365": {"text": "7)对基金合同的修改不涉及本基金合同当事人权利义务关系发生重大变化；", "page": 86, "section": null, "tags": []}, "B2366": {"text": "8)基金合同的修改对基金份额持有人利益无实质性不利影响；", "page": 86, "section": null, "tags": []}, "B2367": {"text": "9)按照法律法规或本基金合同规定不需召开基金份额持有人大会的其他情形。", "page": 86, "section": null, "tags": []}, "B2368": {"text": "3.召集人和召集方式", "page": 86, "section": null, "tags": []}, "B2369": {"text": "（1）除法律法规或本基金合同另有约定外，基金份额持有人大会由基金管理人召集。", "page": 86, "section": null, "tags": []}, "B2370": {"text": "基金管理人未按规定召集或者不能召集时，由基金托管人召集。", "page": 86, "section": null, "tags": []}, "B2371": {"text": "（2）基金托管人认为有必要召开基金份额持有人大会的，应当向基金管理人提出书面", "page": 86, "section": null, "tags": []}, "B2372": {"text": "提议。基金管理人应当自收到书面提议之日起10日内决定是否召集，并书面告知基金托管", "page": 86, "section": null, "tags": []}, "B2373": {"text": "人。基金管理人决定召集的，应当自出具书面决定之日起60日内召开；基金管理人决定不", "page": 86, "section": null, "tags": []}, "B2374": {"text": "召集，基金托管人仍认为有必要召开的，应当自行召集。", "page": 86, "section": null, "tags": []}, "B2375": {"text": "（3） 代表基金份额10%以上的基金份额持有人认为有必要召开基金份额持有人大会的，", "page": 86, "section": null, "tags": []}, "B2376": {"text": "应当向基金管理人提出书面提议。基金管理人应当自收到书面提议之日起10日内决定是否", "page": 86, "section": null, "tags": []}, "B2377": {"text": "召集，并书面告知提出提议的基金份额持有人代表和基金托管人。基金管理人决定召集的，", "page": 86, "section": null, "tags": []}, "B2378": {"text": "应当自出具书面决定之日起60日内召开；基金管理人决定不召集，代表基金份额10%以上", "page": 86, "section": null, "tags": []}, "B2379": {"text": "的基金份额持有人仍认为有必要召开的，应当向基金托管人提出书面提议。基金托管人应", "page": 86, "section": null, "tags": []}, "B2380": {"text": "当自收到书面提议之日起10日内决定是否召集，并书面告知提出提议的基金份额持有人代", "page": 86, "section": null, "tags": []}, "B2381": {"text": "表和基金管理人；基金托管人决定召集的，应当自出具书面决定之日起60日内召开。", "page": 86, "section": null, "tags": []}, "B2382": {"text": "（4）代表基金份额10%以上的基金份额持有人就同一事项要求召开基金份额持有人大", "page": 86, "section": null, "tags": []}, "B2383": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 87, "section": null, "tags": ["市场风险"]}, "B2384": {"text": "83", "page": 87, "section": null, "tags": []}, "B2385": {"text": "会，而基金管理人、基金托管人都不召集的，代表基金份额10%以上的基金份额持有人有权", "page": 87, "section": null, "tags": []}, "B2386": {"text": "自行召集基金份额持有人大会，但应当至少提前30日向中国证监会备案。", "page": 87, "section": null, "tags": []}, "B2387": {"text": "（5）基金份额持有人依法自行召集基金份额持有人大会的，基金管理人、基金托管人", "page": 87, "section": null, "tags": []}, "B2388": {"text": "应当配合，不得阻碍、干扰。", "page": 87, "section": null, "tags": []}, "B2389": {"text": "4.召开基金份额持有人大会的通知时间、通知内容、通知方式", "page": 87, "section": null, "tags": []}, "B2390": {"text": "（1）基金份额持有人大会的召集人(以下简称“召集人”)负责选择确定开会时间、地", "page": 87, "section": null, "tags": []}, "B2391": {"text": "点、方式和权益登记日。召开基金份额持有人大会，召集人必须于会议召开日前30天在指", "page": 87, "section": null, "tags": []}, "B2392": {"text": "定媒介公告。基金份额持有人大会通知须至少载明以下内容：", "page": 87, "section": null, "tags": []}, "B2393": {"text": "1)会议召开的时间、地点和出席方式；", "page": 87, "section": null, "tags": []}, "B2394": {"text": "2)会议拟审议的主要事项；", "page": 87, "section": null, "tags": []}, "B2395": {"text": "3)会议形式；", "page": 87, "section": null, "tags": []}, "B2396": {"text": "4)议事程序；", "page": 87, "section": null, "tags": []}, "B2397": {"text": "5)有权出席基金份额持有人大会的基金份额持有人权益登记日；", "page": 87, "section": null, "tags": []}, "B2398": {"text": "6)代理投票的授权委托书的内容要求(包括但不限于代理人身份、 代理权限和代理有效", "page": 87, "section": null, "tags": []}, "B2399": {"text": "期限等)、送达时间和地点；", "page": 87, "section": null, "tags": []}, "B2400": {"text": "7)表决方式；", "page": 87, "section": null, "tags": []}, "B2401": {"text": "8)会务常设联系人姓名、电话；", "page": 87, "section": null, "tags": []}, "B2402": {"text": "9)出席会议者必须准备的文件和必须履行的手续；", "page": 87, "section": null, "tags": []}, "B2403": {"text": "10)召集人需要通知的其他事项。", "page": 87, "section": null, "tags": []}, "B2404": {"text": "（2） 采用通讯方式开会并进行表决的情况下， 由召集人决定通讯方式和书面表决方式，", "page": 87, "section": null, "tags": []}, "B2405": {"text": "并在会议通知中说明本次基金份额持有人大会所采取的具体通讯方式、委托的公证机关及", "page": 87, "section": null, "tags": []}, "B2406": {"text": "其联系方式和联系人、书面表决意见寄交的截止时间和收取方式。", "page": 87, "section": null, "tags": []}, "B2407": {"text": "（3）如召集人为基金管理人，还应另行书面通知基金托管人到指定地点对书面表决意", "page": 87, "section": null, "tags": []}, "B2408": {"text": "见的计票进行监督；如召集人为基金托管人，则应另行书面通知基金管理人到指定地点对", "page": 87, "section": null, "tags": []}, "B2409": {"text": "书面表决意见的计票进行监督；如召集人为基金份额持有人，则应另行书面通知基金管理", "page": 87, "section": null, "tags": []}, "B2410": {"text": "人和基金托管人到指定地点对书面表决意见的计票进行监督。基金管理人或基金托管人拒", "page": 87, "section": null, "tags": []}, "B2411": {"text": "不派代表对书面表决意见的计票进行监督的，不影响计票和表决结果。", "page": 87, "section": null, "tags": []}, "B2412": {"text": "5.基金份额持有人出席会议的方式", "page": 87, "section": null, "tags": []}, "B2413": {"text": "（1）会议方式", "page": 87, "section": null, "tags": []}, "B2414": {"text": "1)基金份额持有人大会的召开方式包括现场开会和通讯方式开会。", "page": 87, "section": null, "tags": []}, "B2415": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 88, "section": null, "tags": ["市场风险"]}, "B2416": {"text": "84", "page": 88, "section": null, "tags": []}, "B2417": {"text": "2)会议的召开方式由会议召集人确定，但更换基金管理人和基金托管人必须以现场开", "page": 88, "section": null, "tags": []}, "B2418": {"text": "会方式召开。", "page": 88, "section": null, "tags": []}, "B2419": {"text": "3)现场开会由基金份额持有人本人出席或通过授权委托书委派其代理人出席，现场开", "page": 88, "section": null, "tags": []}, "B2420": {"text": "会时基金管理人和基金托管人的授权代表应当出席，如基金管理人或基金托管人拒不派代", "page": 88, "section": null, "tags": []}, "B2421": {"text": "表出席的，不影响表决效力。", "page": 88, "section": null, "tags": []}, "B2422": {"text": "4)通讯方式开会指按照本基金合同的相关规定以通讯的书面方式进行表决。", "page": 88, "section": null, "tags": []}, "B2423": {"text": "5)会议的召开方式由召集人确定，但决定转换基金运作方式、基金管理人更换或基金", "page": 88, "section": null, "tags": []}, "B2424": {"text": "托管人更换、提前终止基金合同的事宜必须以现场开会方式召开基金份额持有人大会。", "page": 88, "section": null, "tags": []}, "B2425": {"text": "（2）召开基金份额持有人大会的条件", "page": 88, "section": null, "tags": []}, "B2426": {"text": "1)现场开会方式", "page": 88, "section": null, "tags": []}, "B2427": {"text": "在同时符合以下条件时，现场会议方可举行：", "page": 88, "section": null, "tags": []}, "B2428": {"text": "A．对到会者在权益登记日持有基金份额的统计显示，全部有效凭证所对应的基金份额", "page": 88, "section": null, "tags": []}, "B2429": {"text": "应占权益登记日基金总份额的50%以上(含50%，下同)；", "page": 88, "section": null, "tags": []}, "B2430": {"text": "B．到会的基金份额持有人身份证明及持有基金份额的凭证、代理人身份证明、委托人", "page": 88, "section": null, "tags": []}, "B2431": {"text": "持有基金份额的凭证及授权委托代理手续完备，到会者出具的相关文件符合有关法律法规", "page": 88, "section": null, "tags": []}, "B2432": {"text": "和基金合同及会议通知的规定，并且持有基金份额的凭证与基金管理人持有的注册登记资", "page": 88, "section": null, "tags": []}, "B2433": {"text": "料相符。", "page": 88, "section": null, "tags": []}, "B2434": {"text": "未能满足上述条件的情况下， 则召集人可另行确定并公告重新开会的时间(至少应在25", "page": 88, "section": null, "tags": []}, "B2435": {"text": "个工作日后)和地点，但确定有权出席会议的基金份额持有人资格的权益登记日不变。", "page": 88, "section": null, "tags": []}, "B2436": {"text": "2)通讯开会方式", "page": 88, "section": null, "tags": []}, "B2437": {"text": "在同时符合以下条件时，通讯会议方可举行：", "page": 88, "section": null, "tags": []}, "B2438": {"text": "A．召集人按本基金合同规定公布会议通知后，在2个工作日内连续公布相关提示性公", "page": 88, "section": null, "tags": []}, "B2439": {"text": "告；", "page": 88, "section": null, "tags": []}, "B2440": {"text": "B．召集人按基金合同规定通知基金托管人或/和基金管理人(分别或共同称为“监督", "page": 88, "section": null, "tags": []}, "B2441": {"text": "人”)到指定地点对书面表决意见的计票进行监督；", "page": 88, "section": null, "tags": []}, "B2442": {"text": "C．召集人在监督人和公证机关的监督下按照会议通知规定的方式收取和统计基金份额", "page": 88, "section": null, "tags": []}, "B2443": {"text": "持有人的书面表决意见，如基金管理人或基金托管人经通知拒不到场监督的，不影响表决", "page": 88, "section": null, "tags": []}, "B2444": {"text": "效力；", "page": 88, "section": null, "tags": []}, "B2445": {"text": "D．本人直接出具书面意见或授权他人代表出具书面意见的基金份额持有人所代表的基", "page": 88, "section": null, "tags": []}, "B2446": {"text": "金份额占权益登记日基金总份额的50%以上；", "page": 88, "section": null, "tags": []}, "B2447": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 89, "section": null, "tags": ["市场风险"]}, "B2448": {"text": "85", "page": 89, "section": null, "tags": []}, "B2449": {"text": "E.直接出具书面意见的基金份额持有人或受托代表他人出具书面意见的代理人提交的", "page": 89, "section": null, "tags": []}, "B2450": {"text": "持有基金份额的凭证、授权委托书等文件符合法律法规、基金合同和会议通知的规定，并", "page": 89, "section": null, "tags": []}, "B2451": {"text": "与登记结算机构记录相符。", "page": 89, "section": null, "tags": []}, "B2452": {"text": "如果开会条件达不到上述的条件，则召集人可另行确定并公告重新表决的时间(至少应", "page": 89, "section": null, "tags": []}, "B2453": {"text": "在25个工作日后)，且确定有权出席会议的基金份额持有人资格的权益登记日不变。", "page": 89, "section": null, "tags": []}, "B2454": {"text": "3) 在法律法规或监管机构允许的情况下，经会议通知载明，基金份额持有人也可以采", "page": 89, "section": null, "tags": []}, "B2455": {"text": "用网络、电话或其他方式进行表决，或者采用网络、电话或其他方式授权他人代为出席会", "page": 89, "section": null, "tags": []}, "B2456": {"text": "议并表决。", "page": 89, "section": null, "tags": []}, "B2457": {"text": "6.议事内容与程序", "page": 89, "section": null, "tags": []}, "B2458": {"text": "（1）议事内容及提案权", "page": 89, "section": null, "tags": []}, "B2459": {"text": "1)议事内容为本基金合同规定的召开基金份额持有人大会事由所涉及的内容。", "page": 89, "section": null, "tags": []}, "B2460": {"text": "2)基金管理人、基金托管人、单独或合并持有权益登记日本基金总份额10%以上的基", "page": 89, "section": null, "tags": []}, "B2461": {"text": "金份额持有人可以在大会召集人发出会议通知前就召开事由向大会召集人提交需由基金份", "page": 89, "section": null, "tags": []}, "B2462": {"text": "额持有人大会审议表决的提案；也可以在会议通知发出后向大会召集人提交临时提案，临", "page": 89, "section": null, "tags": []}, "B2463": {"text": "时提案应当在大会召开日前35日提交召集人。 召集人对于临时提案应当在大会召开日前30", "page": 89, "section": null, "tags": []}, "B2464": {"text": "日公告。 否则， 会议的召开日期应当顺延并保证至少与临时提案公告日期有30日的间隔期。", "page": 89, "section": null, "tags": []}, "B2465": {"text": "3)对于基金份额持有人提交的提案，大会召集人应当按照以下原则对提案进行审核：", "page": 89, "section": null, "tags": []}, "B2466": {"text": "关联性。 大会召集人对于基金份额持有人提案涉及事项与基金有直接关系， 并且不超出", "page": 89, "section": null, "tags": []}, "B2467": {"text": "法律法规和基金合同规定的基金份额持有人大会职权范围的，应提交大会审议；对于不符", "page": 89, "section": null, "tags": []}, "B2468": {"text": "合上述要求的，不提交基金份额持有人大会审议。如果召集人决定不将基金份额持有人提", "page": 89, "section": null, "tags": []}, "B2469": {"text": "案提交大会表决，应当在该次基金份额持有人大会上进行解释和说明。", "page": 89, "section": null, "tags": []}, "B2470": {"text": "程序性。 大会召集人可以对基金份额持有人的提案涉及的程序性问题做出决定。 如将其", "page": 89, "section": null, "tags": []}, "B2471": {"text": "提案进行分拆或合并表决，需征得原提案人同意；原提案人不同意变更的，大会主持人可", "page": 89, "section": null, "tags": []}, "B2472": {"text": "以就程序性问题提请基金份额持有人大会做出决定，并按照基金份额持有人大会决定的程", "page": 89, "section": null, "tags": []}, "B2473": {"text": "序进行审议。", "page": 89, "section": null, "tags": []}, "B2474": {"text": "4)单独或合并持有权利登记日基金总份额10％以上的基金份额持有人提交基金份额", "page": 89, "section": null, "tags": []}, "B2475": {"text": "持有人大会审议表决的提案，基金管理人或基金托管人提交基金份额持有人大会审议表决", "page": 89, "section": null, "tags": []}, "B2476": {"text": "的提案，未获基金份额持有人大会审议通过，就同一提案再次提请基金份额持有人大会审", "page": 89, "section": null, "tags": []}, "B2477": {"text": "议，其时间间隔不少于6个月。法律法规另有规定的除外。", "page": 89, "section": null, "tags": []}, "B2478": {"text": "5)基金份额持有人大会的召集人发出召开会议的通知后，如果需要对原有提案进行修", "page": 89, "section": null, "tags": []}, "B2479": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 90, "section": null, "tags": ["市场风险"]}, "B2480": {"text": "86", "page": 90, "section": null, "tags": []}, "B2481": {"text": "改，应当在基金份额持有人大会召开前30日及时公告。否则，会议的召开日期应当顺延并", "page": 90, "section": null, "tags": []}, "B2482": {"text": "保证至少与公告日期有30日的间隔期。", "page": 90, "section": null, "tags": []}, "B2483": {"text": "（2）议事程序", "page": 90, "section": null, "tags": []}, "B2484": {"text": "1)现场开会", "page": 90, "section": null, "tags": []}, "B2485": {"text": "在现场开会的方式下，首先由大会主持人按照规定程序宣布会议议事程序及注意事项，", "page": 90, "section": null, "tags": []}, "B2486": {"text": "确定和公布监票人，然后由大会主持人宣读提案，经讨论后进行表决，经合法执业的律师", "page": 90, "section": null, "tags": []}, "B2487": {"text": "见证后形成大会决议。", "page": 90, "section": null, "tags": []}, "B2488": {"text": "大会由召集人授权代表主持。 基金管理人为召集人的， 其授权代表未能主持大会的情况", "page": 90, "section": null, "tags": []}, "B2489": {"text": "下，由基金托管人授权代表主持；基金托管人为召集人的，其授权代表未能主持大会的情", "page": 90, "section": null, "tags": []}, "B2490": {"text": "况下，由基金管理人授权代表主持；如果基金管理人和基金托管人授权代表均未能主持大", "page": 90, "section": null, "tags": []}, "B2491": {"text": "会， 则由出席大会的基金份额持有人和代理人以所代表的基金份额50%以上多数选举产生一", "page": 90, "section": null, "tags": []}, "B2492": {"text": "名代表作为该次基金份额持有人大会的主持人。", "page": 90, "section": null, "tags": []}, "B2493": {"text": "召集人应当制作出席会议人员的签名册。签名册载明参加会议人员姓名(或单位名称)、", "page": 90, "section": null, "tags": []}, "B2494": {"text": "身份证号码、持有或代表有表决权的基金份额数量、委托人姓名(或单位名称)等事项。", "page": 90, "section": null, "tags": []}, "B2495": {"text": "2)通讯方式开会", "page": 90, "section": null, "tags": []}, "B2496": {"text": "在通讯表决开会的方式下，首先由召集人提前30日公布提案，在所通知的表决截止日", "page": 90, "section": null, "tags": []}, "B2497": {"text": "期后第2个工作日在公证机关及监督人的监督下由召集人统计全部有效表决并形成决议。", "page": 90, "section": null, "tags": []}, "B2498": {"text": "如监督人经通知但拒绝到场监督，则在公证机关监督下形成的决议有效。", "page": 90, "section": null, "tags": []}, "B2499": {"text": "（3）基金份额持有人大会不得对未事先公告的议事内容进行表决。", "page": 90, "section": null, "tags": []}, "B2500": {"text": "7.决议形成的条件、表决方式、程序", "page": 90, "section": null, "tags": []}, "B2501": {"text": "（1）基金份额持有人所持每一基金份额享有平等的表决权。", "page": 90, "section": null, "tags": []}, "B2502": {"text": "（2）基金份额持有人大会决议分为一般决议和特别决议：", "page": 90, "section": null, "tags": []}, "B2503": {"text": "1)一般决议", "page": 90, "section": null, "tags": []}, "B2504": {"text": "一般决议须经出席会议的基金份额持有人(或其代理人)所持表决权的50%以上通过方", "page": 90, "section": null, "tags": []}, "B2505": {"text": "为有效，除下列2)所规定的须以特别决议通过事项以外的其他事项均以一般决议的方式通", "page": 90, "section": null, "tags": []}, "B2506": {"text": "过；", "page": 90, "section": null, "tags": []}, "B2507": {"text": "2)特别决议", "page": 90, "section": null, "tags": []}, "B2508": {"text": "特别决议须经出席会议的基金份额持有人(或其代理人)所持表决权的三分之二以上(含", "page": 90, "section": null, "tags": []}, "B2509": {"text": "三分之二)通过方为有效；涉及更换基金管理人、更换基金托管人、转换基金运作方式、提", "page": 90, "section": null, "tags": []}, "B2510": {"text": "前终止基金合同等重大事项必须以特别决议通过方为有效。", "page": 90, "section": null, "tags": []}, "B2511": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 91, "section": null, "tags": ["市场风险"]}, "B2512": {"text": "87", "page": 91, "section": null, "tags": []}, "B2513": {"text": "（3）基金份额持有人大会决定的事项，应当依法报中国证监会核准或者备案，并予以", "page": 91, "section": null, "tags": []}, "B2514": {"text": "公告。", "page": 91, "section": null, "tags": []}, "B2515": {"text": "（4）采取通讯方式进行表决时，除非在计票时有充分的相反证据证明，否则表面符合", "page": 91, "section": null, "tags": []}, "B2516": {"text": "法律法规和会议通知规定的书面表决意见即视为有效的表决，表决意见模糊不清或相互矛", "page": 91, "section": null, "tags": []}, "B2517": {"text": "盾的视为弃权表决，但应当计入出具书面意见的基金份额持有人所代表的基金份额总数。", "page": 91, "section": null, "tags": []}, "B2518": {"text": "（5）基金份额持有人大会采取记名方式进行投票表决。", "page": 91, "section": null, "tags": []}, "B2519": {"text": "（6）基金份额持有人大会的各项提案或同一项提案内并列的各项议题应当分开审议、", "page": 91, "section": null, "tags": []}, "B2520": {"text": "逐项表决。", "page": 91, "section": null, "tags": []}, "B2521": {"text": "8.计票", "page": 91, "section": null, "tags": []}, "B2522": {"text": "（1）现场开会", "page": 91, "section": null, "tags": []}, "B2523": {"text": "1)如基金份额持有人大会由基金管理人或基金托管人召集，则基金份额持有人大会的", "page": 91, "section": null, "tags": []}, "B2524": {"text": "主持人应当在会议开始后宣布在出席会议的基金份额持有人和代理人中推举两名基金份额", "page": 91, "section": null, "tags": []}, "B2525": {"text": "持有人代表与大会召集人授权的一名监督员共同担任监票人；如大会由基金份额持有人自", "page": 91, "section": null, "tags": []}, "B2526": {"text": "行召集，基金份额持有人大会的主持人应当在会议开始后宣布在出席会议的基金份额持有", "page": 91, "section": null, "tags": []}, "B2527": {"text": "人和代理人中推举两名基金份额持有人代表与基金管理人、基金托管人授权的一名监督员", "page": 91, "section": null, "tags": []}, "B2528": {"text": "共同担任监票人；但如果基金管理人和基金托管人的授权代表未出席，则大会主持人可自", "page": 91, "section": null, "tags": []}, "B2529": {"text": "行选举三名基金份额持有人代表担任监票人。", "page": 91, "section": null, "tags": []}, "B2530": {"text": "2)监票人应当在基金份额持有人表决后立即进行清点，由大会主持人当场公布计票结", "page": 91, "section": null, "tags": []}, "B2531": {"text": "果。", "page": 91, "section": null, "tags": []}, "B2532": {"text": "3)如大会主持人对于提交的表决结果有异议，可以对投票数进行重新清点；如大会主", "page": 91, "section": null, "tags": []}, "B2533": {"text": "持人未进行重新清点，而出席大会的基金份额持有人或代理人对大会主持人宣布的表决结", "page": 91, "section": null, "tags": []}, "B2534": {"text": "果有异议，其有权在宣布表决结果后立即要求重新清点，大会主持人应当立即重新清点并", "page": 91, "section": null, "tags": []}, "B2535": {"text": "公布重新清点结果。重新清点仅限一次。", "page": 91, "section": null, "tags": []}, "B2536": {"text": "4)计票过程应由公证机关予以公证。", "page": 91, "section": null, "tags": []}, "B2537": {"text": "（2）通讯方式开会", "page": 91, "section": null, "tags": []}, "B2538": {"text": "在通讯方式开会的情况下，计票方式为 ： 由大会召集人授权的两名监票人在监督人派出", "page": 91, "section": null, "tags": []}, "B2539": {"text": "的授权代表的监督下进行计票，并由公证机关对其计票过程予以公证；如监督人经通知但", "page": 91, "section": null, "tags": []}, "B2540": {"text": "拒绝到场监督，则大会召集人可自行授权3名监票人进行计票，并由公证机关对其计票过", "page": 91, "section": null, "tags": []}, "B2541": {"text": "程予以公证。", "page": 91, "section": null, "tags": []}, "B2542": {"text": "9.基金份额持有人大会决议报中国证监会核准或备案后的公告时间、方式", "page": 91, "section": null, "tags": []}, "B2543": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 92, "section": null, "tags": ["市场风险"]}, "B2544": {"text": "88", "page": 92, "section": null, "tags": []}, "B2545": {"text": "（1）基金份额持有人大会通过的一般决议和特别决议，召集人应当自通过之日起5日", "page": 92, "section": null, "tags": []}, "B2546": {"text": "内报中国证监会核准或者备案。基金份额持有人大会决定的事项自中国证监会依法核准或", "page": 92, "section": null, "tags": []}, "B2547": {"text": "者出具无异议意见之日起生效。关于本章第(二)条所规定的第(1)-(8)项召开事由的基金份", "page": 92, "section": null, "tags": []}, "B2548": {"text": "额持有人大会决议经中国证监会核准生效后方可执行，关于本章第2条所规定的第9)、10)", "page": 92, "section": null, "tags": []}, "B2549": {"text": "项召开事由的基金份额持有人大会决议经中国证监会核准或出具无异议意见后方可执行。", "page": 92, "section": null, "tags": []}, "B2550": {"text": "（2）生效的基金份额持有人大会决议对全体基金份额持有人、基金管理人、基金托管", "page": 92, "section": null, "tags": []}, "B2551": {"text": "人均有约束力。基金管理人、基金托管人和基金份额持有人应当执行生效的基金份额持有", "page": 92, "section": null, "tags": []}, "B2552": {"text": "人大会决议。", "page": 92, "section": null, "tags": []}, "B2553": {"text": "（3）基金份额持有人大会决议应自生效之日起2日内在指定媒介公告。如果采用通讯", "page": 92, "section": null, "tags": []}, "B2554": {"text": "方式进行表决，在公告基金份额持有人大会决议时，必须将公证书全文、公证机构、公证", "page": 92, "section": null, "tags": []}, "B2555": {"text": "员姓名等一同公告。", "page": 92, "section": null, "tags": []}, "B2556": {"text": "10.法律法规或监管部门对基金份额持有人大会另有规定的，从其规定。", "page": 92, "section": null, "tags": []}, "B2557": {"text": "1．基金利润的构成", "page": 92, "section": null, "tags": []}, "B2558": {"text": "基金利润指基金利息收入、 投资收益、 公允价值变动收益和其他收入扣除相关基金费用", "page": 92, "section": null, "tags": []}, "B2559": {"text": "后的余额；基金已实现收益指基金利润减去公允价值变动收益后的余额。", "page": 92, "section": null, "tags": []}, "B2560": {"text": "2.基金可供分配利润", "page": 92, "section": null, "tags": []}, "B2561": {"text": "基金可供分配利润指截至收益分配基准日 （即可供分配利润计算截止日） 基金未分配利", "page": 92, "section": null, "tags": []}, "B2562": {"text": "润与未分配利润中已实现收益的孰低数。", "page": 92, "section": null, "tags": []}, "B2563": {"text": "3.收益分配原则", "page": 92, "section": null, "tags": []}, "B2564": {"text": "本基金收益分配应遵循下列原则：", "page": 92, "section": null, "tags": []}, "B2565": {"text": "（1）本基金同一类别的每份基金份额享有同等分配权，但由于本基金A类人民币份额", "page": 92, "section": null, "tags": []}, "B2566": {"text": "和A类美元份额不收取销售服务费，而C类人民币份额收取销售服务费，各基金份额类别", "page": 92, "section": null, "tags": []}, "B2567": {"text": "对应的可供分配利润将有所不同；", "page": 92, "section": null, "tags": []}, "B2568": {"text": "（2）收益分配时所发生的银行转账或其他手续费用由投资人自行承担。当投资人的现", "page": 92, "section": null, "tags": []}, "B2569": {"text": "金红利小于一定金额，不足以支付银行转账或其他手续费用时，基金注册登记机构可将投", "page": 92, "section": null, "tags": []}, "B2570": {"text": "资人的现金红利按除息日对应份额类别的基金份额净值自动转为基金份额；", "page": 92, "section": null, "tags": []}, "B2571": {"text": "（3）在符合有关基金分红条件的前提下，本基金收益每年最多分配6次，每次基金收", "page": 92, "section": null, "tags": []}, "B2572": {"text": "益分配比例不低于收益分配基准日可供分配利润的10%；", "page": 92, "section": null, "tags": []}, "B2573": {"text": "（4）若基金合同生效不满3个月则可不进行收益分配；", "page": 92, "section": null, "tags": []}, "B2574": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 93, "section": null, "tags": ["市场风险"]}, "B2575": {"text": "89", "page": 93, "section": null, "tags": []}, "B2576": {"text": "（5） 本基金收益分配方式分为现金分红，A类美元份额以美元进行现金分红，A类人民", "page": 93, "section": null, "tags": []}, "B2577": {"text": "币份额和C类人民币份额以人民币进行现金分红；", "page": 93, "section": null, "tags": []}, "B2578": {"text": "（6）基金红利发放日距离收益分配基准日（即可供分配利润计算截止日）的时间不得", "page": 93, "section": null, "tags": []}, "B2579": {"text": "超过15个工作日；", "page": 93, "section": null, "tags": []}, "B2580": {"text": "（7）基金收益分配后每一人民币份额的基金份额净值不能低于面值，即基金收益分配", "page": 93, "section": null, "tags": []}, "B2581": {"text": "基准日A类人民币份额和C类人民币份额的基金份额净值减去每单位基金份额收益分配金", "page": 93, "section": null, "tags": []}, "B2582": {"text": "额后不能低于面值；对于A类美元份额，由于汇率因素影响，存在收益分配后A类美元份", "page": 93, "section": null, "tags": ["汇率与跨境风险"]}, "B2583": {"text": "额的基金份额净值低于对应的基金份额面值的可能；", "page": 93, "section": null, "tags": []}, "B2584": {"text": "（8）法律法规或监管机构另有规定的从其规定。", "page": 93, "section": null, "tags": []}, "B2585": {"text": "4.收益分配方案", "page": 93, "section": null, "tags": []}, "B2586": {"text": "基金收益分配方案中应载明收益分配基准日 （即可供分配利润计算截止日） 以及该日的", "page": 93, "section": null, "tags": []}, "B2587": {"text": "可供分配利润、基金收益分配对象、分配原则、分配时间、分配数额及比例、分配方式、", "page": 93, "section": null, "tags": []}, "B2588": {"text": "支付方式等内容。", "page": 93, "section": null, "tags": []}, "B2589": {"text": "5.收益分配的时间和程序", "page": 93, "section": null, "tags": []}, "B2590": {"text": "（1） 基金收益分配方案由基金管理人拟订，由基金托管人复核，依照《信息披露办法》", "page": 93, "section": null, "tags": []}, "B2591": {"text": "的有关规定在指定媒介上公告；", "page": 93, "section": null, "tags": []}, "B2592": {"text": "（2）在收益分配方案公布后，基金管理人依据具体方案的规定就支付的现金红利向基", "page": 93, "section": null, "tags": []}, "B2593": {"text": "金托管人发送划款指令，基金托管人按照基金管理人的指令及时进行分红资金的划付。", "page": 93, "section": null, "tags": []}, "B2594": {"text": "（3）法律法规或监管机关另有规定的，从其规定。", "page": 93, "section": null, "tags": []}, "B2595": {"text": "6.分红方式的设置与变更", "page": 93, "section": null, "tags": []}, "B2596": {"text": "具体规则在招募说明书中列示。", "page": 93, "section": null, "tags": []}, "B2597": {"text": "1．基金费用的种类", "page": 93, "section": null, "tags": []}, "B2598": {"text": "（1）基金管理人的管理费，含境外投资顾问收取的费用；", "page": 93, "section": null, "tags": ["汇率与跨境风险"]}, "B2599": {"text": "（2）基金托管人的托管费，含境外托管代理行收取的费用；", "page": 93, "section": null, "tags": ["汇率与跨境风险"]}, "B2600": {"text": "（3）从C类人民币份额的基金财产中计提的销售服务费；", "page": 93, "section": null, "tags": []}, "B2601": {"text": "（4）标的指数许可使用费", "page": 93, "section": null, "tags": ["市场风险"]}, "B2602": {"text": "（5）基金财产拨划支付的银行费用；", "page": 93, "section": null, "tags": []}, "B2603": {"text": "（6）基金合同生效后的基金信息披露费用；", "page": 93, "section": null, "tags": []}, "B2604": {"text": "（7）基金份额持有人大会费用；", "page": 93, "section": null, "tags": []}, "B2605": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 94, "section": null, "tags": ["市场风险"]}, "B2606": {"text": "90", "page": 94, "section": null, "tags": []}, "B2607": {"text": "（8）基金合同生效后与基金有关的会计师费和律师费；", "page": 94, "section": null, "tags": []}, "B2608": {"text": "（9）基金的证券交易费用；", "page": 94, "section": null, "tags": []}, "B2609": {"text": "（10）基金上市费及年费；", "page": 94, "section": null, "tags": []}, "B2610": {"text": "（11）外汇兑换交易的相关费用；", "page": 94, "section": null, "tags": []}, "B2611": {"text": "（12）依法可以在基金财产中列支的其他费用。", "page": 94, "section": null, "tags": []}, "B2612": {"text": "2.上述基金费用由基金管理人在法律规定的范围内参照公允的市场价格确定， 法律法规", "page": 94, "section": null, "tags": []}, "B2613": {"text": "另有规定时从其规定。", "page": 94, "section": null, "tags": []}, "B2614": {"text": "3.基金费用计提方法、计提标准和支付方式", "page": 94, "section": null, "tags": []}, "B2615": {"text": "（1）基金管理人的管理费", "page": 94, "section": null, "tags": []}, "B2616": {"text": "在通常情况下，基金管理费按前一日基金资产净值的1.0%年费率计提。计算方法如下 ：", "page": 94, "section": null, "tags": []}, "B2617": {"text": "H＝E×1.0%÷当年天数", "page": 94, "section": null, "tags": []}, "B2618": {"text": "H为每日应计提的基金管理费", "page": 94, "section": null, "tags": []}, "B2619": {"text": "E为前一日基金资产净值", "page": 94, "section": null, "tags": []}, "B2620": {"text": "基金管理费每日计提， 按月支付。 由基金管理人向基金托管人发送基金管理费划付指令，", "page": 94, "section": null, "tags": []}, "B2621": {"text": "经基金托管人复核后于次月首日起3个工作日内从基金财产中一次性支付给基金管理人，", "page": 94, "section": null, "tags": []}, "B2622": {"text": "若遇法定节假日、休息日或不可抗力致使无法按时支付的，支付日期顺延。", "page": 94, "section": null, "tags": []}, "B2623": {"text": "（2）基金托管人的托管费", "page": 94, "section": null, "tags": []}, "B2624": {"text": "在通常情况下， 基金托管费按前一日基金资产净值的0.28%年费率计提。 计算方法如下 ：", "page": 94, "section": null, "tags": []}, "B2625": {"text": "H＝E×0.28%÷当年天数", "page": 94, "section": null, "tags": []}, "B2626": {"text": "H为每日应计提的基金托管费", "page": 94, "section": null, "tags": []}, "B2627": {"text": "E为前一日基金资产净值", "page": 94, "section": null, "tags": []}, "B2628": {"text": "基金托管费每日计提， 按月支付。 由基金管理人向基金托管人发送基金托管费划付指令，", "page": 94, "section": null, "tags": []}, "B2629": {"text": "经基金托管人复核后于次月首日起3个工作日内从基金财产中一次性支付给基金托管人，", "page": 94, "section": null, "tags": []}, "B2630": {"text": "若遇法定节假日、休息日或不可抗力致使无法按时支付的，支付日期顺延。", "page": 94, "section": null, "tags": []}, "B2631": {"text": "（3）C类人民币份额的销售服务费", "page": 94, "section": null, "tags": []}, "B2632": {"text": "本基金A类人民币份额和A类美元份额不收取销售服务费，C类人民币份额的销售服务", "page": 94, "section": null, "tags": []}, "B2633": {"text": "费年费率为0.40%。", "page": 94, "section": null, "tags": []}, "B2634": {"text": "本基金C类人民币份额的销售服务费按前一日C类人民币份额基金资产净值的0.40%", "page": 94, "section": null, "tags": []}, "B2635": {"text": "的年费率计提。销售服务费的计算方法如下：", "page": 94, "section": null, "tags": []}, "B2636": {"text": "H＝E×0.40%÷当年天数", "page": 94, "section": null, "tags": []}, "B2637": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 95, "section": null, "tags": ["市场风险"]}, "B2638": {"text": "91", "page": 95, "section": null, "tags": []}, "B2639": {"text": "H为C类人民币份额每日应计提的基金销售服务费", "page": 95, "section": null, "tags": []}, "B2640": {"text": "E为C类人民币份额前一日的基金资产净值", "page": 95, "section": null, "tags": []}, "B2641": {"text": "销售服务费每日计提，逐日累计至每个月月末，按月支付。由基金管理人向基金托管人", "page": 95, "section": null, "tags": []}, "B2642": {"text": "发送销售服务费划付指令，经基金托管人复核后于次月首日起3个工作日内从基金财产中", "page": 95, "section": null, "tags": []}, "B2643": {"text": "一次性支付给基金管理人。若遇法定节假日、休息日或不可抗力致使无法按时支付的，顺", "page": 95, "section": null, "tags": []}, "B2644": {"text": "延至最近可支付日支付。", "page": 95, "section": null, "tags": []}, "B2645": {"text": "（4）基金的指数许可使用费", "page": 95, "section": null, "tags": ["市场风险"]}, "B2646": {"text": "标的指数许可使用费按照基金管理人与指数许可方签署的指数许可使用合同的约定从", "page": 95, "section": null, "tags": ["市场风险"]}, "B2647": {"text": "基金财产中支付。", "page": 95, "section": null, "tags": []}, "B2648": {"text": "（5）除管理费和托管费之外的基金费用，由基金托管人根据其他有关法规及相应协议", "page": 95, "section": null, "tags": []}, "B2649": {"text": "的规定，按费用支出金额支付，列入或摊入当期基金费用。", "page": 95, "section": null, "tags": []}, "B2650": {"text": "4.不列入基金费用的项目", "page": 95, "section": null, "tags": []}, "B2651": {"text": "基金管理人和基金托管人因未履行或未完全履行义务导致的费用支出或基金财产的损", "page": 95, "section": null, "tags": []}, "B2652": {"text": "失，以及处理与基金运作无关的事项发生的费用等不列入基金费用。基金合同生效前所发", "page": 95, "section": null, "tags": []}, "B2653": {"text": "生的信息披露费、律师费和会计师费以及其他费用不从基金财产中支付。", "page": 95, "section": null, "tags": []}, "B2654": {"text": "5.基金管理人和基金托管人可根据基金发展情况调整基金管理费率和基金托管费率。 基", "page": 95, "section": null, "tags": []}, "B2655": {"text": "金管理人必须最迟于新的费率实施日2日前在指定媒介上刊登公告。", "page": 95, "section": null, "tags": []}, "B2656": {"text": "6.基金税收", "page": 95, "section": null, "tags": []}, "B2657": {"text": "基金根据国家法律法规和基金投资所在地的法律法规规定，履行纳税义务。", "page": 95, "section": null, "tags": []}, "B2658": {"text": "基金份额持有人根据中国法律法规规定，履行纳税义务。", "page": 95, "section": null, "tags": []}, "B2659": {"text": "除因基金管理人或基金托管人疏忽、 故意行为导致的基金在税收方面造成的损失外， 基", "page": 95, "section": null, "tags": []}, "B2660": {"text": "金管理人和基金托管人不承担责任。", "page": 95, "section": null, "tags": []}, "B2661": {"text": "对于非代扣代缴的税收， 基金管理人应聘请税收顾问对相关投资市场的税收情况给予意", "page": 95, "section": null, "tags": []}, "B2662": {"text": "见和建议。境外托管银行根据基金管理人的指示具体协调基金在海外税务的申报、缴纳及", "page": 95, "section": null, "tags": ["汇率与跨境风险"]}, "B2663": {"text": "索取税收返还等相关工作。基金管理人或其聘请的税务顾问对最终税务的处理的真实准确", "page": 95, "section": null, "tags": []}, "B2664": {"text": "负责。", "page": 95, "section": null, "tags": []}, "B2665": {"text": "1．投资目标", "page": 95, "section": null, "tags": []}, "B2666": {"text": "通过严格的指数化投资策略， 实现基金投资组合对标的指数的有效跟踪， 力争控制净值", "page": 95, "section": null, "tags": ["市场风险"]}, "B2667": {"text": "增长率与业绩比较基准之间的日均跟踪偏离度的绝对值不超过0.5%，年化跟踪误差不超过", "page": 95, "section": null, "tags": []}, "B2668": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 96, "section": null, "tags": ["市场风险"]}, "B2669": {"text": "92", "page": 96, "section": null, "tags": []}, "B2670": {"text": "5%（以美元资产计价） 。", "page": 96, "section": null, "tags": []}, "B2671": {"text": "本基金标的指数为标普石油天然气上游股票指数（S&P Oil & Gas Exploration &", "page": 96, "section": null, "tags": ["市场风险"]}, "B2672": {"text": "Production Select Industry Index） ，该指数是基于标普全市场指数（S&P Total Markets", "page": 96, "section": null, "tags": ["市场风险"]}, "B2673": {"text": "IndexTM）的精选子行业指数之一，选择在美国主要交易所（纽约证券交易所、美国证券交", "page": 96, "section": null, "tags": ["市场风险"]}, "B2674": {"text": "易所、纳斯达克等）上市的石油天然气勘探、采掘和生产等上游行业的公司为标的，采用", "page": 96, "section": null, "tags": []}, "B2675": {"text": "等市值加权的方法计算。", "page": 96, "section": null, "tags": []}, "B2676": {"text": "2.投资范围", "page": 96, "section": null, "tags": []}, "B2677": {"text": "本基金主要投资于： （1） 标普石油天然气上游股票指数成份股、备选成份股； （2） 跟踪", "page": 96, "section": null, "tags": ["市场风险"]}, "B2678": {"text": "标普石油天然气上游股票指数的公募基金、上市交易型基金等； （3）固定收益类证券、银", "page": 96, "section": null, "tags": ["市场风险"]}, "B2679": {"text": "行存款、现金等货币市场工具以及中国证监会允许本基金投资的其他产品或金融工具。", "page": 96, "section": null, "tags": []}, "B2680": {"text": "本基金投资于标普石油天然气上游股票指数成份股、 备选成份股的比例不低于基金资产", "page": 96, "section": null, "tags": ["市场风险"]}, "B2681": {"text": "净值的80%，投资于跟踪标普石油天然气上游股票指数的公募基金、上市交易型基金的比例", "page": 96, "section": null, "tags": ["市场风险"]}, "B2682": {"text": "不超过基金资产净值的10%；投资于现金或者到期日在一年以内的政府债券的比例不低于", "page": 96, "section": null, "tags": []}, "B2683": {"text": "基金资产净值的5%。", "page": 96, "section": null, "tags": []}, "B2684": {"text": "如法律法规或监管机构以后允许基金投资其他品种或变更投资比例限制， 基金管理人在", "page": 96, "section": null, "tags": []}, "B2685": {"text": "履行适当程序后，可以相应调整本基金的投资范围、投资比例规定。", "page": 96, "section": null, "tags": []}, "B2686": {"text": "3.业绩比较基准", "page": 96, "section": null, "tags": []}, "B2687": {"text": "本基金的业绩比较基准为：标普石油天然气上游股票指数（全收益指数）", "page": 96, "section": null, "tags": ["市场风险"]}, "B2688": {"text": "标普石油天然气上游股票指数（S&P Oil & Gas Exploration & Production Select", "page": 96, "section": null, "tags": ["市场风险"]}, "B2689": {"text": "Industry Index）是基于标普全市场指数（S&P Total Markets IndexTM）的精选子行业指", "page": 96, "section": null, "tags": ["市场风险"]}, "B2690": {"text": "数之一，选择在美国主要交易所（纽约证券交易所、美国证券交易所、纳斯达克等）上市", "page": 96, "section": null, "tags": []}, "B2691": {"text": "的石油天然气勘探、采掘和生产等上游行业的公司为标的，采用等市值加权的方法计算。", "page": 96, "section": null, "tags": []}, "B2692": {"text": "未来， 如果标普石油天然气上游股票指数的提供商标准普尔公司终止对基金管理人继续", "page": 96, "section": null, "tags": ["市场风险"]}, "B2693": {"text": "使用该指数的授权，或者是标准普尔公司基于其独立判断停止继续发布该指数，或者有更", "page": 96, "section": null, "tags": ["市场风险"]}, "B2694": {"text": "权威的、更能为市场普遍接受的业绩比较基准推出，或者是市场上出现更加适合用于本基", "page": 96, "section": null, "tags": []}, "B2695": {"text": "金的业绩基准的股票指数时，本基金管理人在保护持有人合法利益的前提下，以不损害持", "page": 96, "section": null, "tags": ["市场风险"]}, "B2696": {"text": "有人利益为原则，可以与基金托管人协商一致并报中国证监会备案后变更业绩比较基准并", "page": 96, "section": null, "tags": []}, "B2697": {"text": "及时公告，无须召开基金份额持有人大会。", "page": 96, "section": null, "tags": []}, "B2698": {"text": "4.风险收益特征", "page": 96, "section": null, "tags": []}, "B2699": {"text": "本基金是一只美国股票指数型证券投资基金， 风险与预期收益高于混合型基金、 债券基", "page": 96, "section": null, "tags": ["市场风险"]}, "B2700": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 97, "section": null, "tags": ["市场风险"]}, "B2701": {"text": "93", "page": 97, "section": null, "tags": []}, "B2702": {"text": "金以及货币市场基金，属于预期风险较高的产品。", "page": 97, "section": null, "tags": []}, "B2703": {"text": "5.投资限制", "page": 97, "section": null, "tags": []}, "B2704": {"text": "（1）组合限制", "page": 97, "section": null, "tags": []}, "B2705": {"text": "本基金在投资策略上兼顾投资原则以及开放式基金的固有特点， 通过分散投资降低基金", "page": 97, "section": null, "tags": []}, "B2706": {"text": "财产的非系统性风险，保持基金组合良好的流动性。基金的投资组合将遵循以下限制：", "page": 97, "section": null, "tags": ["流动性风险"]}, "B2707": {"text": "1）本基金持有同一家银行的存款不得超过基金净值的20%。银行应当是中资商业银行", "page": 97, "section": null, "tags": []}, "B2708": {"text": "在境外设立的分行或在最近一个会计年度达到中国证监会认可的信用评级机构评级的境外", "page": 97, "section": null, "tags": ["信用风险", "汇率与跨境风险"]}, "B2709": {"text": "银行，但在基金托管账户的存款不受此限制。", "page": 97, "section": null, "tags": []}, "B2710": {"text": "2）本基金持有与中国证监会签署双边监管合作谅解备忘录国家或地区以外的其他国", "page": 97, "section": null, "tags": []}, "B2711": {"text": "家或地区证券市场挂牌交易的证券资产 （包括金融衍生产品） 不得超过基金资产净值的10%，", "page": 97, "section": null, "tags": []}, "B2712": {"text": "其中持有任一国家或地区市场的证券资产不得超过基金资产净值的3%。", "page": 97, "section": null, "tags": []}, "B2713": {"text": "3）基金不得购买证券用于控制或影响发行该证券的机构或其管理层。", "page": 97, "section": null, "tags": []}, "B2714": {"text": "4）本基金持有非流动性资产市值不得超过基金净值的10%。前项非流动性资产是指法", "page": 97, "section": null, "tags": ["流动性风险"]}, "B2715": {"text": "律或基金合同规定的流通受限证券以及中国证监会认定的其他资产。", "page": 97, "section": null, "tags": []}, "B2716": {"text": "5）本基金持有境外基金的市值合计不得超过基金净值的10%。持有货币市场基金可以", "page": 97, "section": null, "tags": ["汇率与跨境风险"]}, "B2717": {"text": "不受上述限制。", "page": 97, "section": null, "tags": []}, "B2718": {"text": "6） 基金管理人管理的全部基金持有任何一只境外基金，不得超过该境外基金总份额的", "page": 97, "section": null, "tags": ["汇率与跨境风险"]}, "B2719": {"text": "20%。", "page": 97, "section": null, "tags": []}, "B2720": {"text": "7）为应付赎回、交易清算等临时用途借入现金的比例不得超过基金资产净值的10%。", "page": 97, "section": null, "tags": ["流动性风险"]}, "B2721": {"text": "8）金融衍生品投资", "page": 97, "section": null, "tags": []}, "B2722": {"text": "为有效管理投资组合和规避风险， 本基金可适当投资于衍生金融工具。 金融衍生品投资", "page": 97, "section": null, "tags": []}, "B2723": {"text": "应当符合法律法规及中国证监会的有关规定。", "page": 97, "section": null, "tags": []}, "B2724": {"text": "A．本基金的金融衍生品全部敞口不得高于基金资产净值的20%。", "page": 97, "section": null, "tags": []}, "B2725": {"text": "B．本基金投资衍生品支付的保证金、投资期权支付或收取的期权费、投资柜台交易衍", "page": 97, "section": null, "tags": ["杠杆风险"]}, "B2726": {"text": "生品支付的初始费用的总额不得高于基金资产净值的10%。", "page": 97, "section": null, "tags": []}, "B2727": {"text": "C．本基金投资于远期合约、互换等柜台交易金融衍生品任一交易对手方的市值计价敞", "page": 97, "section": null, "tags": []}, "B2728": {"text": "口不得超过基金资产净值的20％。", "page": 97, "section": null, "tags": []}, "B2729": {"text": "9）本基金主动投资于流动性受限资产的市值合计不得超过基金资产净值的15%；因证", "page": 97, "section": null, "tags": ["流动性风险"]}, "B2730": {"text": "券市场波动、上市公司股票停牌、基金规模变动等基金管理人之外的因素致使基金不符合", "page": 97, "section": null, "tags": ["市场风险"]}, "B2731": {"text": "前述比例限制的，基金管理人不得主动新增流动性受限资产的投资；", "page": 97, "section": null, "tags": ["流动性风险"]}, "B2732": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 98, "section": null, "tags": ["市场风险"]}, "B2733": {"text": "94", "page": 98, "section": null, "tags": []}, "B2734": {"text": "10）本基金与私募类证券资管产品及中国证监会认定的其他主体为交易对手开展逆回", "page": 98, "section": null, "tags": []}, "B2735": {"text": "购交易的，可接受质押品的资质要求应当与基金合同约定的投资范围保持一致；", "page": 98, "section": null, "tags": []}, "B2736": {"text": "11）相关法律法规、基金合同及中国证监会的其他规定。", "page": 98, "section": null, "tags": []}, "B2737": {"text": "基金管理人应当在基金合同生效后6 个月内使基金的投资组合比例符合基金合同的有", "page": 98, "section": null, "tags": []}, "B2738": {"text": "关约定。若基金超过上述1）-8）项投资比例限制，应当在超过比例后30个工作日内采用", "page": 98, "section": null, "tags": []}, "B2739": {"text": "合理的商业措施减仓以符合投资比例限制要求。", "page": 98, "section": null, "tags": []}, "B2740": {"text": "若因将来法律法规或中国证监会的相关规定发生修改或变更， 致使本基金投资限制中前", "page": 98, "section": null, "tags": []}, "B2741": {"text": "述1)至10)项中的任何限制规定被修改或取消的，基金管理人在履行适当程序后，本基金", "page": 98, "section": null, "tags": []}, "B2742": {"text": "可相应调整投资限制规定。", "page": 98, "section": null, "tags": []}, "B2743": {"text": "（2）禁止行为", "page": 98, "section": null, "tags": []}, "B2744": {"text": "除中国证监会另有规定外，基金不得有下列行为：", "page": 98, "section": null, "tags": []}, "B2745": {"text": "1） 购买不动产。", "page": 98, "section": null, "tags": []}, "B2746": {"text": "2） 购买房地产抵押按揭。", "page": 98, "section": null, "tags": []}, "B2747": {"text": "3） 购买贵重金属或代表贵重金属的凭证。", "page": 98, "section": null, "tags": []}, "B2748": {"text": "4） 购买实物商品。", "page": 98, "section": null, "tags": []}, "B2749": {"text": "5） 除应付赎回、交易清算等临时用途以外，借入现金。该临时用途借入现金的比例", "page": 98, "section": null, "tags": ["流动性风险"]}, "B2750": {"text": "不得超过基金、集合计划资产净值的10%。", "page": 98, "section": null, "tags": []}, "B2751": {"text": "6） 利用融资购买证券，但投资金融衍生品除外。", "page": 98, "section": null, "tags": []}, "B2752": {"text": "7） 参与未持有基础资产的卖空交易。", "page": 98, "section": null, "tags": []}, "B2753": {"text": "8） 从事证券承销业务。", "page": 98, "section": null, "tags": []}, "B2754": {"text": "9）不公平对待不同客户或不同投资组合。", "page": 98, "section": null, "tags": []}, "B2755": {"text": "10）除法律法规规定以外，向任何第三方泄露客户资料。", "page": 98, "section": null, "tags": []}, "B2756": {"text": "11）中国证监会禁止的其他行为。", "page": 98, "section": null, "tags": []}, "B2757": {"text": "1．估值对象", "page": 98, "section": null, "tags": []}, "B2758": {"text": "基金所拥有的股票、基金、债券和银行存款本息、应收款项、其它投资等资产。", "page": 98, "section": null, "tags": []}, "B2759": {"text": "2．估值时间", "page": 98, "section": null, "tags": []}, "B2760": {"text": "本基金合同生效后， 每个开放日以及国家法律法规规定需要对外披露基金净值的非开放", "page": 98, "section": null, "tags": []}, "B2761": {"text": "日对基金资产进行估值，T+1日完成T日估值。", "page": 98, "section": null, "tags": []}, "B2762": {"text": "3．估值方法", "page": 98, "section": null, "tags": []}, "B2763": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 99, "section": null, "tags": ["市场风险"]}, "B2764": {"text": "95", "page": 99, "section": null, "tags": []}, "B2765": {"text": "（1）股票估值方法", "page": 99, "section": null, "tags": []}, "B2766": {"text": "1） 上市流通股票按估值日其所在证券交易所的收盘价估值；估值日无交易的，以最近", "page": 99, "section": null, "tags": []}, "B2767": {"text": "交易日的收盘价估值。", "page": 99, "section": null, "tags": []}, "B2768": {"text": "2）未上市股票的估值", "page": 99, "section": null, "tags": []}, "B2769": {"text": "A．送股、转增股、配股和增发等方式发行的股票，按估值日在交易所挂牌的同一股票", "page": 99, "section": null, "tags": []}, "B2770": {"text": "的收盘价估值，该日无交易的，以最近交易日的收盘价估值；", "page": 99, "section": null, "tags": []}, "B2771": {"text": "B．首次发行且未上市的股票，按成本价估值；首次发行且有明确锁定期的股票，同一", "page": 99, "section": null, "tags": []}, "B2772": {"text": "股票在交易所上市后，按交易所上市的同一股票的市价估值。", "page": 99, "section": null, "tags": []}, "B2773": {"text": "（2）基金估值方法", "page": 99, "section": null, "tags": []}, "B2774": {"text": "1） 上市流通的基金按估值日其所在证券交易所的收盘价估值；估值日无交易的，以最", "page": 99, "section": null, "tags": []}, "B2775": {"text": "近交易日的收盘价估值。", "page": 99, "section": null, "tags": []}, "B2776": {"text": "2）其他基金按最近交易日的基金份额净值估值。", "page": 99, "section": null, "tags": []}, "B2777": {"text": "若基金价格无法通过公开信息取得的， 由基金管理人负责从其经纪商处取得， 并及时通", "page": 99, "section": null, "tags": []}, "B2778": {"text": "过书面形式告知基金托管人。", "page": 99, "section": null, "tags": []}, "B2779": {"text": "（3）债券估值方法", "page": 99, "section": null, "tags": []}, "B2780": {"text": "1） 对于上市流通的债券，证券交易所市场实行净价交易的债券按估值日其所在证券交", "page": 99, "section": null, "tags": []}, "B2781": {"text": "易所的收盘价估值；估值日无交易的，以最近交易日的收盘价估值。证券交易所市场未实", "page": 99, "section": null, "tags": []}, "B2782": {"text": "行净价交易的债券按估值日收盘价减去债券收盘价中所含的债券应收利息得到的净价进行", "page": 99, "section": null, "tags": []}, "B2783": {"text": "估值，估值日没有交易的，按最近交易日债券收盘价减去所含的最近交易日债券应收利息", "page": 99, "section": null, "tags": []}, "B2784": {"text": "后得到的净价估值。", "page": 99, "section": null, "tags": []}, "B2785": {"text": "2） 对于非上市债券，参照主要做市商或其他权威价格提供机构的报价进行估值。若债", "page": 99, "section": null, "tags": []}, "B2786": {"text": "券价格无法通过公开信息取得的，由基金管理人负责从其经纪商处取得，并及时通过书面", "page": 99, "section": null, "tags": []}, "B2787": {"text": "形式告知基金托管人。", "page": 99, "section": null, "tags": []}, "B2788": {"text": "（4）存托凭证估值方法", "page": 99, "section": null, "tags": ["机制特有风险"]}, "B2789": {"text": "公开挂牌的存托凭证按其所在证券交易所的最近交易日的收盘价估值。", "page": 99, "section": null, "tags": ["机制特有风险"]}, "B2790": {"text": "（5）汇率", "page": 99, "section": null, "tags": ["汇率与跨境风险"]}, "B2791": {"text": "本基金外币资产价值计算中，所涉及人民币对美元、港元、欧元、英镑和日元的汇率应", "page": 99, "section": null, "tags": ["汇率与跨境风险"]}, "B2792": {"text": "当以基金估值日中国人民银行或其授权机构公布的人民币汇率为准。涉及其他货币对人民", "page": 99, "section": null, "tags": ["汇率与跨境风险"]}, "B2793": {"text": "币的汇率，采用彭博金融终端提供的估值日各种货币对美元折算率并采用套算的方法进行", "page": 99, "section": null, "tags": ["汇率与跨境风险"]}, "B2794": {"te
