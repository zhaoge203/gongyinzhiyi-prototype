险", "page": 12, "section": null, "tags": []}, "B277": {"text": "（1） 海外市场风险：由于本基金投资于海外证券市场（主要为美国） ，因此不同地区处", "page": 12, "section": null, "tags": []}, "B278": {"text": "于不同产业景气循环周期，将对基金的投资绩效产生影响。海外证券市场可能由于对于负面", "page": 12, "section": null, "tags": []}, "B279": {"text": "的特定事件、该国或地区特有的政治因素、法律法规、市场状况、经济发展趋势的反映较境", "page": 12, "section": null, "tags": []}, "B280": {"text": "内证券市场有诸多不同。并且，这些国家或地区证券的每日涨跌幅空间相对较大。以上所述", "page": 12, "section": null, "tags": []}, "B281": {"text": "因素可能会带来市场的急剧下跌，从而带来投资风险的增加。", "page": 12, "section": null, "tags": []}, "B282": {"text": "（2）政府管制风险：因财政政策、货币政策、产业政策、地区发展政策等宏观政策发", "page": 12, "section": null, "tags": []}, "B283": {"text": "生变化，导致市场波动而影响基金收益，产生风险。", "page": 12, "section": null, "tags": ["市场风险"]}, "B284": {"text": "（3）政治风险：政治风险指因所投资地政治不稳定而蒙受损失的风险，这可以是由政", "page": 12, "section": null, "tags": []}, "B285": {"text": "权更迭、政策及法规的改变所造成。", "page": 12, "section": null, "tags": []}, "B286": {"text": "（4）汇率风险：本基金以人民币为计价单位，但所投资的资产及来自该等资产的收入", "page": 12, "section": null, "tags": ["汇率与跨境风险"]}, "B287": {"text": "将会以其他货币为单位， 因此本基金的资产会受持有资产的货币与人民币之间的汇率走势所", "page": 12, "section": null, "tags": ["汇率与跨境风险"]}, "B288": {"text": "影响。本基金的投资表现也可能受外汇管制规定变更的影响。", "page": 12, "section": null, "tags": []}, "B289": {"text": "（5）税务风险", "page": 12, "section": null, "tags": []}, "B290": {"text": "由于各国在税务方面的法律法规存在一定差异，可能会要求基金就股息、利息、资本利", "page": 12, "section": null, "tags": []}, "B291": {"text": "得等收益向当地税务机构缴纳税金，该行为会使基金收益受到一定影响。此外，各国的税收", "page": 12, "section": null, "tags": []}, "B292": {"text": "规定可能发生变化，或者实施具有追溯力的修订，从而导致基金不得不缴纳在基金销售、估", "page": 12, "section": null, "tags": []}, "B293": {"text": "值或者出售投资当日并未预计的额外税项。", "page": 12, "section": null, "tags": []}, "B294": {"text": "（6）法律风险", "page": 12, "section": null, "tags": []}, "B295": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 13, "section": null, "tags": ["市场风险"]}, "B296": {"text": "由于投资标的所在国的法律法规与中国不同，可能导致本基金在投资运作、交易结算以", "page": 13, "section": null, "tags": []}, "B297": {"text": "及资金汇出入等方面受到限制，从而使得基金资产面临损失的可能性。", "page": 13, "section": null, "tags": []}, "B298": {"text": "3．被动投资的风险", "page": 13, "section": null, "tags": []}, "B299": {"text": "（1）指数化投资的风险", "page": 13, "section": null, "tags": ["市场风险"]}, "B300": {"text": "本基金作为股票指数基金， 在日常投资管理中会维持不低于基金资产净值80%的股票投", "page": 13, "section": null, "tags": ["市场风险"]}, "B301": {"text": "资比例，具有对股票市场的系统性风险，不能规避市场下跌的风险和个股风险。", "page": 13, "section": null, "tags": []}, "B302": {"text": "（2）指数编制方法的认知风险", "page": 13, "section": null, "tags": ["市场风险"]}, "B303": {"text": "本基金跟踪的标的指数为标普石油天然气上游股票指数， 该指数采用等权重的编制方法。", "page": 13, "section": null, "tags": ["市场风险"]}, "B304": {"text": "等权重指数并不意味着指数成份股的权重永远相等， 而是在兼顾指数换手率与等权重特征的", "page": 13, "section": null, "tags": ["市场风险"]}, "B305": {"text": "基础上，设定了定期调整机制，使成份股权重在某一时刻保持几乎相等的状态。与市值加权", "page": 13, "section": null, "tags": []}, "B306": {"text": "指数相比，等权重指数具有以下特点：1)等权重指数中小市值公司所占的比重较高；2)等权", "page": 13, "section": null, "tags": ["市场风险"]}, "B307": {"text": "重指数中小公司行业所占的比重较高。 等权重指数的上述特点决定了其风险收益特征高于按", "page": 13, "section": null, "tags": ["市场风险"]}, "B308": {"text": "市值加权的指数。", "page": 13, "section": null, "tags": ["市场风险"]}, "B309": {"text": "（3）指数授权风险", "page": 13, "section": null, "tags": ["市场风险"]}, "B310": {"text": "本基金管理人依据指数授权许可协议依法取得在中国境内发行跟踪标普石油天然气上", "page": 13, "section": null, "tags": ["市场风险"]}, "B311": {"text": "游股票指数基金的权利。未来，如果标的指数提供商（标普道琼斯公司） 终止对基金管理人", "page": 13, "section": null, "tags": ["市场风险"]}, "B312": {"text": "继续使用该指数的授权，或者标的指数提供商基于其独立判断停止继续发布该指数，或者有", "page": 13, "section": null, "tags": ["市场风险"]}, "B313": {"text": "更权威的、更能为市场普遍接受的业绩比较基准推出，或者是市场上出现更加适合用于本基", "page": 13, "section": null, "tags": []}, "B314": {"text": "金的业绩基准的股票指数时，本基金管理人在保护持有人合法利益的前提下，以不损害持有", "page": 13, "section": null, "tags": ["市场风险"]}, "B315": {"text": "人利益为原则， 可以与基金托管人协商一致并报中国证监会备案后变更业绩比较基准并及时", "page": 13, "section": null, "tags": []}, "B316": {"text": "公告。", "page": 13, "section": null, "tags": []}, "B317": {"text": "（4）跟踪误差控制未达约定目标的风险", "page": 13, "section": null, "tags": []}, "B318": {"text": "跟踪误差反映的是投资组合与跟踪基准之间的偏离程度， 是控制投资组合与基准之间相", "page": 13, "section": null, "tags": []}, "B319": {"text": "对风险的重要指标，跟踪误差的大小是衡量指数化投资成功与否的关键。以下原因可能会影", "page": 13, "section": null, "tags": ["市场风险"]}, "B320": {"text": "响到基金的跟踪误差扩大，与业绩基准产生偏离：", "page": 13, "section": null, "tags": []}, "B321": {"text": "1）标的指数成份股的配股、增发、分红等公司行为；", "page": 13, "section": null, "tags": ["市场风险"]}, "B322": {"text": "2）标的指数成份股的调整；", "page": 13, "section": null, "tags": ["市场风险"]}, "B323": {"text": "3）基金现金资产的拖累；", "page": 13, "section": null, "tags": []}, "B324": {"text": "4）基金的管理费、托管费和证券交易费用等带来的跟踪误差；", "page": 13, "section": null, "tags": []}, "B325": {"text": "5）指数成份股停牌、摘牌等因素带来的偏差；", "page": 13, "section": null, "tags": ["市场风险"]}, "B326": {"text": "6）由于缺少衍生金融工具，基金建仓期间无法实现对指数的有效跟踪所带来的偏差。", "page": 13, "section": null, "tags": ["市场风险"]}, "B327": {"text": "7）特殊情况下，如果本基金采取成份股替代策略，基金投资组合与标的指数构成的差", "page": 13, "section": null, "tags": ["市场风险"]}, "B328": {"text": "异可能导致基金收益率与标的指数收益率产生偏离。", "page": 13, "section": null, "tags": ["市场风险"]}, "B329": {"text": "8）其他因素产生的偏离。如因基金申购与赎回带来的现金变动；因指数发布机构指数", "page": 13, "section": null, "tags": ["流动性风险", "市场风险", "机制特有风险"]}, "B330": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 14, "section": null, "tags": ["市场风险"]}, "B331": {"text": "10", "page": 14, "section": null, "tags": []}, "B332": {"text": "编制错误等。 ；", "page": 14, "section": null, "tags": []}, "B333": {"text": "9）由于受外汇管制影响，基金无法维持股票资产比例在较高的水平。", "page": 14, "section": null, "tags": []}, "B334": {"text": "本基金力争将日均跟踪偏离度的绝对值控制在0.5%以内， 年化跟踪误差控制在5%以内，", "page": 14, "section": null, "tags": []}, "B335": {"text": "但因上述原因或其他因素可能导致跟踪误差超过上述范围， 本基金净值表现与指数价格走势", "page": 14, "section": null, "tags": ["市场风险"]}, "B336": {"text": "可能发生较大偏离。", "page": 14, "section": null, "tags": []}, "B337": {"text": "（5）标的指数变更的风险", "page": 14, "section": null, "tags": ["市场风险"]}, "B338": {"text": "根据基金合同的约定，如出现变更本基金标的指数的情形，经履行适当程序，本基金将", "page": 14, "section": null, "tags": ["市场风险"]}, "B339": {"text": "变更标的指数。基于原标的指数的投资策略将会改变，投资组合将随之调整，本基金的风险", "page": 14, "section": null, "tags": ["市场风险"]}, "B340": {"text": "收益特征将与新的标的指数保持一致，投资者须承担此项调整带来的风险与成本。", "page": 14, "section": null, "tags": ["市场风险"]}, "B341": {"text": "（6）指数编制机构停止服务的风险", "page": 14, "section": null, "tags": ["市场风险"]}, "B342": {"text": "本基金的标的指数由指数编制机构发布并管理和维护， 未来指数编制机构可能由于各种", "page": 14, "section": null, "tags": ["市场风险"]}, "B343": {"text": "原因停止对指数的管理和维护， 本基金将根据基金合同的约定自该情形发生之日起十个工作", "page": 14, "section": null, "tags": ["市场风险"]}, "B344": {"text": "日向中国证监会报告并提出解决方案，如对基金份额持有人利益有实质性影响，则在 6 个月", "page": 14, "section": null, "tags": []}, "B345": {"text": "内召集基金份额持有人大会进行表决。", "page": 14, "section": null, "tags": []}, "B346": {"text": "自指数编制机构停止标的指数的编制及发布至解决方案确定并实施前， 基金管理人应按", "page": 14, "section": null, "tags": ["市场风险"]}, "B347": {"text": "照指数编制机构提供的最近一个交易日的指数信息遵循基金份额持有人利益优先原则维持", "page": 14, "section": null, "tags": ["市场风险"]}, "B348": {"text": "基金投资运作， 该期间由于标的指数不再更新等原因可能导致指数表现与相关市场表现存在", "page": 14, "section": null, "tags": ["市场风险"]}, "B349": {"text": "差异，影响投资收益。", "page": 14, "section": null, "tags": []}, "B350": {"text": "（7）成份股停牌的风险", "page": 14, "section": null, "tags": []}, "B351": {"text": "标的指数成份股可能因各种原因临时或长期停牌， 发生成份股停牌时可能面临如下风险 ：", "page": 14, "section": null, "tags": ["市场风险"]}, "B352": {"text": "1）基金可能因无法及时调整投资组合而导致跟踪偏离度和跟踪误差扩大。", "page": 14, "section": null, "tags": []}, "B353": {"text": "2）若成份股停牌时间较长，在约定时间内仍未能及时买入或卖出的，由此可能影响投", "page": 14, "section": null, "tags": []}, "B354": {"text": "资者的投资损益并使基金产生跟踪偏离度和跟踪误差。", "page": 14, "section": null, "tags": []}, "B355": {"text": "3）在极端情况下，标的指数成份股可能大面积停牌，基金可能无法及时卖出成份股以", "page": 14, "section": null, "tags": ["市场风险"]}, "B356": {"text": "获取足额的符合要求的赎回款项，由此基金管理人可能采取暂停赎回的措施，投资者将面临", "page": 14, "section": null, "tags": ["流动性风险"]}, "B357": {"text": "无法赎回全部或部分基金份额的风险。", "page": 14, "section": null, "tags": ["流动性风险"]}, "B358": {"text": "4．开放式基金的一般风险", "page": 14, "section": null, "tags": []}, "B359": {"text": "（1）流动性风险：本基金面临的证券市场流动性风险主要表现在几个方面：基金资产", "page": 14, "section": null, "tags": ["流动性风险"]}, "B360": {"text": "不能迅速转变成现金，或变现成本很高；不能应付可能出现的投资人大额赎回的风险；证券", "page": 14, "section": null, "tags": ["流动性风险"]}, "B361": {"text": "投资中个券的流动性风险等。这些风险的主要形成原因是：", "page": 14, "section": null, "tags": ["流动性风险"]}, "B362": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 15, "section": null, "tags": ["市场风险"]}, "B363": {"text": "11", "page": 15, "section": null, "tags": []}, "B364": {"text": "1）市场整体流动性相对不足。证券市场的流动性受到市场行情、投资群体等诸多因素", "page": 15, "section": null, "tags": ["流动性风险"]}, "B365": {"text": "的影响，在某些时期成交活跃，流动性非常好，而在另一些时期，则可能成交稀少，流动性", "page": 15, "section": null, "tags": ["流动性风险"]}, "B366": {"text": "差。在市场流动性相对不足时，交易变现都有可能因流动性问题而增加变现成本，对本基金", "page": 15, "section": null, "tags": ["流动性风险"]}, "B367": {"text": "的资产净值造成不利影响。这种风险在发生大额赎回时表现尤为突出。", "page": 15, "section": null, "tags": ["流动性风险"]}, "B368": {"text": "2）证券市场中流动性不均匀，存在个券流动性风险。由于流动性存在差异，即使在市", "page": 15, "section": null, "tags": ["流动性风险"]}, "B369": {"text": "场流动性比较好的情况下，一些个券的流动性可能仍然比较差，这种情况的存在使得本基金", "page": 15, "section": null, "tags": ["流动性风险"]}, "B370": {"text": "在进行个券操作时，可能难以按计划买入或卖出相应的数量，或买入卖出行为对个券价格产", "page": 15, "section": null, "tags": []}, "B371": {"text": "生比较大的影响，增加个券的建仓成本或变现成本。这种风险在出现个券停牌和涨跌停板等", "page": 15, "section": null, "tags": ["流动性风险"]}, "B372": {"text": "情况时表现得尤为突出。", "page": 15, "section": null, "tags": []}, "B373": {"text": "（2）信用风险：信用风险是指债券发行人是否能够实现发行时的承诺，按时足额还本", "page": 15, "section": null, "tags": ["信用风险"]}, "B374": {"text": "付息的风险。一般认为：国债的信用风险可以视为零，而其它债券的信用风险可按专业机构", "page": 15, "section": null, "tags": ["信用风险"]}, "B375": {"text": "的信用评级确定， 信用等级的变化或市场对某一信用等级水平下债券率的变化都会迅速的改", "page": 15, "section": null, "tags": ["信用风险"]}, "B376": {"text": "变债券的价格，从而影响到基金资产。", "page": 15, "section": null, "tags": []}, "B377": {"text": "（3）利率风险: 利率风险是指由于利率变动而导致的证券价格和证券利息的损失。利", "page": 15, "section": null, "tags": ["市场风险"]}, "B378": {"text": "率风险是债券投资所面临的主要风险，息票利率、期限和到期收益率水平都将影响债券的利", "page": 15, "section": null, "tags": ["市场风险"]}, "B379": {"text": "率风险水平。利率的波动仅间接影响到股市。", "page": 15, "section": null, "tags": ["市场风险"]}, "B380": {"text": "（4）大宗交易风险：大宗交易的成交价格并非完全由市场供需关系形成，可能与市场", "page": 15, "section": null, "tags": []}, "B381": {"text": "价格存在一定差异，从而导致大宗交易参与者的非正常损益。", "page": 15, "section": null, "tags": []}, "B382": {"text": "（5）管理风险", "page": 15, "section": null, "tags": ["操作与合规风险"]}, "B383": {"text": "在基金管理运作过程中， 基金管理人的研究水平、 投资管理水平直接影响基金收益水平，", "page": 15, "section": null, "tags": []}, "B384": {"text": "如果基金管理人对经济形势和证券市场判断不准确、获取的信息不全、投资操作出现失误，", "page": 15, "section": null, "tags": []}, "B385": {"text": "都会影响基金的收益水平。", "page": 15, "section": null, "tags": []}, "B386": {"text": "（6）操作或技术风险", "page": 15, "section": null, "tags": []}, "B387": {"text": "在开放式基金的各种交易行为或者后台运作中， 可能因为技术系统的故障或者差错而影", "page": 15, "section": null, "tags": []}, "B388": {"text": "响交易的正常进行或者导致投资人的利益受到影响。这种技术风险可能来自基金管理公司、", "page": 15, "section": null, "tags": []}, "B389": {"text": "注册登记机构、销售机构、证券交易所、证券登记结算机构等。", "page": 15, "section": null, "tags": []}, "B390": {"text": "（7）合规性风险", "page": 15, "section": null, "tags": ["操作与合规风险"]}, "B391": {"text": "指基金管理或运作过程中，违反国家法律法规的规定，或者基金投资违反法规及基金合", "page": 15, "section": null, "tags": []}, "B392": {"text": "同有关规定的风险。", "page": 15, "section": null, "tags": []}, "B393": {"text": "（8）其他风险", "page": 15, "section": null, "tags": []}, "B394": {"text": "战争、自然灾害等不可抗力因素的出现，将会严重影响证券市场的运行，可能导致基金", "page": 15, "section": null, "tags": []}, "B395": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 16, "section": null, "tags": ["市场风险"]}, "B396": {"text": "12", "page": 16, "section": null, "tags": []}, "B397": {"text": "财产的损失。", "page": 16, "section": null, "tags": []}, "B398": {"text": "金融市场危机、行业竞争、代理商违约、托管行违约等超出基金管理人自身直接控制能", "page": 16, "section": null, "tags": ["信用风险"]}, "B399": {"text": "力之外的风险，可能导致基金或者基金份额持有人利益受损。", "page": 16, "section": null, "tags": []}, "B400": {"text": "5、本基金法律文件中涉及基金风险特征的表述与销售机构对基金的风险评级可能不一", "page": 16, "section": null, "tags": []}, "B401": {"text": "致的风险", "page": 16, "section": null, "tags": []}, "B402": {"text": "本基金基金合同、 招募说明书等法律文件中涉及基金风险收益特征或风险状况的表述仅", "page": 16, "section": null, "tags": []}, "B403": {"text": "为主要基于基金投资方向与策略特点的概括性表述；而本基金各销售机构依据中国证券投资", "page": 16, "section": null, "tags": []}, "B404": {"text": "基金业协会发布的《基金募集机构投资者适当性管理实施指引（试行） 》及内部评级标准，", "page": 16, "section": null, "tags": []}, "B405": {"text": "将基金产品按照风险由低到高顺序进行风险级别评定划分， 其风险评级结果所依据的评价要", "page": 16, "section": null, "tags": []}, "B406": {"text": "素可能更多、范围更广，与本基金法律文件中的风险收益特征或风险状况表述并不必然一致", "page": 16, "section": null, "tags": []}, "B407": {"text": "或存在对应关系。同时，不同销售机构因其采取的具体评价标准和方法的差异，对同一产品", "page": 16, "section": null, "tags": []}, "B408": {"text": "风险级别的评定也可能各有不同；销售机构还可能根据监管要求、市场变化及基金实际运作", "page": 16, "section": null, "tags": []}, "B409": {"text": "情况等适时调整对本基金的风险评级。敬请投资人知悉，在购买本基金时按照销售机构的要", "page": 16, "section": null, "tags": []}, "B410": {"text": "求完成风险承受能力与产品风险之间的匹配检验， 并须及时关注销售机构对于本基金风险评", "page": 16, "section": null, "tags": []}, "B411": {"text": "级的调整情况，谨慎作出投资决策。", "page": 16, "section": null, "tags": []}, "B412": {"text": "1．本基金未经任何一级政府、机构及部门担保。投资人自愿投资于本基金，须自行承", "page": 16, "section": null, "tags": []}, "B413": {"text": "担投资风险。", "page": 16, "section": null, "tags": []}, "B414": {"text": "2．除基金管理人直接办理本基金的销售外，本基金还通过代销机构代理销售，但是，", "page": 16, "section": null, "tags": []}, "B415": {"text": "基金并不是代销机构的存款或负债，也没有经代销机构担保或者背书，代销机构并不能保证", "page": 16, "section": null, "tags": []}, "B416": {"text": "其收益或本金安全。", "page": 16, "section": null, "tags": []}, "B417": {"text": "四、基金管理人", "page": 16, "section": null, "tags": []}, "B418": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 17, "section": null, "tags": ["市场风险"]}, "B419": {"text": "13", "page": 17, "section": null, "tags": []}, "B420": {"text": "基金管理人：华宝基金管理有限公司", "page": 17, "section": null, "tags": []}, "B421": {"text": "住所：中国（上海）自由贸易试验区世纪大道100号上海环球金融中心58楼", "page": 17, "section": null, "tags": []}, "B422": {"text": "办公地址：中国（上海）自由贸易试验区世纪大道100号上海环球金融中心58楼", "page": 17, "section": null, "tags": []}, "B423": {"text": "法定代表人：XIAOYI HELEN HUANG（黄小薏）", "page": 17, "section": null, "tags": []}, "B424": {"text": "总经理：XIAOYI HELEN HUANG（黄小薏）", "page": 17, "section": null, "tags": []}, "B425": {"text": "成立日期：2003年3月7日", "page": 17, "section": null, "tags": []}, "B426": {"text": "注册资本：1.5亿元", "page": 17, "section": null, "tags": []}, "B427": {"text": "电话：021－38505888", "page": 17, "section": null, "tags": []}, "B428": {"text": "联系人：章希", "page": 17, "section": null, "tags": []}, "B429": {"text": "股权结构：中方股东华宝信托有限责任公司持有51%的股份，外方股东Warburg Pincus", "page": 17, "section": null, "tags": []}, "B430": {"text": "Asset Management，L.P.持有49%的股份。", "page": 17, "section": null, "tags": []}, "B431": {"text": "1.基金管理人董事、监事、经理及其他高级管理人员基本情况", "page": 17, "section": null, "tags": []}, "B432": {"text": "（1）董事会信息", "page": 17, "section": null, "tags": []}, "B433": {"text": "朱永红先生，董事长，博士。曾任武汉钢铁（集团） 公司战略研究室主任、财务总监兼", "page": 17, "section": null, "tags": []}, "B434": {"text": "计划财务部部长、副总会计师、总会计师等职务。现任华宝基金管理有限公司董事长，中国", "page": 17, "section": null, "tags": []}, "B435": {"text": "宝武钢铁集团有限公司党委常委、总会计师兼董事会秘书，宝山钢铁股份有限公司监事会主", "page": 17, "section": null, "tags": []}, "B436": {"text": "席，中国太平洋保险（集团） 股份有限公司监事会主席，宝武集团财务有限责任公司董事长", "page": 17, "section": null, "tags": []}, "B437": {"text": "XIAOYI HELEN HUANG（黄小薏）女士，董事，硕士。曾任加拿大TD Securities公司金", "page": 17, "section": null, "tags": []}, "B438": {"text": "融分析师，Acthop投资公司财务总监。2003年5月加入华宝基金管理有限公司，先后担任", "page": 17, "section": null, "tags": []}, "B439": {"text": "公司营运总监、董事会秘书、副总经理，现任华宝基金管理有限公司总经理。", "page": 17, "section": null, "tags": []}, "B440": {"text": "魏臻先生，董事。曾任麦肯锡（上海）咨询公司分析师，摩根斯坦利亚洲公司分析师，", "page": 17, "section": null, "tags": []}, "B441": {"text": "香港人人媒体总监。现任华平投资集团董事总经理、神州租车控股公司董事、九月教育集团", "page": 17, "section": null, "tags": ["汇率与跨境风险"]}, "B442": {"text": "董事、中通快递董事。", "page": 17, "section": null, "tags": []}, "B443": {"text": "周朗朗先生，董事，本科。曾任瑞士信贷第一波士顿（加拿大） 分析师；花旗银行（香", "page": 17, "section": null, "tags": []}, "B444": {"text": "港） 投资银行部分析师；现任美国华平集团中国金融行业负责人、董事总经理，华融资产管", "page": 17, "section": null, "tags": []}, "B445": {"text": "理股份有限公司董事，上海灿谷投资管理咨询服务有限公司董事。", "page": 17, "section": null, "tags": []}, "B446": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 18, "section": null, "tags": ["市场风险"]}, "B447": {"text": "14", "page": 18, "section": null, "tags": []}, "B448": {"text": "胡光先生，独立董事，硕士。曾任美国俄亥俄州舒士克曼律师事务所律师，飞利浦电子", "page": 18, "section": null, "tags": []}, "B449": {"text": "中国集团法律顾问，上海市邦信阳律师事务所合伙人，上海胡光律师事务所主任。现任上海", "page": 18, "section": null, "tags": []}, "B450": {"text": "市君悦律师事务所主任。", "page": 18, "section": null, "tags": []}, "B451": {"text": "尉安宁先生，独立董事，博士。曾任宁夏广播电视大学讲师，中国社会科学院经济研究", "page": 18, "section": null, "tags": []}, "B452": {"text": "所助理研究员，世界银行农业经济学家，荷兰合作银行东北亚区食品农业研究主管，新希望", "page": 18, "section": null, "tags": []}, "B453": {"text": "集团常务副总裁，比利时富通银行中国区 CEO 兼上海分行行长，山东亚太中慧集团董事长。", "page": 18, "section": null, "tags": []}, "B454": {"text": "现任上海谷旺投资管理有限公司执行董事兼总经理，大成食品（亚洲）有限公司执行董事、", "page": 18, "section": null, "tags": []}, "B455": {"text": "董事会主席、执行委员会主席。", "page": 18, "section": null, "tags": []}, "B456": {"text": "陈志宏先生，独立董事，硕士。曾任毕马威会计师事务所合伙人、普华永道会计师事务", "page": 18, "section": null, "tags": []}, "B457": {"text": "所合伙人，苏黎世金融服务集团亚太地区首席执行官。", "page": 18, "section": null, "tags": []}, "B458": {"text": "（2）监事会信息", "page": 18, "section": null, "tags": []}, "B459": {"text": "朱莉丽女士，监事，硕士。曾就职于美林投资银行部、德意志银行投资银行部；现任美", "page": 18, "section": null, "tags": []}, "B460": {"text": "国华平集团执行董事。", "page": 18, "section": null, "tags": []}, "B461": {"text": "黄洪永先生，监事，硕士。曾任宝钢集团规划部、管理创新部综合主管，宝钢工程党委", "page": 18, "section": null, "tags": []}, "B462": {"text": "组织部、人力资源部部长，广东钢铁集团规划部副部长，广东宝钢置业副总经理，宝钢集团", "page": 18, "section": null, "tags": []}, "B463": {"text": "人事效率总监、领导力发展总监，中国宝武集团领导力发展总监，中国宝武钢铁集团产业金", "page": 18, "section": null, "tags": []}, "B464": {"text": "融党工委副书记、纪工委书记；现任华宝投资有限公司党委副书记、 纪委书记。", "page": 18, "section": null, "tags": []}, "B465": {"text": "沈燕女士，监事，本科。曾任宝钢集团审计部主任审计师，宝钢欧洲有限责任公司财务", "page": 18, "section": null, "tags": []}, "B466": {"text": "总监，华宝证券有限责任公司稽核部高级经理。现任华宝基金管理有限公司合规审计部内审", "page": 18, "section": null, "tags": []}, "B467": {"text": "主管。", "page": 18, "section": null, "tags": []}, "B468": {"text": "丁科先生，监事，硕士。曾任招银金融租赁业务研发部客户经理，平安国际融资租赁企", "page": 18, "section": null, "tags": []}, "B469": {"text": "划部经营分析经理，华宝投资投资银行部项目经理、华宝基金战略规划部战略规划主管。现", "page": 18, "section": null, "tags": []}, "B470": {"text": "任华宝基金管理有限公司华宝机构销售部高级销售经理。", "page": 18, "section": null, "tags": []}, "B471": {"text": "（3）总经理及其他高级管理人员", "page": 18, "section": null, "tags": []}, "B472": {"text": "朱永红先生，董事长，简历同上。", "page": 18, "section": null, "tags": []}, "B473": {"text": "XIAOYI HELEN HUANG（黄小薏）女士，总经理，简历同上。", "page": 18, "section": null, "tags": []}, "B474": {"text": "刘欣先生，常务副总经理，本科。曾任中国国际金融有限公司投资银行部分析师、经理", "page": 18, "section": null, "tags": []}, "B475": {"text": "，美林（亚太）有限公司投资银行部经理、亚洲企业融资部副总裁/董事，瑞士信贷香港有", "page": 18, "section": null, "tags": ["汇率与跨境风险"]}, "B476": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 19, "section": null, "tags": ["市场风险"]}, "B477": {"text": "15", "page": 19, "section": null, "tags": []}, "B478": {"text": "限公司投资银行部副总裁，北京春雨天下软件有限公司首席财务官，亚投顾问有限公司高级", "page": 19, "section": null, "tags": []}, "B479": {"text": "顾问等职务。现任华宝基金管理有限公司常务副总经理。", "page": 19, "section": null, "tags": []}, "B480": {"text": "向辉先生，副总经理，硕士。曾在武汉长江金融审计事务所任副所长、在长盛基金管理", "page": 19, "section": null, "tags": []}, "B481": {"text": "有限公司市场部任职。2002年加入华宝基金公司参与公司的筹建工作，先后担任公司清算", "page": 19, "section": null, "tags": []}, "B482": {"text": "登记部总经理、营运副总监、营运总监，现任华宝基金管理有限公司副总经理。", "page": 19, "section": null, "tags": []}, "B483": {"text": "周雷先生，督察长，硕士。曾任职于中国机械设备进出口总公司、北京证监局、中国证", "page": 19, "section": null, "tags": []}, "B484": {"text": "监会，曾任华宝证券有限责任公司首席风险官、合规总监。现任华宝基金管理有限公司督察", "page": 19, "section": null, "tags": []}, "B485": {"text": "长。", "page": 19, "section": null, "tags": []}, "B486": {"text": "李孟恒先生，首席信息官，硕士。曾在T.A. Consultanted LTD.从事开发及技术管理", "page": 19, "section": null, "tags": []}, "B487": {"text": "工作。2002年参与华宝基金管理有限公司筹备工作，后历任信息技术部资深系统工程师、", "page": 19, "section": null, "tags": []}, "B488": {"text": "部门副总经理，营运副总监兼信息技术部总经理，现任华宝基金管理有限公司首席信息官。", "page": 19, "section": null, "tags": []}, "B489": {"text": "2、本基金基金经理", "page": 19, "section": null, "tags": []}, "B490": {"text": "杨洋，硕士。曾在法兴银行、东北证券从事证券交易、研究、投资管理工作。2014年", "page": 19, "section": null, "tags": []}, "B491": {"text": "6月加入华宝基金管理有限公司，先后担任高级分析师、投资经理等职务。2021年5月起任", "page": 19, "section": null, "tags": []}, "B492": {"text": "华宝标普沪港深中国增强价值指数证券投资基金(LOF)、华宝标普美国品质消费股票指数证", "page": 19, "section": null, "tags": ["市场风险"]}, "B493": {"text": "券投资基金(LOF)、华宝港股通恒生中国(香港上市)25指数证券投资基金(LOF)、华宝英国", "page": 19, "section": null, "tags": ["市场风险", "汇率与跨境风险"]}, "B494": {"text": "富时100指数发起式证券投资基金、 华宝标普香港上市中国中小盘指数证券投资基金(LOF)、", "page": 19, "section": null, "tags": ["市场风险", "汇率与跨境风险"]}, "B495": {"text": "华宝标普石油天然气上游股票指数证券投资基金(LOF)、 华宝港股通恒生香港35指数证券投", "page": 19, "section": null, "tags": ["市场风险", "汇率与跨境风险"]}, "B496": {"text": "资基金(LOF)基金经理，2022年1月起任华宝致远混合型证券投资基金（QDII）基金经理。", "page": 19, "section": null, "tags": []}, "B497": {"text": "周晶，博士。先后在德亚投资(美国)、华宝基金、汇丰证券(美国)从事风控、投资分", "page": 19, "section": null, "tags": []}, "B498": {"text": "析等工作。2011年6月再次加入华宝基金管理有限公司，先后担任策略部总经理、首席策", "page": 19, "section": null, "tags": []}, "B499": {"text": "略分析师、海外投资部总经理等职务，现任公司总经理助理兼国际业务部总经理。 2013年", "page": 19, "section": null, "tags": []}, "B500": {"text": "6月至2015年11月任华宝兴业成熟市场动量优选证券投资基金基金经理，2014年9月起任", "page": 19, "section": null, "tags": []}, "B501": {"text": "华宝标普石油天然气上游股票指数证券投资基金(LOF)基金经理，2015年9月至2017年8", "page": 19, "section": null, "tags": ["市场风险"]}, "B502": {"text": "月任华宝兴业中国互联网股票型证券投资基金基金经理，2016年3月起任华宝标普美国品", "page": 19, "section": null, "tags": []}, "B503": {"text": "质消费股票指数证券投资基金(LOF)基金经理，2016年6月起任华宝标普香港上市中国中小", "page": 19, "section": null, "tags": ["市场风险", "汇率与跨境风险"]}, "B504": {"text": "盘指数证券投资基金(LOF)基金经理，2017年4月起任华宝港股通恒生中国(香港上市)25指", "page": 19, "section": null, "tags": ["市场风险", "汇率与跨境风险"]}, "B505": {"text": "数证券投资基金(LOF)基金经理，2018年3月起任华宝港股通恒生香港35指数证券投资基", "page": 19, "section": null, "tags": ["市场风险", "汇率与跨境风险"]}, "B506": {"text": "金(LOF)基金经理，2018年10月起任华宝标普沪港深中国增强价值指数证券投资基金(LOF)", "page": 19, "section": null, "tags": ["市场风险"]}, "B507": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 20, "section": null, "tags": ["市场风险"]}, "B508": {"text": "16", "page": 20, "section": null, "tags": []}, "B509": {"text": "基金经理，2019年11月起任华宝致远混合型证券投资基金（QDII）基金经理，2020年11", "page": 20, "section": null, "tags": []}, "B510": {"text": "月起任华宝英国富时100指数发起式证券投资基金基金经理。", "page": 20, "section": null, "tags": ["市场风险"]}, "B511": {"text": "3、 跨境公募基金权益投决会信息", "page": 20, "section": null, "tags": []}, "B512": {"text": "周晶先生，华宝基金管理有限公司总经理助理、国际业务部总经理、基金经理。", "page": 20, "section": null, "tags": []}, "B513": {"text": "钟奇先生，华宝基金管理有限公司研究总监、创新研究发展中心总经理、基金经理。", "page": 20, "section": null, "tags": []}, "B514": {"text": "周欣先生，华宝基金管理有限公司基金经理。", "page": 20, "section": null, "tags": []}, "B515": {"text": "杨洋先生，华宝基金管理有限公司基金经理。", "page": 20, "section": null, "tags": []}, "B516": {"text": "4、上述人员之间不存在近亲属关系。", "page": 20, "section": null, "tags": []}, "B517": {"text": "基金管理人应严格依法履行下列职责：", "page": 20, "section": null, "tags": []}, "B518": {"text": "1．依法募集本基金，办理或者委托经中国证监会认定的其他机构代为办理基金份额的发", "page": 20, "section": null, "tags": []}, "B519": {"text": "售、申购、赎回和登记事宜；", "page": 20, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B520": {"text": "2．办理本基金备案手续；", "page": 20, "section": null, "tags": []}, "B521": {"text": "3．对所管理的不同基金财产分别管理、分别记账，进行证券投资；", "page": 20, "section": null, "tags": []}, "B522": {"text": "4．按照基金合同的约定确定基金收益分配方案，及时向基金份额持有人分配收益；", "page": 20, "section": null, "tags": []}, "B523": {"text": "5．进行基金会计核算并编制基金财务会计报告；", "page": 20, "section": null, "tags": []}, "B524": {"text": "6．编制中期报告和年度报告；", "page": 20, "section": null, "tags": []}, "B525": {"text": "7．计算并公告基金净值信息，确定基金份额申购、赎回价格；", "page": 20, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B526": {"text": "8．办理与基金财产管理业务活动有关的信息披露事项；", "page": 20, "section": null, "tags": []}, "B527": {"text": "9．召集基金份额持有人大会；", "page": 20, "section": null, "tags": []}, "B528": {"text": "10．保存基金财产管理业务活动的记录、账册、报表和其他相关资料；", "page": 20, "section": null, "tags": []}, "B529": {"text": "11．以基金管理人名义，代表基金份额持有人利益行使诉讼权利或者实施其他法律行为 ；", "page": 20, "section": null, "tags": []}, "B530": {"text": "12．中国证监会规定的其他职责。", "page": 20, "section": null, "tags": []}, "B531": {"text": "1.基金管理人将遵守《基金法》 、 《证券法》等法律法规的相关规定，并建立健全内部", "page": 20, "section": null, "tags": []}, "B532": {"text": "控制制度，采取有效措施，防止违法违规行为的发生。", "page": 20, "section": null, "tags": []}, "B533": {"text": "2.基金管理人不从事下列行为：", "page": 20, "section": null, "tags": []}, "B534": {"text": "（1）不公平地对待其管理的不同基金财产；", "page": 20, "section": null, "tags": []}, "B535": {"text": "（2）利用基金财产为基金份额持有人以外的第三人牟取利益；", "page": 20, "section": null, "tags": []}, "B536": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 21, "section": null, "tags": ["市场风险"]}, "B537": {"text": "17", "page": 21, "section": null, "tags": []}, "B538": {"text": "（3）向基金份额持有人违规承诺收益或者承担损失；", "page": 21, "section": null, "tags": []}, "B539": {"text": "（4）依照法律、行政法规有关规定，由中国证监会规定禁止的其他行为。", "page": 21, "section": null, "tags": []}, "B540": {"text": "3.基金经理承诺", "page": 21, "section": null, "tags": []}, "B541": {"text": "（1）依照有关法律法规和基金合同的规定，本着谨慎的原则为基金份额持有人谋取", "page": 21, "section": null, "tags": []}, "B542": {"text": "最大利益；", "page": 21, "section": null, "tags": []}, "B543": {"text": "（2）不利用职务之便为自己、代理人、代表人、受雇人或任何其他第三人牟取不当", "page": 21, "section": null, "tags": []}, "B544": {"text": "利益；", "page": 21, "section": null, "tags": []}, "B545": {"text": "（3）不泄漏在任职期间知悉的有关证券、基金的商业秘密、尚未依法公开的基金投", "page": 21, "section": null, "tags": []}, "B546": {"text": "资内容、基金投资计划等信息；", "page": 21, "section": null, "tags": []}, "B547": {"text": "（4）不以任何形式为其他组织或个人进行证券交易。", "page": 21, "section": null, "tags": []}, "B548": {"text": "本基金管理人将借助于本公司已经开发的指数基金风险管理系统，对投资过程中的各", "page": 21, "section": null, "tags": ["市场风险"]}, "B549": {"text": "种风险使用风险控制指标进行量化分析和评估，并据此制定具体的控制措施，科学有效地", "page": 21, "section": null, "tags": []}, "B550": {"text": "进行投资风险管理。同时，加强投资者教育，向投资者充分揭示产品的风险，将该基金销", "page": 21, "section": null, "tags": []}, "B551": {"text": "售给适合的对象。", "page": 21, "section": null, "tags": []}, "B552": {"text": "（1）基金投资运作风险控制", "page": 21, "section": null, "tags": []}, "B553": {"text": "根据公司内控制度和投资管理制度的内容，结合本基金的特点，本基金投资运作风险", "page": 21, "section": null, "tags": []}, "B554": {"text": "控制主要内容包括：", "page": 21, "section": null, "tags": []}, "B555": {"text": "1) 风险控制制度", "page": 21, "section": null, "tags": []}, "B556": {"text": "为了配合风险管理指标的应用以及风险控制体系的贯彻，公司制定了系列风险管理制", "page": 21, "section": null, "tags": []}, "B557": {"text": "度，形成岗位自控、部门互控、监察检查、董事会合规审核委员会和公司内部控制委员会", "page": 21, "section": null, "tags": []}, "B558": {"text": "五道防线，全面而深入地对各种风险进行管理和控制。", "page": 21, "section": null, "tags": []}, "B559": {"text": "2) 跟踪偏离度和跟踪误差分析", "page": 21, "section": null, "tags": []}, "B560": {"text": "针对影响跟踪偏离度和跟踪误差的各种因素，制定合适的交易策略，减少跟踪偏离度", "page": 21, "section": null, "tags": []}, "B561": {"text": "和跟踪误差。每日跟踪基金组合与标的指数表现的偏离度，每月末、季度末定期分析基金", "page": 21, "section": null, "tags": ["市场风险"]}, "B562": {"text": "的实际组合与标的指数表现的累计偏离度、跟踪误差变化情况及其原因，并优化跟踪偏离", "page": 21, "section": null, "tags": ["市场风险"]}, "B563": {"text": "度管理方案。在正常情况下，本基金力争控制净值增长率与业绩比较基准之间的日均跟踪", "page": 21, "section": null, "tags": []}, "B564": {"text": "偏离度的绝对值不超过0.5%，年化跟踪误差不超过5%（以美元资产计价） 。", "page": 21, "section": null, "tags": []}, "B565": {"text": "3）加强系统建设", "page": 21, "section": null, "tags": []}, "B566": {"text": "加强系统建设，确保各项计算的准确性和信息传递的及时性。", "page": 21, "section": null, "tags": []}, "B567": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 22, "section": null, "tags": ["市场风险"]}, "B568": {"text": "18", "page": 22, "section": null, "tags": []}, "B569": {"text": "（2）汇率风险管理", "page": 22, "section": null, "tags": ["汇率与跨境风险"]}, "B570": {"text": "在充分做好风险批露的同时，本基金将采用以下措施控制汇率风险：", "page": 22, "section": null, "tags": ["汇率与跨境风险"]}, "B571": {"text": "投资人员将利用利率平价模型，考虑投资标的国的利率水平及变化趋势等因素，对汇", "page": 22, "section": null, "tags": ["市场风险"]}, "B572": {"text": "率变化进行预测。同时，对于短期内出现的某一货币汇率剧烈波动的情况，本基金也会采", "page": 22, "section": null, "tags": ["汇率与跨境风险"]}, "B573": {"text": "用一定的汇率对冲手段进行管理。", "page": 22, "section": null, "tags": ["汇率与跨境风险"]}, "B574": {"text": "（3）充分的风险揭示和投资者教育", "page": 22, "section": null, "tags": []}, "B575": {"text": "本基金属于跟踪海外细分行业的股票型基金，是基金中风险较高、预期收益也较高的", "page": 22, "section": null, "tags": []}, "B576": {"text": "品种， 适合风险承受能力较强的投资者。 基金管理人及其代销机构在向投资者销售产品时，", "page": 22, "section": null, "tags": []}, "B577": {"text": "一方面充分揭示产品的风险，另一方面尽量了解投资者的风险承受能力，将其卖给合适的", "page": 22, "section": null, "tags": []}, "B578": {"text": "投资者。", "page": 22, "section": null, "tags": []}, "B579": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 23, "section": null, "tags": ["市场风险"]}, "B580": {"text": "19", "page": 23, "section": null, "tags": []}, "B581": {"text": "五、 基金的募集", "page": 23, "section": null, "tags": []}, "B582": {"text": "本基金经中国证监会证监基金字［2011］1301号《关于同意华宝兴业标普石油天然气", "page": 23, "section": null, "tags": []}, "B583": {"text": "上游股票指数证券投资基金（LOF）募集的批复》核准，由基金管理人依照《基金法》 、 《运", "page": 23, "section": null, "tags": ["市场风险"]}, "B584": {"text": "作办法》 、 《销售办法》 、基金合同及其他有关规定募集，募集期从2011年9月5日起，至", "page": 23, "section": null, "tags": []}, "B585": {"text": "2011年9月23日止，共募集373，243，682.43份基金份额，有效认购户数为3,087户。", "page": 23, "section": null, "tags": []}, "B586": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 24, "section": null, "tags": ["市场风险"]}, "B587": {"text": "20", "page": 24, "section": null, "tags": []}, "B588": {"text": "六、 基金合同生效", "page": 24, "section": null, "tags": []}, "B589": {"text": "基金合同于2011年9月29日生效。本基金基金合同生效后，连续20个工作日出现基", "page": 24, "section": null, "tags": []}, "B590": {"text": "金份额持有人数量不满200人或者基金资产净值（A类美元份额所对应的基金资产净值需按", "page": 24, "section": null, "tags": []}, "B591": {"text": "计算日中国人民银行公布的人民币对美元汇率中间价折算为人民币） 低于5000万元情形的，", "page": 24, "section": null, "tags": ["汇率与跨境风险"]}, "B592": {"text": "基金管理人应当在定期报告中予以披露；连续60个工作日出现前述情形的，基金管理人应", "page": 24, "section": null, "tags": []}, "B593": {"text": "当向中国证监会报告并提出解决方案，如转换运作方式、与其他基金合并或者终止基金合同", "page": 24, "section": null, "tags": []}, "B594": {"text": "等，并召开基金份额持有人大会进行表决。", "page": 24, "section": null, "tags": []}, "B595": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 25, "section": null, "tags": ["市场风险"]}, "B596": {"text": "21", "page": 25, "section": null, "tags": []}, "B597": {"text": "七、基金上市交易", "page": 25, "section": null, "tags": []}, "B598": {"text": "1．上市交易的地点", "page": 25, "section": null, "tags": []}, "B599": {"text": "深圳证券交易所", "page": 25, "section": null, "tags": []}, "B600": {"text": "2．上市交易的时间", "page": 25, "section": null, "tags": []}, "B601": {"text": "本基金已于2012年6月8日在深圳证券交易所上市交易。基金上市后，登记在证券登", "page": 25, "section": null, "tags": []}, "B602": {"text": "记结算系统中的A类人民币份额可直接在深圳证券交易所上市交易；登记在注册登记系统中", "page": 25, "section": null, "tags": []}, "B603": {"text": "的A类人民币份额通过办理跨系统转托管业务将基金份额转至场内后，方可上市交易。", "page": 25, "section": null, "tags": []}, "B604": {"text": "3．上市交易的规则", "page": 25, "section": null, "tags": []}, "B605": {"text": "（1）本基金上市首日的开盘参考价为最近交易日A类人民币份额的基金份额净值；", "page": 25, "section": null, "tags": []}, "B606": {"text": "（2）本基金实行价格涨跌幅限制，涨跌幅比例为10%，自上市首日起实行；", "page": 25, "section": null, "tags": []}, "B607": {"text": "（3）本基金买入申报数量为100份或其整数倍；", "page": 25, "section": null, "tags": []}, "B608": {"text": "（4）本基金申报价格最小变动单位为0.001元人民币；", "page": 25, "section": null, "tags": []}, "B609": {"text": "（5）本基金上市交易遵循深圳证券交易所相关业务规则及规定。", "page": 25, "section": null, "tags": []}, "B610": {"text": "4．上市交易的费用", "page": 25, "section": null, "tags": []}, "B611": {"text": "本基金上市交易的费用按照深圳证券交易所的有关规定办理。", "page": 25, "section": null, "tags": []}, "B612": {"text": "5．上市交易的行情揭示", "page": 25, "section": null, "tags": []}, "B613": {"text": "本基金在深圳证券交易所挂牌交易，交易行情通过行情发布系统揭示。行情发布系统同", "page": 25, "section": null, "tags": []}, "B614": {"text": "时揭示基金最新的A类人民币份额基金份额净值。", "page": 25, "section": null, "tags": []}, "B615": {"text": "6．基金上市条件", "page": 25, "section": null, "tags": []}, "B616": {"text": "基金合同生效后具备下列条件，基金管理人可依据《深圳证券交易所证券投资基金上市", "page": 25, "section": null, "tags": []}, "B617": {"text": "规则》，向深圳证券交易所申请上市：", "page": 25, "section": null, "tags": []}, "B618": {"text": "（1）基金募集金额不低于2亿元；", "page": 25, "section": null, "tags": []}, "B619": {"text": "（2）基金份额持有人不少于1000人；", "page": 25, "section": null, "tags": []}, "B620": {"text": "（3）《深圳证券交易所证券投资基金上市规则》规定的其他条件。", "page": 25, "section": null, "tags": []}, "B621": {"text": "基金上市前，基金管理人应与深圳证券交易所签订上市协议书。基金获准在深圳证券交", "page": 25, "section": null, "tags": []}, "B622": {"text": "易所上市的，基金管理人应在基金上市日前至少3 个工作日发布基金上市交易公告书。", "page": 25, "section": null, "tags": []}, "B623": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 26, "section": null, "tags": ["市场风险"]}, "B624": {"text": "22", "page": 26, "section": null, "tags": []}, "B625": {"text": "本基金A类人民币份额在深圳证券交易所的上市交易需遵照《深圳证券交易所交易规", "page": 26, "section": null, "tags": []}, "B626": {"text": "则》、《深圳证券交易所证券投资基金上市规则》等有关规定。本基金C类人民币份额和A", "page": 26, "section": null, "tags": []}, "B627": {"text": "类美元份额不上市交易。", "page": 26, "section": null, "tags": []}, "B628": {"text": "基金份额上市交易期间出现下列情形之一的，深圳证券交易所可暂停基金的上市交易，", "page": 26, "section": null, "tags": []}, "B629": {"text": "并报中国证监会备案：", "page": 26, "section": null, "tags": []}, "B630": {"text": "1．不再具备本章第（一）款规定的上市条件；", "page": 26, "section": null, "tags": []}, "B631": {"text": "2．违反法律、行政法规，中国证监会决定暂停其上市；", "page": 26, "section": null, "tags": []}, "B632": {"text": "3．严重违反深圳证券交易所有关规则的；", "page": 26, "section": null, "tags": []}, "B633": {"text": "4．深圳证券交易所认为应当暂停上市的其他情形。", "page": 26, "section": null, "tags": []}, "B634": {"text": "发生上述暂停上市情形时， 基金管理人应在收到深圳证券交易所暂停基金上市的决定之", "page": 26, "section": null, "tags": []}, "B635": {"text": "日起2 个工作日内在指定媒介发布基金暂停上市公告。", "page": 26, "section": null, "tags": []}, "B636": {"text": "当暂停上市情形消除后，基金管理人应向深圳证券交易所提出恢复上市申请，经深圳证", "page": 26, "section": null, "tags": []}, "B637": {"text": "券交易所核准后可恢复本基金上市，并在指定媒介发布基金恢复上市公告。", "page": 26, "section": null, "tags": []}, "B638": {"text": "基金份额上市交易后，有下列情形之一的，深圳证券交易所可终止基金的上市交易，并", "page": 26, "section": null, "tags": []}, "B639": {"text": "报中国证监会备案：", "page": 26, "section": null, "tags": []}, "B640": {"text": "1．自暂停上市之日起半年内未能消除暂停上市原因的；", "page": 26, "section": null, "tags": []}, "B641": {"text": "2．基金合同终止；", "page": 26, "section": null, "tags": []}, "B642": {"text": "3．基金份额持有人大会决定终止上市；", "page": 26, "section": null, "tags": []}, "B643": {"text": "4．深圳证券交易所认为应当终止上市的其他情形。", "page": 26, "section": null, "tags": []}, "B644": {"text": "基金管理人应当在收到深圳证券交易所终止基金上市的决定之日起2 个工作日内发布", "page": 26, "section": null, "tags": []}, "B645": {"text": "基金终止上市公告。", "page": 26, "section": null, "tags": []}, "B646": {"text": "相关法律法规、 中国证监会及深圳证券交易所对基金上市交易的规则等相关规定进行调", "page": 26, "section": null, "tags": []}, "B647": {"text": "整的，本基金基金合同相应予以修改，且此项修改无须召开基金份额持有人大会，并在本基", "page": 26, "section": null, "tags": []}, "B648": {"text": "金更新的招募说明书中列示。", "page": 26, "section": null, "tags": []}, "B649": {"text": "若深圳证券交易所、中国证券登记结算有限责任公司增加了基金上市交易的的新功能，", "page": 26, "section": null, "tags": []}, "B650": {"text": "本基金管理人可以在履行适当的程序后增加相应功能。", "page": 26, "section": null, "tags": []}, "B651": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 27, "section": null, "tags": ["市场风险"]}, "B652": {"text": "23", "page": 27, "section": null, "tags": []}, "B653": {"text": "八、 基金份额的申购、赎回、非交易过户与转托管", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B654": {"text": "本基金的申购与赎回将通过销售机构进行。各类基金份额的销售机构或有不同。本基金", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B655": {"text": "场外申购和赎回场所为基金管理人的直销网点及基金场外代销机构；场内申购和赎回场所为", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B656": {"text": "深圳证券交易所内具有申赎业务资格的会员单位。 具体的销售网点和办理申购赎回业务的会", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B657": {"text": "员单位将由基金管理人在相关公告中列明。基金管理人可根据情况变更或增减代销机构，并", "page": 27, "section": null, "tags": []}, "B658": {"text": "在基金管理人网站公示。 投资人应当在销售机构办理基金销售业务的营业场所或按销售机构", "page": 27, "section": null, "tags": []}, "B659": {"text": "提供的其他方式办理基金份额的申购与赎回。", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B660": {"text": "1.开放日及开放时间", "page": 27, "section": null, "tags": []}, "B661": {"text": "本基金的开放日为深圳证券交易所的交易日， 但本基金投资的主要市场因节假日而休市", "page": 27, "section": null, "tags": []}, "B662": {"text": "的日期除外。 本基金投资的主要市场包括 ： 美国纽约证券交易所和美国纳斯达克证券交易所。", "page": 27, "section": null, "tags": []}, "B663": {"text": "投资人在开放日办理基金份额的申购和赎回，但基金管理人根据法律法规、中国证监会", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B664": {"text": "的要求或本基金合同的规定公告暂停申购、赎回时除外。场内业务办理时间为深圳证券交易", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B665": {"text": "所交易日交易时间，场外业务办理时间以各销售机构的规定为准。", "page": 27, "section": null, "tags": []}, "B666": {"text": "基金合同生效后， 若出现新的证券交易市场、 证券交易所交易时间变更或其他特殊情况，", "page": 27, "section": null, "tags": []}, "B667": {"text": "基金管理人将视情况对前述开放日及开放时间进行相应的调整， 但应在实施日前依照有关规", "page": 27, "section": null, "tags": []}, "B668": {"text": "定在指定媒介上公告。", "page": 27, "section": null, "tags": []}, "B669": {"text": "基金管理人不得在基金合同约定之外的日期或者时间办理基金份额的申购、 赎回或者转", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B670": {"text": "换。", "page": 27, "section": null, "tags": []}, "B671": {"text": "2.申购、赎回开始日及业务办理时间", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B672": {"text": "本基金自2011年10月25日起开始办理日常申购、赎回业务。", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B673": {"text": "在确定申购开始与赎回开始时间后，基金管理人应在申购、赎回开放日前依照有关规定", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B674": {"text": "在指定媒介上公告申购与赎回的开始时间。", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B675": {"text": "基金管理人不得在基金合同约定之外的日期或者时间办理基金份额的申购、 赎回或者转", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B676": {"text": "换。投资人在基金合同约定之外的日期和时间提出申购、赎回或转换申请的，其基金份额申", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B677": {"text": "购、赎回价格为下一开放日对应份额类别的基金份额申购、赎回的价格。", "page": 27, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B678": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 28, "section": null, "tags": ["市场风险"]}, "B679": {"text": "24", "page": 28, "section": null, "tags": []}, "B680": {"text": "1.“未知价”原则，即基金份额申购、赎回价格以受理申请当日收市后计算的对应份额", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B681": {"text": "类别的基金份额净值为基准进行计算；", "page": 28, "section": null, "tags": []}, "B682": {"text": "2.“金额申购、份额赎回”原则，即申购以金额申请，赎回以份额申请；", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B683": {"text": "3.场外赎回遵循 “先进先出”原则， 即基金份额持有人在场外销售机构赎回基金份额时，", "page": 28, "section": null, "tags": ["流动性风险"]}, "B684": {"text": "按照基金份额持有人场外认购、申购确认的先后次序进行顺序赎回；亦即对该基金份额持有", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B685": {"text": "人在该场外销售机构托管的基金份额进行处理时，认购、申购确认日期在先的基金份额先赎", "page": 28, "section": null, "tags": ["机制特有风险"]}, "B686": {"text": "回，认购、申购确认日期在后的基金份额后赎回，以确定所适用的赎回费率；场内赎回采用", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B687": {"text": "固定费率；", "page": 28, "section": null, "tags": []}, "B688": {"text": "4.当日的申购与赎回申请可以在基金管理人规定的时间以内撤销， 在当日业务办理时间", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B689": {"text": "结束后不得撤销；", "page": 28, "section": null, "tags": []}, "B690": {"text": "5.投资人办理场外A类人民币份额、A类美元份额和C类人民币份额的申购、赎回应使", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B691": {"text": "用基金账户，办理场内A类人民币份额的申购、赎回应使用深圳证券账户；", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B692": {"text": "6.投资人办理本基金A类人民币份额的场内申购、 赎回业务时， 需遵守深圳证券交易所、", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B693": {"text": "中国证券登记结算有限责任公司的相关业务规则。若相关法律法规、中国证监会、深圳证券", "page": 28, "section": null, "tags": []}, "B694": {"text": "交易所或中国证券登记结算有限责任公司对场内申购、赎回业务规则有新的规定，按新规定", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B695": {"text": "执行；", "page": 28, "section": null, "tags": []}, "B696": {"text": "7. “分币种申赎”原则，即以人民币申购获得A类人民币份额和C类人民币份额，赎", "page": 28, "section": null, "tags": ["机制特有风险"]}, "B697": {"text": "回A类人民币份额和C类人民币份额时获得人民币赎回款，以美元申购获得A类美元份额，", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B698": {"text": "赎回A类美元份额获得美元赎回款，依此类推。", "page": 28, "section": null, "tags": ["流动性风险"]}, "B699": {"text": "基金管理人可根据基金运作的实际情况依法对上述原则进行调整。 基金管理人必须按有", "page": 28, "section": null, "tags": []}, "B700": {"text": "关规定在指定媒介上公告。", "page": 28, "section": null, "tags": []}, "B701": {"text": "1.申购和赎回的申请方式", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B702": {"text": "投资人必须根据销售机构规定的程序， 在开放日的具体业务办理时间内提出申购或赎回", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B703": {"text": "的申请。", "page": 28, "section": null, "tags": []}, "B704": {"text": "投资人在提交申购申请时须按销售机构规定的方式备足申购资金， 投资人在提交赎回申", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B705": {"text": "请时须持有足够的基金份额余额，否则所提交的申购、赎回申请无效。", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B706": {"text": "2.申购和赎回申请的确认", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B707": {"text": "基金管理人应以交易时间结束前受理申购和赎回申请的当日作为申购或赎回申请日(T", "page": 28, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B708": {"text": "日)，在正常情况下，本基金注册登记机构在T+2日内对该申请的有效性进行确认。T日提", "page": 28, "section": null, "tags": []}, "B709": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 29, "section": null, "tags": ["市场风险"]}, "B710": {"text": "25", "page": 29, "section": null, "tags": []}, "B711": {"text": "交的有效申请， 投资人应当在T+3日后(包括该日)尽快到销售网点柜台或以销售机构规定的", "page": 29, "section": null, "tags": []}, "B712": {"text": "其他方式查询申请的确认情况， 如经其查询发现确认的信息与其提交申请中所记载的相应信", "page": 29, "section": null, "tags": []}, "B713": {"text": "息存在任何不一致之处， 应于五个工作日内向相应销售机构提出， 否则由此导致的任何损失，", "page": 29, "section": null, "tags": []}, "B714": {"text": "由投资人自行承担。基金销售机构对申购、赎回申请的受理并不代表申请一定成功，而仅代", "page": 29, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B715": {"text": "表销售机构确实接收到申购、赎回申请。申购、赎回申请的确认以注册登记结算机构或基金", "page": 29, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B716": {"text": "管理人的确认结果为准。如因申请未得到注册登记结算机构的确认而造成损失，由投资人自", "page": 29, "section": null, "tags": []}, "B717": {"text": "行承担。", "page": 29, "section": null, "tags": []}, "B718": {"text": "在法律法规允许的范围内，基金管理人可根据业务规则，对上述业务办理时间进行调整", "page": 29, "section": null, "tags": []}, "B719": {"text": "并公告。", "page": 29, "section": null, "tags": []}, "B720": {"text": "3.申购和赎回的款项支付", "page": 29, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B721": {"text": "申购采用全额缴款方式，若申购资金在规定时间内未全额到账则申购不成功。若申购不", "page": 29, "section": null, "tags": ["机制特有风险"]}, "B722": {"text": "成功或无效， 基金管理人或基金管理人指定的代销机构将投资人已缴付的申购款项本金退还", "page": 29, "section": null, "tags": ["机制特有风险"]}, "B723": {"text": "给投资人。", "page": 29, "section": null, "tags": []}, "B724": {"text": "投资人T日提出的赎回申请被确认有效后， 基金管理人将通过登记结算机构及其相关销", "page": 29, "section": null, "tags": ["流动性风险"]}, "B725": {"text": "售机构在T＋10日(包括该日)内将赎回款项划往基金份额持有人帐户。", "page": 29, "section": null, "tags": ["流动性风险"]}, "B726": {"text": "在发生巨额赎回时，款项的支付办法参照本基金合同有关条款处理。", "page": 29, "section": null, "tags": ["流动性风险"]}, "B727": {"text": "1.投资人通过场内或场外办理申购A类人民币份额或C类人民币份额时，直销e网金、", "page": 29, "section": null, "tags": ["机制特有风险"]}, "B728": {"text": "代销机构的代销网点及网上交易系统每个基金账户首笔申购和追加申购的每笔金额不得低", "page": 29, "section": null, "tags": ["机制特有风险"]}, "B729": {"text": "于1元人民币（含申购费） 。通过直销柜台首次申购的最低金额为10万元人民币（含申购", "page": 29, "section": null, "tags": ["机制特有风险"]}, "B730": {"text": "费） ，追加申购最低金额为1元人民币（含申购费） 。投资人通过场内办理申购A类人民币份", "page": 29, "section": null, "tags": ["机制特有风险"]}, "B731": {"text": "额时，每个账户每笔申购和追加申购的每笔金额不得低于100元人民币（含申购费） 。", "page": 29, "section": null, "tags": ["机制特有风险"]}, "B732": {"text": "2.投资人可将其所持有的A类人民币份额和C类人民币份额全部或部分基金份额赎回。", "page": 29, "section": null, "tags": ["流动性风险"]}, "B733": {"text": "本基金场外A类人民币份额和C类人民币份额按照份额进行赎回， 单笔赎回份额不得低于1", "page": 29, "section": null, "tags": ["流动性风险"]}, "B734": {"text": "份，赎回份额精确到小数点后两位；基金份额持有人赎回时或赎回后在销售机构（网点或网", "page": 29, "section": null, "tags": ["流动性风险"]}, "B735": {"text": "上交易系统） 保留的场外A类人民币份额和C类人民币份额余额不足1份的，在赎回时需一", "page": 29, "section": null, "tags": ["流动性风险"]}, "B736": {"text": "次全部赎回。 本基金场内A类人民币份额按照份额进行赎回， 单笔赎回份额不得低于100份，", "page": 29, "section": null, "tags": ["流动性风险"]}, "B737": {"text": "赎回份额精确到整数位 ； 基金份额持有人赎回时或赎回后在销售机构 （网点或网上交易系统）", "page": 29, "section": null, "tags": ["流动性风险"]}, "B738": {"text": "保留的场内A类人民币份额余额不足100份的，在赎回时需一次全部赎回。", "page": 29, "section": null, "tags": ["流动性风险"]}, "B739": {"text": "3. 通过已开通美元份额申购赎回业务的销售机构申购本基金美元份额时，单笔申购最", "page": 29, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B740": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 30, "section": null, "tags": ["市场风险"]}, "B741": {"text": "26", "page": 30, "section": null, "tags": []}, "B742": {"text": "低金额为 1000 美元（含申购费） 。各销售机构对最低申购限额及交易级差有其他规定的，以", "page": 30, "section": null, "tags": ["机制特有风险"]}, "B743": {"text": "各销售机构的业务规定为准。", "page": 30, "section": null, "tags": []}, "B744": {"text": "4. 本基金A类美元份额按照份额进行赎回，单笔赎回份额不得低于1000份。基金份额", "page": 30, "section": null, "tags": ["流动性风险"]}, "B745": {"text": "持有人赎回时或赎回后在销售机构保留的基金份额余额不足1000份的，在赎回时必须一次", "page": 30, "section": null, "tags": ["流动性风险"]}, "B746": {"text": "全部赎回。", "page": 30, "section": null, "tags": ["流动性风险"]}, "B747": {"text": "5．基金管理人可以规定投资人每个交易账户的最低基金份额余额。", "page": 30, "section": null, "tags": []}, "B748": {"text": "6.当接受申购申请对存量基金份额持有人利益构成潜在重大不利影响时，基金管理人", "page": 30, "section": null, "tags": ["机制特有风险"]}, "B749": {"text": "应当采取设定单一投资者申购金额上限或基金单日净申购比例上限、拒绝大额申购、暂停基", "page": 30, "section": null, "tags": ["机制特有风险"]}, "B750": {"text": "金申购等措施，切实保护存量基金份额持有人的合法权益。具体请参见相关公告。", "page": 30, "section": null, "tags": ["机制特有风险"]}, "B751": {"text": "7.基金管理人可以根据市场情况，在法律法规允许的情况下，调整上述规定申购金额和", "page": 30, "section": null, "tags": ["机制特有风险"]}, "B752": {"text": "赎回份额的数量限制、单个投资者单日或单笔申购金额上限、本基金总规模限额和单日净申", "page": 30, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B753": {"text": "购比例上限等。 基金管理人必须在调整前依照有关规定在指定媒介上公告并报中国证监会备", "page": 30, "section": null, "tags": []}, "B754": {"text": "案。", "page": 30, "section": null, "tags": []}, "B755": {"text": "1．申购费率与赎回费率", "page": 30, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B756": {"text": "1）A类人民币份额申购费率", "page": 30, "section": null, "tags": ["机制特有风险"]}, "B757": {"text": "投资人在一天之内如果有多笔申购，适用费率按单笔分别计算。本基金A类人民币份额", "page": 30, "section": null, "tags": ["机
