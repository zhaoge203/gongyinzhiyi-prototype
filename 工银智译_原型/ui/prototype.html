 null, "tags": ["市场风险"]}, "B803": {"text": "断，从", "page": 23, "section": null, "tags": []}, "B804": {"text": "而制定并调整组合的期限和品种配置，以适应短期市场利率的预期变化，追求更高收益。", "page": 23, "section": null, "tags": ["市场风险"]}, "B805": {"text": "2.期限配置策略", "page": 23, "section": null, "tags": []}, "B806": {"text": "根据对短期利率走势的判断确定并调整组合的平均期限。在预期短期利率上升时，缩短组合的平均", "page": 23, "section": null, "tags": ["市场风险"]}, "B807": {"text": "限，以规避资本损失或获得较高的再投资收益；在预期短期利率下降时，延长组合的平均期限，以", "page": 23, "section": null, "tags": ["市场风险"]}, "B808": {"text": "获得资", "page": 23, "section": null, "tags": []}, "B809": {"text": "本利得或锁定较高的利率水平。", "page": 23, "section": null, "tags": ["市场风险"]}, "B810": {"text": "3.类属和品种配置策略", "page": 23, "section": null, "tags": []}, "B811": {"text": "本基金的投资工具包括在交易所交易的短期国债、企业债和债券回购，在银行间市场交易的短期国", "page": 23, "section": null, "tags": []}, "B812": {"text": "债、", "page": 23, "section": null, "tags": []}, "B813": {"text": "金融债、央行票据和债券回购，以及同业存款等品种。由于上述工具具有不同的流动性特征和收益", "page": 23, "section": null, "tags": ["流动性风险"]}, "B814": {"text": "特征，", "page": 23, "section": null, "tags": []}, "B815": {"text": "因此，本基金将研究它们的市场准入政策变化、参与主体资金供求变化、市场容量和税收政策等因", "page": 23, "section": null, "tags": []}, "B816": {"text": "素，制", "page": 23, "section": null, "tags": []}, "B817": {"text": "定并调整类属和品种配置，一方面提高组合的收益性，另一方面满足组合的流动性要求。", "page": 23, "section": null, "tags": ["流动性风险"]}, "B818": {"text": "4.利用短期市场机会的灵活策略", "page": 23, "section": null, "tags": []}, "B819": {"text": "由于市场分割、信息不对称、发行人信用等级意外变化等情况会造成短期内市场失衡；新股、新债", "page": 23, "section": null, "tags": ["信用风险", "机制特有风险"]}, "B820": {"text": "行以及年末效应等因素会使市场资金供求发生短时的失衡。这种失衡将带来一定市场机会。通过分", "page": 23, "section": null, "tags": []}, "B821": {"text": "析短期", "page": 23, "section": null, "tags": []}, "B822": {"text": "市场机会发生的动因，研究其中的规律，据此调整组合配置，改进操作方法，积极利用市场机会获", "page": 24, "section": null, "tags": []}, "B823": {"text": "得超额", "page": 24, "section": null, "tags": []}, "B824": {"text": "收益。", "page": 24, "section": null, "tags": []}, "B825": {"text": "在上述投资策略实施的过程中，本基金特别重视风险控制，通过平均到期期限、组合的分散程度、", "page": 24, "section": null, "tags": []}, "B826": {"text": "券信用等级等指标的严格控制，保证基金风险得到良好的控制。", "page": 24, "section": null, "tags": ["信用风险"]}, "B827": {"text": "1.投资计划的拟定", "page": 24, "section": null, "tags": []}, "B828": {"text": "基金经理每月拟定投资计划，报投资决策委员会审批。基金经理根据对未来一段时间短期利率的判", "page": 24, "section": null, "tags": ["市场风险"]}, "B829": {"text": "断，", "page": 24, "section": null, "tags": []}, "B830": {"text": "以及各类货币市场工具的流动性和信用风险的变化情况，结合目前基金组合实际投资比例，制定下", "page": 24, "section": null, "tags": ["流动性风险", "信用风险"]}, "B831": {"text": "一月各", "page": 24, "section": null, "tags": []}, "B832": {"text": "期限、各品种货币市场工具的配置目标、变动范围和调整方案。", "page": 24, "section": null, "tags": []}, "B833": {"text": "如果基金经理认为影响各期限、品种收益率的因素产生了重大变化，还可以临时提出新的投资计划", "page": 24, "section": null, "tags": []}, "B834": {"text": "并由投资决策委员会审批。", "page": 24, "section": null, "tags": []}, "B835": {"text": "2.投资计划的实施", "page": 24, "section": null, "tags": []}, "B836": {"text": "基金经理在投资计划规定的期限、品种配置目标和变动范围内，根据市场的实际情况，采用积极利", "page": 24, "section": null, "tags": []}, "B837": {"text": "市场短期机会的灵活策略，通过动态调整优化投资组合，追求当期收益最大化。在动态调整的过程", "page": 24, "section": null, "tags": []}, "B838": {"text": "中，基", "page": 24, "section": null, "tags": []}, "B839": {"text": "金经理将细致计算交易成本和市场流动性特征，平衡收益、成本与流动性的关系。", "page": 24, "section": null, "tags": ["流动性风险"]}, "B840": {"text": "3.具体品种的选择", "page": 24, "section": null, "tags": []}, "B841": {"text": "具有下列一项或多项特征的证券或回购是本基金重点投资的对象：", "page": 24, "section": null, "tags": []}, "B842": {"text": "（1）在相似到期期限和信用等级下，收益率较高的债券、票据或债券回购；", "page": 24, "section": null, "tags": ["信用风险"]}, "B843": {"text": "（2）相似条件下，流动性较高的债券、票据；", "page": 24, "section": null, "tags": ["流动性风险"]}, "B844": {"text": "（3）相似条件下，交易对手信用等级较高的债券、票据或债券回购。", "page": 24, "section": null, "tags": ["信用风险"]}, "B845": {"text": "4.交易执行", "page": 24, "section": null, "tags": []}, "B846": {"text": "交易管理部负责执行基金经理下达的交易指令，同时履行一线监控的职能。在交易指令执行前，交", "page": 24, "section": null, "tags": []}, "B847": {"text": "管理部对交易指令进行复核，确保交易指令执行后基金各项投资比例符合法律法规以及基金合同、", "page": 24, "section": null, "tags": []}, "B848": {"text": "招募说", "page": 24, "section": null, "tags": []}, "B849": {"text": "明书的各项规定。", "page": 24, "section": null, "tags": []}, "B850": {"text": "5.组合监控与调整", "page": 24, "section": null, "tags": []}, "B851": {"text": "基金经理将密切关注宏观经济和市场变化，结合基金申购和赎回导致的现金流量情况，每日对组合", "page": 24, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B852": {"text": "风险和流动性进行监控，确保基金的各项风险控制指标维持在合理水平，确保组合的流动性能够满", "page": 24, "section": null, "tags": ["流动性风险"]}, "B853": {"text": "足投资", "page": 24, "section": null, "tags": []}, "B854": {"text": "者的赎回要求。当组合中货币市场工具价格波动引起组合投资比例不能符合控制标准时，或当组合", "page": 24, "section": null, "tags": ["流动性风险"]}, "B855": {"text": "中货币", "page": 24, "section": null, "tags": []}, "B856": {"text": "市场工具信用评级调整导致信用等级不符合要求时，基金经理应采取有效的措施，在合理的时间内", "page": 24, "section": null, "tags": ["信用风险"]}, "B857": {"text": "调整组", "page": 24, "section": null, "tags": []}, "B858": {"text": "合。", "page": 25, "section": null, "tags": []}, "B859": {"text": "本基金投资组合符合以下规定：", "page": 25, "section": null, "tags": []}, "B860": {"text": "1.本基金与由本基金管理人管理的其他基金持有一家公司发行的证券，不超过该证券的10%。", "page": 25, "section": null, "tags": []}, "B861": {"text": "2.除本基金合同另有约定外，本基金投资组合的平均剩余期限不得超过120天，平均剩余存续期不得", "page": 25, "section": null, "tags": []}, "B862": {"text": "超过240天。", "page": 25, "section": null, "tags": []}, "B863": {"text": "基金投资组合平均剩余期限和平均剩余存续期限的计算方法参照《货币市场基金监督管理办法》及", "page": 25, "section": null, "tags": []}, "B864": {"text": "关法律法规的规定执行。如法律法规或监管机构对剩余期限或剩余存续期限计算方法另有规定的", "page": 25, "section": null, "tags": []}, "B865": {"text": "，从其规", "page": 25, "section": null, "tags": []}, "B866": {"text": "定。", "page": 25, "section": null, "tags": []}, "B867": {"text": "3.同一机构发行的债券、非金融企业债务融资工具及其作为原始权益人的资产支持证券占基金资产", "page": 25, "section": null, "tags": ["机制特有风险"]}, "B868": {"text": "值的比例合计不得超过10%，国债、中央银行票据、政策性金融债券除外。本基金投资的债券与非", "page": 25, "section": null, "tags": []}, "B869": {"text": "金融企", "page": 25, "section": null, "tags": []}, "B870": {"text": "业债务融资工具须具有评级资质的资信评级机构进行持续信用评级，信用评级主要参照最近一个会", "page": 25, "section": null, "tags": ["信用风险"]}, "B871": {"text": "计年度", "page": 25, "section": null, "tags": []}, "B872": {"text": "的主体信用评级，如果对发行人同时有两家以上境内机构评级的，应采用孰低原则确定其评级，并", "page": 25, "section": null, "tags": ["信用风险"]}, "B873": {"text": "结合基", "page": 25, "section": null, "tags": []}, "B874": {"text": "金管理人内部信用评级进行独立判断与认定。", "page": 25, "section": null, "tags": ["信用风险"]}, "B875": {"text": "4.本基金投资于有固定期限银行存款的比例，不得超过基金资产净值的30%，但投资于有存款期限，", "page": 25, "section": null, "tags": []}, "B876": {"text": "根据协议可提前支取的银行存款不受上述比例限制；投资于具有基金托管人资格的同一商业银行的", "page": 25, "section": null, "tags": []}, "B877": {"text": "银行存", "page": 25, "section": null, "tags": []}, "B878": {"text": "款、同业存单占基金资产净值的比例合计不得超过20%，投资于不具有基金托管人资格的同一商业", "page": 25, "section": null, "tags": []}, "B879": {"text": "银行的", "page": 25, "section": null, "tags": []}, "B880": {"text": "银行存款、同业存单占基金资产净值的比例合计不得超过5%。", "page": 25, "section": null, "tags": []}, "B881": {"text": "5.（1）现金、国债、中央银行票据、政策性金融债券占基金资产净值的比例合计不得低于5%；", "page": 25, "section": null, "tags": []}, "B882": {"text": "（2）现金、国债、中央银行票据、政策性金融债券以及五个交易日内到期的其他金融工具占基金资", "page": 25, "section": null, "tags": []}, "B883": {"text": "产净值的比例合计不得低于10%；当本基金前10名份额持有人的持有份额合计超过基金总份额的", "page": 25, "section": null, "tags": []}, "B884": {"text": "50%时，", "page": 25, "section": null, "tags": []}, "B885": {"text": "上述比例合计不得低于30%；当本基金前10名份额持有人的持有份额合计超过基金总份额的20%时", "page": 25, "section": null, "tags": []}, "B886": {"text": "，上", "page": 25, "section": null, "tags": []}, "B887": {"text": "述比例合计不得低于20%；", "page": 25, "section": null, "tags": []}, "B888": {"text": "（3）除发生巨额赎回、连续3个交易日累计赎回20%以上或者连续5个交易日累计赎回30%以上的", "page": 25, "section": null, "tags": ["流动性风险"]}, "B889": {"text": "情形外，债券正回购的资金余额占基金资产净值的比例不得超过20%。", "page": 25, "section": null, "tags": []}, "B890": {"text": "6.本基金投资于主体信用评级低于AAA的机构发行的金融工具占基金资产净值的比例合计不得超过", "page": 25, "section": null, "tags": ["信用风险"]}, "B891": {"text": "10%，其中单一机构发行的金融工具占基金资产净值的比例不得超过2%。前述金融工具包括债券、", "page": 25, "section": null, "tags": []}, "B892": {"text": "非金", "page": 25, "section": null, "tags": []}, "B893": {"text": "融企业债务融资工具、银行存款、同业存单、相关机构作为原始权益人的资产支持证券及中国证监", "page": 25, "section": null, "tags": ["机制特有风险"]}, "B894": {"text": "会认定", "page": 25, "section": null, "tags": []}, "B895": {"text": "的其他品种", "page": 25, "section": null, "tags": []}, "B896": {"text": "7.本基金拟投资于主体信用评级低于AA+的商业银行的银行存款与同业存单的，应当经基金管理人", "page": 25, "section": null, "tags": ["信用风险"]}, "B897": {"text": "事会审议批准，相关交易应当事先征得基金托管人的同意，并作为重大事项履行信息披露程序。", "page": 26, "section": null, "tags": []}, "B898": {"text": "8.本基金管理人管理的全部货币市场基金投资同一商业银行的银行存款及其发行的同业存单与债券", "page": 26, "section": null, "tags": []}, "B899": {"text": "不得超过该商业银行最近一个季度末净资产的10%。", "page": 26, "section": null, "tags": []}, "B900": {"text": "9.当基金前10名份额持有人的持有份额合计超过基金总份额的50%时，基金投资组合的平均剩余期限", "page": 26, "section": null, "tags": []}, "B901": {"text": "不得超过60天，平均剩余存续期不得超过120天。当基金前10名份额持有人的持有份额合计超过基金", "page": 26, "section": null, "tags": []}, "B902": {"text": "份额的20%时，基金投资组合的平均剩余期限不得超过90天，平均剩余存续期不得超过180天。", "page": 26, "section": null, "tags": []}, "B903": {"text": "10.本基金主动投资于流动性受限资产的市值合计不得超过该基金资产净值的10%。因证券市场波动", "page": 26, "section": null, "tags": ["流动性风险", "市场风险"]}, "B904": {"text": "基金规模变动等基金管理人之外的因素致使基金不符合前述所规定比例限制的，基金管理人不得主", "page": 26, "section": null, "tags": []}, "B905": {"text": "动新增", "page": 26, "section": null, "tags": []}, "B906": {"text": "流动性受限资产的投资。", "page": 26, "section": null, "tags": ["流动性风险"]}, "B907": {"text": "11.本基金与私募类证券资管产品及中国证监会认定的其他主体为交易对手开展逆回购交易的，可接", "page": 26, "section": null, "tags": []}, "B908": {"text": "质押品的资质要求应当与本基金合同约定的投资范围保持一致。", "page": 26, "section": null, "tags": []}, "B909": {"text": "12.法律法规或监管部门对上述比例限制另有规定的，从其规定。", "page": 26, "section": null, "tags": []}, "B910": {"text": "除上述第2、5（1）、10、11项外，因基金规模或市场变化、基金份额持有人赎回等原因导致投资组", "page": 26, "section": null, "tags": ["流动性风险"]}, "B911": {"text": "超出上述规定不在限制之内，基金管理人应在合理期限内进行调整，以达到上述标准。", "page": 26, "section": null, "tags": []}, "B912": {"text": "本基金不得进行如下行为（法律法规或监管部门另有规定的除外）：", "page": 26, "section": null, "tags": []}, "B913": {"text": "1.投资于股票。", "page": 26, "section": null, "tags": []}, "B914": {"text": "2.投资于可转换债券、可交换债券。", "page": 26, "section": null, "tags": []}, "B915": {"text": "3.投资于以定期存款利率为基准利率的浮动利率债券，已进入最后一个利率调整期的除外。", "page": 26, "section": null, "tags": ["市场风险"]}, "B916": {"text": "4.投资于信用等级在AA+以下的债券与非金融企业债务融资工具。", "page": 26, "section": null, "tags": ["信用风险"]}, "B917": {"text": "5.投资于中国证监会、中国人民银行禁止投资的其他金融工具。", "page": 26, "section": null, "tags": []}, "B918": {"text": "6.从事法律法规及监管机关规定禁止从事的其他行为。", "page": 26, "section": null, "tags": []}, "B919": {"text": "法律法规或监管部门取消上述限制后，本基金不受上述规定的限制。", "page": 26, "section": null, "tags": []}, "B920": {"text": "十九、基金的融资", "page": 26, "section": null, "tags": []}, "B921": {"text": "本基金可以按照国家的有关规定进行融资。", "page": 26, "section": null, "tags": []}, "B922": {"text": "二十、基金资产", "page": 26, "section": null, "tags": []}, "B923": {"text": "本基金基金资产总值包括基金所拥有的各类有价证券、银行存款本息及其他投资等的价值总和。", "page": 26, "section": null, "tags": []}, "B924": {"text": "本基金基金资产净值是指基金资产总值减去负债后的价值。", "page": 26, "section": null, "tags": []}, "B925": {"text": "本基金基金资产独立于基金管理人及基金托管人的资产，并由基金托管人保管。基金管理人、基金", "page": 26, "section": null, "tags": []}, "B926": {"text": "管人以其自有资产承担法律责任，其债权人不得对本基金基金资产行使请求冻结、扣押和其他权利", "page": 26, "section": null, "tags": []}, "B927": {"text": "。除依", "page": 26, "section": null, "tags": []}, "B928": {"text": "《基金法》、基金合同及其他有关规定处分外，基金资产不得被处分。", "page": 26, "section": null, "tags": []}, "B929": {"text": "本基金需按有关规定开立基金专用银行存款账户以及证券账户，上述账户与基金管理人和基金托管", "page": 27, "section": null, "tags": []}, "B930": {"text": "自有的资产账户以及其他基金资产账户独立。", "page": 27, "section": null, "tags": []}, "B931": {"text": "二十一、基金资产计价", "page": 27, "section": null, "tags": []}, "B932": {"text": "基金资产的计价目的是客观、准确地反映基金资产的价值。", "page": 27, "section": null, "tags": []}, "B933": {"text": "本基金的计价日为相关证券交易市场的正常交易日，定价时点为上述证券交易市场的收市时间，主", "page": 27, "section": null, "tags": []}, "B934": {"text": "以上海证券交易所、深圳证券交易所为准。", "page": 27, "section": null, "tags": []}, "B935": {"text": "基金管理人可在有关法律法规允许的条件下，参照其他相关证券交易市场的交易日和交易时间，确", "page": 27, "section": null, "tags": []}, "B936": {"text": "变更本基金的计价日或定价时点并公告。", "page": 27, "section": null, "tags": []}, "B937": {"text": "本基金依法持有的银行存款、各类有价证券等。", "page": 27, "section": null, "tags": []}, "B938": {"text": "本基金按以下方法进行计价：", "page": 27, "section": null, "tags": []}, "B939": {"text": "1、债券（包括票据）采用摊余成本法进行估值，即估值对象以买入成本列示，按票面利率或商定利", "page": 27, "section": null, "tags": ["市场风险"]}, "B940": {"text": "率并考虑其买入时的溢价与折价，在其剩余期限内按实际利率法进行摊销，每日计提收益。本基金", "page": 27, "section": null, "tags": ["市场风险"]}, "B941": {"text": "不采用", "page": 27, "section": null, "tags": []}, "B942": {"text": "市场利率和上市交易的债券和票据的市价计算基金资产净值。", "page": 27, "section": null, "tags": ["市场风险"]}, "B943": {"text": "2、债券回购按成本法估值。", "page": 27, "section": null, "tags": []}, "B944": {"text": "3、基金持有的银行存款以本金列示，按商定利率逐日计提利息。", "page": 27, "section": null, "tags": ["市场风险"]}, "B945": {"text": "4、为了避免采用“摊余成本法”计算的基金资产净值与按市场利率和交易市价计算的基金资产净值", "page": 27, "section": null, "tags": ["市场风险"]}, "B946": {"text": "发生重大偏离，从而对基金份额持有人的利益产生稀释和不公平的结果，基金管理人于每一估值日", "page": 27, "section": null, "tags": []}, "B947": {"text": "，采用", "page": 27, "section": null, "tags": []}, "B948": {"text": "估值技术，对基金持有的估值对象进行重新评估，即“影子定价”。当影子定价确定的基金资产净", "page": 27, "section": null, "tags": []}, "B949": {"text": "值与摊", "page": 27, "section": null, "tags": []}, "B950": {"text": "余成本法计算的基金资产净值的负偏离度绝对值达到0.25%时，基金管理人应当在5个交易日内将负", "page": 27, "section": null, "tags": []}, "B951": {"text": "偏离", "page": 27, "section": null, "tags": []}, "B952": {"text": "度绝对值调整到0.25%以内。当正偏离度绝对值达到0.5%时，基金管理人应当暂停接受申购并在5个", "page": 27, "section": null, "tags": ["机制特有风险"]}, "B953": {"text": "易日内将正偏离度绝对值调整到0.5%以内。当负偏离度绝对值达到0.5%时，基金管理人应当使用风", "page": 27, "section": null, "tags": []}, "B954": {"text": "险准", "page": 27, "section": null, "tags": []}, "B955": {"text": "备金或者固有资金弥补潜在资产损失，将负偏离度绝对值控制在0.5%以内。当负偏离度绝对值连续", "page": 27, "section": null, "tags": []}, "B956": {"text": "两个交", "page": 27, "section": null, "tags": []}, "B957": {"text": "易日超过0.5%时，基金管理人应当采用公允价值估值方法对持有投资组合的账面价值进行调整，或", "page": 27, "section": null, "tags": []}, "B958": {"text": "者采取", "page": 27, "section": null, "tags": []}, "B959": {"text": "暂停接受所有赎回申请并终止基金合同进行财产清算等措施。", "page": 27, "section": null, "tags": ["流动性风险"]}, "B960": {"text": "5、如有确凿证据表明按上述规定不能客观反映基金资产公允价值的，基金管理人可根据具体情况，", "page": 27, "section": null, "tags": []}, "B961": {"text": "在与基金托管人商议后，按最能反映基金资产公允价值的方法估值。", "page": 27, "section": null, "tags": []}, "B962": {"text": "6、国家有最新规定的，按其规定进行估值。", "page": 28, "section": null, "tags": []}, "B963": {"text": "7、特殊情形的处理", "page": 28, "section": null, "tags": []}, "B964": {"text": "基金管理人及基金托管人按本条有关估值方法的第4、5项条款进行估值时，所造成的偏差不作为基", "page": 28, "section": null, "tags": []}, "B965": {"text": "资产净值错误处理。", "page": 28, "section": null, "tags": []}, "B966": {"text": "基金的日常计价由基金管理人进行。基金管理人完成计价后，将计价结果加盖业务公章以书面形式", "page": 28, "section": null, "tags": []}, "B967": {"text": "送基金托管人，基金托管人按照基金合同规定的计价方法、时间与程序进行复核；基金托管人复核", "page": 28, "section": null, "tags": []}, "B968": {"text": "无误后", "page": 28, "section": null, "tags": []}, "B969": {"text": "加盖业务公章返回给基金管理人；月末、年中和年末计价复核与基金会计账目的核对同时进行。", "page": 28, "section": null, "tags": []}, "B970": {"text": "1.基金投资涉及的证券交易市场遇法定节假日或因其他原因停市时；", "page": 28, "section": null, "tags": []}, "B971": {"text": "2.因不可抗力或其他情形致使基金管理人、基金托管人无法准确评估基金资产价值时；", "page": 28, "section": null, "tags": []}, "B972": {"text": "3.当前一估值日基金资产净值50%以上的资产出现无可参考的活跃市场价格且采用估值技术仍导致公", "page": 28, "section": null, "tags": []}, "B973": {"text": "允价值存在重大不确定性时，经与基金托管人协商确认后，基金管理人应当暂停基金估值；", "page": 28, "section": null, "tags": []}, "B974": {"text": "4.中国证监会认定的其他情形。", "page": 28, "section": null, "tags": []}, "B975": {"text": "基金管理人和基金托管人应采取必要、适当、合理的措施确保基金资产计价的准确性和及时性。当", "page": 28, "section": null, "tags": []}, "B976": {"text": "金资产计价出现错误时，基金管理人应当立即公告、予以纠正，并采取合理的措施防止损失进一步", "page": 28, "section": null, "tags": []}, "B977": {"text": "扩大。", "page": 28, "section": null, "tags": []}, "B978": {"text": "错误偏差达到基金资产净值的0.5%时，基金管理人应当通报基金托管人并报中国证监会备案。", "page": 28, "section": null, "tags": []}, "B979": {"text": "1.差错类型", "page": 28, "section": null, "tags": []}, "B980": {"text": "本基金运作过程中，如果由于基金管理人、基金托管人、注册登记机构、销售代理人或投资者自身", "page": 28, "section": null, "tags": []}, "B981": {"text": "过错造成差错，导致其他当事人遭受损失的，过错的责任人应当对由于该差错遭受损失的当事人", "page": 28, "section": null, "tags": []}, "B982": {"text": "（“受损", "page": 28, "section": null, "tags": []}, "B983": {"text": "方”）按下述“差错处理原则”给予赔偿并承担相关责任。", "page": 28, "section": null, "tags": []}, "B984": {"text": "上述差错的主要类型包括但不限于：资料申报差错、数据传输差错、数据计算差错、系统故障差错", "page": 28, "section": null, "tags": []}, "B985": {"text": "下达指令差错等。", "page": 28, "section": null, "tags": []}, "B986": {"text": "对于因技术原因引起的差错，若系同行业现有技术水平无法预见、无法避免、无法抗拒，则属不可", "page": 28, "section": null, "tags": []}, "B987": {"text": "力。因不可抗力原因出现差错的当事人不对其他当事人承担赔偿责任，但因该差错取得不当得利的", "page": 28, "section": null, "tags": []}, "B988": {"text": "当事人", "page": 28, "section": null, "tags": []}, "B989": {"text": "仍负有返还不当得利的义务。", "page": 28, "section": null, "tags": []}, "B990": {"text": "2.差错处理原则", "page": 28, "section": null, "tags": []}, "B991": {"text": "因基金资产计价错误给投资者造成损失的应先由基金管理人承担，基金管理人对不应由其承担的责", "page": 28, "section": null, "tags": []}, "B992": {"text": "任，", "page": 28, "section": null, "tags": []}, "B993": {"text": "有权根据过错原则，向过错人追偿，本基金合同的当事人应当按照以下约定处理。", "page": 28, "section": null, "tags": []}, "B994": {"text": "（1）差错已发生，但尚未给当事人造成损失时，差错责任方应及时协调各方，及时进行更正，因更", "page": 28, "section": null, "tags": []}, "B995": {"text": "正差错发生的费用由差错责任方承担；由于差错责任方未及时更正已产生的差错，给当事人造成损", "page": 29, "section": null, "tags": []}, "B996": {"text": "失的由", "page": 29, "section": null, "tags": []}, "B997": {"text": "差错责任方承担；若差错责任方已经积极协调，并且有协助义务的当事人有足够的时间进行更正而", "page": 29, "section": null, "tags": []}, "B998": {"text": "未更正，", "page": 29, "section": null, "tags": []}, "B999": {"text": "则该当事人应当承担相应赔偿责任。差错责任方应对更正的情况向有关当事人进行确认，确保差错", "page": 29, "section": null, "tags": []}, "B1000": {"text": "已得到", "page": 29, "section": null, "tags": []}, "B1001": {"text": "更正。", "page": 29, "section": null, "tags": []}, "B1002": {"text": "（2）差错的责任方对可能导致有关当事人的直接损失负责，不对间接损失负责，并且仅对差错的有", "page": 29, "section": null, "tags": []}, "B1003": {"text": "关直接当事人负责，不对第三方负责。", "page": 29, "section": null, "tags": []}, "B1004": {"text": "（3）因差错而获得不当得利的当事人负有及时返还不当得利的义务。但差错责任方仍应对差错负责", "page": 29, "section": null, "tags": []}, "B1005": {"text": "如果由于获得不当得利的当事人不返还或不全部返还不当得利造成其他当事人的利益损失（“受损", "page": 29, "section": null, "tags": []}, "B1006": {"text": "方”），", "page": 29, "section": null, "tags": []}, "B1007": {"text": "则差错责任方应赔偿受损方的损失，并在其支付的赔偿金额的范围内对获得不当得利的当事人享有", "page": 29, "section": null, "tags": []}, "B1008": {"text": "要求交", "page": 29, "section": null, "tags": []}, "B1009": {"text": "付不当得利的权利；如果获得不当得利的当事人已经将此部分不当得利返还给受损方，则受损方应", "page": 29, "section": null, "tags": []}, "B1010": {"text": "当将其", "page": 29, "section": null, "tags": []}, "B1011": {"text": "已经获得的赔偿额加上已经获得的不当得利返还的总和超过其实际损失的差额部分支付给差错责任", "page": 29, "section": null, "tags": []}, "B1012": {"text": "方。", "page": 29, "section": null, "tags": []}, "B1013": {"text": "（4）差错调整采用尽量恢复至假设未发生差错的正确情形的方式。", "page": 29, "section": null, "tags": []}, "B1014": {"text": "（5）差错责任方拒绝进行赔偿时，如果因基金管理人过错造成基金资产损失时，基金托管人应为基", "page": 29, "section": null, "tags": []}, "B1015": {"text": "金的利益向基金管理人追偿，如果因基金托管人过错造成基金资产损失时，基金管理人应为基金的", "page": 29, "section": null, "tags": []}, "B1016": {"text": "利益向", "page": 29, "section": null, "tags": []}, "B1017": {"text": "基金托管人追偿。除基金管理人和基金托管人之外的第三方造成基金资产的损失，并拒绝进行赔偿", "page": 29, "section": null, "tags": []}, "B1018": {"text": "时，由", "page": 29, "section": null, "tags": []}, "B1019": {"text": "基金管理人负责向差错方追偿。", "page": 29, "section": null, "tags": []}, "B1020": {"text": "（6）如果出现差错的当事人未按规定对受损方进行赔偿，并且依据法律法规、基金合同或其他规定", "page": 29, "section": null, "tags": []}, "B1021": {"text": "基金管理人自行或依据法院判决、仲裁裁决对受损方承担了赔偿责任，则基金管理人有权向出现过", "page": 29, "section": null, "tags": []}, "B1022": {"text": "错的当", "page": 29, "section": null, "tags": []}, "B1023": {"text": "事人进行追索，并有权要求其赔偿或补偿由此发生的费用和遭受的损失。", "page": 29, "section": null, "tags": []}, "B1024": {"text": "（7）前述内容如法律法规或监管机关另有规定的，按其规定处理。", "page": 29, "section": null, "tags": []}, "B1025": {"text": "3.差错处理程序", "page": 29, "section": null, "tags": []}, "B1026": {"text": "差错被发现后，有关的当事人应当及时进行处理，处理的程序如下：", "page": 29, "section": null, "tags": []}, "B1027": {"text": "（1）查明差错发生的原因，列明所有当事人，根据差错发生的原因确定差错责任方；", "page": 29, "section": null, "tags": []}, "B1028": {"text": "（2）根据差错处理原则或当事人协商的方法对因差错造成的损失进行评估；", "page": 29, "section": null, "tags": []}, "B1029": {"text": "（3）根据差错处理原则或当事人协商的方法由差错的责任方进行更正和赔偿损失；", "page": 29, "section": null, "tags": []}, "B1030": {"text": "（4）根据差错处理的方法，需要修改基金注册登记机构的交易数据的，由注册登记机构进行更正，", "page": 29, "section": null, "tags": []}, "B1031": {"text": "并就差错的更正向有关当事人进行确认；", "page": 29, "section": null, "tags": []}, "B1032": {"text": "（5）基金资产净值计算错误偏差达到0.5%时，基金管理人应当通报基金托管人并报中国证监会备案", "page": 29, "section": null, "tags": []}, "B1033": {"text": "1.基金管理人及基金托管人按本条第（四）款第4、5项规定进行计价时，所造成的差异不作为基金", "page": 30, "section": null, "tags": []}, "B1034": {"text": "产净值错误处理。", "page": 30, "section": null, "tags": []}, "B1035": {"text": "2.由于证券交易市场及登记结算公司发送的数据错误，或由于不可抗力原因，基金管理人和基金托", "page": 30, "section": null, "tags": []}, "B1036": {"text": "人虽然已经采取必要、适当、合理的措施进行检查，但是未能发现该错误而造成的基金资产计价错", "page": 30, "section": null, "tags": []}, "B1037": {"text": "误，基", "page": 30, "section": null, "tags": []}, "B1038": {"text": "金管理人、基金托管人可以免除赔偿责任。但基金管理人、基金托管人应积极采取必要的措施消除", "page": 30, "section": null, "tags": []}, "B1039": {"text": "由此造", "page": 30, "section": null, "tags": []}, "B1040": {"text": "成的影响。", "page": 30, "section": null, "tags": []}, "B1041": {"text": "二十二、基金费用与税收", "page": 30, "section": null, "tags": []}, "B1042": {"text": "1.基金管理人的管理费；", "page": 30, "section": null, "tags": []}, "B1043": {"text": "2.基金托管人的托管费；", "page": 30, "section": null, "tags": []}, "B1044": {"text": "3.基金销售服务费；", "page": 30, "section": null, "tags": []}, "B1045": {"text": "4.证券交易费用；", "page": 30, "section": null, "tags": []}, "B1046": {"text": "5.基金份额持有人大会费用；", "page": 30, "section": null, "tags": []}, "B1047": {"text": "6.基金合同生效后与基金相关的会计师费、律师费；除法律法规、中国证监会另有规定外，基金合", "page": 30, "section": null, "tags": []}, "B1048": {"text": "生效后与基金相关的信息披露费用；", "page": 30, "section": null, "tags": []}, "B1049": {"text": "7.其他按照国家有关规定可以列入的费用。", "page": 30, "section": null, "tags": []}, "B1050": {"text": "1.基金管理人的管理费", "page": 30, "section": null, "tags": []}, "B1051": {"text": "在通常情况下，基金管理费按前一日基金资产净值的0.33%年费率计提。计算方法如下：", "page": 30, "section": null, "tags": []}, "B1052": {"text": "H＝E×0.33%÷当年天数", "page": 30, "section": null, "tags": []}, "B1053": {"text": "H为每日应计提的基金管理费", "page": 30, "section": null, "tags": []}, "B1054": {"text": "E为前一日基金资产净值", "page": 30, "section": null, "tags": []}, "B1055": {"text": "基金管理费每日计提，按月支付。由基金管理人向基金托管人发送基金管理费划付指令，经基金托", "page": 30, "section": null, "tags": []}, "B1056": {"text": "人复核后于次月首日起5个工作日内从基金资产中一次性支付给基金管理人，若遇法定节假日、休息", "page": 30, "section": null, "tags": []}, "B1057": {"text": "日，", "page": 30, "section": null, "tags": []}, "B1058": {"text": "支付日期顺延。", "page": 30, "section": null, "tags": []}, "B1059": {"text": "2.基金托管人的托管费", "page": 30, "section": null, "tags": []}, "B1060": {"text": "在通常情况下，基金托管费按前一日基金资产净值的0.05%年费率计提。计算方法如下：", "page": 30, "section": null, "tags": []}, "B1061": {"text": "H=E×0.05%÷当年天数", "page": 30, "section": null, "tags": []}, "B1062": {"text": "H为每日应计提的基金托管费", "page": 30, "section": null, "tags": []}, "B1063": {"text": "E为前一日基金资产净值", "page": 30, "section": null, "tags": []}, "B1064": {"text": "基金托管费每日计提，按月支付。由基金管理人向基金托管人发送基金托管费划付指令，基金托管", "page": 30, "section": null, "tags": []}, "B1065": {"text": "复核后于次月首日起5个工作日内从基金资产中一次性支付给基金托管人，若遇法定节假日、休息日", "page": 30, "section": null, "tags": []}, "B1066": {"text": "，支", "page": 30, "section": null, "tags": []}, "B1067": {"text": "付日期顺延。", "page": 30, "section": null, "tags": []}, "B1068": {"text": "3.基金销售服务费", "page": 31, "section": null, "tags": []}, "B1069": {"text": "本基金A/E类基金份额的销售服务费年费率为0.25%，本基金B类基金份额的销售服务费年费率为", "page": 31, "section": null, "tags": []}, "B1070": {"text": "0.01%。", "page": 31, "section": null, "tags": []}, "B1071": {"text": "各类别基金份额的基金销售服务费计提的计算公式如下：", "page": 31, "section": null, "tags": []}, "B1072": {"text": "H＝E×R÷当年天数", "page": 31, "section": null, "tags": []}, "B1073": {"text": "H为各类别基金份额每日应计提的基金销售服务费", "page": 31, "section": null, "tags": []}, "B1074": {"text": "E为各类别基金份额前一日的基金资产净值", "page": 31, "section": null, "tags": []}, "B1075": {"text": "R为各类别基金份额适用的基金销售服务费率", "page": 31, "section": null, "tags": []}, "B1076": {"text": "基金销售服务费每日计提，按月支付。由基金管理人向基金托管人发送销售服务费划付指令，经基", "page": 31, "section": null, "tags": []}, "B1077": {"text": "托管人复核后于次月首日起5个工作日内从基金资产中划出，若遇法定节假日、休息日，支付日期顺", "page": 31, "section": null, "tags": []}, "B1078": {"text": "延。", "page": 31, "section": null, "tags": []}, "B1079": {"text": "4.本条第（一）款第4至第7项费用由基金托管人根据有关法规及相关合同等的规定，按费用实际支", "page": 31, "section": null, "tags": []}, "B1080": {"text": "金额支付。", "page": 31, "section": null, "tags": []}, "B1081": {"text": "基金管理人和基金托管人因未履行或未完全履行义务导致的费用支出或基金资产的损失，以及处理", "page": 31, "section": null, "tags": []}, "B1082": {"text": "基金运作无关事项发生的费用等不列入基金费用。", "page": 31, "section": null, "tags": []}, "B1083": {"text": "基金管理人和基金托管人可根据基金规模等因素协商酌情调低基金管理费率、基金托管费率和基金", "page": 31, "section": null, "tags": []}, "B1084": {"text": "售服务费率，无须召开基金份额持有人大会。提高上述费率需经基金份额持有人大会决议通过。", "page": 31, "section": null, "tags": []}, "B1085": {"text": "本基金运作过程中涉及的各纳税主体，依照国家法律法规的规定履行纳税义务。", "page": 31, "section": null, "tags": []}, "B1086": {"text": "二十三、基金收益与分配", "page": 31, "section": null, "tags": []}, "B1087": {"text": "基金收益包括：", "page": 31, "section": null, "tags": []}, "B1088": {"text": "1.基金投资所得债券利息、票据利息收入；", "page": 31, "section": null, "tags": []}, "B1089": {"text": "2.买卖证券价差收入；", "page": 31, "section": null, "tags": []}, "B1090": {"text": "3.银行存款利息收入；", "page": 31, "section": null, "tags": []}, "B1091": {"text": "4.其他收入。", "page": 31, "section": null, "tags": []}, "B1092": {"text": "基金净收益为基金收益扣除按照有关规定可以在基金收益中扣除的费用后的余额。基金净收益不保", "page": 31, "section": null, "tags": []}, "B1093": {"text": "为正。", "page": 31, "section": null, "tags": []}, "B1094": {"text": "1.本基金自基金合同生效日起，每日将基金净收益分配给基金份额持有人，当日收益参与下一日的", "page": 31, "section": null, "tags": []}, "B1095": {"text": "益分配，并定期支付且结转为相应的基金份额，具体处理按照招募说明书中的规定执行。", "page": 31, "section": null, "tags": []}, "B1096": {"text": "2.本基金的分红方式限于红利再投资。如当期累计分配的基金收益为正，则为份额持有人增加相应", "page": 31, "section": null, "tags": []}, "B1097": {"text": "基金份额；如当期累计分配的基金收益为负，则直至累计基金收益为正的时期，方为份额持有人增", "page": 32, "section": null, "tags": []}, "B1098": {"text": "加基金", "page": 32, "section": null, "tags": []}, "B1099": {"text": "份额。投资者可通过赎回基金份额获取现金收益。", "page": 32, "section": null, "tags": ["流动性风险"]}, "B1100": {"text": "3.投资者部分赎回基金份额时，如满足最低持有限制，基金份额对应的基金收益不随赎回款项支付", "page": 32, "section": null, "tags": ["流动性风险"]}, "B1101": {"text": "投资者。投资者全部赎回基金份额时，基金收益将全部结算并计入投资者账户。", "page": 32, "section": null, "tags": ["流动性风险"]}, "B1102": {"text": "4.T日申购的基金份额自下一个工作日起享有基金的分配权益；T日赎回的基金份额自下一个工作日", "page": 32, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1103": {"text": "起不享有基金的分配权益。", "page": 32, "section": null, "tags": []}, "B1104": {"text": "5.每一基金份额享有同等分配权。", "page": 32, "section": null, "tags": []}, "B1105": {"text": "6.在不影响基金份额持有人利益的前提下，基金管理人可在中国证监会允许的条件下调整基金收益", "page": 32, "section": null, "tags": []}, "B1106": {"text": "分配原则和支付方式，不需召开基金份额持有人大会。", "page": 32, "section": null, "tags": []}, "B1107": {"text": "7.法律法规或监管机关另有规定的，从其规定。", "page": 32, "section": null, "tags": []}, "B1108": {"text": "1.本基金于每个开放日的次日在指定媒介上披露开放日每万份基金净收益和7日年化收益率。若遇法", "page": 32, "section": null, "tags": []}, "B1109": {"text": "定节假日，于节假日结束后第二个自然日，披露节假日期间的每万份基金净收益、节假日最后一日", "page": 32, "section": null, "tags": []}, "B1110": {"text": "的7日", "page": 32, "section": null, "tags": []}, "B1111": {"text": "年化收益率，以及节假日后首个开放日的每万份基金净收益和7日年化收益率。", "page": 32, "section": null, "tags": []}, "B1112": {"text": "基金收益公告由基金管理人拟定，由基金托管人复核。", "page": 32, "section": null, "tags": []}, "B1113": {"text": "2.计算方法为：", "page": 32, "section": null, "tags": []}, "B1114": {"text": "（1）日每万份基金净收益＝当日基金净收益/当日基金份额总额×10000。", "page": 32, "section": null, "tags": []}, "B1115": {"text": "(r/S )?w w", "page": 32, "section": null, "tags": []}, "B1116": {"text": "w?1期间每万份基金净收益＝×10000；其中，r1为期间首日基金净收益，S1为期间首日", "page": 32, "section": null, "tags": []}, "B1117": {"text": "基金份额总额，rw为第w日基金净收益，Sw为第w日基金份额总额，rn为期间最后一日基金净收", "page": 32, "section": null, "tags": []}, "B1118": {"text": "益，Sn为期间最后一日基金份额总额。", "page": 32, "section": null, "tags": []}, "B1119": {"text": "7 365", "page": 32, "section": null, "tags": []}, "B1120": {"text": "Ri 7[?(1?)]", "page": 32, "section": null, "tags": []}, "B1121": {"text": "10000i?1（2）按日结转份额的7日年化收益率＝｛－1｝×100%；其中，Ri为最近第i个自", "page": 32, "section": null, "tags": []}, "B1122": {"text": "然日（包括计算当日）的每万份基金净收益。", "page": 32, "section": null, "tags": []}, "B1123": {"text": "每万份基金净收益应保留至小数点后第4位，7日年化收益率保留至小数点后第3位。", "page": 32, "section": null, "tags": []}, "B1124": {"text": "3.法律法规或监管机关对基金收益公告的内容与格式另有规定的，从其规定。", "page": 32, "section": null, "tags": []}, "B1125": {"text": "收益分配采用红利再投资方式免收再投资的费用。", "page": 32, "section": null, "tags": []}, "B1126": {"text": "二十四、基金的会计与审计", "page": 32, "section": null, "tags": []}, "B1127": {"text": "1.基金的会计年度为公历每年1月1日至12月31日。", "page": 32, "section": null, "tags": []}, "B1128": {"text": "2.基金核算以人民币为记账本位币，以人民币元为记账单位。", "page": 32, "section": null, "tags": []}, "B1129": {"text": "3.会计制度按国家有关的会计制度执行。", "page": 32, "section": null, "tags": []}, "B1130": {"text": "4.本基金独立建账、独立核算。", "page": 32, "section": null, "tags": []}, "B1131": {"text": "5.本基金会计责任人为基金管理人。", "page": 32, "section": null, "tags": []}, "B1132": {"text": "6.基金管理人及基金托管人各自保留完整的基金会计账目、凭证并进行日常的会计核算，按照有关", "page": 32, "section": null, "tags": []}, "B1133": {"text": "定编制基金会计报表。", "page": 33, "section": null, "tags": []}, "B1134": {"text": "7.基金托管人每月与基金管理人就基金的会计核算、报表编制等进行核对并以书面方式确认。", "page": 33, "section": null, "tags": []}, "B1135": {"text": "1.本基金管理人聘请具有证券从业资格的会计师事务所及其注册会计师对基金进行年度相关审计工", "page": 33, "section": null, "tags": []}, "B1136": {"text": "作。", "page": 33, "section": null, "tags": []}, "B1137": {"text": "2.会计师事务所更换经办注册会计师，应事先征得基金管理人和基金托管人同意。", "page": 33, "section": null, "tags": []}, "B1138": {"text": "3.基金管理人（或基金托管人）认为有充足理由更换会计师事务所，经基金托管人（或基金管理人", "page": 33, "section": null, "tags": []}, "B1139": {"text": "同意后可以更换。更换会计师事务所须在2日内公告。", "page": 33, "section": null, "tags": []}, "B1140": {"text": "二十五、基金的信息披露", "page": 33, "section": null, "tags": []}, "B1141": {"text": "（一）本基金的信息披露应符合《基金法》、《信息披露办法》、《基金合同》及其他有关规定。", "page": 33, "section": null, "tags": []}, "B1142": {"text": "本基金信息披露义务人包括基金管理人、基金托管人、召集基金份额持有人大会的基金份额持有人", "page": 33, "section": null, "tags": []}, "B1143": {"text": "法律、行政法规和中国证监会规定的自然人、法人和非法人组织。", "page": 33, "section": null, "tags": []}, "B1144": {"text": "本基金信息披露义务人应当以保护基金份额持有人利益为根本出发点，按照法律、行政法规和中国", "page": 33, "section": null, "tags": []}, "B1145": {"text": "监会的规定披露基金信息，并保证所披露信息的真实性、准确性、完整性、及时性、简明性和易得", "page": 33, "section": null, "tags": []}, "B1146": {"text": "性。", "page": 33, "section": null, "tags": []}, "B1147": {"text": "本基金信息披露义务人应当在中国证监会规定时间内，将应予披露的基金信息通过中国证监会指定", "page": 33, "section": null, "tags": []}, "B1148": {"text": "介披露，并保证基金投资者能够按照《基金合同》约定的时间和方式查阅或者复制公开披露的信息", "page": 33, "section": null, "tags": []}, "B1149": {"text": "资料。", "page": 33, "section": null, "tags": []}, "B1150": {"text": "1、虚假记载、误导性陈述或者重大遗漏；", "page": 33, "section": null, "tags": []}, "B1151": {"text": "2、对证券投资业绩进行预测；", "page": 33, "section": null, "tags": []}, "B1152": {"text": "3、违规承诺收益或者承担损失；", "page": 33, "section": null, "tags": []}, "B1153": {"text": "4、诋毁其他基金管理人、基金托管人或者基金销售机构；", "page": 33, "section": null, "tags": []}, "B1154": {"text": "5、登载任何自然人、法人和非法人组织的祝贺性、恭维性或推荐性文字；", "page": 33, "section": null, "tags": []}, "B1155": {"text": "6、中国证监会禁止的其他行为。", "page": 33, "section": null, "tags": []}, "B1156": {"text": "（四）本基金公开披露的信息应采用中文文本。如同时采用外文文本的，基金信息披露义务人应保", "page": 33, "section": null, "tags": []}, "B1157": {"text": "不同文本的内容一致。不同文本之间发生歧义的，以中文文本为准。", "page": 33, "section": null, "tags": []}, "B1158": {"text": "本基金公开披露的信息采用阿拉伯数字；除特别说明外，货币单位为人民币元。", "page": 33, "section": null, "tags": []}, "B1159": {"text": "公开披露的基金信息包括：", "page": 33, "section": null, "tags": []}, "B1160": {"text": "1、基金招募说明书、《基金合同》、基金托管协议", "page": 33, "section": null, "tags": []}, "B1161": {"text": "（1）《基金合同》是界定《基金合同》当事人的各项权利、义务关系，明确基金份额持有人大会召", "page": 33, "section": null, "tags": []}, "B1162": {"text": "的规则及具体程序，说明基金产品的特性等涉及基金投资者重大利益的事项的法律文件。", "page": 33, "section": null, "tags": []}, "B1163": {"text": "（2）基金招募说明书应当最大限度地披露影响基金投资者决策的全部事项，说明基金认购、申购和", "page": 33, "section": null, "tags": ["机制特有风险"]}, "B1164": {"text": "赎回安排、基金投资、基金产品特性、风险揭示、信息披露及基金份额持有人服务等内容。基金招", "page": 34, "section": null, "tags": ["流动性风险"]}, "B1165": {"text": "募说明", "page": 34, "section": null, "tags": []}, "B1166": {"text": "书的信息发生重大变更的，基金管理人应当在3个工作日内，更新基金招募说明书并登载在指定网站", "page": 34, "section": null, "tags": []}, "B1167": {"text": "上。", "page": 34, "section": null, "tags": []}, "B1168": {"text": "基金招募说明书的其他信息发生变更的，基金管理人至少每年更新一次。基金合同终止的，基金管", "page": 34, "section": null, "tags": []}, "B1169": {"text": "理人可", "page": 34, "section": null, "tags": []}, "B1170": {"text": "以不再更新基金招募说明书。", "page": 34, "section": null, "tags": []}, "B1171": {"text": "（3）基金托管协议是界定基金托管人和基金管理人在基金财产保管及基金运作监督等活动中的权利", "page": 34, "section": null, "tags": []}, "B1172": {"text": "义务关系的法律文件。", "page": 34, "section": null, "tags": []}, "B1173": {"text": "2、基金产品资料概要", "page": 34, "section": null, "tags": []}, "B1174": {"text": "基金管理人根据《信息披露办法》的要求公告基金产品资料概要。基金产品资料概要的信息发生重", "page": 34, "section": null, "tags": []}, "B1175": {"text": "变更的，基金管理人应当在3个工作日内，更新基金产品资料概要，并登载在指定网站上和基金销售", "page": 34, "section": null, "tags": []}, "B1176": {"text": "机构", "page": 34, "section": null, "tags": []}, "B1177": {"text": "网站上或营业网点。基金产品资料概要的其他信息发生变更的，基金管理人至少每年更新一次。基", "page": 34, "section": null, "tags": []}, "B1178": {"text": "金合同", "page": 34, "section": null, "tags": []}, "B1179": {"text": "终止的，基金管理人可以不再更新基金产品资料概要。", "page": 34, "section": null, "tags": []}, "B1180": {"text": "关于基金产品资料概要编制、披露与更新的要求，自中国证监会规定之日起开始执行。", "page": 34, "section": null, "tags": []}, "B1181": {"text": "3、基金份额发售公告和基金合同生效公告", "page": 34, "section": null, "tags": []}, "B1182": {"text": "基金管理人按照《基金法》、《信息披露办法》及其他有关规定，就基金份额发售的具体事宜编制", "page": 34, "section": null, "tags": []}, "B1183": {"text": "基金", "page": 34, "section": null, "tags": []}, "B1184": {"text": "份额发售公告，并在披露招募说明书的当日同时刊登在至少一种中国证监会指定的全国性报刊和公", "page": 34, "section": null, "tags": []}, "B1185": {"text": "司网站", "page": 34, "section": null, "tags": []}, "B1186": {"text": "上。", "page": 34, "section": null, "tags": []}, "B1187": {"text": "4、基金定期报告，包括基金年度报告、基金中期报告和基金季度报告（含资产组合季度报告）", "page": 34, "section": null, "tags": []}, "B1188": {"text": "基金管理人应当在每年结束之日起3个月内，编制完成基金年度报告，将年度报告登载在指定网站上", "page": 34, "section": null, "tags": []}, "B1189": {"text": "并将年度报告提示性公告登载在指定报刊上。基金年度报告中的财务会计报告应当经过具有证券、", "page": 34, "section": null, "tags": []}, "B1190": {"text": "期货相", "page": 34, "section": null, "tags": ["杠杆风险"]}, "B1191": {"text": "关业务资格的会计师事务所审计。", "page": 34, "section": null, "tags": []}, "B1192": {"text": "基金管理人应当在上半年结束之日起2个月内，编制完成基金中期报告，将中期报告登载在指定网站", "page": 34, "section": null, "tags": []}, "B1193": {"text": "上，并将中期报告提示性公告登载在指定报刊上。", "page": 34, "section": null, "tags": []}, "B1194": {"text": "基金管理人应当在季度结束之日起15个工作日内，编制完成基金季度报告，将季度报告登载在指定", "page": 34, "section": null, "tags": []}, "B1195": {"text": "网站上，并将季度报告提示性公告登载在指定报刊上。", "page": 34, "section": null, "tags": []}, "B1196": {"text": "基金管理人应当在基金年度报告和中期报告中披露基金组合资产情况及其流动性风险分析等。", "page": 34, "section": null, "tags": ["流动性风险"]}, "B1197": {"text": "如报告期内出现单一投资者持有基金份额达到或超过基金总份额20%的情形，为保障其他投资者的", "page": 34, "section": null, "tags": []}, "B1198": {"text": "益，基金管理人至少应当在基金定期报告“影响投资者决策的其他重要信息”项下披露该投资者的", "page": 34, "section": null, "tags": []}, "B1199": {"text": "类别、", "page": 34, "section": null, "tags": []}, "B1200": {"text": "报告期末持有份额及占比、报告期内持有份额变化情况及产品的特有风险，中国证监会认定的特殊", "page": 34, "section": null, "tags": []}, "B1201": {"text": "情形除", "page": 34, "section": null, "tags": []}, "B1202": {"text": "外。", "page": 35, "section": null, "tags": []}, "B1203": {"text": "基金管理人应当在年度报告、中期报告中，至少披露报告期末基金前10名份额持有人的类别、持有", "page": 35, "section": null, "tags": []}, "B1204": {"text": "份额及占总份额的比例等信息。", "page": 35, "section": null, "tags": []}, "B1205": {"text": "5、基金收益公告", "page": 35, "section": null, "tags": []}, "B1206": {"text": "本基金于每个开放日的次日在中国证监会指定媒介上披露开放日每万份基金净收益和7日年化收益率", "page": 35, "section": null, "tags": []}, "B1207": {"text": "若遇法定节假日，于节假日结束后第二个自然日，披露节假日期间的每万份基金净收益、节假日最", "page": 35, "section": null, "tags": []}, "B1208": {"text": "后一日", "page": 35, "section": null, "tags": []}, "B1209": {"text": "的7日年化收益率，以及节假日后首个开放日的每万份基金净收益和7日年化收益率。", "page": 35, "section": null, "tags": []}, "B1210": {"text": "基金管理人在不晚于半年度和年度最后一日的次日在指定网站披露半年度和年度最后一日的基金份", "page": 35, "section": null, "tags": []}, "B1211": {"text": "额每万份基金净收益、基金七日年化收益率。", "page": 35, "section": null, "tags": []}, "B1212": {"text": "6、临时报告", "page": 35, "section": null, "tags": []}, "B1213": {"text": "本基金发生重大事件，有关信息披露义务人应当在2日内编制临时报告书，并登载在指定报刊和指定", "page": 35, "section": null, "tags": []}, "B1214": {"text": "网站上。", "page": 35, "section": null, "tags": []}, "B1215": {"text": "前款所称重大事件，是指可能对基金份额持有人权益或者基金份额的价格产生重大影响的下列事件", "page": 35, "section": null, "tags": []}, "B1216": {"text": "（1）基金份额持有人大会的召开及决定的事项。", "page": 35, "section": null, "tags": []}, "B1217": {"text": "（2）基金合同终止、基金清算。", "page": 35, "section": null, "tags": []}, "B1218": {"text": "（3）转换基金运作方式、基金合并。", "page": 35, "section": null, "tags": []}, "B1219": {"text": "（4）更换基金管理人、基金托管人、基金份额登记机构，基金改聘会计师事务所。", "page": 35, "section": null, "tags": []}, "B1220": {"text": "（5）基金管理人委托基金服务机构代为办理基金的份额登记、核算、估值等事项，基金托管人委托", "page": 35, "section": null, "tags": []}, "B1221": {"text": "基金服务机构代为办理基金的核算、估值、复核等事项。", "page": 35, "section": null, "tags": []}, "B1222": {"text": "（6）基金管理人、基金托管人的法定名称、住所发生变更。", "page": 35, "section": null, "tags": []}, "B1223": {"text": "（7）基金管理公司变更持有百分之五以上股权的股东、变更公司的实际控制人。", "page": 35, "section": null, "tags": []}, "B1224": {"text": "（8）基金管理人高级管理人员、基金经理和基金托管人专门基金托管部门负责人发生变动。", "page": 35, "section": null, "tags": []}, "B1225": {"text": "（9）基金管理人的董事在最近12个月内变更超过百分之五十，基金管理人、基金托管人专门基金托", "page": 35, "section": null, "tags": []}, "B1226": {"text": "管部门的主要业务人员在最近12个月内变动超过百分之三十。", "page": 35, "section": null, "tags": []}, "B1227": {"text": "（10）涉及基金财产、基金管理业务、基金托管业务的诉讼或仲裁。", "page": 35, "section": null, "tags": []}, "B1228": {"text": "（11）基金管理人或其高级管理人员、基金经理因基金管理业务相关行为受到重大行政处罚、刑事", "page": 35, "section": null, "tags": []}, "B1229": {"text": "罚，基金托管人或其专门基金托管部门负责人因基金托管业务相关行为受到重大行政处罚、刑事处", "page": 35, "section": null, "tags": []}, "B1230": {"text": "罚。", "page": 35, "section": null, "tags": []}, "B1231": {"text": "（12）基金管理人运用基金财产买卖基金管理人、基金托管人及其控股股东、实际控制人或者与其", "page": 35, "section": null, "tags": []}, "B1232": {"text": "重大利害关系的公司发行的证券或者承销期内承销的证券，或者从事其他重大关联交易事项，中国", "page": 35, "section": null, "tags": []}, "B1233": {"text": "证监会", "page": 35, "section": null, "tags": []}, "B1234": {"text": "另有规定的情形除外。", "page": 35, "section": null, "tags": []}, "B1235": {"text": "（13）管理费、托管费、销售服务费等费用计提标准、计提方式和费率发生变更。", "page": 35, "section": null, "tags": []}, "B1236": {"text": "（14）基金资产净值计价错误达基金资产净值百分之零点五。", "page": 35, "section": null, "tags": []}, "B1237": {"text": "（15）基金发生巨额赎回并延期办理。", "page": 35, "section": null, "tags": ["流动性风险"]}, "B1238": {"text": "（16）基金连续发生巨额赎回并暂停接受赎回申请或延缓支付赎回款项。", "page": 35, "section": null, "tags": ["流动性风险"]}, "B1239": {"text": "（17）基金暂停接受申购、赎回申请或重新接受申购、赎回申请。", "page": 35, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1240": {"text": "（18）本基金发生涉及基金申购赎回事项调整或潜在影响投资者赎回等重大事项。", "page": 36, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1241": {"text": "（19）本基金投资于主体信用评级低于AA+的商业银行的银行存款与同业存单。", "page": 36, "section": null, "tags": ["信用风险"]}, "B1242": {"text": "（20）基金信息披露义务人认为可能对基金份额持有人权益或者基金份额的价格产生重大影响的其", "page": 36, "section": null, "tags": []}, "B1243": {"text": "事项或中国证监会规定的其他事项。", "page": 36, "section": null, "tags": []}, "B1244": {"text": "7、澄清公告", "page": 36, "section": null, "tags": []}, "B1245": {"text": "在基金合同存续期限内，任何公共媒介中出现的或者在市场上流传的消息可能对基金价格产生误导", "page": 36, "section": null, "tags": []}, "B1246": {"text": "影响或引起较大波动，以及可能损害基金份额持有人权益的，相关的信息披露义务人知悉后应当立", "page": 36, "section": null, "tags": []}, "B1247": {"text": "即对该", "page": 36, "section": null, "tags": []}, "B1248": {"text": "消息进行公开澄清，并将有关情况立即报送中国证监会。", "page": 36, "section": null, "tags": []}, "B1249": {"text": "8、清算报告", "page": 36, "section": null, "tags": []}, "B1250": {"text": "基金财产清算小组应当将清算报告登载在指定网站上，并将清算报告提示性公告登载在指定报刊上", "page": 36, "section": null, "tags": []}, "B1251": {"text": "9、基金份额持有人大会决议", "page": 36, "section": null, "tags": []}, "B1252": {"text": "基金份额持有人大会决定的事项，应当依法报中国证监会备案，并予以公告。", "page": 36, "section": null, "tags": []}, "B1253": {"text": "10、中国证监会规定的其他信息。", "page": 36, "section": null, "tags": []}, "B1254": {"text": "基金管理人、基金托管人应当建立健全信息披露管理制度，指定专门部门及高级管理人员负责管理", "page": 36, "section": null, "tags": []}, "B1255": {"text": "息披露事务。", "page": 36, "section": null, "tags": []}, "B1256": {"text": "基金信息披露义务人公开披露基金信息，应当符合中国证监会相关基金信息披露内容与格式准则等", "page": 36, "section": null, "tags": []}, "B1257": {"text": "规的规定。", "page": 36, "section": null, "tags": []}, "B1258": {"text": "基金托管人应当按照相关法律法规、中国证监会的规定和《基金合同》的约定，对基金管理人编制", "page": 36, "section": null, "tags": []}, "B1259": {"text": "基金资产净值、基金份额每万份基金净收益、七日年化收益率基金定期报告、更新的招募说明书、", "page": 36, "section": null, "tags": []}, "B1260": {"text": "基金产", "page": 36, "section": null, "tags": []}, "B1261": {"text": "品资料概要、基金清算报告等公开披露的相关基金信息进行复核、审查，并向基金管理人进行书面", "page": 36, "section": null, "tags": []}, "B1262": {"text": "或电子", "page": 36, "section": null, "tags": []}, "B1263": {"text": "确认。", "page": 36, "section": null, "tags": []}, "B1264": {"text": "基金管理人、基金托管人应当在指定报刊中选择披露信息的报刊，本基金只需选择一家报刊。", "page": 36, "section": null, "tags": []}, "B1265": {"text": "为强化投资者保护，提升信息披露服务质量，基金管理人应当自中国证监会规定之日起，按照《信", "page": 36, "section": null, "tags": []}, "B1266": {"text": "披露办法》等相关法律法规的规定和中国证监会规定向投资者及时提供对其投资决策有重大影响的", "page": 36, "section": null, "tags": []}, "B1267": {"text": "信息。", "page": 36, "section": null, "tags": []}, "B1268": {"text": "为基金信息披露义务人公开披露的基金信息出具审计报告、法律意见书的专业机构，应当制作工作", "page": 36, "section": null, "tags": []}, "B1269": {"text": "稿，并将相关档案至少保存到《基金合同》终止后10年。", "page": 36, "section": null, "tags": []}, "B1270": {"text": "依法必须披露的信息发布后，基金管理人、基金托管人应当按照相关法律法规规定将信息置备于公", "page": 36, "section": null, "tags": []}, "B1271": {"text": "住所，供社会公众查阅、复制。", "page": 37, "section": null, "tags": []}, "B1272": {"text": "二十六、基金的终止与清算", "page": 37, "section": null, "tags": []}, "B1273": {"text": "有下列情形之一的，本基金经中国证监会批准后终止：", "page": 37, "section": null, "tags": []}, "B1274": {"text": "1.存续期间内，基金份额持有人数量连续60个工作日达不到100人，或连续60个工作日基金资产净值", "page": 37, "section": null, "tags": []}, "B1275": {"text": "于人民币5000万元，基金管理人宣布本基金终止；", "page": 37, "section": null, "tags": []}, "B1276": {"text": "2.基金经基金份额持有人大会表决终止；", "page": 37, "section": null, "tags": []}, "B1277": {"text": "3.因重大违法、违规行为，基金被中国证监会责令终止；", "page": 37, "section": null, "tags": []}, "B1278": {"text": "4.基金管理人因解散、破产、撤销等事由，不能继续担任本基金的管理人，而无其他适当的基金管", "page": 37, "section": null, "tags": []}, "B1279": {"text": "机构承接其权利及义务；", "page": 37, "section": null, "tags": []}, "B1280": {"text": "5.基金托管人因解散、破产、撤销等事由，不能继续担任本基金的托管人，而无其他适当的基金托", "page": 37, "section": null, "tags": []}, "B1281": {"text": "机构承接其权利及义务；", "page": 37, "section": null, "tags": []}, "B1282": {"text": "6.由于投资方向变更引起的基金合并、撤销；", "page": 37, "section": null, "tags": []}, "B1283": {"text": "7.法律法规或中国证监会允许的其他情况。", "page": 37, "section": null, "tags": []}, "B1284": {"text": "基金终止，应当按法律法规和本基金合同的有关规定对基金进行清算。", "page": 37, "section": null, "tags": []}, "B1285": {"text": "1.基金清算小组", "page": 37, "section": null, "tags": []}, "B1286": {"text": "（1）自基金终止之日起30个工作日内成立基金清算小组，基金清算小组在中国证监会的监督下进行", "page": 37, "section": null, "tags": []}, "B1287": {"text": "基金清算，在基金清算小组接管基金资产之前，基金管理人和基金托管人应按照基金合同和托管协", "page": 37, "section": null, "tags": []}, "B1288": {"text": "议的规", "page": 37, "section": null, "tags": []}, "B1289": {"text": "定继续履行保护基金资产安全的职责。", "page": 37, "section": null, "tags": []}, "B1290": {"text": "（2）基金清算小组成员由基金管理人、基金托管人、具有从事证券相关业务资格的注册会计师、具", "page": 37, "section": null, "tags": []}, "B1291": {"text": "有从事证券法律业务资格的律师以及中国证监会指定的人员组成。基金清算小组可以聘用必要的工", "page": 37, "section": null, "tags": []}, "B1292": {"text": "作人员。", "page": 37, "section": null, "tags": []}, "B1293": {"text": "（3）基金清算小组负责基金资产的保管、清理、估价、变现和分配。基金清算小组可以依法进行必", "page": 37, "section": null, "tags": ["流动性风险"]}, "B1294": {"text": "要的民事活动。", "page": 37, "section": null, "tags": []}, "B1295": {"text": "2.清算程序", "page": 37, "section": null, "tags": []}, "B1296": {"text": "（1）基金终止后，由基金清算小组统一接管基金资产；", "page": 37, "section": null, "tags": []}, "B1297": {"text": "（2）基金清算小组对基金资产进行清理和确认；", "page": 37, "section": null, "tags": []}, "B1298": {"text": "（3）对基金资产进行评估和变现；", "page": 37, "section": null, "tags": ["流动性风险"]}, "B1299": {"text": "（4）将基金清算结果报告中国证监会；", "page": 37, "section": null, "tags": []}, "B1300": {"text": "（5）公布基金清算公告；", "page": 37, "section": null, "tags": []}, "B1301": {"text": "（6）对基金资产进行分配。", "page": 37, "section": null, "tags": []}, "B1302": {"text": "3.清算费用", "page": 37, "section": null, "tags": []}, "B1303": {"text": "清算费用是指基金清算小组在进行基金清算过程中发生的所有合理费用，清算费用由基金清算小组", "page": 37, "section": null, "tags": []}, "B1304": {"text": "先从基金资产中支付。", "page": 37, "section": null, "tags": []}, "B1305": {"text": "4.基金剩余资产的分配", "page": 37, "section": null, "tags": []}, "B1306": {"text": "基金清算后的全部剩余资产扣除基金清算费用后如有余额，按基金份额持有人持有的基金份额比例", "page": 38, "section": null, "tags": []}, "B1307": {"text": "行分配。", "page": 38, "section": null, "tags": []}, "B1308": {"text": "5.基金清算的公告", "page": 38, "section": null, "tags": []}, "B1309": {"text": "基金终止并报中国证监会核准后5个工作日内由基金清算小组公告；清算过程中的有关重大事项须及", "page": 38, "section": null, "tags": []}, "B1310": {"text": "时公告；基金清算结果由基金清算小组于中国证监会批准后3个工作日内公告。", "page": 38, "section": null, "tags": []}, "B1311": {"text": "6.清算账册及文件的保存", "page": 38, "section": null, "tags": []}, "B1312": {"text": "基金清算账册及有关文件由基金托管人保存15年以上。", "page": 38, "section": null, "tags": []}, "B1313": {"text": "二十七、业务规则", "page": 38, "section": null, "tags": []}, "B1314": {"text": "基金合同当事人应遵守《华夏基金管理有限公司开放式基金业务规则》。该规则由基金管理人在符", "page": 38, "section": null, "tags": []}, "B1315": {"text": "法律法规及本基金合同规定的前提下制订，并由其解释与修改。", "page": 38, "section": null, "tags": []}, "B1316": {"text": "二十八、违约责任", "page": 38, "section": null, "tags": ["信用风险"]}, "B1317": {"text": "（一）由于基金合同一方当事人的过错，造成基金合同不能履行或者不能完全履行的，由有过错的", "page": 38, "section": null, "tags": []}, "B1318": {"text": "方承担违约责任；如属基金合同双方或多方当事人的过错，根据实际情况，由双方或多方当事人分", "page": 38, "section": null, "tags": ["信用风险"]}, "B1319": {"text": "别承担", "page": 38, "section": null, "tags": []}, "B1320": {"text": "各自应负的违约责任。但是发生下列情况，当事人可以免责：", "page": 38, "section": null, "tags": ["信用风险"]}, "B1321": {"text": "1.不可抗力；", "page": 38, "section": null, "tags": []}, "B1322": {"text": "2.基金管理人及基金托管人按照当时有效的法律、法规、规章或中国证监会的规定作为或不作为而", "page": 38, "section": null, "tags": []}, "B1323": {"text": "成的损失等；", "page": 38, "section": null, "tags": []}, "B1324": {"text": "3.基金管理人由于按照本基金合同规定的投资原则投资或不投资造成的损失或潜在损失等。", "page": 38, "section": null, "tags": []}, "B1325": {"text": "（三）在发生一方或多方当事人违约的情况下，基金合同能继续履行的，应当继续履行。未违约方", "page": 38, "section": null, "tags": ["信用风险"]}, "B1326": {"text": "事人在职责范围内有义务及时采取必要的措施，防止损失的扩大。", "page": 38, "section": null, "tags": []}, "B1327": {"text": "（四）因第三方的过错而导致基金合同一方当事人违约，给其他当事人造成损失的，违约方并不免", "page": 38, "section": null, "tags": ["信用风险"]}, "B1328": {"text": "其赔偿责任。", "page": 38, "section": null, "tags": []}, "B1329": {"text": "（五）因基金合同一方当事人违约而导致其他当事人损失的，基金份额持有人应先于其他受损方获", "page": 38, "section": null, "tags": ["信用风险"]}, "B1330": {"text": "赔偿。", "page": 38, "section": null, "tags": []}, "B1331": {"text": "二十九、争议处理", "page": 38, "section": null, "tags": []}, "B1332": {"text": "本基金合同受中华人民共和国法律管辖。", "page": 38, "section": null, "tags": []}, "B1333": {"text": "本基金合同各方当事人因基金合同而产生的或与基金合同有关的一切争议应当通过协商或者调解解", "page": 38, "section": null, "tags": []}, "B1334": {"text": "决，协商或者调解不能解决的，可将争议提交中国国际经济贸易仲裁委员会，根据提交仲裁时该会", "page": 38, "section": null, "tags": []}, "B1335": {"text": "的仲裁", "page": 38, "section": null, "tags": []}, "B1336": {"text": "规则进行仲裁，仲裁地点为北京。仲裁裁决是终局的，对仲裁各方当事人均具有约束力。", "page": 38, "section": null, "tags": []}, "B1337": {"text": "三十、基金合同的效力", "page": 38, "section": null, "tags": []}, "B1338": {"text": "（一）本基金合同经基金发起人、基金管理人与基金托管人三方盖章、三方法定代表人或其授权代", "page": 38, "section": null, "tags": []}, "B1339": {"text": "人签字或盖章并经中国证监会批准后生效。基金合同的有效期自生效之日起至本基金清算结束报中", "page": 39, "section": null, "tags": []}, "B1340": {"text": "国证监", "page": 39, "section": null, "tags": []}, "B1341": {"text": "会批准并公告之日止。", "page": 39, "section": null, "tags": []}, "B1342": {"text": "（三）本基金合同正本一式十份，其中上报中国证监会和中国银监会各两份，基金发起人、基金管", "page": 39, "section": null, "tags": []}, "B1343": {"text": "人和基金托管人各持有两份，每份具有同等的法律效力。", "page": 39, "section": null, "tags": []}, "B1344": {"text": "（四）本基金合同可印制成册，供投资者在基金管理人、基金托管人、销售代理人的办公场所和营", "page": 39, "section": null, "tags": []}, "B1345": {"text": "场所查阅；投资者也可按工本费购买本基金合同复制件或复印件，但内容应以本基金合同正本为准", "page": 39, "section": null, "tags": []}, "B1346": {"text": "三十一、基金合同的修改与终止", "page": 39, "section": null, "tags": []}, "B1347": {"text": "1.本基金合同的修改需经包括基金管理人和基金托管人在内的各方当事人同意。", "page": 39, "section": null, "tags": []}, "B1348": {"text": "2.修改基金合同应经基金份额持有人大会决议通过，并报中国证监会批准，自批准之日起生效。但", "page": 39, "section": null, "tags": []}, "B1349": {"text": "因相应的法律、法规发生变动并属于本基金合同必须遵照进行修改的情形，或者基金合同的修改不", "page": 39, "section": null, "tags": []}, "B1350": {"text": "涉及本", "page": 39, "section": null, "tags": []}, "B1351": {"text": "基金合同当事人权利义务关系发生变化或对基金份额持有人利益无实质性不利影响的，可不经基金", "page": 39, "section": null, "tags": []}, "B1352": {"text": "份额持", "page": 39, "section": null, "tags": []}, "B1353": {"text": "有人大会决议，而经基金管理人和基金托管人同意修改后公布，并报中国证监会备案。", "page": 39, "section": null, "tags": []}, "B1354": {"text": "1.出现下列情况之一的，本基金合同经中国证监会批准后终止：", "page": 39, "section": null, "tags": []}, "B1355": {"text": "（1）存续期间内，基金份额持有人数量连续60个工作日达不到100人，或连续60个工作日基金资产", "page": 39, "section": null, "tags": []}, "B1356": {"text": "值低于人民币5000万元，基金管理人宣布本基金终止；", "page": 39, "section": null, "tags": []}, "B1357": {"text": "（2）基金经基金份额持有人大会表决终止；", "page": 39, "section": null, "tags": []}, "B1358": {"text": "（3）因重大违法行为，基金被中国证监会责令终止；", "page": 39, "section": null, "tags": []}, "B1359": {"text": "（4）基金管理人因解散、破产、撤销等事由，不能继续担任本基金的管理人，而无其他适当的基金", "page": 39, "section": null, "tags": []}, "B1360": {"text": "管理机构承接其权利及义务；", "page": 39, "section": null, "tags": []}, "B1361": {"text": "（5）基金托管人因解散、破产、撤销等事由，不能继续担任本基金的托管人，而无其他适当的托管", "page": 39, "section": null, "tags": []}, "B1362": {"text": "机构承接其权利及义务；", "page": 39, "section": null, "tags": []}, "B1363": {"text": "（6）由于投资方向变更引起的基金合并、撤销；", "page": 39, "section": null, "tags": []}, "B1364": {"text": "（7）法律法规或中国证监会允许的其他情况。", "page": 39, "section": null, "tags": []}, "B1365": {"text": "2.基金合同的终止。本基金终止后，须按法律法规和本基金合同对基金进行清算。中国证监会对清", "page": 39, "section": null, "tags": []}, "B1366": {"text": "结果批准并予以公告后本基金合同终止。", "page": 39, "section": null, "tags": []}, "B1367": {"text": "三十二、基金发起人、基金管理人和基金托管人签章", "page": 39, "section": null, "tags": []}, "B1368": {"text": "（见下页）", "page": 39, "section": null, "tags": []}}, "P03": {"B001": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 1, "section": null, "tags": ["市场风险"]}, "B002": {"text": "华宝标普石油天然气上游股票指数证券投资基金", "page": 1, "section": null, "tags": ["市场风险"]}, "B003": {"text": "（LOF）招募说明书（更新）", "page": 1, "section": null, "tags": []}, "B004": {"text": "2022年定期更新", "page": 1, "section": null, "tags": []}, "B005": {"text": "基金管理人：华宝基金管理有限公司", "page": 1, "section": null, "tags": []}, "B006": {"text": "基金托管人：中国建设银行股份有限公司", "page": 1, "section": null, "tags": []}, "B007": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 2, "section": null, "tags": ["市场风险"]}, "B008": {"text": "【重要提示】", "page": 2, "section": null, "tags": []}, "B009": {"text": "本基金根据中国证券监督管理委员会2011年8月12日证监许可【2011】1301号文核", "page": 2, "section": null, "tags": []}, "B010": {"text": "准募集。", "page": 2, "section": null, "tags": []}, "B011": {"text": "基金管理人保证 《华宝标普石油天然气上游股票指数证券投资基金 （LOF） 招募说明书》", "page": 2, "section": null, "tags": ["市场风险"]}, "B012": {"text": "(以下简称“招募说明书”或“本招募说明书”)的内容真实、准确、完整。本招募说明书经", "page": 2, "section": null, "tags": []}, "B013": {"text": "中国证监会核准，但中国证监会对本基金募集的核准，并不表明其对本基金的价值和收益作", "page": 2, "section": null, "tags": []}, "B014": {"text": "出实质性判断或保证，也不表明投资于本基金没有风险。", "page": 2, "section": null, "tags": []}, "B015": {"text": "本基金为指数基金，投资者投资于本基金面临跟踪误差控制未达约定目标、指数编制机", "page": 2, "section": null, "tags": ["市场风险"]}, "B016": {"text": "构停止服务、成份券停牌等潜在风险。", "page": 2, "section": null, "tags": []}, "B017": {"text": "本基金的标的指数为标普石油天然气上游股票指数（全收益指数），指数编制方法如下 ：", "page": 2, "section": null, "tags": ["市场风险"]}, "B018": {"text": "（1） 样本空间：综合性油气企业(10102010)、石油和天然气勘探及生产(10102020)、石", "page": 2, "section": null, "tags": []}, "B019": {"text": "油和天然气精炼及营销(10102030)。", "page": 2, "section": null, "tags": []}, "B020": {"text": "（2）选样方法：", "page": 2, "section": null, "tags": []}, "B021": {"text": "1）方法：指数系列为等权重，调整各成分股的权重以确保集中度和流动性要求。", "page": 2, "section": null, "tags": ["流动性风险", "市场风险"]}, "B022": {"text": "2）成分股权重：在每季度重新调整时，以截至该季度最后一个月第二个周五的收盘价", "page": 2, "section": null, "tags": []}, "B023": {"text": "作为参考价格， 对股票最初进行均等加权。 然后会按理论上既定投资组合价值 （如下文详述）", "page": 2, "section": null, "tags": []}, "B024": {"text": "作出调整，以确保指数的各成分股权重均不会超过可在一日内买卖的价值。每年都会审核理", "page": 2, "section": null, "tags": ["市场风险"]}, "B025": {"text": "论投资组合价值。指数委员会将酌情进行任何更新，向客户宣布时会给予充足的准备时间。", "page": 2, "section": null, "tags": ["市场风险"]}, "B026": {"text": "本指数系列采用等权重法，且为确保满足集中度和流动性要求调整每只成分股的权重。", "page": 2, "section": null, "tags": ["流动性风险", "市场风险"]}, "B027": {"text": "有关标的指数具体编制方案及成份股信息详见www.spdji.com。", "page": 2, "section": null, "tags": ["市场风险"]}, "B028": {"text": "本基金投资于证券市场，基金净值会因为证券市场波动等因素产生波动，投资者在投", "page": 2, "section": null, "tags": ["市场风险"]}, "B029": {"text": "资本基金前，需充分了解本基金的产品特性，并承担基金投资中出现的各类风险，包括：因", "page": 2, "section": null, "tags": []}, "B030": {"text": "整体政治、经济、社会等环境因素对证券价格产生影响而形成的系统性风险，个别证券特有", "page": 2, "section": null, "tags": []}, "B031": {"text": "的非系统性风险，由于基金投资人连续大量赎回基金产生的流动性风险，基金管理人在基金", "page": 2, "section": null, "tags": ["流动性风险"]}, "B032": {"text": "管理实施过程中产生的基金管理风险等。另外，本基金投资的标的为石油天然气上游行业上", "page": 2, "section": null, "tags": ["操作与合规风险"]}, "B033": {"text": "市公司的股票，而非与原油价格直接挂钩的现货商品或期货，因此，本基金的业绩表现可能", "page": 2, "section": null, "tags": ["杠杆风险"]}, "B034": {"text": "随着油气价格波动而出现较大波动，但也可能与油气价格变化存在明显差异。", "page": 2, "section": null, "tags": []}, "B035": {"text": "本基金已于2012年6月8日在深圳证券交易所上市交易。在上市交易期间，如继续接", "page": 2, "section": null, "tags": []}, "B036": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 3, "section": null, "tags": ["市场风险"]}, "B037": {"text": "受申购可能导致基金管理人突破国家外汇局批准的外汇额度，此时本基金将暂停申购，由此", "page": 3, "section": null, "tags": ["机制特有风险"]}, "B038": {"text": "可能导致二级市场价格短期内剧烈波动并出现较大折溢价。 这种折溢价水平会在国家外汇局", "page": 3, "section": null, "tags": []}, "B039": {"text": "本基金恢复申购业务后大幅缩小。", "page": 3, "section": null, "tags": ["机制特有风险"]}, "B040": {"text": "根据深圳证券交易所于2015年1月9日发布的关于修改《深圳证券交易所交易规则》", "page": 3, "section": null, "tags": []}, "B041": {"text": "第3.1.4条的通知，本基金已于2015年1月19日起实行当日回转交易，即T+0回转交易。", "page": 3, "section": null, "tags": []}, "B042": {"text": "基金的过往业绩并不预示其未来表现。", "page": 3, "section": null, "tags": []}, "B043": {"text": "基金管理人依照恪尽职守、诚实信用、谨慎勤勉的原则管理和运用基金财产，但不保证", "page": 3, "section": null, "tags": ["信用风险"]}, "B044": {"text": "投资于本基金一定盈利，也不保证最低收益。", "page": 3, "section": null, "tags": []}, "B045": {"text": "本招募说明书中所载内容截止日为2022年2月28日；有关财务数据和净值表现截止日", "page": 3, "section": null, "tags": []}, "B046": {"text": "为2021年12月31日，数据未经审计。", "page": 3, "section": null, "tags": []}, "B047": {"text": "投资有风险，投资人申购本基金时应认真阅读本招募说明书。", "page": 3, "section": null, "tags": ["机制特有风险"]}, "B048": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 4, "section": null, "tags": ["市场风险"]}, "B049": {"text": "目     录", "page": 4, "section": null, "tags": []}, "B050": {"text": "一、绪  言................................................................................................................................1", "page": 4, "section": null, "tags": []}, "B051": {"text": "二、释  义................................................................................................................................2", "page": 4, "section": null, "tags": []}, "B052": {"text": "三、风险揭示............................................................................................................................8", "page": 4, "section": null, "tags": []}, "B053": {"text": "四、基金管理人......................................................................................................................13", "page": 4, "section": null, "tags": []}, "B054": {"text": "五、基金的募集......................................................................................................................19", "page": 4, "section": null, "tags": []}, "B055": {"text": "六、基金合同生效..................................................................................................................20", "page": 4, "section": null, "tags": []}, "B056": {"text": "七、基金上市交易..................................................................................................................21", "page": 4, "section": null, "tags": []}, "B057": {"text": "八、基金份额的申购、赎回、非交易过户与转托管..........................................................23", "page": 4, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B058": {"text": "九、基金的投资......................................................................................................................36", "page": 4, "section": null, "tags": []}, "B059": {"text": "十、基金的业绩......................................................................................................................46", "page": 4, "section": null, "tags": []}, "B060": {"text": "十一、基金的费用与税收......................................................................................................47", "page": 4, "section": null, "tags": []}, "B061": {"text": "十二、基金财产......................................................................................................................50", "page": 4, "section": null, "tags": []}, "B062": {"text": "十三、基金资产估值..............................................................................................................51", "page": 4, "section": null, "tags": []}, "B063": {"text": "十四、基金收益与分配..........................................................................................................56", "page": 4, "section": null, "tags": []}, "B064": {"text": "十五、基金的会计与审计......................................................................................................58", "page": 4, "section": null, "tags": []}, "B065": {"text": "十六、基金的信息披露..........................................................................................................59", "page": 4, "section": null, "tags": []}, "B066": {"text": "十七、基金合同的变更、终止与基金财产清算..................................................................64", "page": 4, "section": null, "tags": []}, "B067": {"text": "十八、基金托管人..................................................................................................................67", "page": 4, "section": null, "tags": []}, "B068": {"text": "十九、境外托管人..................................................................................................................71", "page": 4, "section": null, "tags": ["汇率与跨境风险"]}, "B069": {"text": "二十、相关服务机构..............................................................................................................72", "page": 4, "section": null, "tags": []}, "B070": {"text": "二十一、基金合同的内容摘要..............................................................................................74", "page": 4, "section": null, "tags": []}, "B071": {"text": "二十二、基金托管协议内容摘要........................................................................................103", "page": 4, "section": null, "tags": []}, "B072": {"text": "二十三、对基金份额持有人的服务....................................................................................119", "page": 4, "section": null, "tags": []}, "B073": {"text": "二十四、其他应披露事项....................................................................................................122", "page": 4, "section": null, "tags": []}, "B074": {"text": "二十五、招募说明书存放及查阅方式................................................................................124", "page": 4, "section": null, "tags": []}, "B075": {"text": "二十六、备查文件................................................................................................................125", "page": 4, "section": null, "tags": []}, "B076": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 5, "section": null, "tags": ["市场风险"]}, "B077": {"text": "一、 绪  言", "page": 5, "section": null, "tags": []}, "B078": {"text": "本招募说明书依据《中华人民共和国证券投资基金法》(以下简称“《基金法》”)、 《合", "page": 5, "section": null, "tags": []}, "B079": {"text": "格境内机构投资者境外证券投资管理试行办法》(以下简称“《试行办法》”)、 《公开募集开", "page": 5, "section": null, "tags": ["汇率与跨境风险"]}, "B080": {"text": "放式证券投资基金流动性风险管理规定》 （以下简称“《流动性规定》”） 、 《公开募集证券投资", "page": 5, "section": null, "tags": ["流动性风险"]}, "B081": {"text": "基金信息披露管理办法》(以下简称“《信息披露办法》”)、 《公开募集证券投资基金运作指", "page": 5, "section": null, "tags": []}, "B082": {"text": "引第3号——指数基金指引》 （以下简称“《指数基金指引》”） 其他有关规定及《华宝标普石", "page": 5, "section": null, "tags": ["市场风险"]}, "B083": {"text": "油天然气上游股票指数证券投资基金（LOF）基金合同》(以下简称“基金合同”)编写。", "page": 5, "section": null, "tags": ["市场风险"]}, "B084": {"text": "本招募说明书阐述了华宝标普石油天然气上游股票指数证券投资基金（LOF）的投资目", "page": 5, "section": null, "tags": ["市场风险"]}, "B085": {"text": "标、策略、风险、费率等与投资人投资决策有关的必要事项，投资人在作出投资决策前应仔", "page": 5, "section": null, "tags": []}, "B086": {"text": "细阅读本招募说明书。", "page": 5, "section": null, "tags": []}, "B087": {"text": "本基金管理人承诺本招募说明书不存在任何虚假记载、误导性陈述或重大遗漏，并对其", "page": 5, "section": null, "tags": []}, "B088": {"text": "真实性、准确性、完整性承担法律责任。", "page": 5, "section": null, "tags": []}, "B089": {"text": "本基金是根据本招募说明书所载明资料申请募集的。本招募说明书由本基金管理人解释。", "page": 5, "section": null, "tags": []}, "B090": {"text": "本基金管理人没有委托或授权任何其他人提供未在本招募说明书中载明的信息， 或对本招募", "page": 5, "section": null, "tags": []}, "B091": {"text": "说明书作出任何解释或者说明。", "page": 5, "section": null, "tags": []}, "B092": {"text": "本招募说明书根据基金合同编写，并经中国证监会核准。基金合同是约定基金当事人之", "page": 5, "section": null, "tags": []}, "B093": {"text": "间权利、义务的法律文件。基金投资人自依基金合同取得基金份额，即成为基金份额持有人", "page": 5, "section": null, "tags": []}, "B094": {"text": "和基金合同的当事人，其持有基金份额的行为本身即表明其对基金合同的承认和接受，并按", "page": 5, "section": null, "tags": []}, "B095": {"text": "照《基金法》 、基金合同及其他有关规定享有权利、承担义务。基金投资人欲了解基金份额", "page": 5, "section": null, "tags": []}, "B096": {"text": "持有人的权利和义务，应详细查阅基金合同。", "page": 5, "section": null, "tags": []}, "B097": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 6, "section": null, "tags": ["市场风险"]}, "B098": {"text": "二、 释  义", "page": 6, "section": null, "tags": []}, "B099": {"text": "在本招募说明书中，除非文义另有所指，下列词语或简称具有如下含义：", "page": 6, "section": null, "tags": []}, "B100": {"text": "1.基金或本基金：指华宝标普石油天然气上游股票指数证券投资基金（LOF）", "page": 6, "section": null, "tags": ["市场风险"]}, "B101": {"text": "2.基金管理人：指华宝基金管理有限公司", "page": 6, "section": null, "tags": []}, "B102": {"text": "3.基金托管人：指中国建设银行股份有限公司", "page": 6, "section": null, "tags": []}, "B103": {"text": "4.基金合同：指《华宝标普石油天然气上游股票指数证券投资基金（LOF）基金合同》", "page": 6, "section": null, "tags": ["市场风险"]}, "B104": {"text": "及对基金合同的任何有效修订和补充", "page": 6, "section": null, "tags": []}, "B105": {"text": "5.托管协议：指基金管理人与基金托管人就本基金签订之《华宝标普石油天然气上游股", "page": 6, "section": null, "tags": []}, "B106": {"text": "票指数证券投资基金（LOF）托管协议》及对该托管协议的任何有效修订和补充", "page": 6, "section": null, "tags": ["市场风险"]}, "B107": {"text": "6.招募说明书或本招募说明书：指《华宝标普石油天然气上游股票指数证券投资基金", "page": 6, "section": null, "tags": ["市场风险"]}, "B108": {"text": "（LOF）招募说明书》及其更新", "page": 6, "section": null, "tags": []}, "B109": {"text": "7.基金产品资料概要：指《华宝标普石油天然气上游股票指数证券投资基金", "page": 6, "section": null, "tags": ["市场风险"]}, "B110": {"text": "（LOF）基金产品资料概要》及其更新（本招募说明书关于基金产品资料概要的编制、", "page": 6, "section": null, "tags": []}, "B111": {"text": "披露及更新等内容，将不晚于2020年9月1日起执行）", "page": 6, "section": null, "tags": []}, "B112": {"text": "8.发售公告：指《华宝兴业标普石油天然气上游股票指数证券投资基金（LOF） 份额发", "page": 6, "section": null, "tags": ["市场风险"]}, "B113": {"text": "售公告》", "page": 6, "section": null, "tags": []}, "B114": {"text": "9.法律法规：指中国现行有效并公布实施的法律、行政法规、规范性文件、司法解释、", "page": 6, "section": null, "tags": []}, "B115": {"text": "行政规章以及其他对基金合同当事人有约束力的决定、决议、通知等", "page": 6, "section": null, "tags": []}, "B116": {"text": "10.《基金法》 ：指2003年10月28日经第十届全国人民代表大会常务委员会第五次会", "page": 6, "section": null, "tags": []}, "B117": {"text": "议通过，自2004年6月1日起实施的《中华人民共和国证券投资基金法》及颁布机关对其", "page": 6, "section": null, "tags": []}, "B118": {"text": "不时作出的修订", "page": 6, "section": null, "tags": []}, "B119": {"text": "11.《销售办法》 ：指中国证监会于2004年6月25日颁布、自同年7月1日起实施的", "page": 6, "section": null, "tags": []}, "B120": {"text": "《证券投资基金销售管理办法》及颁布机关对其不时做出的修订", "page": 6, "section": null, "tags": []}, "B121": {"text": "12、 《信息披露办法》 ： 指中国证监会2019年7月26日颁布、同年9月1日实施的《公", "page": 6, "section": null, "tags": []}, "B122": {"text": "开募集证券投资基金信息披露管理办法》及颁布机关对其不时做出的修订", "page": 6, "section": null, "tags": []}, "B123": {"text": "13.《运作办法》 ：指中国证监会于2004年6月29日颁布、自同年7月1日起实施的", "page": 6, "section": null, "tags": []}, "B124": {"text": "《证券投资基金运作管理办法》及颁布机关对其不时做出的修订", "page": 6, "section": null, "tags": []}, "B125": {"text": "14.《试行办法》 ： 指中国证监会2007年6月21日颁布、同年7月5日实施的《合格境", "page": 6, "section": null, "tags": []}, "B126": {"text": "内机构投资者境外证券投资管理试行办法》及颁布机关对其不时做出的修订", "page": 6, "section": null, "tags": ["汇率与跨境风险"]}, "B127": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 7, "section": null, "tags": ["市场风险"]}, "B128": {"text": "15.《流动性规定》 ：指中国证监会于2017年8月3日公布、同年10月1日起实施的", "page": 7, "section": null, "tags": ["流动性风险"]}, "B129": {"text": "《公开募集开放式证券投资基金流动性风险管理规定》及颁布机关对其不时做出的修订", "page": 7, "section": null, "tags": ["流动性风险"]}, "B130": {"text": "16.《指数基金指引》 ： 指中国证监会2021年1月22日颁布、同年2月1日实施的《公", "page": 7, "section": null, "tags": ["市场风险"]}, "B131": {"text": "开募集证券投资基金运作指引第3号——指数基金指引》及颁布机关对其不时做出的修订", "page": 7, "section": null, "tags": ["市场风险"]}, "B132": {"text": "17.流动性受限资产：指由于法律法规、监管、合同或操作障碍等原因无法以合理价格", "page": 7, "section": null, "tags": ["流动性风险"]}, "B133": {"text": "予以变现的资产，包括但不限于到期日在 10 个交易日以上的逆回购与银行定期存款（含协", "page": 7, "section": null, "tags": ["流动性风险"]}, "B134": {"text": "议约定有条件提前支取的银行存款） 、停牌股票、流通受限的新股及非公开发行股票、资产", "page": 7, "section": null, "tags": ["机制特有风险"]}, "B135": {"text": "支持证券、因发行人债务违约无法进行转让或交易的债券等", "page": 7, "section": null, "tags": ["信用风险"]}, "B136": {"text": "18.中国证监会：指中国证券监督管理委员会", "page": 7, "section": null, "tags": []}, "B137": {"text": "19.银行业监督管理机构：指中国人民银行和/或中国银行保险监督管理委员会", "page": 7, "section": null, "tags": []}, "B138": {"text": "20.国家外汇局： 指国家外汇管理局或其授权的代表机构", "page": 7, "section": null, "tags": []}, "B139": {"text": "21.基金合同当事人：指受基金合同约束，根据基金合同享有权利并承担义务的法律主", "page": 7, "section": null, "tags": []}, "B140": {"text": "体，包括基金管理人、基金托管人和基金份额持有人", "page": 7, "section": null, "tags": []}, "B141": {"text": "22.个人投资者：指年满18周岁，合法持有现时有效的中华人民共和国居民身份证、军", "page": 7, "section": null, "tags": []}, "B142": {"text": "人证件等有效身份证件的中国公民，以及中国证监会批准的其他可以投资基金的自然人", "page": 7, "section": null, "tags": []}, "B143": {"text": "23.机构投资者：指依法可以投资开放式证券投资基金的、在中华人民共和国境内合法", "page": 7, "section": null, "tags": []}, "B144": {"text": "注册登记并存续或经有关政府部门批准设立并存续的企业法人、事业法人、社会团体或其他", "page": 7, "section": null, "tags": []}, "B145": {"text": "组织", "page": 7, "section": null, "tags": []}, "B146": {"text": "24．投资人：指个人投资者、机构投资者和合格境外机构投资者以及法律法规或中国证", "page": 7, "section": null, "tags": ["汇率与跨境风险"]}, "B147": {"text": "监会允许购买证券投资基金的其他投资人的合称", "page": 7, "section": null, "tags": []}, "B148": {"text": "25．基金份额持有人：指依基金合同和招募说明书合法取得基金份额的投资人", "page": 7, "section": null, "tags": []}, "B149": {"text": "26．基金销售业务：指基金管理人或代销机构宣传推介基金，发售基金份额，办理基金", "page": 7, "section": null, "tags": []}, "B150": {"text": "份额的申购、赎回、转换、非交易过户、转托管及定期定额投资等业务", "page": 7, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B151": {"text": "27．销售机构：指直销机构和代销机构", "page": 7, "section": null, "tags": []}, "B152": {"text": "28．直销机构：指华宝基金管理有限公司", "page": 7, "section": null, "tags": []}, "B153": {"text": "29．代销机构：指与基金管理人签订了基金销售服务代理协议，代为办理基金销售业务", "page": 7, "section": null, "tags": []}, "B154": {"text": "的机构", "page": 7, "section": null, "tags": []}, "B155": {"text": "30.基金销售网点：指直销机构的直销柜台及代销机构的代销网点", "page": 7, "section": null, "tags": []}, "B156": {"text": "31.基金网上交易系统：指直销机构的直销e网金及代销机构的网上交易系统", "page": 7, "section": null, "tags": []}, "B157": {"text": "32.会员单位：深圳证券交易所的会员单位", "page": 7, "section": null, "tags": []}, "B158": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 8, "section": null, "tags": ["市场风险"]}, "B159": {"text": "33.销售场所：指场外销售场所和场内销售及交易场所，分别简称“场外”和“场内”", "page": 8, "section": null, "tags": []}, "B160": {"text": "34.场外：指不利用交易所交易系统，而通过各销售机构柜台系统办理基金份额认购、", "page": 8, "section": null, "tags": []}, "B161": {"text": "申购、赎回的场所", "page": 8, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B162": {"text": "35.场内：指深圳证券交易所内会员单位利用交易所交易系统办理基金份额认购、申购、", "page": 8, "section": null, "tags": ["机制特有风险"]}, "B163": {"text": "赎回的场所和上市交易的场所", "page": 8, "section": null, "tags": ["流动性风险"]}, "B164": {"text": "36.上市交易：指基金合同生效后投资人通过会员单位以集中竞价的方式买卖本基金A", "page": 8, "section": null, "tags": []}, "B165": {"text": "类人民币份额的行为", "page": 8, "section": null, "tags": []}, "B166": {"text": "37．登记结算业务：指基金登记、存管、过户、清算和结算业务，具体内容包括投资人", "page": 8, "section": null, "tags": []}, "B167": {"text": "基金账户的建立和管理、基金份额注册登记、基金销售业务的确认、清算和结算、代理发放", "page": 8, "section": null, "tags": []}, "B168": {"text": "红利、建立并保管基金份额持有人名册、办理非交易过户业务等", "page": 8, "section": null, "tags": []}, "B169": {"text": "38．登记结算机构：指办理登记结算业务的机构。本基金场内A类人民币份额登记结算", "page": 8, "section": null, "tags": []}, "B170": {"text": "机构为中国证券登记结算有限责任公司深圳分公司（以下简称：中国结算深圳分公司） ，场", "page": 8, "section": null, "tags": []}, "B171": {"text": "外A类人民币份额登记结算机构为中国证券登记结算有限责任公司（以下简称：中国结算公", "page": 8, "section": null, "tags": []}, "B172": {"text": "司） ，A类美元份额和C类人民币份额登记结算机构为华宝基金管理有限公司", "page": 8, "section": null, "tags": []}, "B173": {"text": "39.境外托管人：指纽约梅隆银行（The Bank of New York Mellon Company，INC）", "page": 8, "section": null, "tags": ["汇率与跨境风险"]}, "B174": {"text": "40.基金账户：指登记结算机构为投资人开立的、记录其持有的、基金管理人所管理的", "page": 8, "section": null, "tags": []}, "B175": {"text": "基金份额余额及其变动情况的账户。投资人通过场外销售机构办理基金份额的认购、申购和", "page": 8, "section": null, "tags": ["机制特有风险"]}, "B176": {"text": "赎回等业务时需持有基金帐户。其中，场外A类人民币份额记录在中国证券登记结算有限责", "page": 8, "section": null, "tags": ["流动性风险"]}, "B177": {"text": "任公司开立的基金账户并登记在中国证券登记结算有限责任公司的注册登记系统，A类美元", "page": 8, "section": null, "tags": []}, "B178": {"text": "份额和C类人民币份额记录在华宝基金管理有限公司开立的基金账户并登记在华宝基金管", "page": 8, "section": null, "tags": []}, "B179": {"text": "理有限公司的注册登记系统", "page": 8, "section": null, "tags": []}, "B180": {"text": "41.基金交易账户：指销售机构为投资人开立的、记录投资人通过该销售机构买卖本基", "page": 8, "section": null, "tags": []}, "B181": {"text": "金的基金份额变动及结余情况的账户", "page": 8, "section": null, "tags": []}, "B182": {"text": "42.深圳证券账户：指投资人在中国证券登记结算有限责任公司深圳分公司开立的深圳", "page": 8, "section": null, "tags": []}, "B183": {"text": "证券交易所人民币普通股票账户或证券投资基金账户。 记录在该账户下的场内A类人民币基", "page": 8, "section": null, "tags": []}, "B184": {"text": "金份额登记在登记结算机构的证券登记结算系统", "page": 8, "section": null, "tags": []}, "B185": {"text": "43.基金合同生效日：指2011年9月29日", "page": 8, "section": null, "tags": []}, "B186": {"text": "44.基金合同终止日：指基金合同规定的基金合同终止事由出现后，基金财产清算完毕，", "page": 8, "section": null, "tags": []}, "B187": {"text": "清算结果报中国证监会备案并予以公告的日期", "page": 8, "section": null, "tags": []}, "B188": {"text": "45.存续期：指基金合同生效至终止之间的不定期期限", "page": 8, "section": null, "tags": []}, "B189": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 9, "section": null, "tags": ["市场风险"]}, "B190": {"text": "46.工作日：指深圳证券交易所的正常交易日", "page": 9, "section": null, "tags": []}, "B191": {"text": "47.日：指公历日", "page": 9, "section": null, "tags": []}, "B192": {"text": "48.月：指公历月", "page": 9, "section": null, "tags": []}, "B193": {"text": "49.开放日：指为投资人办理基金份额申购、赎回或其他业务的工作日", "page": 9, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B194": {"text": "50.T日：指销售机构在规定的开放时间受理投资者申购、赎回或其他业务有效申请的", "page": 9, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B195": {"text": "工作日", "page": 9, "section": null, "tags": []}, "B196": {"text": "51.T+n日：指自T日起第n个工作日(不包含T日)", "page": 9, "section": null, "tags": []}, "B197": {"text": "52.交易时间：指开放日基金接受申购、赎回或其他交易的时间段", "page": 9, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B198": {"text": "53.认购：指在基金募集期内，投资人申请购买基金份额的行为", "page": 9, "section": null, "tags": []}, "B199": {"text": "54.申购：指基金存续期内，投资人根据基金合同和招募说明书的规定申请购买基金份", "page": 9, "section": null, "tags": ["机制特有风险"]}, "B200": {"text": "额的行为", "page": 9, "section": null, "tags": []}, "B201": {"text": "55.赎回：指基金存续期内，基金份额持有人按基金合同规定的条件要求将基金份额兑", "page": 9, "section": null, "tags": ["流动性风险"]}, "B202": {"text": "换为现金的行为", "page": 9, "section": null, "tags": []}, "B203": {"text": "56.系统内转托管：指基金份额持有人将持有的A类人民币份额在注册登记系统内不同", "page": 9, "section": null, "tags": []}, "B204": {"text": "销售机构(网点)之间或证券登记结算系统内不同会员单位（交易单元） 之间进行转托管的行", "page": 9, "section": null, "tags": []}, "B205": {"text": "57.跨系统转托管：指基金份额持有人将持有的A类人民币份额在注册登记系统和证券", "page": 9, "section": null, "tags": []}, "B206": {"text": "登记结算系统间进行转登记的行为。除非基金管理人另行公告，本基金不支持基金份额持有", "page": 9, "section": null, "tags": []}, "B207": {"text": "人将持有的基金份额在中国证券登记结算有限责任公司的注册登记系统或登记结算系统与", "page": 9, "section": null, "tags": []}, "B208": {"text": "华宝基金管理有限公司注册登记系统之间进行转托管。", "page": 9, "section": null, "tags": []}, "B209": {"text": "58.注册登记系统：中国证券登记结算有限公司开放式基金登记结算系统", "page": 9, "section": null, "tags": []}, "B210": {"text": "59.证券登记结算系统：中国证券登记结算有限公司深圳分公司证券登记结算系统", "page": 9, "section": null, "tags": []}, "B211": {"text": "60.定期定额投资计划：指投资人通过有关销售机构提出申请，约定每期扣款日、扣款", "page": 9, "section": null, "tags": []}, "B212": {"text": "金额及扣款方式， 由销售机构于每期约定扣款日在投资人指定银行账户内自动完成扣款及基", "page": 9, "section": null, "tags": []}, "B213": {"text": "金申购申请的一种投资方式", "page": 9, "section": null, "tags": ["机制特有风险"]}, "B214": {"text": "61.巨额赎回：指本基金单个开放日，基金净赎回申请(赎回申请份额总数加上基金转换", "page": 9, "section": null, "tags": ["流动性风险"]}, "B215": {"text": "中转出申请份额总数后扣除申购申请份额总数及基金转换中转入申请份额总数后的余额)超", "page": 9, "section": null, "tags": ["机制特有风险"]}, "B216": {"text": "过上一开放日基金总份额的10%", "page": 9, "section": null, "tags": []}, "B217": {"text": "62.元：如无特指，指人民币元", "page": 9, "section": null, "tags": []}, "B218": {"text": "63.人民币：指中国法定货币及法定货币单位", "page": 9, "section": null, "tags": []}, "B219": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 10, "section": null, "tags": ["市场风险"]}, "B220": {"text": "64.美元：指美国法定货币及法定货币单位", "page": 10, "section": null, "tags": []}, "B221": {"text": "65.基金份额类别：本基金根据销售服务费、申购费收取方式和申购、赎回所使用的货", "page": 10, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B222": {"text": "币的不同，将基金份额分为A类人民币份额、C类人民币份额和A类美元份额三个类别。不", "page": 10, "section": null, "tags": []}, "B223": {"text": "从本类别基金资产中计提销售服务费，收取申购费且以人民币计价并进行申购、赎回或上市", "page": 10, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B224": {"text": "交易的基金份额类别，称为A类人民币份额；从本类别基金资产中计提销售服务费，但不收", "page": 10, "section": null, "tags": []}, "B225": {"text": "取申购费且以人民币计价并进行申购、赎回的基金份额类别，称为C类人民币份额类别；不", "page": 10, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B226": {"text": "从本类别基金资产中计提销售服务费，收取申购费且以美元计价并进行申购、赎回的基金份", "page": 10, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B227": {"text": "额类别，称为A类美元份额。三类基金份额分设不同的基金代码，并分别公布基金份额净值", "page": 10, "section": null, "tags": []}, "B228": {"text": "和基金份额累计净值", "page": 10, "section": null, "tags": []}, "B229": {"text": "66.基金利润：指基金利息收入、投资收益、公允价值变动收益和其他收入扣除相关费", "page": 10, "section": null, "tags": []}, "B230": {"text": "用后的余额", "page": 10, "section": null, "tags": []}, "B231": {"text": "67.基金可供分配利润：指截至收益分配基准日基金未分配利润与未分配利润中已实现", "page": 10, "section": null, "tags": []}, "B232": {"text": "收益的孰低数", "page": 10, "section": null, "tags": []}, "B233": {"text": "68.基金资产总值：指基金拥有的各类有价证券、银行存款本息、基金应收申购款及其", "page": 10, "section": null, "tags": ["机制特有风险"]}, "B234": {"text": "他资产的价值总和", "page": 10, "section": null, "tags": []}, "B235": {"text": "69.基金资产净值：指基金资产总值减去基金负债后的价值", "page": 10, "section": null, "tags": []}, "B236": {"text": "70.基金转换：指基金份额持有人按照本基金合同和基金管理人届时有效公告规定的条", "page": 10, "section": null, "tags": []}, "B237": {"text": "件，申请将其持有基金管理人管理的、某一基金的基金份额转换为基金管理人管理的、且由", "page": 10, "section": null, "tags": []}, "B238": {"text": "同一登记结算机构办理登记结算的其他基金基金份额的行为", "page": 10, "section": null, "tags": []}, "B239": {"text": "71.基金份额净值：各人民币份额的基金份额净值指计算日基金资产净值除以计算日基", "page": 10, "section": null, "tags": []}, "B240": {"text": "金份额总数所得的基金单位份额的价值， 计算日基金份额余额为计算日各币种基金份额余额", "page": 10, "section": null, "tags": []}, "B241": {"text": "的合计数（对本基金来说，计算A类人民币份额的基金份额净值时，基金份额余额为A类人", "page": 10, "section": null, "tags": []}, "B242": {"text": "民币份额和A类美元份额余额的合计数） ；A类美元份额的基金份额净值以A类人民币份额", "page": 10, "section": null, "tags": []}, "B243": {"text": "的基金份额净值为基础， 按照计算日中国人民银行公布的人民币对美元汇率中间价进行计算", "page": 10, "section": null, "tags": ["汇率与跨境风险"]}, "B244": {"text": "72.基金资产估值：指计算评估基金资产和负债的价值，以确定基金资产净值和基金份", "page": 10, "section": null, "tags": []}, "B245": {"text": "额净值的过程", "page": 10, "section": null, "tags": []}, "B246": {"text": "73．指定媒介：指中国证监会指定的用以进行信息披露的全国性报刊及指定互联网网站", "page": 10, "section": null, "tags": []}, "B247": {"text": "（包括基金管理人网站、基金托管人网站、中国证监会基金电子披露网站）等媒介", "page": 10, "section": null, "tags": []}, "B248": {"text": "74.不可抗力：指本基金合同当事人不能预见、不能避免、不能克服的客观事件且在本", "page": 10, "section": null, "tags": []}, "B249": {"text": "基金合同由基金管理人、基金托管人签署之日后发生的，使本基金合同当事人无法全部或部", "page": 10, "section": null, "tags": []}, "B250": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 11, "section": null, "tags": ["市场风险"]}, "B251": {"text": "分履行本基金合同的任何事件，包括但不限于洪水、地震及其他自然灾害、战争、骚乱、火", "page": 11, "section": null, "tags": []}, "B252": {"text": "灾、政府征用、没收、恐怖袭击、传染病传播、法律法规变化、突发停电或其他突发事件、", "page": 11, "section": null, "tags": []}, "B253": {"text": "证券交易所非正常暂停或停止交易、互联网或公众通讯设备故障", "page": 11, "section": null, "tags": []}, "B254": {"text": "75、A类人民币份额：指不从本类别基金资产中计提销售服务费，收取申购费且以人民", "page": 11, "section": null, "tags": ["机制特有风险"]}, "B255": {"text": "币计价并进行申购、赎回或上市交易的基金份额类别", "page": 11, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B256": {"text": "76、C类人民币份额：指从本类别基金资产中计提销售服务费，但不收取申购费且以人", "page": 11, "section": null, "tags": ["机制特有风险"]}, "B257": {"text": "民币计价并进行申购、赎回的基金份额类别", "page": 11, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B258": {"text": "77、A类美元份额：指不从本类别基金资产中计提销售服务费，收取申购费且以美元计", "page": 11, "section": null, "tags": ["机制特有风险"]}, "B259": {"text": "价并进行申购、赎回的基金份额类别", "page": 11, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B260": {"text": "78、销售服务费：指从基金资产中计提的，用于本基金市场推广、销售以及基金份额持", "page": 11, "section": null, "tags": []}, "B261": {"text": "有人服务的费用", "page": 11, "section": null, "tags": []}, "B262": {"text": "华宝标普石油天然气上游股票指数证券投资基金（LOF）招募说明书（更新）", "page": 12, "section": null, "tags": ["市场风险"]}, "B263": {"text": "三、风险揭示", "page": 12, "section": null, "tags": []}, "B264": {"text": "1．本基金特有风险", "page": 12, "section": null, "tags": []}, "B265": {"text": "（1）净值大幅波动风险：本基金为专门投资石油天然气上游行业股票指数的被动投资", "page": 12, "section": null, "tags": ["市场风险"]}, "B266": {"text": "基金，因此本基金业绩表现可能随着油气价格波动而出现较大波动，但也可能与油气价格变", "page": 12, "section": null, "tags": []}, "B267": {"text": "化存在明显差异。由于此行业上市公司股票价格与石油天然气价格 尤其是石油价格具有较", "page": 12, "section": null, "tags": []}, "B268": {"text": "高的相关性，会随油气价格的变动而出现明显波动。考虑到油气价格可能受到各种国际和地", "page": 12, "section": null, "tags": []}, "B269": {"text": "缘经济、政治因素的影响出现大幅的波动，因此，本基金的净值可能也会随之出现较大幅度", "page": 12, "section": null, "tags": []}, "B270": {"text": "的波动。", "page": 12, "section": null, "tags": []}, "B271": {"text": "（2）场内溢价风险：本基金已于2012年6月8日在深圳证券交易所上市交易。在上市交", "page": 12, "section": null, "tags": []}, "B272": {"text": "易期间，如继续接受申购可能导致基金管理人突破国家外汇局批准的外汇额度，本基金将暂", "page": 12, "section": null, "tags": ["机制特有风险"]}, "B273": {"text": "停申购，由此可能导致二级市场价格短期内剧烈波动并出现较大溢价。若投资者以高溢价在", "page": 12, "section": null, "tags": ["机制特有风险"]}, "B274": {"text": "场内买入本基金，将承担额外的溢价成本以及未来溢价波动带来的价格风险，可能造成重大", "page": 12, "section": null, "tags": []}, "B275": {"text": "损失。", "page": 12, "section": null, "tags": []}, "B276": {"text": "2．海外投资风
