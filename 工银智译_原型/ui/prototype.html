text": "本基金按照国家法律法规有关规定及基金合同相关约定进行操作， 不存在违法违规", "page": 10, "section": null, "tags": []}, "B272": {"text": "及未履行基金合同承诺的情况。", "page": 10, "section": null, "tags": []}, "B273": {"text": "本报告期内，本基金管理人严格遵守《证券投资基金法》及其配套规则和其他相关", "page": 10, "section": null, "tags": []}, "B274": {"text": "法律法规的有关规定以及基金合同的相关约定，勤勉尽责地管理和运用基金资产，在严", "page": 10, "section": null, "tags": []}, "B275": {"text": "格控制风险的基础上，为基金份额持有人谋求最大利益。", "page": 10, "section": null, "tags": []}, "B276": {"text": "本报告期内，本基金运作合法合规，不存在损害基金份额持有人利益的行为。", "page": 10, "section": null, "tags": []}, "B277": {"text": "4.3 管理人对报告期内公平交易情况的专项说明", "page": 10, "section": null, "tags": []}, "B278": {"text": "4.3.1 公平交易制度的执行情况", "page": 10, "section": null, "tags": []}, "B279": {"text": "公平交易的执行情况包括：建立统一的研究平台和公共信息平台，保证各组合得到", "page": 10, "section": null, "tags": []}, "B280": {"text": "公平的投资资讯；公平对待不同投资组合，禁止各投资组合之间进行以利益输送为目的", "page": 10, "section": null, "tags": []}, "B281": {"text": "的投资交易活动；在保证各投资组合投资决策相对独立性的同时，严格执行授权审批程", "page": 10, "section": null, "tags": []}, "B282": {"text": "序；实行集中交易制度和公平交易分配制度；建立不同投资组合投资信息的管理及保密", "page": 10, "section": null, "tags": []}, "B283": {"text": "制度，保证不同投资组合经理之间的重大非公开投资信息的相互隔离；加强对投资交易", "page": 10, "section": null, "tags": []}, "B284": {"text": "行为的监察稽核力度，建立有效的异常交易行为日常监控和分析评估体系等。", "page": 10, "section": null, "tags": []}, "B285": {"text": "报告期内，公司公平交易程序运作良好，未出现异常情况；场外、网下业务公平交", "page": 10, "section": null, "tags": []}, "B286": {"text": "易制度执行情况良好，未出现异常情况。", "page": 10, "section": null, "tags": []}, "B287": {"text": "公司对旗下各投资组合的交易行为进行监控和分析， 对各投资组合不同时间窗口 （1", "page": 10, "section": null, "tags": []}, "B288": {"text": "日、3日、5日）内的同向交易的溢价金额与溢价率进行了T检验，未发现违反公平交易", "page": 10, "section": null, "tags": []}, "B289": {"text": "原则的异常交易。", "page": 10, "section": null, "tags": []}, "B290": {"text": "本报告期内，未出现违反公平交易制度的情况，公司旗下各基金不存在因非公平交", "page": 10, "section": null, "tags": []}, "B291": {"text": "易等导致的利益输送行为，公平交易制度的整体执行情况良好。", "page": 10, "section": null, "tags": []}, "B292": {"text": "4.3.2 异常交易行为的专项说明", "page": 10, "section": null, "tags": []}, "B293": {"text": "本报告期内，本公司所有投资组合参与的交易所公开竞价交易中，同日反向交易成", "page": 10, "section": null, "tags": []}, "B294": {"text": "交较少的单边交易量超过该证券当日成交量的5%的交易次数为0次，未发生不公平交易", "page": 10, "section": null, "tags": []}, "B295": {"text": "和利益输送。", "page": 10, "section": null, "tags": []}, "B296": {"text": "4.4 管理人对报告期内基金的投资策略和业绩表现的说明", "page": 10, "section": null, "tags": []}, "B297": {"text": "4.4.1 报告期内基金投资策略和运作分析", "page": 10, "section": null, "tags": []}, "B298": {"text": "去年我们一直在讲央行货币政策的管理思路从更注重传导机制的建立， 转向更注重", "page": 10, "section": null, "tags": []}, "B299": {"text": "传导的有效性， 对于2026年， 这种有效性更多地着眼在银行持续支持实体经济的能力上，", "page": 10, "section": null, "tags": []}, "B300": {"text": "更多地体现在净息差、负债稳定性、防空转三个方面，这是我们在年报中提到的，今年", "page": 10, "section": null, "tags": []}, "B301": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 11, "section": null, "tags": []}, "B302": {"text": "第11页", "page": 11, "section": null, "tags": []}, "B303": {"text": "上半年央行针对这些都有所动作。央行一方面引导货币市场和同业市场利率下行，这主", "page": 11, "section": null, "tags": ["市场风险"]}, "B304": {"text": "要考虑的是降低银行负债成本， 受到净息差较低以及银行资产端利率的调整通常快于负", "page": 11, "section": null, "tags": ["市场风险"]}, "B305": {"text": "债端的限制，所采用的方式并非降低政策利率的价格型手段，而是以数量型的方式，通", "page": 11, "section": null, "tags": ["市场风险"]}, "B306": {"text": "过大量投放中长期流动性，引导货币市场利率下行，此外通过调整同业自律机制的执行", "page": 11, "section": null, "tags": ["流动性风险", "市场风险"]}, "B307": {"text": "口径，进一步推动同业负债利率的下行。但另一方面，在市场利率下行的过程中，同业", "page": 11, "section": null, "tags": ["市场风险"]}, "B308": {"text": "负债利率和货币市场利率的下行节奏出现了错配，由于银行对负债稳定性的考量，同业", "page": 11, "section": null, "tags": ["市场风险"]}, "B309": {"text": "负债利率具有一定的粘性，同业负债利率的下行慢于货币市场利率，这导致市场出现了", "page": 11, "section": null, "tags": ["市场风险"]}, "B310": {"text": "比较明显的套利和空转的行为，因此央行在二季度开始整治空转，在针对这一结构性和", "page": 11, "section": null, "tags": []}, "B311": {"text": "阶段性目标的手段上，也依旧采取的是数量型工具，回笼之前多投放的中长期流动性，", "page": 11, "section": null, "tags": ["流动性风险"]}, "B312": {"text": "阶段性地抬高货币市场利率，消弭套利空间，从而有效地扼制了套利行为，银行对同业", "page": 11, "section": null, "tags": ["市场风险"]}, "B313": {"text": "活期存款这一同业工具的认知也发生了比较显著的变化， 从原来稳定且容易上大量的同", "page": 11, "section": null, "tags": []}, "B314": {"text": "业负债工具，变成了不稳定的工具，后续将更多以流动性工具看待，价格也将与资金价", "page": 11, "section": null, "tags": ["流动性风险"]}, "B315": {"text": "格趋同，这就使得同业市场利率和货币市场利率的下行节奏将大概率是匹配的，从而央", "page": 11, "section": null, "tags": ["市场风险"]}, "B316": {"text": "行整治空转的阶段性目标大体上是实现了的。整治空转这一阶段性目标完成后，央行重", "page": 11, "section": null, "tags": []}, "B317": {"text": "新回到引导货币市场利率下行的宽松路径中， 只是在力度上温和了很多， 推出隔夜OMO", "page": 11, "section": null, "tags": ["市场风险"]}, "B318": {"text": "这一新工具，特别是以较低的利率推出这一工具，我们理解除了丰富货币政策工具箱的", "page": 11, "section": null, "tags": ["市场风险"]}, "B319": {"text": "KPI考量，也有重新表明货币市场利率锚的含义（虽然这一工具的政策利率色彩偏低，", "page": 11, "section": null, "tags": ["市场风险"]}, "B320": {"text": "但以较低的固定利率招标的方式推出这一工具， 在一定程度上表明了央行对利率水平的", "page": 11, "section": null, "tags": ["市场风险"]}, "B321": {"text": "定位） ， 表明二季度的回笼更多的是针对空转， 而不是针对货币市场利率偏低。 操作上，", "page": 11, "section": null, "tags": ["市场风险"]}, "B322": {"text": "我们在市场宽松、 利率下行的时期实现了一些收益， 在利率波动的时期增加了一些配置。", "page": 11, "section": null, "tags": ["市场风险"]}, "B323": {"text": "4.4.2 报告期内基金的业绩表现", "page": 11, "section": null, "tags": []}, "B324": {"text": "截至2026年06月30日，本基金本报告期净值收益率为0.4771%，同期业绩比较基准", "page": 11, "section": null, "tags": []}, "B325": {"text": "收益率为0.6695%。", "page": 11, "section": null, "tags": []}, "B326": {"text": "4.5 管理人对宏观经济、证券市场及行业走势的简要展望", "page": 11, "section": null, "tags": []}, "B327": {"text": "2026年下半年，货币政策在遵循对上一致性方面要等待大的宏观政策的定调，目前", "page": 11, "section": null, "tags": []}, "B328": {"text": "看大幅变动的可能性不大，更多的可能是在存量政策的落实上发力，央行做好财政货币", "page": 11, "section": null, "tags": []}, "B329": {"text": "的配合，但考虑上半年存款重定价已经基本完成，净息差得到一定的修复，政策利率下", "page": 11, "section": null, "tags": ["市场风险"]}, "B330": {"text": "调的掣肘有所减轻，存在下调的空间和可能性，一定程度上也是对上半年利用数量工具", "page": 11, "section": null, "tags": []}, "B331": {"text": "引导市场利率下行在价格工具上的一种呼应。但如果政策利率下调，央行在数量工具上", "page": 11, "section": null, "tags": ["市场风险"]}, "B332": {"text": "的操作就会减弱，这是央行在维持传导有效性、避免市场过度反应的一种大概率选择，", "page": 11, "section": null, "tags": []}, "B333": {"text": "这种情况下，货币市场可能会较上半年偏紧，波动也会变大。", "page": 11, "section": null, "tags": []}, "B334": {"text": "4.6 管理人对报告期内基金估值程序等事项的说明", "page": 11, "section": null, "tags": []}, "B335": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 12, "section": null, "tags": []}, "B336": {"text": "第12页", "page": 12, "section": null, "tags": []}, "B337": {"text": "本基金管理人按照企业会计准则、中国证监会相关规定、中国证券投资基金业协会", "page": 12, "section": null, "tags": []}, "B338": {"text": "相关指引和基金合同关于估值的约定，对基金所持有的投资品种进行估值。本基金管理", "page": 12, "section": null, "tags": []}, "B339": {"text": "人设立的基金估值委员会为公司基金估值决策机构， 负责制定公司所管理基金的基本估", "page": 12, "section": null, "tags": []}, "B340": {"text": "值政策，对公司旗下基金已采用的估值政策、方法、流程的执行情况进行审核监督，确", "page": 12, "section": null, "tags": []}, "B341": {"text": "保基金估值工作符合相关法律法规和基金合同的规定， 确保基金资产估值的公平、 合理，", "page": 12, "section": null, "tags": []}, "B342": {"text": "有效维护投资人的利益。", "page": 12, "section": null, "tags": []}, "B343": {"text": "本基金托管人根据法律法规要求履行基金估值及净值计算的复核责任。 基金管理人", "page": 12, "section": null, "tags": []}, "B344": {"text": "改变估值技术，导致基金资产净值的变化在0.25%以上的，对所采用的相关估值技术、", "page": 12, "section": null, "tags": []}, "B345": {"text": "假设及输入值的适当性等咨询会计师事务所的专业意见。 定价服务机构按照商业合同约", "page": 12, "section": null, "tags": []}, "B346": {"text": "定提供定价服务。参与估值流程各方之间不存在任何重大利益冲突。", "page": 12, "section": null, "tags": []}, "B347": {"text": "4.7 管理人对报告期内基金利润分配情况的说明", "page": 12, "section": null, "tags": []}, "B348": {"text": "根据本基金合同及招募说明书（更新）等有关规定，本基金每日将基金净收益分配", "page": 12, "section": null, "tags": []}, "B349": {"text": "给基金份额持有人（该收益参与下一日的收益分配），并按自然日结转至基金份额持有", "page": 12, "section": null, "tags": []}, "B350": {"text": "人的基金账户。", "page": 12, "section": null, "tags": []}, "B351": {"text": "4.8 报告期内管理人对本基金持有人数或基金资产净值预警情形的说明", "page": 12, "section": null, "tags": []}, "B352": {"text": "本报告期内本基金管理人无应说明预警信息。", "page": 12, "section": null, "tags": []}, "B353": {"text": "§5  托管人报告", "page": 12, "section": null, "tags": []}, "B354": {"text": "5.1 报告期内本基金托管人遵规守信情况声明", "page": 12, "section": null, "tags": []}, "B355": {"text": "作为本基金的托管人，中信银行严格遵守了《中华人民共和国证券投资基金法》及", "page": 12, "section": null, "tags": []}, "B356": {"text": "其他有关法律法规、基金合同和托管协议的规定，对天弘余额宝货币市场基金报告期的", "page": 12, "section": null, "tags": []}, "B357": {"text": "投资运作，进行了认真、独立的会计核算和必要的投资监督，履行了托管人的义务，不", "page": 12, "section": null, "tags": []}, "B358": {"text": "存在任何损害基金份额持有人利益的行为。", "page": 12, "section": null, "tags": []}, "B359": {"text": "5.2 托管人对报告期内本基金投资运作遵规守信、净值计算、利润分配等情况的说明", "page": 12, "section": null, "tags": []}, "B360": {"text": "本托管人认为，天弘基金管理有限公司在天弘余额宝货币市场基金的投资运作、基", "page": 12, "section": null, "tags": []}, "B361": {"text": "金资产净值的计算、 基金份额申购赎回价格的计算、 基金费用开支及利润分配等问题上，", "page": 12, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B362": {"text": "不存在损害基金份额持有人利益的行为；在报告期内，严格遵守了《中华人民共和国证", "page": 12, "section": null, "tags": []}, "B363": {"text": "券投资基金法》等有关法律法规，在各重要方面的运作严格按照基金合同的规定进行。", "page": 12, "section": null, "tags": []}, "B364": {"text": "5.3 托管人对本中期报告中财务信息等内容的真实、准确和完整发表意见", "page": 12, "section": null, "tags": []}, "B365": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 13, "section": null, "tags": []}, "B366": {"text": "第13页", "page": 13, "section": null, "tags": []}, "B367": {"text": "本托管人认为，天弘基金管理有限公司的信息披露事务符合《公开募集证券投资基", "page": 13, "section": null, "tags": []}, "B368": {"text": "金信息披露管理办法》及其他相关法律法规的规定，基金管理人所编制和披露的报告期", "page": 13, "section": null, "tags": []}, "B369": {"text": "内的财务指标、净值表现、收益分配情况、财务会计报告、投资组合报告等信息真实、", "page": 13, "section": null, "tags": []}, "B370": {"text": "准确、完整，未发现有损害基金持有人利益的行为。", "page": 13, "section": null, "tags": []}, "B371": {"text": "§6 半年度财务会计报告（未经审计）", "page": 13, "section": null, "tags": []}, "B372": {"text": "6.1 资产负债表", "page": 13, "section": null, "tags": []}, "B373": {"text": "会计主体：天弘余额宝货币市场基金", "page": 13, "section": null, "tags": []}, "B374": {"text": "报告截止日：2026年06月30日", "page": 13, "section": null, "tags": []}, "B375": {"text": "单位：人民币元", "page": 13, "section": null, "tags": []}, "B376": {"text": " "tags": []}, "B573": {"text": "6.4 报表附注", "page": 18, "section": null, "tags": []}, "B574": {"text": "6.4.1 基金基本情况", "page": 18, "section": null, "tags": []}, "B575": {"text": "天弘余额宝货币市场基金（以下简称“本基金”）由天弘增利宝货币市场基金变更", "page": 18, "section": null, "tags": []}, "B576": {"text": "而来， 天弘增利宝货币市场基金系经中国证券监督管理委员会 （以下简称“中国证监会”）", "page": 18, "section": null, "tags": []}, "B577": {"text": "证监许可[2013]692号 《关于核准天弘增利宝货币市场基金募集的批复》 的准许， 由基金", "page": 18, "section": null, "tags": []}, "B578": {"text": "管理人天弘基金管理有限公司向社会公开发行募集，基金合同于2013年5月29日生效，", "page": 18, "section": null, "tags": []}, "B579": {"text": "首次设立募集规模为200,628,721.85份基金份额。 本基金的运作方式为契约型开放式， 存", "page": 18, "section": null, "tags": []}, "B580": {"text": "续期限不定。本基金的基金管理人为天弘基金管理有限公司，基金托管人为中信银行股", "page": 18, "section": null, "tags": []}, "B581": {"text": "份有限公司。", "page": 18, "section": null, "tags": []}, "B582": {"text": "本基金投资于以下金融工具：", "page": 18, "section": null, "tags": []}, "B583": {"text": "1、现金；", "page": 18, "section": null, "tags": []}, "B584": {"text": "2、期限在1年以内（含1年）的银行存款、债券回购、中央银行票据、同业存单；", "page": 18, "section": null, "tags": []}, "B585": {"text": "3、剩余期限在397天以内（含397天）的债券、非金融企业债务融资工具、资产支", "page": 18, "section": null, "tags": []}, "B586": {"text": "持证券；", "page": 18, "section": null, "tags": []}, "B587": {"text": "4、中国证监会、中国人民银行认可的其它具有良好流动性的货币市场工具。", "page": 18, "section": null, "tags": ["流动性风险"]}, "B588": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 19, "section": null, "tags": []}, "B589": {"text": "第19页", "page": 19, "section": null, "tags": []}, "B590": {"text": "对于法律法规或监管机构以后允许货币市场基金投资的其他金融工具， 基金管理人", "page": 19, "section": null, "tags": []}, "B591": {"text": "在履行适当程序后，可以将其纳入投资范围。", "page": 19, "section": null, "tags": []}, "B592": {"text": "6.4.2 会计报表的编制基础", "page": 19, "section": null, "tags": []}, "B593": {"text": "本财务报表系按照财政部颁布的《企业会计准则——基本准则》以及其后颁布及修", "page": 19, "section": null, "tags": []}, "B594": {"text": "订的具体会计准则、解释以及《资产管理产品相关会计处理规定》和其他相关规定（统", "page": 19, "section": null, "tags": []}, "B595": {"text": "称“企业会计准则”）编制，同时，在信息披露和估值方面，也参考了中国证监会发布", "page": 19, "section": null, "tags": []}, "B596": {"text": "的《中国证券监督管理委员会关于证券投资基金估值业务的指导意见》、《公开募集证", "page": 19, "section": null, "tags": []}, "B597": {"text": "券投资基金信息披露管理办法》、《公开募集证券投资基金信息披露内容与格式准则第", "page": 19, "section": null, "tags": []}, "B598": {"text": "2号——定期报告的内容与格式》、《证券投资基金信息披露编报规则第3号〈会计报表", "page": 19, "section": null, "tags": []}, "B599": {"text": "附注的编制及披露〉》、《证券投资基金信息披露编报规则第5号〈货币市场基金信息", "page": 19, "section": null, "tags": []}, "B600": {"text": "披露特别规定〉》，中国证券投资基金业协会发布的《公开募集证券投资基金信息披露", "page": 19, "section": null, "tags": []}, "B601": {"text": "XBRL模板第3号——年度报告和中期报告》 以及中国证监会和中国证券投资基金业协会", "page": 19, "section": null, "tags": []}, "B602": {"text": "发布的其他相关规定。", "page": 19, "section": null, "tags": []}, "B603": {"text": "本财务报表以本基金持续经营为基础列报。", "page": 19, "section": null, "tags": []}, "B604": {"text": "6.4.3 遵循企业会计准则及其他有关规定的声明", "page": 19, "section": null, "tags": []}, "B605": {"text": "本基金2026年度上半年财务报表符合企业会计准则的要求，真实、完整地反映了本", "page": 19, "section": null, "tags": []}, "B606": {"text": "基金2026年06月30日的财务状况以及2026年度上半年的经营成果和净资产变动情况等", "page": 19, "section": null, "tags": []}, "B607": {"text": "有关信息。", "page": 19, "section": null, "tags": []}, "B608": {"text": "6.4.4 本报告期所采用的会计政策、会计估计与最近一期年度报告相一致的说明", "page": 19, "section": null, "tags": []}, "B609": {"text": "本基金本报告期会计报表所采用的会计政策、 会计估计与最近一期年度会计报表所", "page": 19, "section": null, "tags": []}, "B610": {"text": "采用的会计政策、会计估计一致。", "page": 19, "section": null, "tags": []}, "B611": {"text": "6.4.5 差错更正的说明", "page": 19, "section": null, "tags": []}, "B612": {"text": "本基金在本报告期间无须说明的会计差错更正。", "page": 19, "section": null, "tags": []}, "B613": {"text": "6.4.6 税项", "page": 19, "section": null, "tags": []}, "B614": {"text": "根据中华人民共和国主席令第四十一号《中华人民共和国增值税法》、中华人民共", "page": 19, "section": null, "tags": []}, "B615": {"text": "和国国务院令第826号《中华人民共和国增值税法实施条例》及财政部、税务总局公告", "page": 19, "section": null, "tags": []}, "B616": {"text": "2026年第10号《关于增值税法施行后增值税优惠政策衔接事项的公告》的规定，资管产", "page": 19, "section": null, "tags": []}, "B617": {"text": "品运营过程中发生的应税交易，资管产品管理人为纳税人；自2026年1月1日至2027年12", "page": 19, "section": null, "tags": []}, "B618": {"text": "月31日，资管产品管理人运营契约制资管产品过程中发生的增值税应税行为，可以选择", "page": 19, "section": null, "tags": []}, "B619": {"text": "适用简易计税方法， 按照3%的规定征收率计算缴纳增值税， 公募证券投资基金 （封闭式", "page": 19, "section": null, "tags": []}, "B620": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 20, "section": null, "tags": []}, "B621": {"text": "第20页", "page": 20, "section": null, "tags": []}, "B622": {"text": "证券投资基金、开放式证券投资基金）管理人运用基金买卖股票、债券取得的收入免征", "page": 20, "section": null, "tags": []}, "B623": {"text": "增值税；自2026年1月1日至2027年12月31日，金融同业往来利息收入免征增值税，金融", "page": 20, "section": null, "tags": []}, "B624": {"text": "同业往来利息收入包括金融机构与人民银行所发生的资金往来业务、银行联行往来业", "page": 20, "section": null, "tags": []}, "B625": {"text": "务、金融机构间的资金往来业务，以及金融机构开展同业存款、同业借款、同业代付、", "page": 20, "section": null, "tags": []}, "B626": {"text": "买断式买入返售金融商品、质押式买入返售金融商品、同业存单，取得的利息收入；取", "page": 20, "section": null, "tags": []}, "B627": {"text": "得存款利息收入不属于应税交易，不征收增值税；本基金管理人运营本基金过程中发生", "page": 20, "section": null, "tags": []}, "B628": {"text": "的增值税应税行为适用简易计税方法，按照3%的征收率计算缴纳增值税；", "page": 20, "section": null, "tags": []}, "B629": {"text": "根据财政部、税务总局公告2025年第4号《关于国债等债券利息收入增值税政策的", "page": 20, "section": null, "tags": []}, "B630": {"text": "公告》的规定，自2025年8月8日起，对在该日期之后（含当日）新发行的国债、地方政", "page": 20, "section": null, "tags": []}, "B631": {"text": "府债券、金融债券的利息收入，恢复征收增值税。对在该日期之前已发行的国债、地方", "page": 20, "section": null, "tags": []}, "B632": {"text": "政府债券、金融债券（包含在2025年8月8日之后续发行的部分）的利息收入，继续免征", "page": 20, "section": null, "tags": []}, "B633": {"text": "增值税直至债券到期。", "page": 20, "section": null, "tags": []}, "B634": {"text": "根据《中华人民共和国城市维护建设税法》、《征收教育费附加的暂行规定（2011", "page": 20, "section": null, "tags": []}, "B635": {"text": "年修订）》及相关地方教育附加的征收规定，凡缴纳消费税、增值税、营业税的单位和", "page": 20, "section": null, "tags": []}, "B636": {"text": "个人，都应当依照规定缴纳城市维护建设税、教育费附加（除按照相关规定缴纳农村教", "page": 20, "section": null, "tags": []}, "B637": {"text —固定净值型货币市场基金", "page": 30, "section": null, "tags": []}, "B982": {"text": "单位：人民币元", "page": 30, "section": null, "tags": []}, "B983": {"text": "已按再投资形式", "page": 30, "section": null, "tags": []}, "B984": {"text": "转实收基金", "page": 30, "section": null, "tags": []}, "B985": {"text": "直接通过应付", "page": 30, "section": null, "tags": []}, "B986": {"text": "赎回款转出金额", "page": 30, "section": null, "tags": ["流动性风险"]}, "B987": {"text": "应付利润", "page": 30, "section": null, "tags": []}, "B988": {"text": "本年变动", "page": 30, "section": null, "tags": []}, "B989": {"text": "本期利润", "page": 30, "section": null, "tags": []}, "B990": {"text": "分配合计", "page": 30, "section": null, "tags": []}, "B991": {"text": "备注", "page": 30, "section": null, "tags": []}, "B992": {"text": "3,406,304,529.91 - - 3,406,304,529.9", "page": 30, "section": null, "tags": []}, "B993": {"text": "1 -", "page": 30, "section": null, "tags": []}, "B994": {"text": "注：本基金在本年度累计分配收益3,406,304,529.91元，其中以红利再投资方式结转", "page": 30, "section": null, "tags": []}, "B995": {"text": "入实收基金3,406,304,529.91元，计入应付收益科目0.00元。", "page": 30, "section": null, "tags": []}, "B996": {"text": "6.4.12 期末（2026年06月30日）本基金持有的流通受限证券", "page": 30, "section": null, "tags": []}, "B997": {"text": "6.4.12.1 因认购新发/增发证券而于期末持有的流通受限证券", "page": 30, "section": null, "tags": []}, "B998": {"text": "本基金本报告期末未持有因认购新发/增发证券而流通受限的证券。", "page": 30, "section": null, "tags": []}, "B999": {"text": "6.4.12.2 期末持有的暂时停牌等流通受限股票", "page": 30, "section": null, "tags": []}, "B1000": {"text": "本基金本报告期末未持有暂时停牌等流通受限的股票。", "page": 30, "section": null, "tags": []}, "B1001": {"text": "6.4.12.3 期末债券正回购交易中作为抵押的债券", "page": 30, "section": null, "tags": []}, "B1002": {"text": "6.4.12.3.1 银行间市场债券正回购", "page": 30, "section": null, "tags": []}, "B1003": {"text": "截至本报告期末2026年06月30日， 本基金未持有银行间市场债券正回购交易中作为", "page": 30, "section": null, "tags": []}, "B1004": {"text": "质押的债券。", "page": 30, "section": null, "tags": []}, "B1005": {"text": "6.4.12.3.2 交易所市场债券正回购", "page": 30, "section": null, "tags": []}, "B1006": {"text": "截至本报告期末2026年06月30日， 本基金未持有交易所市场债券正回购交易中作为", "page": 30, "section": null, "tags": []}, "B1007": {"text": "质押的债券。", "page": 30, "section": null, "tags": []}, "B1008": {"text": "6.4.12.4 期末参与转融通证券出借业务的证券", "page": 30, "section": null, "tags": []}, "B1009": {"text": "本基金本报告期末无参与转融通证券出借业务的证券。", "page": 30, "section": null, "tags": []}, "B1010": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 31, "section": null, "tags": []}, "B1011": {"text": "第31页", "page": 31, "section": null, "tags": []}, "B1012": {"text": "6.4.13 金融工具风险及管理", "page": 31, "section": null, "tags": []}, "B1013": {"text": "6.4.13.1 风险管理政策和组织架构", "page": 31, "section": null, "tags": []}, "B1014": {"text": "本基金为货币市场基金，本基金投资于各类固定收益类金融工具，其预期收益和风", "page": 31, "section": null, "tags": []}, "B1015": {"text": "险均低于债券型基金、混合型基金及股票型基金。本基金在日常经营活动中面临的与这", "page": 31, "section": null, "tags": []}, "B1016": {"text": "些金融工具相关的风险主要包括信用风险、流动性风险及市场风险。本基金的基金管理", "page": 31, "section": null, "tags": ["流动性风险", "信用风险"]}, "B1017": {"text": "人从事风险管理的主要目标是在保持基金资产的低风险和高流动性的前提下， 力争实现", "page": 31, "section": null, "tags": ["流动性风险"]}, "B1018": {"text": "超越业绩比较基准的投资回报。", "page": 31, "section": null, "tags": []}, "B1019": {"text": "本基金管理人按照“全面管理、专业分工、各司其职”的思路，明确风险管理职责", "page": 31, "section": null, "tags": []}, "B1020": {"text": "并将其融入组织架构、 写入制度、 嵌入系统， 实施多层次、 多角度、 全方位的风险管理。", "page": 31, "section": null, "tags": []}, "B1021": {"text": "一是投资决策实施分层授权管理，投资决策委员会、投资总监、投资部门负责人和基金", "page": 31, "section": null, "tags": []}, "B1022": {"text": "经理对投资行为及相关风险进行管理、监控，根据不同权限实施风险控制；二是按照部", "page": 31, "section": null, "tags": []}, "B1023": {"text": "门职能执行分工管理，基金经理、中央交易室、研究相关部门、风险管理部、内控合规", "page": 31, "section": null, "tags": []}, "B1024": {"text": "部、基金运营部等从不同角度、不同环节对投资全过程实行风险监控和管理；三是投资", "page": 31, "section": null, "tags": []}, "B1025": {"text": "到结算的全流程， 已经形成了一套贯穿“事前风险定位、 事中风险管理和事后风险评估”", "page": 31, "section": null, "tags": []}, "B1026": {"text": "的健全风险监控体系。", "page": 31, "section": null, "tags": []}, "B1027": {"text": "本基金的基金管理人对于金融工具的风险管理方法主要是通过定性分析和定量分", "page": 31, "section": null, "tags": []}, "B1028": {"text": "析的方法去估测各种风险产生的可能损失。从定性分析的角度出发，判断风险损失的严", "page": 31, "section": null, "tags": []}, "B1029": {"text": "重程度和出现同类风险损失的频度。 而从定量分析的角度出发， 根据本基金的投资目标，", "page": 31, "section": null, "tags": []}, "B1030": {"text": "结合基金资产所运用金融工具特征通过特定的风险量化指标、模型，日常的量化报告，", "page": 31, "section": null, "tags": []}, "B1031": {"text": "确定风险损失的限度和相应置信程度，及时可靠地对各种风险进行监督、检查和评估，", "page": 31, "section": null, "tags": []}, "B1032": {"text": "并通过相应决策，将风险控制在可承受的范围内。", "page": 31, "section": null, "tags": []}, "B1033": {"text": "6.4.13.2 信用风险", "page": 31, "section": null, "tags": ["信用风险"]}, "B1034": {"text": "信用风险是指基金在交易过程中因交易对手未履行合约责任， 或者基金所投资证券", "page": 31, "section": null, "tags": ["信用风险"]}, "B1035": {"text": "之发行人出现违约、拒绝支付到期本息等情况，导致基金资产损失和收益变化的风险。", "page": 31, "section": null, "tags": ["信用风险"]}, "B1036": {"text": "本基金的基金管理人在交易前对交易对手的资信状况进行了充分的评估。 本基金的活期", "page": 31, "section": null, "tags": []}, "B1037": {"text": "银行存款和定期存款存放在本基金的托管人中信银行股份有限公司及其他具有基金托", "page": 31, "section": null, "tags": []}, "B1038": {"text": "管资格的国有银行和大型股份制银行，并实施不同区间的额度管理，因而与银行存款相", "page": 31, "section": null, "tags": []}, "B1039": {"text": "关的信用风险不重大。 本基金在交易所进行的交易均以中国证券登记结算有限责任公司", "page": 31, "section": null, "tags": ["信用风险"]}, "B1040": {"text": "为交易对手完成证券交收和款项清算，违约风险可能性很小；在银行间同业市场进行交", "page": 31, "section": null, "tags": ["信用风险"]}, "B1041": {"text": "易前均对交易对手进行信用评估并对证券交割方式进行限制以控制相应的信用风险。", "page": 31, "section": null, "tags": ["信用风险"]}, "B1042": {"text": "本基金的基金管理人建立了信用风险管理流程，不投资于短期信用评级在A-1级以", "page": 31, "section": null, "tags": ["信用风险"]}, "B1043": {"text": "下或长期信用评级在AAA级以下的债券， 通过对投资品种信用等级评估来控制证券发行", "page": 31, "section": null, "tags": ["信用风险"]}, "B1044": {"text": "人的信用风险，且通过分散化投资以分散信用风险。本基金投资于主体信用评级低于", "page": 31, "section": null, "tags": ["信用风险"]}, "B1045": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 32, "section": null, "tags": []}, "B1046": {"text": "第32页", "page": 32, "section": null, "tags": []}, "B1047": {"text": "AAA的机构发行的金融工具占基金资产净值的比例合计不得超过10%， 其中单一机构发", "page": 32, "section": null, "tags": []}, "B1048": {"text": "行的金融工具占基金资产净值的比例合计不得超过2%。 且本基金与由本基金的基金管理", "page": 32, "section": null, "tags": []}, "B1049": {"text": "人管理的其他货币市场基金投资同一商业银行的银行存款及其发行的同业存单与债券", "page": 32, "section": null, "tags": []}, "B1050": {"text": "不得超过该商业银行最近一个季度末的净资产的10%。", "page": 32, "section": null, "tags": []}, "B1051": {"text": "本基金债券投资的信用评级情况按《中国人民银行信用评级管理指导意见》设定的", "page": 32, "section": null, "tags": ["信用风险"]}, "B1052": {"text": "标准统计及汇总。", "page": 32, "section": null, "tags": []}, "B1053": {"text": "6.4.13.2.1 按短期信用评级列示的债券投资", "page": 32, "section": null, "tags": ["信用风险"]}, "B1054": {"text": "单位：人民币元", "page": 32, "section": null, "tags": []}, "B1055": {"text": "短期信用评级", "page": 32, "section": null, "tags": ["信用风险"]}, "B1056": {"text": "本期末", "page": 32, "section": null, "tags": []}, "B1057": {"text": "2026年06月30日", "page": 32, "section": null, "tags": []}, "B1058": {"text": "上年度末", "page": 32, "section": null, "tags": []}, "B1059": {"text": "2025年12月31日", "page": 32, "section": null, "tags": []}, "B1060": {"text": "A-1 - 2,848,187,582.00", "page": 32, "section": null, "tags": []}, "B1061": {"text": "A-1以下 - -", "page": 32, "section": null, "tags": []}, "B1062": {"text": "未评级 - 28,900,369,712.13", "page": 32, "section": null, "tags": []}, "B1063": {"text": "合计 - 31,748,557,294.13", "page": 32, "section": null, "tags": []}, "B1064": {"text": "注：未评级债券为国债、政策性金融债、央票或其他未经第三方评级机构进行债项", "page": 32, "section": null, "tags": []}, "B1065": {"text": "评级的债券。", "page": 32, "section": null, "tags": []}, "B1066": {"text": "6.4.13.2.2 按短期信用评级列示的资产支持证券投资", "page": 32, "section": null, "tags": ["信用风险", "机制特有风险"]}, "B1067": {"text": "本基金本报告期末及上年度末均未持有短期信用评级的资产支持证券。", "page": 32, "section": null, "tags": ["信用风险", "机制特有风险"]}, "B1068": {"text": "6.4.13.2.3 按短期信用评级列示的同业存单投资", "page": 32, "section": null, "tags": ["信用风险"]}, "B1069": {"text": "单位：人民币元", "page": 32, "section": null, "tags": []}, "B1070": {"text": "短期信用评级", "page": 32, "section": null, "tags": ["信用风险"]}, "B1071": {"text": "本期末", "page": 32, "section": null, "tags": []}, "B1072": {"text": "2026年06月30日", "page": 32, "section": null, "tags": []}, "B1073": {"text": "上年度末", "page": 32, "section": null, "tags": []}, "B1074": {"text": "2025年12月31日", "page": 32, "section": null, "tags": []}, "B1075": {"text": "A-1 - -", "page": 32, "section": null, "tags": []}, "B1076": {"text": "A-1以下 - -", "page": 32, "section": null, "tags": []}, "B1077": {"text": "未评级 71,288,910,457.00 106,382,854,787.99", "page": 32, "section": null, "tags": []}, "B1078": {"text": "合计 71,288,910,457.00 106,382,854,787.99", "page": 32, "section": null, "tags": []}, "B1079": {"text": "6.4.13.2.4 按长期信用评级列示的债券投资", "page": 32, "section": null, "tags": ["信用风险"]}, "B1080": {"text": "单位：人民币元", "page": 32, "section": null, "tags": []}, "B1081": {"text": "长期信用评级 本期末 上年度末", "page": 32, "section": null, "tags": ["信用风险"]}, "B1082": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 33, "section": null, "tags": []}, "B1083": {"text": "第33页", "page": 33, "section": null, "tags": []}, "B1084": {"text": "2026年06月30日 2025年12月31日", "page": 33, "section": null, "tags": []}, "B1085": {"text": "AAA - 3,354,536,443.84", "page": 33, "section": null, "tags": []}, "B1086": {"text": "AAA以下 - -", "page": 33, "section": null, "tags": []}, "B1087": {"text": "未评级 - 3,088,393,861.23", "page": 33, "section": null, "tags": []}, "B1088": {"text": "合计 - 6,442,930,305.07", "page": 33, "section": null, "tags": []}, "B1089": {"text": "注：未评级债券为国债、政策性金融债、央票或其他未经第三方评级机构进行债项", "page": 33, "section": null, "tags": []}, "B1090": {"text": "评级的债券。", "page": 33, "section": null, "tags": []}, "B1091": {"text": "6.4.13.2.5 按长期信用评级列示的资产支持证券投资", "page": 33, "section": null, "tags": ["信用风险", "机制特有风险"]}, "B1092": {"text": "本基金本报告期末及上年度末均未持有长期信用评级的资产支持证券。", "page": 33, "section": null, "tags": ["信用风险", "机制特有风险"]}, "B1093": {"text": "6.4.13.2.6 按长期信用评级列示的同业存单投资", "page": 33, "section": null, "tags": ["信用风险"]}, "B1094": {"text": "本基金本报告期末及上年度末均未持有长期信用评级的同业存单。", "page": 33, "section": null, "tags": ["信用风险"]}, "B1095": {"text": "6.4.13.3 流动性风险", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1096": {"text": "流动性风险是指基金在履行与金融负债有关的义务时遇到资金短缺的风险。 本基金", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1097": {"text": "的流动性风险一方面来自于基金份额持有人可随时要求赎回其持有的基金份额， 另一方", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1098": {"text": "面来自于投资品种所处的交易市场不活跃而带来的变现困难或因投资集中而无法在市", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1099": {"text": "场出现剧烈波动的情况下以合理的价格变现。", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1100": {"text": "针对兑付赎回资金的流动性风险， 本基金的基金管理人每日对本基金的申购赎回情", "page": 33, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1101": {"text": "况进行严密监控并预测流动性需求，保持基金投资组合中的可用现金头寸与之相匹配。", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1102": {"text": "本基金的基金管理人在基金合同中设计了巨额赎回条款， 约定在非常情况下赎回申请的", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1103": {"text": "处理方式， 控制因开放申购赎回模式带来的流动性风险， 有效保障基金份额持有人利益。", "page": 33, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B1104": {"text": "此外，基金管理人经与基金托管人协商，在确保投资者得到公平对待的前提下，可依照", "page": 33, "section": null, "tags": []}, "B1105": {"text": "法律法规及基金合同的约定，综合运用各类流动性风险管理工具，对赎回申请等进行适", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1106": {"text": "度调整，作为特定情形下基金管理人流动性风险管理的辅助措施。", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1107": {"text": "本基金于报告期末的卖出回购金融资产款（若有）计息且利息金额不重大；本基金", "page": 33, "section": null, "tags": []}, "B1108": {"text": "所承担的其他金融负债的合约约定到期日均为一个月以内且不计息， 可赎回基金份额净", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1109": {"text": "值（净资产）无固定到期日且不计息，因此账面余额约为未折现的合约到期现金流量。", "page": 33, "section": null, "tags": []}, "B1110": {"text": "6.4.13.3.1 报告期内本基金组合资产的流动性风险分析", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1111": {"text": "本基金的基金管理人在基金运作过程中严格按照 《公开募集证券投资基金运作管理", "page": 33, "section": null, "tags": []}, "B1112": {"text": "办法》、《货币市场基金监督管理办法》、《公开募集开放式证券投资基金流动性风险", "page": 33, "section": null, "tags": ["流动性风险"]}, "B1113": {"text": "管理规定》及《重要货币市场基金监管暂行规定》等法规的要求对本基金组合资产的流", "page": 33, "section": null, "tags": []}, "B1114": {"text": "动性风险进行管理， 通过监控基金平均剩余期限、 平均剩余存续期限、 高流动资产占比、", "page": 33, "section": null, "tags": []}, "B1115": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 34, "section": null, "tags": []}, "B1116": {"text": "第34页", "page": 34, "section": null, "tags": []}, "B1117": {"text": "持仓集中度、投资交易的不活跃品种（企业债或短期融资券），并结合份额持有人集中", "page": 34, "section": null, "tags": []}, "B1118": {"text": "度变化予以实现。", "page": 34, "section": null, "tags": []}, "B1119": {"text": "一般情况下，本基金投资组合的平均剩余期限在每个交易日不得超过60天，投资组", "page": 34, "section": null, "tags": []}, "B1120": {"text": "合中现金、国债、中央银行票据、政策性金融债券以及5个交易日内到期的其他金融工", "page": 34, "section": null, "tags": []}, "B1121": {"text": "具占基金资产净值的比例合计不得低于20%。当本基金前10名份额持有人的持有份额合", "page": 34, "section": null, "tags": []}, "B1122": {"text": "计超过基金总份额的50%时，本基金除投资组合的平均剩余期限在每个交易日不得超过", "page": 34, "section": null, "tags": []}, "B1123": {"text": "60天外，平均剩余存续期在每个交易日还不得超过120天，投资组合中现金、国债、中", "page": 34, "section": null, "tags": []}, "B1124": {"text": "央银行票据、政策性金融债券以及5个交易日内到期的其他金融工具占基金资产净值的", "page": 34, "section": null, "tags": []}, "B1125": {"text": "比例合计不得低于30%。本基金持有的现金、国债、中央银行票据、政策性金融债券以", "page": 34, "section": null, "tags": []}, "B1126": {"text": "及5个交易日内到期的其他金融工具占基金资产净值的比例符合法律法规的相关要求。", "page": 34, "section": null, "tags": []}, "B1127": {"text": "本基金投资于一家公司发行的证券市值不超过基金资产净值的5%， 且本基金与由本", "page": 34, "section": null, "tags": []}, "B1128": {"text": "基金的基金管理人管理的其他基金共同持有一家公司发行的证券不得超过该证券的", "page": 34, "section": null, "tags": []}, "B1129": {"text": "10%。本基金投资于具有基金托管人资格的同一商业银行发行的金融工具占基金资产净", "page": 34, "section": null, "tags": []}, "B1130": {"text": "值的比例不得超过15%，且本基金与由本基金的基金管理人管理的其他货币市场基金投", "page": 34, "section": null, "tags": []}, "B1131": {"text": "资同一商业银行的银行存款及其发行的同业存单与债券不得超过该商业银行最近一个", "page": 34, "section": null, "tags": []}, "B1132": {"text": "季度末净资产的10%。", "page": 34, "section": null, "tags": []}, "B1133": {"text": "本基金主动投资于流动性受限资产的市值合计不得超过基金资产净值的5%。本期", "page": 34, "section": null, "tags": ["流动性风险"]}, "B1134": {"text": "末， 本基金持有的流动性受限资产的估值占基金资产净值的比例符合法律法规的相关要", "page": 34, "section": null, "tags": ["流动性风险"]}, "B1135": {"text": "求。", "page": 34, "section": null, "tags": []}, "B1136": {"text": "同时，本基金的基金管理人通过合理分散逆回购交易的到期日与交易对手的集中", "page": 34, "section": null, "tags": []}, "B1137": {"text": "度；按照穿透原则对交易对手的财务状况、偿付能力及杠杆水平等进行必要的尽职调查", "page": 34, "section": null, "tags": ["杠杆风险"]}, "B1138": {"text": "与严格的准入管理， 以及对不同的交易对手实施交易额度管理并进行动态调整等措施严", "page": 34, "section": null, "tags": []}, "B1139": {"text": "格管理本基金从事逆回购交易的流动性风险和交易对手风险。此外，本基金的基金管理", "page": 34, "section": null, "tags": ["流动性风险"]}, "B1140": {"text": "人建立了交易对手管理制度：根据质押品的资质确定质押率水平；持续监测质押品的风", "page": 34, "section": null, "tags": []}, "B1141": {"text": "险状况与价值变动以确保质押品按公允价值计算足额； 并在与私募类证券资管产品及中", "page": 34, "section": null, "tags": []}, "B1142": {"text": "国证监会认定的其他主体为交易对手开展逆回购交易时， 可接受质押品的资质要求与基", "page": 34, "section": null, "tags": []}, "B1143": {"text": "金合同约定的投资范围保持一致。此外，本基金与私募资管产品的债券逆回购交易余额", "page": 34, "section": null, "tags": []}, "B1144": {"text": "合计不得超过基金资产净值的10%，相关质押券等担保品计入本基金投资于一家公司发", "page": 34, "section": null, "tags": []}, "B1145": {"text": "行的证券市值不超过基金资产净值5%的比例且其内部信用评级应当为较高级； 其中， 涉", "page": 34, "section": null, "tags": ["信用风险"]}, "B1146": {"text": "及同一私募资管产品的债券逆回购交易余额不得超过基金资产净值的1%。", "page": 34, "section": null, "tags": []}, "B1147": {"text": "6.4.13.4 市场风险", "page": 34, "section": null, "tags": []}, "B1148": {"text": "市场风险是指基金所持金融工具的公允价值或未来现金流量因所处市场各类价格", "page": 34, "section": null, "tags": []}, "B1149": {"text": "因素的变动而发生波动的风险，包括利率风险、外汇风险和其他价格风险。", "page": 34, "section": null, "tags": ["市场风险"]}, "B1150": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 35, "section": null, "tags": []}, "B1151": {"text": "第35页", "page": 35, "section": null, "tags": []}, "B1152": {"text": "6.4.13.4.1 利率风险", "page": 35, "section": null, "tags": ["市场风险"]}, "B1153": {"text": "利率风险是指金融工具的公允价值或未来现金流量受市场利率变动而发生波动的", "page": 35, "section": null, "tags": ["市场风险"]}, "B1154": {"text": "风险。利率敏感性金融工具均面临由于市场利率上升而导致公允价值下降的风险，其中", "page": 35, "section": null, "tags": ["市场风险"]}, "B1155": {"text": "浮动利率类金融工具还面临每个付息期间结束根据市场利率重新定价时对于未来现金", "page": 35, "section": null, "tags": ["市场风险"]}, "B1156": {"text": "流影响的风险。", "page": 35, "section": null, "tags": []}, "B1157": {"text": "本基金主要投资于银行存款和银行间同业市场交易的固定收益品种， 因此存在相应", "page": 35, "section": null, "tags": []}, "B1158": {"text": "的利率风险。本基金的基金管理人每日通过“影子定价”对本基金面临的市场风险进行", "page": 35, "section": null, "tags": ["市场风险"]}, "B1159": {"text": "监控，定期对本基金面临的利率敏感性缺口进行监控，并通过调整投资组合的久期等方", "page": 35, "section": null, "tags": ["市场风险"]}, "B1160": {"text": "法对上述利率风险进行管理。", "page": 35, "section": null, "tags": ["市场风险"]}, "B1161": {"text": "6.4.13.4.1.1 利率风险敞口", "page": 35, "section": null, "tags": ["市场风险"]}, "B1162": {"text": "单位：人民币元", "page": 35, "section": null, "tags": []}, "B1163": {"text": "本期末", "page": 35, "section": null, "tags": []}, "B1164": {"text": "2026年06月30日 6个月以内 6个月-1年 1-5年 5年以上 不计息 合计", "page": 35, "section": null, "tags": []}, "B1165": {"text": "资产", "page": 35, "section": null, "tags": []}, "B1166": {"text": "货币资金 401,247,489,4", "page": 35, "section": null, "tags": []}, "B1167": {"text": "84.18", "page": 35, "section": null, "tags": []}, "B1168": {"text": "704,009,139.0", "page": 35, "section": null, "tags": []}, "B1169": {"text": "3 - - - 401,951,498,6", "page": 35, "section": null, "tags": []}, "B1170": {"text": "23.21", "page": 35, "section": null, "tags": []}, "B1171": {"text": "结算备付金 51,058,958.04 - - - - 51,058,958.04", "page": 35, "section": null, "tags": []}, "B1172": {"text": "存出保证金 391,215.87 - - - - 391,215.87", "page": 35, "section": null, "tags": ["杠杆风险"]}, "B1173": {"text": "交易性金融资产 55,336,799,14", "page": 35, "section": null, "tags": []}, "B1174": {"text": "2.88", "page": 35, "section": null, "tags": []}, "B1175": {"text": "15,952,111,31", "page": 35, "section": null, "tags": []}, "B1176": {"text": "4.12 - - - 71,288,910,45", "page": 35, "section": null, "tags": []}, "B1177": {"text": "7.00", "page": : 42, "section": null, "tags": ["机制特有风险"]}, "B1443": {"text": "本基金本报告期末未持有资产支持证券。", "page": 42, "section": null, "tags": ["机制特有风险"]}, "B1444": {"text": "7.9 投资组合报告附注", "page": 42, "section": null, "tags": []}, "B1445": {"text": "7.9.1 基金计价方法说明", "page": 42, "section": null, "tags": []}, "B1446": {"text": "本基金估值采用摊余成本法，即估值对象以买入成本列示，按票面利率或协议利率", "page": 42, "section": null, "tags": ["市场风险"]}, "B1447": {"text": "并考虑其买入时的溢价与折价，在其剩余存续期内按照实际利率法进行摊销，每日计提", "page": 42, "section": null, "tags": ["市场风险"]}, "B1448": {"text": "损益。本基金通过每日计算基金收益并分配的方式，使基金份额净值保持在人民币1.00", "page": 42, "section": null, "tags": []}, "B1449": {"text": "元。 为了避免采用摊余成本法计算的基金资产净值与按市场利率和交易市价计算的基金", "page": 42, "section": null, "tags": ["市场风险"]}, "B1450": {"text": "资产净值发生重大偏离，从而对基金份额持有人的利益产生稀释和不公平的结果，基金", "page": 42, "section": null, "tags": []}, "B1451": {"text": "管理人于每一估值日，采用估值技术，对基金持有的估值对象进行重新评估，即\"影子", "page": 42, "section": null, "tags": []}, "B1452": {"text": "定价\"。投资组合的摊余成本与其他可参考公允价值指标产生重大偏离的，应按其他公", "page": 42, "section": null, "tags": []}, "B1453": {"text": "允指标对组合的账面价值进行调整，调整差额确认为\"公允价值变动损益\"，并按其他公", "page": 42, "section": null, "tags": []}, "B1454": {"text": "允价值指标进行后续计量。如基金份额净值恢复至1.00元，可恢复使用摊余成本法估算", "page": 42, "section": null, "tags": []}, "B1455": {"text": "公允价值。如有确凿证据表明按上述方法进行估值不能客观反映其公允价值的，基金管", "page": 42, "section": null, "tags": []}, "B1456": {"text": "理人可根据具体情况与基金托管人商定后，按最能反映公允价值的价格估值。", "page": 42, "section": null, "tags": []}, "B1457": {"text": "7.9.2 本基金投资的前十名证券发行主体中，【交通银行股份有限公司】于 2025年12月", "page": 42, "section": null, "tags": []}, "B1458": {"text": "10日收到中国人民银行出具公开处罚、 公开批评的通报， 于2026年06月05日收到国家金", "page": 42, "section": null, "tags": []}, "B1459": {"text": "融监督管理总局出具公开处罚的通报； 【宁波银行股份有限公司】 于2025年11月14日收", "page": 42, "section": null, "tags": []}, "B1460": {"text": "到中国人民银行宁波市分行出具公开处罚的通报；【兴业银行股份有限公司】于 2025", "page": 42, "section": null, "tags": []}, "B1461": {"text": "年12月05日收到国家金融监督管理总局出具公开处罚的通报； 【中国民生银行股份有限", "page": 42, "section": null, "tags": []}, "B1462": {"text": "公司】 分别于2025年09月12日、2025年10月31日收到国家金融监督管理总局出具公开处", "page": 42, "section": null, "tags": []}, "B1463": {"text": "罚的通报， 于2025年12月31日收到国家金融监督管理总局宁波监管局出具公开处罚的通", "page": 42, "section": null, "tags": []}, "B1464": {"text": "报； 【中国农业银行股份有限公司】 于2025年10月31日收到国家金融监督管理总局出具", "page": 42, "section": null, "tags": []}, "B1465": {"text": "公开处罚的通报；【中信银行股份有限公司】分别于 2025年09月12日、2026年06月05", "page": 42, "section": null, "tags": []}, "B1466": {"text": "日收到国家金融监督管理总局出具公开处罚的通报， 于2025年09月22日收到中国人民银", "page": 42, "section": null, "tags": []}, "B1467": {"text": "行出具公开处罚、 公开批评的通报， 于2026年06月17日收到国家金融监督管理总局云南", "page": 42, "section": null, "tags": []}, "B1468": {"text": "监管局出具公开处罚的通报。 本基金对上述主体发行的相关证券的投资决策程序符合相", "page": 42, "section": null, "tags": []}, "B1469": {"text": "关法律法规及基金合同的要求。", "page": 42, "section": null, "tags": []}, "B1470": {"text": "天弘余额宝货币市场基金2026年中期报告", "page": 43, "section": null, "tags": []}, "B1471": {"text": "第43页", "page": 43, "section": null, "tags": []}, "B1472": {"text": "7.9.3 期末其他各项资产构成", "page": 43, "section": null, "tags": []}, "B1473": {"text": "单位：人民币元", "page": 43, "section": null, "tags": []}, "B1474": {"text": "序号 名称 金额", "page": 43, "section": null, "tags": []}, "B1475": {"text": "1 存出保证金 391,215.87", "page": 43, "section": null, "tags": ["杠杆风险"]}, "B1476": {"text": "2 应收清算款 4,750,737,833.07", "page": 43, "section": null, "tags": []}, "B1477": {"text": "3 应收利息 -", "page": 43, "section": null, "tags": []}, "B1478": {"text": "4 应收申购款 -", "page": 43, "section": null, "tags": ["机制特有风险"]}, "B1479": {"text": "5 其他应收款 -", "page": 43, "section": null, "tags": []}, "B1480": {"text": "6 待摊费用 -", "page": 43, "section": null, "tags": []}, "B1481": {"text": "7 其他 -", "page": 43, "section": null, "tags": []}, "B1482": {"text": "8 合计 4,751,129,048.94", "page": 43, "section": null, "tags": []}, "B1483": {"text": "7.9.4 投资组合报告附注的其他文字描述部分", "page": 43, "section": null, "tags": []}, "B1484": {"text": "由于四舍五入的原因，分项之和与合计项之间可能存在尾差。", "page": 43, "section": null, "tags": []}, "B1485": {"text": " 资目标 本基金主要投资于具有良好成长性且合理定价的股票，在利用金融工程技术控", "page": 3, "section": null, "tags": []}, "B026": {"text": "制组合风险的前提下，谋求基金资产的长期最大化增值。", "page": 3, "section": null, "tags": []}, "B027": {"text": "投资策略", "page": 3, "section": null, "tags": []}, "B028": {"text": "本基金在对宏观经济、政策环境、利率走势、资金供给以及证券市场的现状及", "page": 3, "section": null, "tags": ["市场风险"]}, "B029": {"text": "发展趋势等因素进行深入分析研究的基础上，动态配置股票、债券、现金之间", "page": 3, "section": null, "tags": []}, "B030": {"text": "比例。在股票投资层面，在股票投资层面，本基金采用主动投资管理策略，基", "page": 3, "section": null, "tags": []}, "B031": {"text": "于“快速成长、合理定价”的选股标准精选个股，并在坚持以基本面研究驱动", "page": 3, "section": null, "tags": []}, "B032": {"text": "投资的基础上进行适度的选时操作，争取投资收益的最大化。在存托凭证投资", "page": 3, "section": null, "tags": ["机制特有风险"]}, "B033": {"text": "方面，本基金将根据投资目标和股票投资策略，基于对基础证券投资价值的研", "page": 3, "section": null, "tags": []}, "B034": {"text": "究判断，进行存托凭证的投资。在债券投资方面，本基金将采用久期控制下的", "page": 3, "section": null, "tags": ["机制特有风险"]}, "B035": {"text": "主动性投资策略。", "page": 3, "section": null, "tags": []}, "B036": {"text": "业绩比较基准 沪深 300 指数收益率×70%+中债综合全价指数收益率×25%+同业存款利率×", "page": 3, "section": null, "tags": ["市场风险"]}, "B037": {"text": "5%。", "page": 3, "section": null, "tags": []}, "B038": {"text": "风险收益特征", "page": 3, "section": null, "tags": []}, "B039": {"text": "本基金是一只主动投资的混合型基金，主要投资于具有良好成长性且合理定价", "page": 3, "section": null, "tags": []}, "B040": {"text": "的股票，风险和预期收益匹配，属于风险适中的证券投资基金品种。本基金力", "page": 3, "section": null, "tags": []}, "B041": {"text": "争在严格控制风险的前提下谋求实现基金资产长期稳定增长。", "page": 3, "section": null, "tags": []}, "B042": {"text": "基金管理人 富国基金管理有限公司", "page": 3, "section": null, "tags": []}, "B043": {"text": "基金托管人 中国工商银行股份有限公司", "page": 3, "section": null, "tags": []}, "B044": {"text": "下属分级基金的基金简称 富国天惠成长混合（LOF）A/B 富国天惠成长混合", "page": 3, "section": null, "tags": []}, "B045": {"text": "（LOF）C", "page": 3, "section": null, "tags": []}, "B046": {"text": "富国天惠成长混合", "page": 3, "section": null, "tags": []}, "B047": {"text": "（LOF）D", "page": 3, "section": null, "tags": []}, "B048": { on": null, "tags": []}, "B119": {"text": "（1） 自基金合同生效以来富国天惠成长混合（LOF）A/B 基金累计净值增长率与业绩比较基", "page": 5, "section": null, "tags": []}, "B120": {"text": "准收益率的历史走势对比图", "page": 5, "section": null, "tags": []}, "B121": {"text": "注：1、截止日期为 2025 年 12 月 31 日。", "page": 5, "section": null, "tags": []}, "B122": {"text": "2、本基金于 2005 年 11 月 16 日成立，建仓期 6 个月，从 2005 年 11 月 16 日起至 2006 年 5", "page": 5, "section": null, "tags": []}, "B123": {"text": "月 15 日，建仓期结束时各项资产配置比例均符合基金合同约定。", "page": 5, "section": null, "tags": []}, "B124": {"text": "（2） 自基金 C 级份额生效以来富国天惠成长混合（LOF）C 基金累计净值增长率与业绩比较", "page": 6, "section": null, "tags": []}, "B125": {"text": "基准收益率的历史走势对比图", "page": 6, "section": null, "tags": []}, "B126": {"text": "注：1、截止日期为 2025 年 12 月 31 日。", "page": 6, "section": null, "tags": []}, "B127": {"text": "2、本基金自 2017 年 3 月 23 日起增加 C 类份额，相关数据按实际存续期计算。", "page": 6, "section": null, "tags": []}, "B128": {"text": "（3） 自基金 D 级份额生效以来富国天惠成长混合（LOF）D 基金累计净值增长率与业绩比较", "page": 6, "section": null, "tags": []}, "B129": {"text": "基准收益率的历史走势对比图", "page": 6, "section": null, "tags": []}, "B130": {"text": "注：1、截止日期为 2025 年 12 月 31 日。", "page": 7, "section": null, "tags": []}, "B131": {"text": "2、本基金自 2024 年 11 月 20 日起增加 D 类份额，相关数据按实际存续期计算。", "page": 7, "section": null, "tags": []}, "B132": {"text": "§4 管理人报告", "page": 8, "section": null, "tags": []}, "B133": {"text": "4.1 基金经理（或基金经理小组）简介", "page": 8, "section": null, "tags": []}, "B134": {"text": "姓名 职务", "page": 8, "section": null, "tags": []}, "B135": {"text": "任本基金的基金经理期限 证券从", "page": 8, "section": null, "tags": []}, "B136": {"text": "业年限", "page": 8, "section": null, "tags": []}, "B137": {"text": "说明", "page": 8, "section": null, "tags": []}, "B138": {"text": "任职日期 离任日期", "page": 8, "section": null, "tags": []}, "B139": {"text": "朱少醒", "page": 8, "section": null, "tags": []}, "B140": {"text": "本基金现任基", "page": 8, "section": null, "tags": []}, "B141": {"text": "金经理", "page": 8, "section": null, "tags": []}, "B142": {"text": "2005-11-16 － 26", "page": 8, "section": null, "tags": []}, "B143": {"text": "博士，自 2000 年 6 月加入富国基金管", "page": 8, "section": null, "tags": []}, "B144": {"text": "理有限公司，历任产品开发主管、基金", "page": 8, "section": null, "tags": []}, "B145": {"text": "经理、研究部总经理、权益投资部总经", "page": 8, "section": null, "tags": []}, "B146": {"text": "理、公司总经理助理；现任富国基金副", "page": 8, "section": null, "tags": []}, "B147": {"text": "总经理，兼任富国基金资深权益基金经", "page": 8, "section": null, "tags": []}, "B148": {"text": "理。自 2005 年 11 月起任富国天惠精选", "page": 8, "section": null, "tags": []}, "B149": {"text": "成长混合型证券投资基金（LOF）基金", "page": 8, "section": null, "tags": []}, "B150": {"text": "经理；具有基金从业资格。", "page": 8, "section": null, "tags": []}, "B151": {"text": "注：1、上述任职日期为根据公司决定确定的聘任日期，离任日期为根据公司确定的解聘日期；", "page": 8, "section": null, "tags": []}, "B152": {"text": "首任基金经理任职日期为基金合同生效日。", "page": 8, "section": null, "tags": []}, "B153": {"text": "2、证券从业的涵义遵从中国证监会《证券基金经营机构董事、监事、高级管理人员及从业人", "page": 8, "section": null, "tags": []}, "B154": {"text": "员监督管理办法》的相关规定。", "page": 8, "section": null, "tags": []}, "B155": {"text": "4.2 管理人对报告期内本基金运作遵规守信情况的说明", "page": 8, "section": null, "tags": []}, "B156": {"text": "本报告期，富国基金管理有限公司作为富国天惠精选成长混合型证券投资基金（LOF）的", "page": 8, "section": null, "tags": []}, "B157": {"text": "管理人严格按照《中华人民共和国证券投资基金法》、《中华人民共和国证券法》、《富国天", "page": 8, "section": null, "tags": []}, "B158": {"text": "惠精选成长混合型证券投资基金（LOF）基金合同》以及其它有关法律法规的规定，本着诚实", "page": 8, "section": null, "tags": []}, "B159": {"text": "信用、勤勉尽责的原则管理和运用基金资产，以尽可能减少和分散投资风险、力保基金资产的", "page": 8, "section": null, "tags": ["信用风险"]}, "B160": {"text": "安全并谋求基金资产长期稳定收益为目标，基金投资组合符合有关法规及基金合同的规定。", "page": 8, "section": null, "tags": []}, "B161": {"text": "4.3 公平交易专项说明", "page": 8, "section": null, "tags": []}, "B162": {"text": "4.3.1 公平交易制度的执行情况", "page": 8, "section": null, "tags": []}, "B163": {"text": "本基金管理人根据《证券投资基金管理公司公平交易制度指导意见》和相关法规要求，制", "page": 8, "section": null, "tags": []}, "B164": {"text": "定了《证券投资公平交易管理办法》，保证公司旗下不同投资组合在系统控制、日常操作层面", "page": 9, "section": null, "tags": []}, "B165": {"text": "享有公平的交易机会，并保持各投资组合的独立投资决策权。", "page": 9, "section": null, "tags": []}, "B166": {"text": "本报告期内公司旗下基金严格遵守法律法规关于公平交易的相关规定，在投资管理活动中", "page": 9, "section": null, "tags": []}, "B167": {"text": "公平对待不同投资组合，未出现违反公平交易制度的情况。", "page": 9, "section": null, "tags": []}, "B168": {"text": "4.3.2 异常交易行为的专项说明", "page": 9, "section": null, "tags": []}, "B169": {"text": "本报告期内未发现异常交易行为。", "page": 9, "section": null, "tags": []}, "B170": {"text": "在交易所公开竞价同日反向交易的控制方面，报告期内本基金与公司管理的其他投资组合", "page": 9, "section": null, "tags": []}, "B171": {"text": "之间，出现 2 次同日反向交易成交较少的单边交易量超过该证券当日成交量 5%的情况，为投", "page": 9, "section": null, "tags": []}, "B172": {"text": "资组合间因投资策略不同而发生的反向交易，未发现不公平对待投资组合或利益输送等情况。", "page": 9, "section": null, "tags": []}, "B173": {"text": "4.4 报告期内基金的投资策略和运作分析", "page": 9, "section": null, "tags": []}, "B174": {"text": "四季度沪深 300 指数下跌0.23%，创业板指下跌 1.08%。指数经历了三季度的良好表现后", "page": 9, "section": null, "tags": ["市场风险"]}, "B175": {"text": "维持震荡走势。", "page": 9, "section": null, "tags": []}, "B176": {"text": "四季度出口保持强劲，地产继续下跌，消费低迷。货币政策保持宽松，财政政策持续发力。", "page": 9, "section": null, "tags": []}, "B177": {"text": "中美关系经历前期激烈的博弈后进入缓和阶段，投资者的风险偏好也得以提升。高景气的通讯、", "page": 9, "section": null, "tags": []}, "B178": {"text": "电子、有色等行业表现良好。反内卷的系列政策正在逐步反应在企业的经营环境上，未来将持", "page": 9, "section": null, "tags": []}, "B179": {"text": "续影响上市公司的基本面。市场的机会一定程度上有所扩散。当前的 A 股市场整体估值已经上", "page": 9, "section": null, "tags": []}, "B180": {"text": "行不少，但依然处于长周期中的合理区间。当下权益资产在所有资产大类中相对吸引力显著。", "page": 9, "section": null, "tags": []}, "B181": {"text": "当然指数中枢上行后，自下而上个股阿尔法的选择比之前更为重要。放在更长的时间维度，我", "page": 9, "section": null, "tags": ["市场风险"]}, "B182": {"text": "们相信实体经济终将有力复苏。优质的权益资产也将会进一步受益。投资者当前应当选择在权", "page": 9, "section": null, "tags": []}, "B183": {"text": "益上的维持头寸。未来我们依然会致力于在优质股票里寻找价值。我们并不具备精确预测市场", "page": 9, "section": null, "tags": []}, "B184": {"text": "短期趋势的可靠能力，而是把精力集中在耐心收集具有远大前景的优秀公司，等待公司自身创", "page": 9, "section": null, "tags": []}, "B185": {"text": "造价值的实现和市场情绪在未来某个时点的周期性回归。个股选择层面，本基金偏好投资于具", "page": 9, "section": null, "tags": []}, "B186": {"text": "有良好“企业基因”，公司治理结构完善、管理优秀的企业。我们认为此类企业有更大的概率", "page": 9, "section": null, "tags": []}, "B187": {"text": "能在未来为投资者创造价值。分享企业自身增长带来的资本市场收益是成长型基金获取回报的", "page": 9, "section": null, "tags": []}, "B188": {"text": "最佳途径。", "page": 9, "section": null, "tags": []}, "B189": {"text": "4.5 报告期内基金的业绩表现", "page": 9, "section": null, "tags": []}, "B190": {"text": "本报告期，本基金份额净值增长率情况：富国天惠成长混合（LOF）A/B 为 1.12%，富国天", "page": 9, "section": null, "tags": []}, "B191": {"text": "惠成长混合（LOF）C 为 0.91%，富国天惠成长混合（LOF）D 为 1.12%；同期业绩比较基准收益", "page": 10, "section": null, "tags": []}, "B192": {"text": "率情况：富国天惠成长混合（LOF）A/B 为-0.09%，富国天惠成长混合（LOF）C 为-0.09%，富", "page": 10, "section": null, "tags": []}, "B193": {"text": "国天惠成长混合（LOF）D 为-0.09%。", "page": 10, "section": null, "tags": []}, "B194": {"text": "4.6 报告期内基金持有人数或基金资产净值预警说明", "page": 10, "section": null, "tags": []}, "B195": {"text": "本基金本报告期无需要说明的相关情形。", "page": 10, "section": null, "tags": []}, "B196": {"text": "10", "page": 11, "section": null, "tags": []}, "B197": {"text": "§5 投资组合报告", "page": 11, "section": null, "tags": []}, "B198": {"text": "5.1 报告期末基金资产组合情况", "page": 11, "section": null, "tags": []}, "B199": {"text": "序号 项目 金额（元） 占基金总资产的比例（%）", "page": 11, "section": null, "tags": []}, "B200": {"text": "1 权益投资 21,217,982,399.49 93.89", "page": 11, "section": null, "tags": []}, "B201": {"text": "其中：股票 21,217,982,399.49 93.89", "page": 11, "section": null, "tags": []}, "B202": {"text": "2 固定收益投资 464,342,554.79 2.05", "page": 11, "section": null, "tags": []}, "B203": {"text": "其中：债券 464,342,554.79 2.05", "page": 11, "section": null, "tags": []}, "B204": {"text": "资产支持证券 － －", "page": 11, "section": null, "tags": ["机制特有风险"]}, "B205": {"text": "3 贵金属投资 － －", "page": 11, "section": null, "tags": []}, "B206": {"text": "4 金融衍生品投资 － －", "page": 11, "section": null, "tags": []}, "B207": {"text": "5 买入返售金融资产 － －", "page": 11, "section": null, "tags": []}, "B208": {"text": "其中：买断
