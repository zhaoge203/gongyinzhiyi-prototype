2016年 11月1日", "page": 1, "section": "产品概况", "tags": []}, "B022": {"text": "其他", "page": 1, "section": "产品概况", "tags": []}, "B023": {"text": "《基金合同》生效后，连续 60 个工作日出现基金份额持有人数量不满 200 人或者", "page": 1, "section": "产品概况", "tags": []}, "B024": {"text": "基金资产净值低于5000万元情形的，直接终止基金合同并进入基金财产清算程序，", "page": 1, "section": "产品概况", "tags": []}, "B025": {"text": "无需召开基金份额持有人大会审议。", "page": 1, "section": "产品概况", "tags": []}, "B026": {"text": "本基金的投资安排，请阅读本基金《招募说明书》 “基金的投资”章节了解详细情况。", "page": 1, "section": "基金投资与净值表现", "tags": []}, "B027": {"text": "投资目标  在控制风险并保持资产流动性的基础上，力争实现超过业绩比较基准的投资收益。", "page": 1, "section": "基金投资与净值表现", "tags": ["流动性风险"]}, "B028": {"text": "投资范围", "page": 1, "section": "基金投资与净值表现", "tags": []}, "B029": {"text": "本基金主要投资于具有良好流动性的工具，包括现金；期限在1 年以内（含1年）的", "page": 1, "section": "基金投资与净值表现", "tags": ["流动性风险"]}, "B030": {"text": "银行存款、债券回购、中央银行票据、同业存单；剩余期限在397天以内（含397天）", "page": 1, "section": "基金投资与净值表现", "tags": []}, "B031": {"text": "的债券、非金融企业债务融资工具、资产支持证券及法律法规或中国证监会、中国人", "page": 1, "section": "基金投资与净值表现", "tags": ["机制特有风险"]}, "B032": {"text": "民银行认可的其他具有良好流动性的货币市场工具。", "page": 1, "section": "基金投资与净值表现", "tags": ["流动性风险"]}, "B033": {"text": "主要投资策略  本基金将采取利率策略、信用策略、相对价值策略等积极投资策略，在严格控制风险", "page": 1, "section": "基金投资与净值表现", "tags": ["市场风险", "信用风险"]}, "B034": {"text": "的前提下，发掘和利用市场失衡提供的投资机会，实现组合增值。", "page": 1, "section": "基金投资与净值表现", "tags": []}, "B035": {"text": "业绩比较基准  中国人民银行公布的七天通知存款税后利率。", "page": 1, "section": "基金投资与净值表现", "tags": ["市场风险"]}, "B036": {"text": "风险收益特征  本基金为货币市场基金，在一般情况下，其风险与预期收益均低于一般债券型基金，", "page": 1, "section": "基金投资与净值表现", "tags": []}, "B037": {"text": "第 2页 共 4页", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B038": {"text": "也低于混合型基金与股票型基金。", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B039": {"text": "注：1、本基金基金合同于 2016 年 12 月 23 日生效。合同生效当年不满完整自然年度的，按实际期限计算", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B040": {"text": "净值收益率。", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B041": {"text": "2、基金的过往业绩不代表未来表现。", "page": 2, "section": "基金投资与净值表现", "tags": []}, "B042": {"text": "通常情况下，本基金不收取申购费用和赎回费用。", "page": 2, "section": "投资本基金涉及的费用", "tags": ["流动性风险", "机制特有风险"]}, "B043": {"text": "在满足相关流动性风险管理要求的前提下，当本基金持有的现金、国债、中央银行票据、政策性金融债", "page": 2, "section": "投资本基金涉及的费用", "tags": ["流动性风险"]}, "B044": {"text": "券以及 5 个交易日内到期的其他金融工具占基金资产净值的比例合计低于5%且偏离度为负时，为确保基金", "page": 2, "section": "投资本基金涉及的费用", "tags": []}, "B045": {"text": "平稳运作， 避免诱发系统性风险， 基金管理人将对当日单个基金份额持有人申请赎回基金份额超过基金总份", "page": 2, "section": "投资本基金涉及的费用", "tags": ["流动性风险"]}, "B046": {"text": "额 1%以上的赎回申请，对超过1%的部分征收1%的强制赎回费用，并将上述赎回费用全额计入基金财产。基", "page": 2, "section": "投资本基金涉及的费用", "tags": ["流动性风险"]}, "B047": {"text": "金管理人与基金托管人协商确认上述做法无益于基金利益最大化的情形除外。", "page": 2, "section": "投资本基金涉及的费用", "tags": []}, "B048": {"text": "当前 10名份额持有人的持有份额合计超过基金总份额50%， 且投资组合中现金、 国债、 中央银行票据、", "page": 2, "section": "投资本基金涉及的费用", "tags": []}, "B049": {"text": "政策性金融债券以及 5 个交易日内到期的其他金融工具占基金资产净值的比例合计低于 10%且偏离度为负", "page": 2, "section": "投资本基金涉及的费用", "tags": []}, "B050": {"text": "第 3页 共 4页", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B051": {"text": "时，为确保基金平稳运作，避免诱发系统性风险，基金管理人将对当日单个基金份额持有人超过基金总份额", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B052": {"text": "1%以上的赎回申请征收 1%的强制赎回费用，并将上述赎回费用全额计入基金财产。基金管理人与基金托管", "page": 3, "section": "投资本基金涉及的费用", "tags": ["流动性风险"]}, "B053": {"text": "人协商确认上述做法无益于基金利益最大化的情形除外。", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B054": {"text": "以下费用将从基金资产中扣除：", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B055": {"text": "费用类", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B056": {"text": "别  收费方式/年费率或金额  收取方", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B057": {"text": "管理费  0.15%  基金管理人和销售机构", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B058": {"text": "托管费  0.05%  基金托管人", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B059": {"text": "销售服", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B060": {"text": "务费  0.25%  销售机构", "page": 3, "section": "投资本基金涉及的费用", "tags": []}, "B061": {"text": : "风险揭示与重要提示", "tags": ["市场风险"]}, "B083": {"text": "面了解本基金的产品特性，理性判断市场，并承担基金投资中出现的各类风险，包括但不限于：投资组合风", "page": 3, "section": "风险揭示与重要提示", "tags": []}, "B084": {"text": "险、管理风险、合规性风险、操作风险、流动性风险、本基金法律文件风险收益特征表述与销售机构基金风", "page": 3, "section": "风险揭示与重要提示", "tags": ["流动性风险", "操作与合规风险"]}, "B085": {"text": "险评价可能不一致的风险和本基金的特定风险等。", "page": 3, "section": "风险揭示与重要提示", "tags": []}, "B086": {"text": "本基金为货币市场基金，基金的份额净值始终保持为1.00元，每日分配收益。但投资者购买本基金并", "page": 3, "section": "风险揭示与重要提示", "tags": []}, "B087": {"text": "不等于将资金作为存款存放在银行或存款类金融机构， 基金每日分配的收益将根据市场情况上下波动， 在极", "page": 3, "section": "风险揭示与重要提示", "tags": []}, "B088": {"text": "端情况下可能为负值，存在亏损的可能。", "page": 3, "section": "风险揭示与重要提示", "tags": []}, "B089": {"text": "第 4页 共 4页", "page": 4, "section": "风险揭示与重要提示", "tags": []}, "B090": {"text": "中国证监会对本基金募集的注册， 并不表明其对本基金的价值和收益作出实质性判断或保证， 也不表明", "page": 4, "section": "风险揭示与重要提示", "tags": []}, "B091": {"text": "投资于本基金没有风险。", "page": 4, "section": "风险揭示与重要提示", "tags": []}, "B092": {"text": "基金管理人依照恪尽职守、诚实信用、谨慎勤勉的原则管理和运用基金财产，但不保证基金一定盈利，", "page": 4, "section": "风险揭示与重要提示", "tags": ["信用风险"]}, "B093": {"text": "也不保证最低收益。", "page": 4, "section": "风险揭示与重要提示", "tags": []}, "B094": {"text": "基金投资者自依基金合同取得基金份额，即成为基金份额持有人和基金合同的当事人。因《基金合同》", "page": 4, "section": "风险揭示与重要提示", "tags": []}, "B095": {"text": "而产生的或与《基金合同》有关的争议，按照《基金合同》“争议的处理”章节的约定处理。", "page": 4, "section": "风险揭示与重要提示", "tags": []}, "B096": {"text": "基金产品资料概要信息发生重大变更的，基金管理人将在三个工作日内更新，其他信息发生变更的，基", "page": 4, "section": "风险揭示与重要提示", "tags": []}, "B097": {"text": "金管理人每年更新一次。因此，本文件内容相比基金的实际情况可能存在一定的滞后，如需及时、准确获取", "page": 4, "section": "风险揭示与重要提示", "tags": []}, "B098": {"text": "基金的相关信息，敬请同时关注基金管理人发布的相关临时公告等。", "page": 4, "section": "风险揭示与重要提示", "tags": []}, "B099": {"text": "以下资料详见基金管理人网站http://www.icbccs.com.cn或致电本公司客户服务热线4008119999", "page": 4, "section": "其他资料查询方式", "tags": []}, "B100": {"text": "1、基金合同、托管协议、招募说明书", "page": 4, "section": "其他资料查询方式", "tags": []}, "B101": {"text": "2、定期报告，包括基金季度报告、中期报告和年度报告", "page": 4, "section": : "七、基金份额持有人的权利与义务......................................................................................................9", "page": 1, "section": null, "tags": []}, "B015": {"text": "八、基金份额持有人大会....................................................................................................................10", "page": 1, "section": null, "tags": []}, "B016": {"text": "九、基金管理人、基金托管人的更换条件与程序............................................................................14", "page": 1, "section": null, "tags": []}, "B017": {"text": "十、基金的基本情况............................................................................................................................15", "page": 1, "section": null, "tags": []}, "B018": {"text": "十一、基金的募集................................................................................................................................16", "page": 1, "section": null, "tags": []}, "B019": {"text": "十二、基金合同生效............................................................................................................................16", "page": 1, "section": null, "tags": []}, "B020": {"text": "十三、基金的申购与赎回....................................................................................................................17", "page": 1, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B021": {"text": "十四、基金的非交易过户与转托管等................................................................................................22", "page": 1, "section": null, "tags": []}, "B022": {"text": "十五、基金资产的托管........................................................................................................................22", "page": 1, "section": null, "tags": []}, "B023": {"text": "十六、基金认购、申购和赎回等业务及其代理................................................................................23", "page": 1, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B024": {"text": "十七、基金注册登记业务及其代理....................................................................................................23", "page": 1, "section": null, "tags": []}, "B025": {"text": "十八、基金的投资................................................................................................................................24", "page": 1, "section": null, "tags": []}, "B026": {"text": "十九、基金的融资................................................................................................................................28", "page": 1, "section": null, "tags": []}, "B027": {"text": "二十、基金资产....................................................................................................................................28", "page": 1, "section": null, "tags": []}, "B028": {"text": "二十一、基金资产计价........................................................................................................................28", "page": 1, "section": null, "tags": []}, "B029": {"text": "二十二、基金费用与税收....................................................................................................................31", "page": 1, "section": null, "tags": []}, "B030": {"text": "二十三、基金收益与分配....................................................................................................................33", "page": 1, "section": null, "tags": []}, "B031": {"text": "二十四、基金的会计与审计................................................................................................................34", "page": 1, "section": null, "tags": []}, "B032": {"text": "二十五、基金的信息披露....................................................................................................................35", "page": 1, "section": null, "tags": []}, "B033": {"text": "二十六、基金的终止与清算................................................................................................................39", "page": 1, "section": null, "tags": []}, "B034": {"text": "二十七、业务规则................................................................................................................................40", "page": 1, "section": null, "tags": []}, "B035": {"text": "二十八、违约责任................................................................................................................................41", "page": 1, "section": null, "tags": ["信用风险"]}, "B036": {"text": "二十九、争议处理................................................................................................................................41", "page": 1, "section": null, "tags": []}, "B037": {"text": "三十、基金合同的效力........................................................................................................................41", "page": 1, "section": null, "tags": []}, "B038": {"text": "三十一、基金合同的修改与终止........................................................................................................42", "page": 1, "section": null, "tags": []}, "B039": {"text": "三十二、基金发起人、基金管理人和基金托管人签章.....................................................................42", "page": 1, "section": null, "tags": []}, "B040": {"text": "一、前言", "page": 1, "section": null, "tags": []}, "B041": {"text": "为保护基金投资者合法权益，明确基金合同当事人的权利与义务，规范基金运作，依照《中华人民", "page": 1, "section": null, "tags": []}, "B042": {"text": "和国证券投资基金法》（以下简称“《基金法》”）、《证券投资基金运作管理办法》（以下简称", "page": 2, "section": null, "tags": []}, "B043": {"text": "“《运作办法》”）、", "page": 2, "section": null, "tags": []}, "B044": {"text": "《证券投资基金销售管理办法》（以下简称“《销售办法》”）、《公开募集证券投资基金信息披", "page": 2, "section": null, "tags": []}, "B045": {"text": "露管理办法》", "page": 2, "section": null, "tags": []}, "B046": {"text": "（以下简称“《信息披露办法》”）、《货币市场基金监督管理办法》（以下简称“《管理办法》", "page": 2, "section": null, "tags": []}, "B047": {"text": "”）、《公开募集", "page": 2, "section": null, "tags": []}, "B048": {"text": "开放式证券投资基金流动性风险管理规定》（以下简称“《流动性风险管理规定》”）及其他有关", "page": 2, "section": null, "tags": ["流动性风险"]}, "B049": {"text": "规定，在平", "page": 2, "section": null, "tags": []}, "B050": {"text": "等自愿、诚实信用、充分保护基金投资者合法权益的原则基础上，订立《华夏现金增利证券投资基", "page": 2, "section": null, "tags": ["信用风险"]}, "B051": {"text": "金基金", "page": 2, "section": null, "tags": []}, "B052": {"text": "合同》（以下简称“本基金合同”）。", "page": 2, "section": null, "tags": []}, "B053": {"text": "本基金合同是规定本基金合同当事人之间基本权利义务的法律文件。本基金合同的当事人包括基金", "page": 2, "section": null, "tags": []}, "B054": {"text": "起人、基金管理人、基金托管人和基金份额持有人。基金发起人、基金管理人和基金托管人自本基", "page": 2, "section": null, "tags": []}, "B055": {"text": "金合同", "page": 2, "section": null, "tags": []}, "B056": {"text": "签订并生效之日起成为本基金合同的当事人。基金投资者自取得依据本基金合同发售的基金份额", "page": 2, "section": null, "tags": []}, "B057": {"text": "，即成为", "page": 2, "section": null, "tags": []}, "B058": {"text": "基金份额持有人和本基金合同的当事人。本基金合同的当事人按照《基金法》、本基金合同及其他", "page": 2, "section": null, "tags": []}, "B059": {"text": "有关规", "page": 2, "section": null, "tags": []}, "B060": {"text": "定享有权利、承担义务。", "page": 2, "section": null, "tags": []}, "B061": {"text": "华夏现金增利证券投资基金（以下简称“本基金”）由基金发起人按照基金合同及其他有关规定募", "page": 2, "section": null, "tags": []}, "B062": {"text": "集，", "page": 2, "section": null, "tags": []}, "B063": {"text": "经中国证券监督管理委员会（以下简称“中国证监会”）批准。", "page": 2, "section": null, "tags": []}, "B064": {"text": "中国证监会对本基金募集的批准，并不表明其对本基金的价值和收益作出实质性判断或保证，也不", "page": 2, "section": null, "tags": []}, "B065": {"text": "明投资于本基金没有风险。", "page": 2, "section": null, "tags": []}, "B066": {"text": "基金管理人保证依照诚实信用、勤勉尽责的原则管理和运用基金资产，但由于证券投资具有一定的", "page": 2, "section": null, "tags": ["信用风险"]}, "B067": {"text": "险，因此不保证本基金一定盈利，也不保证基金份额持有人的最低收益。", "page": 2, "section": null, "tags": []}, "B068": {"text": "投资者应当认真阅读基金招募说明书、基金合同、基金产品资料概要等信息披露文件，自主判断基", "page": 2, "section": null, "tags": []}, "B069": {"text": "的投资价值，自主做出投资决策，自行承担投资风险。", "page": 2, "section": null, "tags": []}, "B070": {"text": "本基金合同约定的基金产品资料概要编制、披露与更新要求，自《信息披露办法》实施之日起一年", "page": 2, "section": null, "tags": []}, "B071": {"text": "开始执行。", "page": 2, "section": null, "tags": []}, "B072": {"text": "二、释义", "page": 2, "section": null, "tags": []}, "B073": {"text": "本基金合同中，除非文意另有所指，下列词语或简称具有如下含义：", "page": 2, "section": null, "tags": []}, "B074": {"text": "基金或本基金：指华夏现金增利证券投资基金；", "page": 2, "section": null, "tags": []}, "B075": {"text": "基金合同、《基金合同》或本指本《华夏现金增利证券投资基金基金合同》及基金合同当事人对其", "page": 2, "section": null, "tags": []}, "B076": {"text": "不时", "page": 2, "section": null, "tags": []}, "B077": {"text": "基金合同：作出的修订；", "page": 2, "section": null, "tags": []}, "B078": {"text": "招募说明书：指《华夏现金增利证券投资基金招募说明书》及其更新；", "page": 2, "section": null, "tags": []}, "B079": {"text": "基金产品资料概要：指《华夏现金增利证券投资基金基金产品资料概要》及其更新；", "page": 3, "section": null, "tags": []}, "B080": {"text": "托管协议：指《华夏现金增利证券投资基金托管协议》及基金管理人、基金托管人对", "page": 3, "section": null, "tags": []}, "B081": {"text": "其不时作出的更新；", "page": 3, "section": null, "tags": []}, "B082": {"text": "中国证监会：指中国证券监督管理委员会；", "page": 3, "section": null, "tags": []}, "B083": {"text": "中国银监会：指中国银行业监督管理委员会；", "page": 3, "section": null, "tags": []}, "B084": {"text": "《信托法》：指《中华人民共和国信托法》", "page": 3, "section": null, "tags": []}, "B085": {"text": "《基金法》：指《中华人民共和国证券投资基金法》及颁布机关对其不时作出的修订。", "page": 3, "section": null, "tags": []}, "B086": {"text": "《运作办法》：指《证券投资基金运作管理办法》及颁布机关对其不时作出的修订。", "page": 3, "section": null, "tags": []}, "B087": {"text": "《销售办法》：指《证券投资基金销售管理办法》及颁布机关对其不时作出的修订。", "page": 3, "section": null, "tags": []}, "B088": {"text": "《信息披露办法》：指《公开募集证券投资基金信息披露管理办法》及颁布机关对其不时作出", "page": 3, "section": null, "tags": []}, "B089": {"text": "《流动性风险管理规定》：的修订。", "page": 3, "section": null, "tags": ["流动性风险"]}, "B090": {"text": "指中国证监会2017年8月31日颁布、同年10月1日实施的《公开募集开", "page": 3, "section": null, "tags": []}, "B091": {"text": "放式证券投资基金流动性风险管理规定》及颁布机关对其不时做出的修订。", "page": 3, "section": null, "tags": ["流动性风险"]}, "B092": {"text": "基金合同当事人：指受基金合同约束，根据本基金合同享有权利并承担义务的基金发起人、", "page": 3, "section": null, "tags": []}, "B093": {"text": "基金管理人、基金托管人和基金份额持有人；", "page": 3, "section": null, "tags": []}, "B094": {"text": "基金发起人：指华夏基金管理有限公司；", "page": 3, "section": null, "tags": []}, "B095": {"text": "基金管理人：指华夏基金管理有限公司；", "page": 3, "section": null, "tags": []}, "B096": {"text": "基金托管人：指中国建设银行股份有限公司；", "page": 3, "section": null, "tags": []}, "B097": {"text": "合格境外机构投资者：指符合《合格境外机构投资者境内证券投资管理办法》规定的条件，经中", "page": 3, "section": null, "tags": ["汇率与跨境风险"]}, "B098": {"text": "国证监会批准投资于中国证券市场，并取得国家外汇管理局额度批准的中", "page": 3, "section": null, "tags": []}, "B099": {"text": "国境外基金管理机构、保险公司、证券公司以及其他资产管理机构；", "page": 3, "section": null, "tags": ["汇率与跨境风险"]}, "B100": {"text": "注册登记业务：指本基金登记、存管、清算和交收业务，具体内容包括份额持有人基金账", "page": 3, "section": null, "tags": []}, "B101": {"text": "户管理、基金份额登记、清算及基金交易确认、代理发放红利、建立并保", "page": 3, "section": null, "tags": []}, "B102": {"text": "管基金份额持有人名册等；", "page": 3, "section": null, "tags": []}, "B103": {"text": "注册登记代理机构：指接受基金管理人委托代为办理本基金注册登记业务的机构；", "page": 3, "section": null, "tags": []}, "B104": {"text": "注册登记机构：指办理本基金注册登记业务的机构，本基金的注册登记机构为华夏基金管", "page": 3, "section": null, "tags": []}, "B105": {"text": "理有限公司或注册登记代理机构；", "page": 3, "section": null, "tags": []}, "B106": {"text": "基金合同生效日：指基金合同满足生效条件后，基金管理人依法向中国证监会办理基金备案", "page": 3, "section": null, "tags": []}, "B107": {"text": "手续，自中国证监会书面确认之日起，基金合同生效；", "page": 3, "section": null, "tags": []}, "B108": {"text": "认购：指在本基金募集期内，投资者申请购买本基金基金份额的行为；", "page": 3, "section": null, "tags": []}, "B109": {"text": "申购：指在本基金合同生效后，投资者申请购买本基金基金份额的行为；", "page": 3, "section": null, "tags": ["机制特有风险"]}, "B110": {"text": "赎回：指基金份额持有人按本基金合同规定的条件，要求基金管理人购回本基金", "page": 3, "section": null, "tags": ["流动性风险"]}, "B111": {"text": "基金份额的行为；", "page": 3, "section": null, "tags": []}, "B112": {"text": "转换：指基金份额持有人按基金管理人规定的条件申请将其持有的某一基金的基", "page": 3, "section": null, "tags": []}, "B113": {"text": "金份额转为基金管理人管理的其他基金的基金份额的行为；", "page": 3, "section": null, "tags": []}, "B114": {"text": "销售机构：指直销机构及代销机构；", "page": 3, "section": null, "tags": []}, "B115": {"text": "基金账户：指注册登记机构为基金投资者开立的记录其持有的由该注册登记机构办理", "page": 3, "section": null, "tags": []}, "B116": {"text": "注册登记的基金份额余额及其变动情况的账户；", "page": 3, "section": null, "tags": []}, "B117": {"text": "交易账户：指销售机构为基金投资者开立的记录其持有的由该销售机构办理认购、申", "page": 3, "section": null, "tags": []}, "B118": {"text": "购、赎回、转换及转托管等业务的基金份额余额及其变动情况的账户；", "page": 3, "section": null, "tags": ["流动性风险"]}, "B119": {"text": "转托管：指基金份额持有人申请将其持有的同一账户下的基金份额从某一交易账户", "page": 3, "section": null, "tags": []}, "B120": {"text": "转入另一交易账户的行为；", "page": 3, "section": null, "tags": []}, "B121": {"text": "存续期：指基金合同生效并存续的不定期期限；", "page": 4, "section": null, "tags": []}, "B122": {"text": "工作日：指上海证券交易所和深圳证券交易所的正常交易日；", "page": 4, "section": null, "tags": []}, "B123": {"text": "开放日：指为投资者办理基金申购、赎回等业务的工作日；", "page": 4, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B124": {"text": "天/月指公历天/月", "page": 4, "section": null, "tags": []}, "B125": {"text": "T日：指销售机构在规定时间受理投资者申购、赎回或其他业务申请的日期；", "page": 4, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B126": {"text": "T+n日：指T日后（不包括T日）第n个工作日", "page": 4, "section": null, "tags": []}, "B127": {"text": "元：指人民币元；", "page": 4, "section": null, "tags": []}, "B128": {"text": "基金收益：指基金投资所得债券利息、票据利息、买卖证券价差、银行存款利息及其", "page": 4, "section": null, "tags": []}, "B129": {"text": "他合法收入；", "page": 4, "section": null, "tags": []}, "B130": {"text": "基金资产总值：指基金购买的各类证券、银行存款本息及其他投资等的价值总和；", "page": 4, "section": null, "tags": []}, "B131": {"text": "基金资产净值：指基金资产总值减去负债后的价值；", "page": 4, "section": null, "tags": []}, "B132": {"text": "基金资产计价：指计算评估基金资产和负债的价值，以确定基金资产净值和基金收益的过", "page": 4, "section": null, "tags": []}, "B133": {"text": "程。", "page": 4, "section": null, "tags": []}, "B134": {"text": "摊余成本法：指计价对象以买入成本列示，按照票面利率或协议利率并考虑其买入时的", "page": 4, "section": null, "tags": ["市场风险"]}, "B135": {"text": "溢价与折价，在剩余存续期内按实际利率法摊销，每日计提损益。", "page": 4, "section": null, "tags": ["市场风险"]}, "B136": {"text": "影子定价：", "page": 4, "section": null, "tags": []}, "B137": {"text": "指参照中国证券投资基金业协会估值核算工作小组建议的估值处理标准确", "page": 4, "section": null, "tags": []}, "B138": {"text": "定的货币市场基金各投资品种的估值。", "page": 4, "section": null, "tags": []}, "B139": {"text": "偏离度：", "page": 4, "section": null, "tags": []}, "B140": {"text": "指影子定价与摊余成本法确定的基金资产净值的差额占摊余成本法确定的", "page": 4, "section": null, "tags": []}, "B141": {"text": "基金资产净值的比例。", "page": 4, "section": null, "tags": []}, "B142": {"text": "指由于法律法规、监管、合同或操作障碍等原因无法以合理价格予以变现", "page": 4, "section": null, "tags": ["流动性风险"]}, "B143": {"text": "流动性受限资产：", "page": 4, "section": null, "tags": ["流动性风险"]}, "B144": {"text": "的资产，包括但不限于到期日在10个交易日以上的逆回购与银行定期存款", "page": 4, "section": null, "tags": []}, "B145": {"text": "（含协议约定有条件提前支取的银行存款）、资产支持证券、因发行人债务", "page": 4, "section": null, "tags": ["机制特有风险"]}, "B146": {"text": "违约无法进行转让或交易的债券等；就本基金而言，指货币市场基金依法", "page": 4, "section": null, "tags": ["信用风险"]}, "B147": {"text": "可投资的符合前述条件的资产，但中国证监会认可的特殊情形除外。", "page": 4, "section": null, "tags": []}, "B148": {"text": "指定媒介：指中国证监会指定的用以进行信息披露的媒介。", "page": 4, "section": null, "tags": []}, "B149": {"text": "三、基金合同当事人", "page": 4, "section": null, "tags": []}, "B150": {"text": "名称：华夏基金管理有限公司", "page": 4, "section": null, "tags": []}, "B151": {"text": "住所：北京市顺义区安庆大街甲3号院", "page": 4, "section": null, "tags": []}, "B152": {"text": "法定代表人：张佑君", "page": 4, "section": null, "tags": []}, "B153": {"text": "成立日期：1998年4月9日", "page": 4, "section": null, "tags": []}, "B154": {"text": "批准设立机关及批准设立文号：中国证监会证监基字[1998]16号", "page": 4, "section": null, "tags": []}, "B155": {"text": "组织形式：有限责任公司", "page": 4, "section": null, "tags": []}, "B156": {"text": "注册资本：23800万元", "page": 4, "section": null, "tags": []}, "B157": {"text": "存续期间：100年", "page": 4, "section": null, "tags": []}, "B158": {"text": "名称：华夏基金管理有限公司", "page": 4, "section": null, "tags": []}, "B159": {"text": "住所：北京市顺义区安庆大街甲3号院", "page": 4, "section": null, "tags": []}, "B160": {"text": "法定代表人：张佑君", "page": 4, "section": null, "tags": []}, "B161": {"text": "设立日期：1998年4月9日", "page": 5, "section": null, "tags": []}, "B162": {"text": "批准设立机关及批准设立文号：中国证监会证监基字[1998]16号文", "page": 5, "section": null, "tags": []}, "B163": {"text": "组织形式：有限责任公司", "page": 5, "section": null, "tags": []}, "B164": {"text": "注册资本：2.38亿元人民币", "page": 5, "section": null, "tags": []}, "B165": {"text": "存续期限：100年", "page": 5, "section": null, "tags": []}, "B166": {"text": "联系电话：400-818-6666", "page": 5, "section": null, "tags": []}, "B167": {"text": "名称：中国建设银行股份有限公司", "page": 5, "section": null, "tags": []}, "B168": {"text": "住所：北京市西城区金融大街25号", "page": 5, "section": null, "tags": []}, "B169": {"text": "办公地址：北京市西城区闹市口大街1号院1号楼", "page": 5, "section": null, "tags": []}, "B170": {"text": "法定代表人：张金良", "page": 5, "section": null, "tags": []}, "B171": {"text": "成立日期：2004年9月17日", "page": 5, "section": null, "tags": []}, "B172": {"text": "基金托管业务批准文号：中国证监会证监基字[1998]12号", "page": 5, "section": null, "tags": []}, "B173": {"text": "组织形式：股份有限公司", "page": 5, "section": null, "tags": []}, "B174": {"text": "注册资本：贰仟伍佰亿壹仟零玖拾柒万柒仟肆佰捌拾陆元整", "page": 5, "section": null, "tags": []}, "B175": {"text": "存续期间：持续经营", "page": 5, "section": null, "tags": []}, "B176": {"text": "基金投资者购买本基金基金份额的行为即视为对本基金合同的承认和接受，基金投资者自取得依据", "page": 5, "section": null, "tags": []}, "B177": {"text": "基金合同发售的基金份额，即成为基金份额持有人和本基金合同的当事人，直至其不再持有本基金", "page": 5, "section": null, "tags": []}, "B178": {"text": "的基金", "page": 5, "section": null, "tags": []}, "B179": {"text": "份额。基金份额持有人作为本基金合同当事人并不以在本基金合同上书面签章为必要条件。", "page": 5, "section": null, "tags": []}, "B180": {"text": "四、基金发起人的权利与义务", "page": 5, "section": null, "tags": []}, "B181": {"text": "1.申请设立基金；", "page": 5, "section": null, "tags": []}, "B182": {"text": "2.法律、法规和基金合同规定的其他权利。", "page": 5, "section": null, "tags": []}, "B183": {"text": "1.遵守基金合同；", "page": 5, "section": null, "tags": []}, "B184": {"text": "2.公告招募说明书和发售公告；", "page": 5, "section": null, "tags": []}, "B185": {"text": "3.不从事任何有损基金及本基金其他当事人利益的活动；", "page": 5, "section": null, "tags": []}, "B186": {"text": "4.基金合同不能生效时按规定退还所募集资金本息、承担发售费用；", "page": 5, "section": null, "tags": []}, "B187": {"text": "5.法律、法规和基金合同规定的其他义务。", "page": 5, "section": null, "tags": []}, "B188": {"text": "五、基金管理人的权利与义务", "page": 5, "section": null, "tags": []}, "B189": {"text": "1.自基金合同生效之日起，依照有关法律法规独立管理和运用基金资产；", "page": 5, "section": null, "tags": []}, "B190": {"text": "2.在符合有关法律法规的前提下，制订和调整有关基金业务规则；", "page": 5, "section": null, "tags": []}, "B191": {"text": "3.根据基金合同的规定获得基金管理费，收取或委托收取事先批准或公告的合理费用以及法律法规", "page": 5, "section": null, "tags": []}, "B192": {"text": "定的费用；", "page": 5, "section": null, "tags": []}, "B193": {"text": "4.在符合有关法律法规的前提下，决定本基金的相关费率结构和收费方式，但本基金合同规定应由", "page": 5, "section": null, "tags": []}, "B194": {"text": "金份额持有人大会批准的，从其规定；", "page": 5, "section": null, "tags": []}, "B195": {"text": "5.依据本基金合同及有关法律规定监督基金托管人，如认为基金托管人违反了本基金合同或国家有", "page": 6, "section": null, "tags": []}, "B196": {"text": "法律规定对基金资产、其他当事人的利益造成重大损失的，应及时呈报中国证监会和中国银监会", "page": 6, "section": null, "tags": []}, "B197": {"text": "，并有权", "page": 6, "section": null, "tags": []}, "B198": {"text": "向有关部门和基金份额持有人大会提议更换基金托管人，以及采取其他必要措施以保护基金及相关", "page": 6, "section": null, "tags": []}, "B199": {"text": "当事人", "page": 6, "section": null, "tags": []}, "B200": {"text": "的利益；", "page": 6, "section": null, "tags": []}, "B201": {"text": "6.选择、更换基金销售代理人，并依照销售代理协议对基金销售代理人的行为进行必要的监督和检", "page": 6, "section": null, "tags": []}, "B202": {"text": "查；", "page": 6, "section": null, "tags": []}, "B203": {"text": "7.选择、更换注册登记代理机构，并对注册登记代理机构的代理行为进行必要的监督和检查；", "page": 6, "section": null, "tags": []}, "B204": {"text": "8.在基金合同约定的范围内，拒绝或暂停受理申购、赎回和转换申请；", "page": 6, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B205": {"text": "9.以基金的名义依法为基金进行融资，并以相应基金资产履行偿还融资和支付利息的义务；", "page": 6, "section": null, "tags": []}, "B206": {"text": "10.依据基金合同的规定，制订基金收益的分配方案；", "page": 6, "section": null, "tags": []}, "B207": {"text": "11.法律、法规、基金合同以及依据本基金合同制订的其他法律文件所规定的其他权利。", "page": 6, "section": null, "tags": []}, "B208": {"text": "1.遵守基金合同；", "page": 6, "section": null, "tags": []}, "B209": {"text": "2.不从事任何有损基金及其他基金当事人利益的活动；", "page": 6, "section": null, "tags": []}, "B210": {"text": "3.恪尽职守，依照诚实信用、勤勉尽责的原则，管理和运用基金资产；", "page": 6, "section": null, "tags": ["信用风险"]}, "B211": {"text": "4.设置相应的部门并配备足够的具有专业资格的人员进行基金投资分析、决策，以专业化的经营方", "page": 6, "section": null, "tags": []}, "B212": {"text": "管理和运作基金资产，防范和减少风险；", "page": 6, "section": null, "tags": []}, "B213": {"text": "5.设置相应的部门并配备足够的专业人员办理基金份额的认购、申购、赎回和其他业务或委托合格", "page": 6, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B214": {"text": "构代为办理；", "page": 6, "section": null, "tags": []}, "B215": {"text": "6.设置相应的部门并配备足够的专业人员办理基金的注册登记业务或委托其他机构代理该项业务；", "page": 6, "section": null, "tags": []}, "B216": {"text": "7.建立健全内部控制制度，保证基金管理人的自有资产和基金资产相互独立，确保分别管理、分别", "page": 6, "section": null, "tags": []}, "B217": {"text": "算、计账；保证本基金与基金管理人管理的其他基金在资产运作、财务管理等方面相互独立，确保", "page": 6, "section": null, "tags": []}, "B218": {"text": "分别管", "page": 6, "section": null, "tags": []}, "B219": {"text": "理、分别计账；", "page": 6, "section": null, "tags": []}, "B220": {"text": "8.除依据《信托法》、《基金法》、基金合同及其他有关规定外，不为自己及任何第三方谋取利益", "page": 6, "section": null, "tags": []}, "B221": {"text": "9.除依据《信托法》、《基金法》、基金合同及其他有关规定外，不得委托第三人管理、运作基金", "page": 6, "section": null, "tags": []}, "B222": {"text": "资产；", "page": 6, "section": null, "tags": []}, "B223": {"text": "10.接受基金份额持有人、基金份额持有人大会、基金托管人依照本基金合同及相关法律规定对基金", "page": 6, "section": null, "tags": []}, "B224": {"text": "理人履行本基金合同情况进行的监督；", "page": 6, "section": null, "tags": []}, "B225": {"text": "11.按规定核算基金收益、计算基金收益率并公告基金收益率；", "page": 6, "section": null, "tags": []}, "B226": {"text": "12.按照法律和本基金合同的规定受理申购和赎回申请，及时、足额支付赎回款项；", "page": 6, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B227": {"text": "13.严格按照《信托法》、《基金法》、基金合同及其他有关规定履行信息披露及报告义务；保证投", "page": 6, "section": null, "tags": []}, "B228": {"text": "资者", "page": 6, "section": null, "tags": []}, "B229": {"text": "能够按照本基金合同规定的时间和方式，查阅到与基金有关的公开资料，并得到有关资料的复印件", "page": 6, "section": null, "tags": []}, "B230": {"text": "14.保守基金的商业秘密，不泄露基金投资计划等；除《信托法》、《基金法》、基金合同及其他有", "page": 7, "section": null, "tags": []}, "B231": {"text": "关规", "page": 7, "section": null, "tags": []}, "B232": {"text": "定另有规定外，在基金信息公开披露前应予保密，不向他人泄露，但因遵守和服从司法机构、中国", "page": 7, "section": null, "tags": []}, "B233": {"text": "证监会", "page": 7, "section": null, "tags": []}, "B234": {"text": "或其他监管机构的判决、裁决、决定、命令而做出的披露不应视为基金管理人违反基金合同规定的", "page": 7, "section": null, "tags": []}, "B235": {"text": "保密义", "page": 7, "section": null, "tags": []}, "B236": {"text": "务；", "page": 7, "section": null, "tags": []}, "B237": {"text": "15.依据基金合同规定制订基金收益分配方案，并向基金份额持有人分配基金收益；", "page": 7, "section": null, "tags": []}, "B238": {"text": "16.依据《基金法》、基金合同及其他有关规定召集基金份额持有人大会，执行基金份额持有人大会", "page": 7, "section": null, "tags": []}, "B239": {"text": "议；确保向基金份额持有人和基金份额持有人大会提供的各项文件或资料在规定时间内发出；", "page": 7, "section": null, "tags": []}, "B240": {"text": "17.编制本基金的财务会计报告；保存本基金的会计账册、报表及其他处理有关基金事务的完整记录", "page": 7, "section": null, "tags": []}, "B241": {"text": "15年以上；", "page": 7, "section": null, "tags": []}, "B242": {"text": "18.参加基金清算小组，参与基金资产的保管、清理、估价、变现和分配；", "page": 7, "section": null, "tags": ["流动性风险"]}, "B243": {"text": "19.面临解散、依法被撤销、破产或者由接管人接管其资产时，及时报告中国证监会并通知基金托管", "page": 7, "section": null, "tags": []}, "B244": {"text": "人；", "page": 7, "section": null, "tags": []}, "B245": {"text": "20.监督基金托管人按法律法规和基金合同规定履行自己的义务；基金托管人因过错造成基金资产损", "page": 7, "section": null, "tags": []}, "B246": {"text": "时，基金管理人应为基金向基金托管人追偿；", "page": 7, "section": null, "tags": []}, "B247": {"text": "21.因违反本基金合同规定的目的处分基金资产或者因违背本基金合同规定的管理职责、处理基金事", "page": 7, "section": null, "tags": []}, "B248": {"text": "不当而致使基金资产受到损失时，应当承担赔偿责任，其过错责任不因其退任而免除；", "page": 7, "section": null, "tags": []}, "B249": {"text": "22.负责为基金聘请会计师事务所和律师；", "page": 7, "section": null, "tags": []}, "B250": {"text": "23.职责终止时，妥善保管业务资料，及时办理基金管理业务移交手续；按照规定聘请会计师事务所", "page": 7, "section": null, "tags": []}, "B251": {"text": "基金财产进行审计，并将审计结果予以公告，同时报中国证监会备案；", "page": 7, "section": null, "tags": []}, "B252": {"text": "24.法律、法规、本基金合同以及依据本基金合同制定的其他法律文件所规定的其他义务。", "page": 7, "section": null, "tags": []}, "B253": {"text": "六、基金托管人的权利与义务", "page": 7, "section": null, "tags": []}, "B254": {"text": "1.依法持有并保管基金资产；", "page": 7, "section": null, "tags": []}, "B255": {"text": "2.依据本基金合同规定获得基金托管费；", "page": 7, "section": null, "tags": []}, "B256": {"text": "3.监督基金管理人对本基金的投资运作，如基金托管人认为基金管理人违反基金合同或有关法律法", "page": 7, "section": null, "tags": []}, "B257": {"text": "的规定，应呈报中国证监会和其他监管部门，并采取必要措施保护基金份额持有人的利益；必要时", "page": 7, "section": null, "tags": []}, "B258": {"text": "可向有", "page": 7, "section": null, "tags": []}, "B259": {"text": "关部门和基金份额持有人大会提议更换基金管理人；", "page": 7, "section": null, "tags": []}, "B260": {"text": "4.在基金管理人更换时，提名新的基金管理人；", "page": 7, "section": null, "tags": []}, "B261": {"text": "5.法律、法规及基金合同规定的其他权利。", "page": 7, "section": null, "tags": []}, "B262": {"text": "1.遵守基金合同；", "page": 7, "section": null, "tags": []}, "B263": {"text": "2.恪尽职守，依照诚实信用、勤勉尽责的原则，持有并保管基金资产；", "page": 7, "section": null, "tags": ["信用风险"]}, "B264": {"text": "3.设立专门的基金托管部，具有符合要求的营业场所，配备足够的、合格的熟悉基金托管业务的专", "page": 8, "section": null, "tags": []}, "B265": {"text": "人员，负责基金资产托管事宜；建立健全内部风险监控制度，对负责基金资产托管的部门和人员的", "page": 8, "section": null, "tags": []}, "B266": {"text": "行为进", "page": 8, "section": null, "tags": []}, "B267": {"text": "行事先控制和事后监督，防范和减少风险；", "page": 8, "section": null, "tags": []}, "B268": {"text": "4.建立健全内部控制制度，确保基金资产的安全，保证其托管的基金资产与基金托管人自有资产相", "page": 8, "section": null, "tags": []}, "B269": {"text": "独立，保证其托管的基金资产与其托管的其他基金资产相互独立；对不同的基金分别设置账户，独", "page": 8, "section": null, "tags": []}, "B270": {"text": "立核算，", "page": 8, "section": null, "tags": []}, "B271": {"text": "分账管理，保证不同基金之间在名册登记、账户设置、资金划拨、账册记录等方面相互独立；", "page": 8, "section": null, "tags": []}, "B272": {"text": "5.除依据《信托法》、《基金法》、本基金合同及其他有关规定外，不为自己及任何第三人谋取利", "page": 8, "section": null, "tags": []}, "B273": {"text": "益；", "page": 8, "section": null, "tags": []}, "B274": {"text": "6.除依据《信托法》、《基金法》、本基金合同及其他有关规定外，不得委托第三人托管基金资产", "page": 8, "section": null, "tags": []}, "B275": {"text": "7.保管由基金管理人代表基金签订的与基金有关的重大合同及有关凭证；", "page": 8, "section": null, "tags": []}, "B276": {"text": "8.以基金的名义设立证券账户、银行存款账户等基金资产账户，负责基金投资于短期金融工具的清", "page": 8, "section": null, "tags": []}, "B277": {"text": "交割，执行基金管理人的投资指令，并负责办理基金名下的资金往来；", "page": 8, "section": null, "tags": []}, "B278": {"text": "9.对基金商业秘密和基金份额持有人、投资者进行基金交易的有关情况负有保密义务，不泄露基金", "page": 8, "section": null, "tags": []}, "B279": {"text": "资计划、投资意向及基金投资者、基金份额持有人的相关情况及资料等；除《信托法》、《基金法", "page": 8, "section": null, "tags": []}, "B280": {"text": "》、基金", "page": 8, "section": null, "tags": []}, "B281": {"text": "合同及其他有关规定另有规定外，在基金信息公开披露前予以保密，不得向他人泄露；但因遵守和", "page": 8, "section": null, "tags": []}, "B282": {"text": "服从司", "page": 8, "section": null, "tags": []}, "B283": {"text": "法机构、中国证监会或其他监管机构的判决、裁决、决定、命令而作出的披露不应视为基金托管人", "page": 8, "section": null, "tags": []}, "B284": {"text": "违反本", "page": 8, "section": null, "tags": []}, "B285": {"text": "基金合同规定的保密义务；", "page": 8, "section": null, "tags": []}, "B286": {"text": "10.复核、审查基金管理人计算的基金资产净值、基金收益和基金收益率；", "page": 8, "section": null, "tags": []}, "B287": {"text": "11.按规定出具基金业绩和基金托管情况的报告，并报中国证监会和中国银监会；", "page": 8, "section": null, "tags": []}, "B288": {"text": "12.监督基金管理人的投资运作，发现基金管理人的投资指令违法、违规的，不予执行，并向中国证", "page": 8, "section": null, "tags": []}, "B289": {"text": "会报告；", "page": 8, "section": null, "tags": []}, "B290": {"text": "13.在定期报告内出具基金托管人意见，说明基金管理人在各重要方面的运作是否严格按照本基金合", "page": 8, "section": null, "tags": []}, "B291": {"text": "的规定进行，如果基金管理人有未执行本基金合同规定的行为，还应当说明基金托管人是否采取了", "page": 8, "section": null, "tags": []}, "B292": {"text": "适当的", "page": 8, "section": null, "tags": []}, "B293": {"text": "措施；", "page": 8, "section": null, "tags": []}, "B294": {"text": "14.依据《基金法》、基金合同及其他有关规定召集基金份额持有人大会，执行基金份额持有人大会", "page": 8, "section": null, "tags": []}, "B295": {"text": "议；", "page": 8, "section": null, "tags": []}, "B296": {"text": "15.按有关规定保存基金的份额持有人名册、会计账册、报表和其他有关基金托管事务的完整记录等", "page": 8, "section": null, "tags": []}, "B297": {"text": "15年以上；", "page": 8, "section": null, "tags": []}, "B298": {"text": "16.按规定制作相关账册并及时与基金管理人核对；", "page": 9, "section": null, "tags": []}, "B299": {"text": "17.依据基金管理人的指令或有关规定向基金份额持有人支付基金收益和赎回款项；", "page": 9, "section": null, "tags": ["流动性风险"]}, "B300": {"text": "18.参加基金清算小组，参与基金资产的保管、清理、估价、变现和分配；", "page": 9, "section": null, "tags": ["流动性风险"]}, "B301": {"text": "19.面临解散、依法被撤销、破产或者由接管人接管其资产时，及时报告中国证监会和中国银监会", "page": 9, "section": null, "tags": []}, "B302": {"text": "，并", "page": 9, "section": null, "tags": []}, "B303": {"text": "通知基金管理人；", "page": 9, "section": null, "tags": []}, "B304": {"text": "20.监督基金管理人按法律法规和基金合同规定履行自己的义务；基金管理人因过错造成基金资产损", "page": 9, "section": null, "tags": []}, "B305": {"text": "时，基金托管人应为基金向基金管理人追偿；", "page": 9, "section": null, "tags": []}, "B306": {"text": "21.因过错导致基金资产的损失或因违背托管职责或者处理基金事务不当对第三人所负债务或者自己", "page": 9, "section": null, "tags": []}, "B307": {"text": "受到的损失，应当承担赔偿责任，其责任不因其退任而免除；", "page": 9, "section": null, "tags": []}, "B308": {"text": "22.不从事任何有损基金及本基金其他当事人利益的活动；", "page": 9, "section": null, "tags": []}, "B309": {"text": "23.职责终止时，妥善保管基金财产和基金托管业务资料，及时办理基金财产和基金托管业务的移交", "page": 9, "section": null, "tags": []}, "B310": {"text": "续；按照规定聘请会计师事务所对基金财产进行审计，并将审计结果予以公告，同时报中国证监会", "page": 9, "section": null, "tags": []}, "B311": {"text": "备案；", "page": 9, "section": null, "tags": []}, "B312": {"text": "24.法律、法规、本基金合同和依据本基金合同制定的其他法律文件所规定的其他义务。", "page": 9, "section": null, "tags": []}, "B313": {"text": "七、基金份额持有人的权利与义务", "page": 9, "section": null, "tags": []}, "B314": {"text": "1.按照规定要求召开基金份额持有人大会；", "page": 9, "section": null, "tags": []}, "B315": {"text": "2.出席或者委派代表出席基金份额持有人大会，并行使表决权；", "page": 9, "section": null, "tags": []}, "B316": {"text": "3.取得基金收益；", "page": 9, "section": null, "tags": []}, "B317": {"text": "4.获取基金业务及财务状况的公开资料；", "page": 9, "section": null, "tags": []}, "B318": {"text": "5.按照基金合同的规定赎回基金份额，并在规定的时间取得有效申请的款项；", "page": 9, "section": null, "tags": ["流动性风险"]}, "B319": {"text": "6.取得基金清算后的剩余资产；", "page": 9, "section": null, "tags": []}, "B320": {"text": "7.知悉基金合同规定的有关信息披露内容；", "page": 9, "section": null, "tags": []}, "B321": {"text": "8.提请基金管理人或基金托管人履行按本基金合同规定应尽的义务；", "page": 9, "section": null, "tags": []}, "B322": {"text": "9.因基金管理人、基金托管人、注册登记机构、销售机构的过错导致利益受到损害，有权要求赔偿", "page": 9, "section": null, "tags": []}, "B323": {"text": "10.法律法规及基金合同规定的其他权利。", "page": 9, "section": null, "tags": []}, "B324": {"text": "1.遵守基金合同及相关业务规则；", "page": 9, "section": null, "tags": []}, "B325": {"text": "2.缴纳基金认购、申购款项，承担规定的费用；", "page": 9, "section": null, "tags": ["机制特有风险"]}, "B326": {"text": "3.承担基金亏损或者终止的有限责任；", "page": 9, "section": null, "tags": []}, "B327": {"text": "4.不从事任何有损基金及本基金其他当事人利益的活动；", "page": 9, "section": null, "tags": []}, "B328": {"text": "5.法律法规及基金合同规定的其他义务。", "page": 9, "section": null, "tags": []}, "B329": {"text": "八、基金份额持有人大会", "page": 9, "section": null, "tags": []}, "B330": {"text": "有以下情形之一的，应召开基金份额持有人大会：", "page": 9, "section": null, "tags": []}, "B331": {"text": "1.修改基金合同，但本基金合同另有规定的除外；", "page": 9, "section": null, "tags": []}, "B332": {"text": "2.更换基金管理人或基金托管人；", "page": 9, "section": null, "tags": []}, "B333": {"text": "3.提高基金管理费率或基金托管费率；", "page": 9, "section": null, "tags": []}, "B334": {"text": "4.提前终止基金合同；", "page": 10, "section": null, "tags": []}, "B335": {"text": "5.与其他基金合并；", "page": 10, "section": null, "tags": []}, "B336": {"text": "6.单独或合计持有基金总份额10%以上的基金份额持有人就同一事项书面要求召开基金份额持有人大", "page": 10, "section": null, "tags": []}, "B337": {"text": "会；", "page": 10, "section": null, "tags": []}, "B338": {"text": "7.基金管理人或基金托管人要求召开基金份额持有人大会；", "page": 10, "section": null, "tags": []}, "B339": {"text": "8.有对基金合同当事人权利、义务产生重大影响的其他事项；", "page": 10, "section": null, "tags": []}, "B340": {"text": "9.中国证监会规定的其他情形。", "page": 10, "section": null, "tags": []}, "B341": {"text": "以下情形不需召开基金份额持有人大会：", "page": 10, "section": null, "tags": []}, "B342": {"text": "1.调低基金管理费率、基金托管费率或基金销售服务费率；", "page": 10, "section": null, "tags": []}, "B343": {"text": "2.在本基金合同规定的范围内变更本基金的申购费率、赎回费率或收费方式；", "page": 10, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B344": {"text": "3.因相应的法律、法规发生变动必须对基金合同进行修改；", "page": 10, "section": null, "tags": []}, "B345": {"text": "4.对基金合同的修改不涉及本基金合同当事人权利义务关系发生变化；", "page": 10, "section": null, "tags": []}, "B346": {"text": "5.对基金合同的修改对基金份额持有人利益无实质性不利影响；", "page": 10, "section": null, "tags": []}, "B347": {"text": "6.按照法律法规或本基金合同规定不需召开基金份额持有人大会的其他情形。", "page": 10, "section": null, "tags": []}, "B348": {"text": "1.在正常情况下，基金份额持有人大会由基金管理人召集。", "page": 10, "section": null, "tags": []}, "B349": {"text": "2.基金管理人未按规定召集或者不能召集时，由基金托管人召集。基金托管人认为有必要召开基金", "page": 10, "section": null, "tags": []}, "B350": {"text": "额持有人大会的，应当向基金管理人提出书面提议。基金管理人应当自收到书面提议之日起10日内", "page": 10, "section": null, "tags": []}, "B351": {"text": "决定", "page": 10, "section": null, "tags": []}, "B352": {"text": "是否召集，并书面告知基金托管人。基金管理人决定召集的，应当自出具书面决定之日起60日内召", "page": 10, "section": null, "tags": []}, "B353": {"text": "开；", "page": 10, "section": null, "tags": []}, "B354": {"text": "基金管理人决定不召集，基金托管人仍认为有必要召开的，应当自行召集。", "page": 10, "section": null, "tags": []}, "B355": {"text": "3.代表基金份额10%以上的基金份额持有人认为有必要召开基金份额持有人大会的，应当向基金管理", "page": 10, "section": null, "tags": []}, "B356": {"text": "人提出书面提议。基金管理人应当自收到书面提议之日起10日内决定是否召集，并书面告知提出提", "page": 10, "section": null, "tags": []}, "B357": {"text": "议的", "page": 10, "section": null, "tags": []}, "B358": {"text": "基金份额持有人代表和基金托管人。基金管理人决定召集的，应当自出具书面决定之日起60日内召", "page": 10, "section": null, "tags": []}, "B359": {"text": "开；", "page": 10, "section": null, "tags": []}, "B360": {"text": "基金管理人决定不召集，代表基金份额10%以上的基金份额持有人仍认为有必要召开的，应当向基", "page": 10, "section": null, "tags": []}, "B361": {"text": "金托管", "page": 10, "section": null, "tags": []}, "B362": {"text": "人提出书面提议。基金托管人应当自收到书面提议之日起10日内决定是否召集，并书面告知提出提", "page": 10, "section": null, "tags": []}, "B363": {"text": "议的", "page": 10, "section": null, "tags": []}, "B364": {"text": "基金份额持有人代表和基金管理人；基金托管人决定召集的，应当自出具书面决定之日起60日内召", "page": 10, "section": null, "tags": []}, "B365": {"text": "开。", "page": 10, "section": null, "tags": []}, "B366": {"text": "基金管理人和基金托管人都不召集基金份额持有人大会的，基金份额持有人可以自行召集基金份额", "page": 10, "section": null, "tags": []}, "B367": {"text": "持有人", "page": 10, "section": null, "tags": []}, "B368": {"text": "大会。基金份额持有人自行召集基金份额持有人大会的，应当至少提前30日向中国证监会备案。", "page": 10, "section": null, "tags": []}, "B369": {"text": "召开基金份额持有人大会，召集人应当至少提前30日，在至少一种中国证监会指定媒介公告通知。", "page": 10, "section": null, "tags": []}, "B370": {"text": "基金份额持有人大会通知至少应载明以下内容：", "page": 10, "section": null, "tags": []}, "B371": {"text": "1.会议召开的时间、地点和方式；", "page": 10, "section": null, "tags": []}, "B372": {"text": "2.会议拟审议的主要事项；", "page": 10, "section": null, "tags": []}, "B373": {"text": "3.确定有权出席基金份额持有人大会的基金份额持有人资格的权利登记日；", "page": 11, "section": null, "tags": []}, "B374": {"text": "4.代理投票授权委托书送达时间和地点；", "page": 11, "section": null, "tags": []}, "B375": {"text": "5.会务常设联系人姓名、电话。", "page": 11, "section": null, "tags": []}, "B376": {"text": "采取通讯方式开会并进行表决的情况下，由召集人决定通讯方式和书面表决方式，并在会议通知中", "page": 11, "section": null, "tags": []}, "B377": {"text": "明本次基金份额持有人大会所采取的具体通讯方式、委托的公证机构及其联系方式和联系人、书面", "page": 11, "section": null, "tags": []}, "B378": {"text": "表决意", "page": 11, "section": null, "tags": []}, "B379": {"text": "见的寄交和收取方式。如召集人为基金管理人，还应另行书面通知基金托管人到指定地点对书面表", "page": 11, "section": null, "tags": []}, "B380": {"text": "决意见", "page": 11, "section": null, "tags": []}, "B381": {"text": "的计票进行监督；如召集人为基金托管人，则应另行书面通知基金管理人到指定地点对书面表决意", "page": 11, "section": null, "tags": []}, "B382": {"text": "见的计", "page": 11, "section": null, "tags": []}, "B383": {"text": "票进行监督；如召集人为基金份额持有人，则应另行书面通知基金管理人和基金托管人到指定地点", "page": 11, "section": null, "tags": []}, "B384": {"text": "对书面", "page": 11, "section": null, "tags": []}, "B385": {"text": "表决意见的计票进行监督。", "page": 11, "section": null, "tags": []}, "B386": {"text": "会议的召开方式由召集人确定，但更换基金管理人和基金托管人必须以现场开会方式召开基金份额", "page": 11, "section": null, "tags": []}, "B387": {"text": "有人大会。", "page": 11, "section": null, "tags": []}, "B388": {"text": "1.现场开会。由基金份额持有人本人出席或以代理投票授权委托书委派代表出席，现场开会时基金", "page": 11, "section": null, "tags": []}, "B389": {"text": "理人和基金托管人的授权代表应当列席基金份额持有人大会。", "page": 11, "section": null, "tags": []}, "B390": {"text": "现场开会同时符合以下条件时，可以进行基金份额持有人大会议程：", "page": 11, "section": null, "tags": []}, "B391": {"text": "（1）亲自出席会议者持有基金份额的凭证、受托出席会议者出具的委托人持有基金份额的凭证及委", "page": 11, "section": null, "tags": []}, "B392": {"text": "托人的代理投票授权委托书符合法律、法规、本基金合同和会议通知的规定；", "page": 11, "section": null, "tags": []}, "B393": {"text": "（2）经核对，汇总到会者出示的在权利登记日持有基金份额的凭证显示，全部有效的凭证所对应的", "page": 11, "section": null, "tags": []}, "B394": {"text": "基金份额占本基金在权利登记日基金总份额的50%以上。", "page": 11, "section": null, "tags": []}, "B395": {"text": "2.通讯方式开会。通讯方式开会应以书面方式进行表决。", "page": 11, "section": null, "tags": []}, "B396": {"text": "在符合以下条件时，通讯开会的方式视为有效：", "page": 11, "section": null, "tags": []}, "B397": {"text": "（1）大会召集人按本基金合同规定公布会议通知后，在两个工作日内连续公布相关提示性公告；", "page": 11, "section": null, "tags": []}, "B398": {"text": "（2）大会召集人按本基金合同规定通知基金托管人或/和基金管理人（分别或共同地称为“监督人", "page": 11, "section": null, "tags": []}, "B399": {"text": "”）", "page": 11, "section": null, "tags": []}, "B400": {"text": "到指定地点对书面表决意见的计票进行监督；", "page": 11, "section": null, "tags": []}, "B401": {"text": "（3）大会召集人在公证机构的监督下按照会议通知规定的方式收取基金份额持有人的书面表决意见", "page": 11, "section": null, "tags": []}, "B402": {"text": "（4）所有出具有效书面意见所代表的基金份额持有人所持有的基金份额占本基金在权利登记日基金", "page": 11, "section": null, "tags": []}, "B403": {"text": "总份额的50%以上；", "page": 11, "section": null, "tags": []}, "B404": {"text": "（5）直接出具书面意见的基金份额持有人或受托代表他人出具书面意见的代理人，同时提交的持有", "page": 11, "section": null, "tags": []}, "B405": {"text": "基金份额的凭证、受托出席会议者出具的委托人持有基金份额的凭证及委托人的代理投票授权委托", "page": 11, "section": null, "tags": []}, "B406": {"text": "书符合", "page": 11, "section": null, "tags": []}, "B407": {"text": "法律、法规、本基金合同和会议通知的规定；", "page": 11, "section": null, "tags": []}, "B408": {"text": "（6）会议通知公布前已报中国证监会备案。", "page": 11, "section": null, "tags": []}, "B409": {"text": "如果开会条件达不到上述现场开会或通讯方式开会的条件，则对同一议题可履行再次开会的程序", "page": 11, "section": null, "tags": []}, "B410": {"text": "，再", "page": 12, "section": null, "tags": []}, "B411": {"text": "次开会日期的提前通知期限为至少10天，但确定有权出席会议的基金份额持有人资格的权利登记日", "page": 12, "section": null, "tags": []}, "B412": {"text": "不应", "page": 12, "section": null, "tags": []}, "B413": {"text": "发生变化。", "page": 12, "section": null, "tags": []}, "B414": {"text": "1.议事内容及提案权", "page": 12, "section": null, "tags": []}, "B415": {"text": "议事内容为关系基金份额持有人利益的重大事项，如修改基金合同、更换基金管理人或基金托管人", "page": 12, "section": null, "tags": []}, "B416": {"text": "提高基金管理费率或基金托管费率、提前终止基金合同、与其他基金合并以及召集人认为需提交基", "page": 12, "section": null, "tags": []}, "B417": {"text": "金份额", "page": 12, "section": null, "tags": []}, "B418": {"text": "持有人大会讨论的其他事项。", "page": 12, "section": null, "tags": []}, "B419": {"text": "基金份额持有人大会不得对未事先公告的议事内容进行表决。", "page": 12, "section": null, "tags": []}, "B420": {"text": "2.议事程序", "page": 12, "section": null, "tags": []}, "B421": {"text": "（1）现场开会", "page": 12, "section": null, "tags": []}, "B422": {"text": "在现场开会的方式下，首先由大会主持人按照下列第（七）款规定程序确定和公布监票人，然后由", "page": 12, "section": null, "tags": []}, "B423": {"text": "会主持人宣读提案，经讨论后进行表决，并形成大会决议。基金份额持有人大会由基金管理人召集", "page": 12, "section": null, "tags": []}, "B424": {"text": "的，大", "page": 12, "section": null, "tags": []}, "B425": {"text": "会主持人为基金管理人授权出席会议的代表；基金份额持有人大会由基金托管人召集的，大会主持", "page": 12, "section": null, "tags": []}, "B426": {"text": "人为基", "page": 12, "section": null, "tags": []}, "B427": {"text": "金托管人授权出席会议的代表；基金份额持有人大会由基金份额持有人召集的，大会主持人为召集", "page": 12, "section": null, "tags": []}, "B428": {"text": "基金份", "page": 12, "section": null, "tags": []}, "B429": {"text": "额持有人大会的基金份额持有人自行选举的代表。如果大会主持人未能按前述规定确定，则由出席", "page": 12, "section": null, "tags": []}, "B430": {"text": "大会的", "page": 12, "section": null, "tags": []}, "B431": {"text": "基金份额持有人以所代表的基金份额50%以上（不含50%）多数选举产生一名基金份额持有人作为该", "page": 12, "section": null, "tags": []}, "B432": {"text": "次基", "page": 12, "section": null, "tags": []}, "B433": {"text": "金份额持有人大会的主持人。", "page": 12, "section": null, "tags": []}, "B434": {"text": "（2）通讯方式开会", "page": 12, "section": null, "tags": []}, "B435": {"text": "在通讯方式开会的情况下，由召集人至少提前30日公布提案，在所通知的表决截止日期第二天统计", "page": 12, "section": null, "tags": []}, "B436": {"text": "全部有效表决，在公证机构及监督人的监督下形成决议。如监督人经通知但拒绝到场监督，则在公", "page": 12, "section": null, "tags": []}, "B437": {"text": "证机构", "page": 12, "section": null, "tags": []}, "B438": {"text": "监督下形成的决议有效。", "page": 12, "section": null, "tags": []}, "B439": {"text": "1.基金份额持有人所持每份基金份额有一票表决权。", "page": 12, "section": null, "tags": []}, "B440": {"text": "2.基金份额持有人大会决议分为一般决议和特别决议：", "page": 12, "section": null, "tags": []}, "B441": {"text": "（1）一般决议。一般决议须经出席会议的基金份额持有人所持表决权的50%以上（不含50%）多数", "page": 12, "section": null, "tags": []}, "B442": {"text": "通过方为有效；除下列（2）所规定的须以特别决议通过事项以外的其他事项均以一般决议的方式通", "page": 12, "section": null, "tags": []}, "B443": {"text": "过。", "page": 12, "section": null, "tags": []}, "B444": {"text": "（2）特别决议。特别决议须经出席会议的基金份额持有人所持表决权的2/3以上通过方可作出。更", "page": 12, "section": null, "tags": []}, "B445": {"text": "基金管理人、更换基金托管人、提前终止基金合同等重大事项必须以特别决议通过方为有效。", "page": 12, "section": null, "tags": []}, "B446": {"text": "3.基金份额持有人大会采取记名方式进行投票表决。", "page": 12, "section": null, "tags": []}, "B447": {"text": "4.采取通讯方式进行表决时，除非有充分相反证据证明，否则其表面符合法律法规和会议通知规定", "page": 13, "section": null, "tags": []}, "B448": {"text": "书面表决意见视为有效表决。意见模煳或相互矛盾的视为无效表决。", "page": 13, "section": null, "tags": []}, "B449": {"text": "5.基金份额持有人大会的各项提案或同一项提案内并列的各项议题应当分开审议、逐项表决。", "page": 13, "section": null, "tags": []}, "B450": {"text": "1.现场开会", "page": 13, "section": null, "tags": []}, "B451": {"text": "（1）如大会由基金管理人或基金托管人召集，基金份额持有人大会的主持人应当在会议开始后宣布", "page": 13, "section": null, "tags": []}, "B452": {"text": "在出席会议的基金份额持有人中选举两名基金份额持有人代表与大会召集人授权的一名监督员共同", "page": 13, "section": null, "tags": []}, "B453": {"text": "担任", "page": 13, "section": null, "tags": []}, "B454": {"text": "监票人；如大会由基金份额持有人自行召集，基金份额持有人大会的主持人应当在会议开始后宣布", "page": 13, "section": null, "tags": []}, "B455": {"text": "在出席", "page": 13, "section": null, "tags": []}, "B456": {"text": "会议的基金份额持有人中选举三名基金份额持有人代表担任监票人。", "page": 13, "section": null, "tags": []}, "B457": {"text": "（2）监票人应当在基金份额持有人表决后立即进行清点并由大会主持人当场公布计票结果。", "page": 13, "section": null, "tags": []}, "B458": {"text": "（3）如果会议主持人对于提交的表决结果有怀疑，可以对所投票数进行重新清点；如果会议主持人", "page": 13, "section": null, "tags": []}, "B459": {"text": "未进行重新清点，而出席会议的基金份额持有人或者基金份额持有人代理人对会议主持人宣布的表", "page": 13, "section": null, "tags": []}, "B460": {"text": "决结果", "page": 13, "section": null, "tags": []}, "B461": {"text": "有异议，有权在宣布表决结果后立即要求重新清点，会议主持人应当立即重新清点并公布重新清点", "page": 13, "section": null, "tags": []}, "B462": {"text": "结果。", "page": 13, "section": null, "tags": []}, "B463": {"text": "2.通讯方式开会", "page": 13, "section": null, "tags": []}, "B464": {"text": "在通讯方式开会的情况下，计票方式为：由大会召集人授权的两名监督员在监督人派出的授权代表", "page": 13, "section": null, "tags": []}, "B465": {"text": "监督下进行计票，并由公证机构对其计票过程予以公证；如监督人经通知但拒绝到场监督，则大会", "page": 13, "section": null, "tags": []}, "B466": {"text": "召集人", "page": 13, "section": null, "tags": []}, "B467": {"text": "可自行授权三名监督员进行计票，并由公证机构对其计票过程予以公证。", "page": 13, "section": null, "tags": []}, "B468": {"text": "基金份额持有人大会表决通过的事项，召集人应当自通过之日起5日内报中国证监会核准或者备案。", "page": 13, "section": null, "tags": []}, "B469": {"text": "基金份额持有人大会决定的事项自中国证监会依法核准或者出具无异议意见之日起生效。", "page": 13, "section": null, "tags": []}, "B470": {"text": "基金份额持有人大会决议自生效之日起5个工作日内在至少一种中国证监会指定媒介公告。采用通讯", "page": 13, "section": null, "tags": []}, "B471": {"text": "方式召开基金份额持有人大会的，应在公告基金份额持有人大会决议时公告公证书全文、公证机关", "page": 13, "section": null, "tags": []}, "B472": {"text": "及公证", "page": 13, "section": null, "tags": []}, "B473": {"text": "员姓名。", "page": 13, "section": null, "tags": []}, "B474": {"text": "基金管理人、基金托管人和基金份额持有人应当执行生效的基金份额持有人大会的决定。", "page": 13, "section": null, "tags": []}, "B475": {"text": "九、基金管理人、基金托管人的更换条件与程序", "page": 13, "section": null, "tags": []}, "B476": {"text": "1.基金管理人的更换条件", "page": 13, "section": null, "tags": []}, "B477": {"text": "有下列情形之一的，经中国证监会批准，须更换基金管理人：", "page": 13, "section": null, "tags": []}, "B478": {"text": "（1）基金管理人解散、依法被撤销、破产或者由接管人接管其资产；", "page": 13, "section": null, "tags": []}, "B479": {"text": "（2）基金份额持有人大会以特别决议通过更换基金管理人；", "page": 13, "section": null, "tags": []}, "B480": {"text": "（3）中国证监会有充分理由认为基金管理人不能继续履行基金管理职责。", "page": 13, "section": null, "tags": []}, "B481": {"text": "2.基金托管人的更换条件", "page": 13, "section": null, "tags": []}, "B482": {"text": "有下列情形之一的，经中国证监会和中国银监会批准，须更换基金托管人：", "page": 13, "section": null, "tags": []}, "B483": {"text": "（1）基金托管人解散、依法被撤销、破产或者由接管人接管其资产；", "page": 14, "section": null, "tags": []}, "B484": {"text": "（2）基金份额持有人大会以特别决议通过更换基金托管人；", "page": 14, "section": null, "tags": []}, "B485": {"text": "（3）中国银监会有充分理由认为基金托管人不能继续履行基金托管职责。", "page": 14, "section": null, "tags": []}, "B486": {"text": "1.基金管理人的更换程序", "page": 14, "section": null, "tags": []}, "B487": {"text": "（1）提名：新任基金管理人由基金托管人提名。", "page": 14, "section": null, "tags": []}, "B488": {"text": "（2）决议：基金份额持有人大会对被提名的基金管理人形成决议。", "page": 14, "section": null, "tags": []}, "B489": {"text": "（3）批准：新任基金管理人经中国证监会审查批准方可继任，原任基金管理人经中国证监会批准方", "page": 14, "section": null, "tags": []}, "B490": {"text": "可退任。", "page": 14, "section": null, "tags": []}, "B491": {"text": "（4）公告：基金管理人更换后，由基金托管人在中国证监会批准后5个工作日内在中国证监会指定", "page": 14, "section": null, "tags": []}, "B492": {"text": "媒介公告。新任基金管理人与原基金管理人进行资产管理的交接手续，并与基金托管人核对资产总", "page": 14, "section": null, "tags": []}, "B493": {"text": "值。如", "page": 14, "section": null, "tags": []}, "B494": {"text": "果基金托管人和基金管理人同时更换，由新任基金管理人和新任基金托管人在中国证监会和中国银", "page": 14, "section": null, "tags": []}, "B495": {"text": "监会批", "page": 14, "section": null, "tags": []}, "B496": {"text": "准后5个工作日内在中国证监会指定媒介联合公告。", "page": 14, "section": null, "tags": []}, "B497": {"text": "（5）基金名称变更：基金管理人更换后，如果基金管理人要求，基金托管人和新任基金管理人应按", "page": 14, "section": null, "tags": []}, "B498": {"text": "其要求替换或删除基金名称中“华夏”的字样。", "page": 14, "section": null, "tags": []}, "B499": {"text": "2.基金托管人的更换程序", "page": 14, "section": null, "tags": []}, "B500": {"text": "（1）提名：新任基金托管人由基金管理人提名。", "page": 14, "section": null, "tags": []}, "B501": {"text": "（2）决议：基金份额持有人大会对被提名的基金托管人形成决议。", "page": 14, "section": null, "tags": []}, "B502": {"text": "（3）批准：新任基金托管人经中国证监会和中国银监会审查批准方可继任，原任基金托管人经中国", "page": 14, "section": null, "tags": []}, "B503": {"text": "证监会和中国银监会批准方可退任。", "page": 14, "section": null, "tags": []}, "B504": {"text": "（4）公告：基金托管人更换后，由基金管理人在中国证监会和中国银监会批准后5个工作日内在中", "page": 14, "section": null, "tags": []}, "B505": {"text": "国证监会指定媒介公告。新任基金托管人与原基金托管人进行资产托管的交接手续，并与基金管理", "page": 14, "section": null, "tags": []}, "B506": {"text": "人核对", "page": 14, "section": null, "tags": []}, "B507": {"text": "资产总值。如果基金托管人和基金管理人同时更换，由新任基金管理人和新任基金托管人在中国证", "page": 14, "section": null, "tags": []}, "B508": {"text": "监会和", "page": 14, "section": null, "tags": []}, "B509": {"text": "中国银监会批准后5个工作日内在中国证监会指定媒介联合公告。", "page": 14, "section": null, "tags": []}, "B510": {"text": "十、基金的基本情况", "page": 14, "section": null, "tags": []}, "B511": {"text": "（三）基金投资者范围：中华人民共和国境内的自然人、法人及其他组织（法律法规禁止购买证券", "page": 14, "section": null, "tags": []}, "B512": {"text": "资基金者除外），以及合格境外机构投资者和法律法规或中国证监会允许购买证券投资基金的其他", "page": 14, "section": null, "tags": ["汇率与跨境风险"]}, "B513": {"text": "投资者。", "page": 14, "section": null, "tags": []}, "B514": {"text": "（八）基金收益分配：本基金自基金合同生效日起每日将基金净收益分配给基金份额持有人，并定", "page": 14, "section": null, "tags": []}, "B515": {"text": "支付且结转为相应的基金份额，份额持有人可通过赎回基金份额获得现金收益。", "page": 14, "section": null, "tags": ["流动性风险"]}, "B516": {"text": "1、基金份额的类别", "page": 15, "section": null, "tags": []}, "B517": {"text": "本基金根据投资者申购本基金的金额，对投资者持有的基金份额按照不同的费率计提销售服务费用", "page": 15, "section": null, "tags": ["机制特有风险"]}, "B518": {"text": "因此形成不同的基金份额类别。本基金将设A类、B类、E类三类基金份额，A/E类、B类基金份额单", "page": 15, "section": null, "tags": []}, "B519": {"text": "设置基金代码，并分别公布每万份基金净收益、七日年化收益率。", "page": 15, "section": null, "tags": []}, "B520": {"text": "2、基金份额类别的限制", "page": 15, "section": null, "tags": []}, "B521": {"text": "本基金各份额类别的数额限制及相关规则见招募说明书。", "page": 15, "section": null, "tags": []}, "B522": {"text": "3、基金管理人可以在不违反法律法规的情况下，增加新的基金份额类别，或者调整现有基金份额类", "page": 15, "section": null, "tags": []}, "B523": {"text": "别设置及各类别的费率水平、数额限制和相关规则，或者停止现有基金份额类别的销售等，并在更", "page": 15, "section": null, "tags": []}, "B524": {"text": "新的招", "page": 15, "section": null, "tags": []}, "B525": {"text": "募说明书或相关公告中披露。", "page": 15, "section": null, "tags": []}, "B526": {"text": "十一、基金的募集", "page": 15, "section": null, "tags": []}, "B527": {"text": "本基金的募集期限不超过3个月，自招募说明书公告之日起计算。", "page": 15, "section": null, "tags": []}, "B528": {"text": "本基金通过销售机构办理基金认购业务的网点公开发售。", "page": 15, "section": null, "tags": []}, "B529": {"text": "1.投资者认购前，需按销售机构规定的方式备足认购资金。", "page": 15, "section": null, "tags": []}, "B530": {"text": "2.募集期内，投资者可多次认购基金份额，每次认购金额不得低于1,000元，累计认购金额不设上限", "page": 15, "section": null, "tags": []}, "B531": {"text": "本基金不收取认购费用。", "page": 15, "section": null, "tags": []}, "B532": {"text": "本基金的认购份数由认购金额加上认购资金在募集期间的利息后除以基金份额面值确定。基金份额", "page": 15, "section": null, "tags": []}, "B533": {"text": "值为1.00元。基金份额份数以四舍五入的方法保留小数点后两位。由此误差产生的损失由合同生效", "page": 15, "section": null, "tags": []}, "B534": {"text": "后的基", "page": 15, "section": null, "tags": []}, "B535": {"text": "金资产承担，产生的收益归合同生效后的基金资产所有。", "page": 15, "section": null, "tags": []}, "B536": {"text": "十二、基金合同的生效", "page": 15, "section": null, "tags": []}, "B537": {"text": "净认购金额超过2亿元并且认购户数达到或超过100人。", "page": 15, "section": null, "tags": []}, "B538": {"text": "1.募集期内，达到前述基金合同生效条件，基金合同可以生效。基金发起人发布基金合同生效公告", "page": 15, "section": null, "tags": []}, "B539": {"text": "2.基金合同生效前，投资者的认购款项只能存入商业银行，不得动用。", "page": 15, "section": null, "tags": []}, "B540": {"text": "3.认购款项在基金合同生效前产生的利息，在基金合同生效后折算成基金份额，归投资者所有。", "page": 15, "section": null, "tags": []}, "B541": {"text": "1.募集期满，未达到基金合同生效条件，或募集期内发生使基金合同无法生效的不可抗力，则基金", "page": 15, "section": null, "tags": []}, "B542": {"text": "集失败，不得合同生效。", "page": 15, "section": null, "tags": []}, "B543": {"text": "2.本基金不合同生效时，基金发起人应承担全部募集费用，将已募集资金加计银行活期存款利息在", "page": 16, "section": null, "tags": []}, "B544": {"text": "集期结束后30天内退还基金认购人。", "page": 16, "section": null, "tags": []}, "B545": {"text": "3.基金募集失败，基金管理人及销售机构不得请求报酬。", "page": 16, "section": null, "tags": []}, "B546": {"text": "本基金合同生效后的存续期间内，有效基金份额持有人数量连续20个工作日达不到100人，或连续20", "page": 16, "section": null, "tags": []}, "B547": {"text": "个工作日基金资产净值低于人民币5,000万元，基金管理人应当及时向中国证监会报告，说明出现上", "page": 16, "section": null, "tags": []}, "B548": {"text": "述情况", "page": 16, "section": null, "tags": []}, "B549": {"text": "的原因以及解决方案。存续期间内，基金份额持有人数量连续60个工作日达不到100人，或连续60个", "page": 16, "section": null, "tags": []}, "B550": {"text": "工作", "page": 16, "section": null, "tags": []}, "B551": {"text": "日基金资产净值低于人民币5,000万元，基金管理人有权宣布本基金终止，并报中国证监会备案。中", "page": 16, "section": null, "tags": []}, "B552": {"text": "国证监", "page": 16, "section": null, "tags": []}, "B553": {"text": "会另有规定的，按其规定办理。", "page": 16, "section": null, "tags": []}, "B554": {"text": "十三、基金的申购与赎回", "page": 16, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B555": {"text": "本基金的销售机构包括基金管理人和基金管理人委托的代销机构。", "page": 16, "section": null, "tags": []}, "B556": {"text": "投资者应当在销售机构办理基金申购赎回业务的营业场所或按销售机构提供的其他方式办理基金的", "page": 16, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B557": {"text": "申购与赎回。", "page": 16, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B558": {"text": "在销售机构允许的条件下，投资者还可以委托销售机构代为办理本基金的申购与赎回，并签订委托", "page": 16, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B559": {"text": "理协议明确双方的权利与义务，投资者需遵守销售机构的相关规定。", "page": 16, "section": null, "tags": []}, "B560": {"text": "1.开放日及开放时间", "page": 16, "section": null, "tags": []}, "B561": {"text": "本基金为投资者办理申购与赎回等基金业务的时间即开放日为上海证券交易所、深圳证券交易所的", "page": 16, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B562": {"text": "易日。在开放日的具体业务办理时间由基金管理人在招募说明书中规定。", "page": 16, "section": null, "tags": []}, "B563": {"text": "若出现新的证券交易市场、证券交易所交易时间变更或其他特殊情况，基金管理人将视情况对前述", "page": 16, "section": null, "tags": []}, "B564": {"text": "放日及具体业务办理时间进行相应的调整并公告。", "page": 16, "section": null, "tags": []}, "B565": {"text": "2.申购的开始时间", "page": 16, "section": null, "tags": ["机制特有风险"]}, "B566": {"text": "本基金自基金合同生效日后不超过30个工作日的时间起开始办理申购。", "page": 16, "section": null, "tags": ["机制特有风险"]}, "B567": {"text": "3.赎回的开始时间", "page": 16, "section": null, "tags": ["流动性风险"]}, "B568": {"text": "本基金自基金合同生效日后不超过30个工作日的时间起开始办理赎回。", "page": 16, "section": null, "tags": ["流动性风险"]}, "B569": {"text": "4.在确定申购开始时间与赎回开始时间后，由基金管理人最迟于开放日前3个工作日在至少一种中国", "page": 16, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B570": {"text": "证监会指定媒介公告。", "page": 16, "section": null, "tags": []}, "B571": {"text": "1.本基金的申购、赎回价格为每份基金份额1.00元。", "page": 16, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B572": {"text": "2.本基金采用金额申购和份额赎回的方式，即申购以金额申请，赎回以份额申请。", "page": 16, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B573": {"text": "3.当日的申购与赎回申请受理完成后，投资者不可以撤销。", "page": 16, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B574": {"text": "4.投资者部分赎回基金份额时，如满足最低持有限制，基金份额对应的基金收益不随赎回款项支付", "page": 16, "section": null, "tags": ["流动性风险"]}, "B575": {"text": "投资者；如待结转的基金收益为负，则赎回后的基金份额余额需大于待结转的负收益。投资者全部", "page": 16, "section": null, "tags": ["流动性风险"]}, "B576": {"text": "赎回基", "page": 17, "section": null, "tags": ["流动性风险"]}, "B577": {"text": "金份额时，基金收益将全部结算并计入投资者账户。", "page": 17, "section": null, "tags": []}, "B578": {"text": "5.基金管理人在不损害基金份额持有人权益的情况下可更改上述原则。基金管理人最迟须于新规则", "page": 17, "section": null, "tags": []}, "B579": {"text": "始实施日前3个工作日在至少一种中国证监会指定媒介公告。", "page": 17, "section": null, "tags": []}, "B580": {"text": "1.申购与赎回申请的提出", "page": 17, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B581": {"text": "基金投资者须按基金销售机构规定的手续，在开放日的业务办理时间提出申购或赎回的申请。", "page": 17, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B582": {"text": "投资者申购本基金，须按销售机构规定的方式备足申购资金。", "page": 17, "section": null, "tags": ["机制特有风险"]}, "B583": {"text": "投资者提交赎回申请时，其在销售机构（网点）必须有足够的基金份额余额。", "page": 17, "section": null, "tags": ["流动性风险"]}, "B584": {"text": "2.申购与赎回申请的确认", "page": 17, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B585": {"text": "T日规定时间受理的申请，正常情况下投资者可在T+2日通过本公司客户服务电话或到其办理业务的", "page": 17, "section": null, "tags": []}, "B586": {"text": "售网点查询确认情况，打印确认单。", "page": 17, "section": null, "tags": []}, "B587": {"text": "3.申购与赎回申请的款项支付", "page": 17, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B588": {"text": "申购采用全额交款方式，若资金在规定时间内未全额到账则申购不成功，申购不成功的款项将退回", "page": 17, "section": null, "tags": ["机制特有风险"]}, "B589": {"text": "资者账户。", "page": 17, "section": null, "tags": []}, "B590": {"text": "投资者T日的赎回申请成功后，基金管理人将指示基金托管人按有关规定将赎回款项于T+1日从基金", "page": 17, "section": null, "tags": ["流动性风险"]}, "B591": {"text": "管账户划出，经销售机构于T+2日内划往投资者银行账户。在发生巨额赎回时，款项的支付办法按", "page": 17, "section": null, "tags": ["流动性风险"]}, "B592": {"text": "基金合", "page": 17, "section": null, "tags": []}, "B593": {"text": "同及招募说明书有关规定处理。", "page": 17, "section": null, "tags": []}, "B594": {"text": "1.本基金不收取申购费用和赎回费用。当基金持有的现金、国债、中央银行票据、政策性金融债券", "page": 17, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B595": {"text": "及5个交易日内到期的其他金融工具占基金资产净值的比例合计低于5%且偏离度为负时，或者当基", "page": 17, "section": null, "tags": []}, "B596": {"text": "金前10", "page": 17, "section": null, "tags": []}, "B597": {"text": "名份额持有人的持有份额合计超过基金总份额50%，且投资组合中现金、国债、中央银行票据、政", "page": 17, "section": null, "tags": []}, "B598": {"text": "策性金", "page": 17, "section": null, "tags": []}, "B599": {"text": "融债券以及5个交易日内到期的其他金融工具占基金资产净值的比例合计低于10%且偏离度为负时", "page": 17, "section": null, "tags": []}, "B600": {"text": "，为确", "page": 17, "section": null, "tags": []}, "B601": {"text": "保基金平稳运作，避免诱发系统性风险，基金管理人可以与基金托管人协商后，对当日单个基金份", "page": 17, "section": null, "tags": []}, "B602": {"text": "额持有", "page": 17, "section": null, "tags": []}, "B603": {"text": "人申请赎回基金份额超过基金总份额1%以上的赎回申请征收1%的强制赎回费用，并将上述赎回费用", "page": 17, "section": null, "tags": ["流动性风险"]}, "B604": {"text": "全额", "page": 17, "section": null, "tags": []}, "B605": {"text": "计入基金财产，但基金管理人与基金托管人协商确认上述做法无益于基金利益最大化的情形除外。", "page": 17, "section": null, "tags": []}, "B606": {"text": "2.本基金的申购、赎回价格为每份基金份额1.00元。投资者申购所得的份额等于申购金额除以1.00元", "page": 17, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B607": {"text": "赎回所得的金额等于赎回份额乘以1.00元。", "page": 17, "section": null, "tags": ["流动性风险"]}, "B608": {"text": "本基金申购和赎回的数额限制由基金管理人确定并在招募说明书中规定。", "page": 17, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B609": {"text": "当接受申购申请对存量基金份额持有人利益构成潜在重大不利影响时，基金管理人应当采取设定单", "page": 18, "section": null, "tags": ["机制特有风险"]}, "B610": {"text": "投资者申购金额上限或基金单日净申购比例上限、拒绝大额申购、暂停基金申购等措施，切实保护", "page": 18, "section": null, "tags": ["机制特有风险"]}, "B611": {"text": "存量基", "page": 18, "section": null, "tags": []}, "B612": {"text": "金份额持有人的合法权益，具体请参见相关公告。", "page": 18, "section": null, "tags": []}, "B613": {"text": "投资者申购基金成功后，注册登记机构在T+1日为投资者办理增加权益的登记手续，投资者自T+2日", "page": 18, "section": null, "tags": ["机制特有风险"]}, "B614": {"text": "起有权赎回该部分基金份额。投资者赎回基金成功后，注册登记机构在T+1日为投资者办理扣除权", "page": 18, "section": null, "tags": ["流动性风险"]}, "B615": {"text": "益的登", "page": 18, "section": null, "tags": []}, "B616": {"text": "记手续。", "page": 18, "section": null, "tags": []}, "B617": {"text": "基金管理人可在法律法规允许的范围内，对上述注册登记办理时间进行调整，并最迟于开始实施前3", "page": 18, "section": null, "tags": []}, "B618": {"text": "个工作日在至少一种中国证监会指定媒介公告。", "page": 18, "section": null, "tags": []}, "B619": {"text": "1.巨额赎回的认定", "page": 18, "section": null, "tags": ["流动性风险"]}, "B620": {"text": "单个开放日基金净赎回申请超过上一日基金总份额的10%时，为巨额赎回。", "page": 18, "section": null, "tags": ["流动性风险"]}, "B621": {"text": "2.巨额赎回的处理方式", "page": 18, "section": null, "tags": ["流动性风险"]}, "B622": {"text": "出现巨额赎回时，基金管理人可以根据本基金当时的资产组合状况决定接受全额赎回或部分延期赎", "page": 18, "section": null, "tags": ["流动性风险"]}, "B623": {"text": "回。", "page": 18, "section": null, "tags": []}, "B624": {"text": "（1）接受全额赎回：当基金管理人认为有能力兑付投资者的全部赎回申请时，按正常赎回程序执行", "page": 18, "section": null, "tags": ["流动性风险"]}, "B625": {"text": "（2）部分延期赎回：当基金管理人认为兑付投资者的赎回申请有困难，或认为为兑付投资者的赎回", "page": 18, "section": null, "tags": ["流动性风险"]}, "B626": {"text": "申请进行的资产变现可能使基金资产净值发生较大波动时，基金管理人在当日接受赎回比例不低于", "page": 18, "section": null, "tags": ["流动性风险"]}, "B627": {"text": "上一日", "page": 18, "section": null, "tags": []}, "B628": {"text": "基金总份额10％的前提下，对其余赎回申请延期办理。对于当日的赎回申请，应当按单个账户赎回", "page": 18, "section": null, "tags": ["流动性风险"]}, "B629": {"text": "申请量", "page": 18, "section": null, "tags": []}, "B630": {"text": "占赎回申请总量的比例，确定当日受理的赎回份额；未受理部分除投资者在提交赎回申请时选择将", "page": 18, "section": null, "tags": ["流动性风险"]}, "B631": {"text": "当日未", "page": 18, "section": null, "tags": []}, "B632": {"text": "获受理部分予以撤销者外，延迟至下一开放日办理。转入下一开放日的赎回申请不享有赎回优先权", "page": 18, "section": null, "tags": ["流动性风险"]}, "B633": {"text": "，以此", "page": 18, "section": null, "tags": []}, "B634": {"text": "类推，直到全部赎回为止。", "page": 18, "section": null, "tags": ["流动性风险"]}, "B635": {"text": "（3）当发生巨额赎回并部分延期赎回时，基金管理人应在3个工作日内在至少一种中国证监会指定", "page": 18, "section": null, "tags": ["流动性风险"]}, "B636": {"text": "媒介公告，并说明有关处理方法。", "page": 18, "section": null, "tags": []}, "B637": {"text": "本基金连续两个开放日以上发生巨额赎回，如基金管理人认为有必要，可暂停接受赎回申请；已经", "page": 18, "section": null, "tags": ["流动性风险"]}, "B638": {"text": "受的赎回申请可以延缓支付赎回款项，但延缓期限不得超过20个工作日，并应当在至少一种中国证", "page": 18, "section": null, "tags": ["流动性风险"]}, "B639": {"text": "监会", "page": 18, "section": null, "tags": []}, "B640": {"text": "指定媒介公告。", "page": 18, "section": null, "tags": []}, "B641": {"text": "（4）如果基金发生巨额赎回，在单个基金份额持有人超过基金总份额20%以上的大额赎回申请情形", "page": 18, "section": null, "tags": ["流动性风险"]}, "B642": {"text": "下，", "page": 18, "section": null, "tags": []}, "B643": {"text": "如果基金管理人认为支付全部投资人的赎回申请有困难或认为因支付全部投资人的赎回申请而进行", "page": 18, "section": null, "tags": ["流动性风险"]}, "B644": {"text": "的财", "page": 18, "section": null, "tags": []}, "B645": {"text": "产变现可能会对基金资产净值造成较大波动时，基金管理人可以延期办理赎回申请。具体分为两种", "page": 18, "section": null, "tags": ["流动性风险"]}, "B646": {"text": "情况：", "page": 19, "section": null, "tags": []}, "B647": {"text": "①如果基金管理人认为有能力支付其他投资人的全部赎回申请，为了保护其他赎回投资人的利益", "page": 19, "section": null, "tags": ["流动性风险"]}, "B648": {"text": "，对", "page": 19, "section": null, "tags": []}, "B649": {"text": "于其他投资人的赎回申请按正常程序进行。对于单个投资人超过基金总份额20%以上的大额赎回申", "page": 19, "section": null, "tags": ["流动性风险"]}, "B650": {"text": "请，基", "page": 19, "section": null, "tags": []}, "B651": {"text": "金管理人在剩余支付能力范围内对其按比例确认当日受理的赎回份额，未确认的赎回部分作自动延", "page": 19, "section": null, "tags": ["流动性风险"]}, "B652": {"text": "期处理。", "page": 19, "section": null, "tags": []}, "B653": {"text": "延期的赎回申请与下一开放日赎回申请一并处理，无优先权，以此类推，直到全部赎回为止。如投", "page": 19, "section": null, "tags": ["流动性风险"]}, "B654": {"text": "资人在", "page": 19, "section": null, "tags": []}, "B655": {"text": "提交赎回申请时选择取消赎回的，则当日未获受理的部分赎回申请将被撤销。", "page": 19, "section": null, "tags": ["流动性风险"]}, "B656": {"text": "②如果基金管理人认为仅支付其他投资人的赎回申请也有困难时，则所有投资人的赎回申请（包括", "page": 19, "section": null, "tags": ["流动性风险"]}, "B657": {"text": "单个投资人超过基金总份额20%以上的大额赎回申请和其他投资人的赎回申请）都按照上述", "page": 19, "section": null, "tags": ["流动性风险"]}, "B658": {"text": "“（2）部分延", "page": 19, "section": null, "tags": []}, "B659": {"text": "期赎回”的约定一并办理。", "page": 19, "section": null, "tags": ["流动性风险"]}, "B660": {"text": "（九）单个基金份额持有人在单个开放日申请赎回基金份额超过基金总份额10%的，基金管理人可", "page": 19, "section": null, "tags": ["流动性风险"]}, "B661": {"text": "采取延期办理部分赎回申请或者延缓支付赎回款项的措施。", "page": 19, "section": null, "tags": ["流动性风险"]}, "B662": {"text": "1.在如下情况下，基金管理人可以拒绝或暂停接受投资者的申购申请：", "page": 19, "section": null, "tags": ["机制特有风险"]}, "B663": {"text": "（1）不可抗力；", "page": 19, "section": null, "tags": []}, "B664": {"text": "（2）证券交易市场交易时间非正常停市；", "page": 19, "section": null, "tags": []}, "B665": {"text": "（3）基金资产规模过大，使基金管理人无法找到合适的投资品种，或可能对基金业绩产生负面影响", "page": 19, "section": null, "tags": []}, "B666": {"text": "从而损害已有基金份额持有人的利益；", "page": 19, "section": null, "tags": []}, "B667": {"text": "（4）个别投资者的申购、赎回过于频繁，导致基金的交易费用和变现成本增加，或使得基金管理人", "page": 19, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B668": {"text": "无法顺利实施投资策略，继续接受其申购可能对其他基金份额持有人的利益产生损害；", "page": 19, "section": null, "tags": ["机制特有风险"]}, "B669": {"text": "（5）基金管理人、基金托管人、基金销售代理人或注册登记机构的技术保障或人员支持等不充分；", "page": 19, "section": null, "tags": []}, "B670": {"text": "（6）当正偏离度绝对值达到0.5%时，基金管理人应当暂停接受申购；", "page": 19, "section": null, "tags": ["机制特有风险"]}, "B671": {"text": "（7）为了保护基金份额持有人的合法权益，基金管理人可以依照相关法律法规以及基金合同的约定", "page": 19, "section": null, "tags": []}, "B672": {"text": "在特定市场条件下暂停或者拒绝接受一定金额以上的资金申购；", "page": 19, "section": null, "tags": ["机制特有风险"]}, "B673": {"text": "（8）当前一估值日基金资产净值50%以上的资产出现无可参考的活跃市场价格且采用估值技术仍导", "page": 19, "section": null, "tags": []}, "B674": {"text": "致公允价值存在重大不确定性时，经与基金托管人协商确认后，基金管理人应当暂停接受基金申购", "page": 19, "section": null, "tags": ["机制特有风险"]}, "B675": {"text": "申请；", "page": 19, "section": null, "tags": []}, "B676": {"text": "（9）基金管理人接受某笔或者某些申购申请有可能导致单一投资者持有基金份额的比例达到或者超", "page": 19, "section": null, "tags": ["机制特有风险"]}, "B677": {"text": "过50%，或者变相规避50%集中度的情形时；", "page": 19, "section": null, "tags": []}, "B678": {"text": "（10）法律法规规定或经中国证监会批准的其他情形。", "page": 19, "section": null, "tags": []}, "B679": {"text": "基金管理人拒绝接受某些投资者的申购申请时，申购款项将退回投资者账户。基金管理人暂停接受", "page": 19, "section": null, "tags": ["机制特有风险"]}, "B680": {"text": "资者的申购申请时需按规定公告。", "page": 19, "section": null, "tags": ["机制特有风险"]}, "B681": {"text": "2.在如下情况下，基金管理人可以暂停接受投资者的赎回申请或延缓支付赎回款项：", "page": 19, "section": null, "tags": ["流动性风险"]}, "B682": {"text": "（1）不可抗力；", "page": 19, "section": null, "tags": []}, "B683": {"text": "（2）证券交易市场交易时间非正常停市；", "page": 20, "section": null, "tags": []}, "B684": {"text": "（3）当前一估值日基金资产净值50%以上的资产出现无可参考的活跃市场价格且采用估值技术仍导", "page": 20, "section": null, "tags": []}, "B685": {"text": "致公允价值存在重大不确定性时，经与基金托管人协商确认后，基金管理人应当暂停接受基金赎回", "page": 20, "section": null, "tags": ["流动性风险"]}, "B686": {"text": "申请或", "page": 20, "section": null, "tags": []}, "B687": {"text": "延缓支付赎回款项；", "page": 20, "section": null, "tags": ["流动性风险"]}, "B688": {"text": "（4）法律法规规定或经中国证监会批准的其他情形。", "page": 20, "section": null, "tags": []}, "B689": {"text": "发生上述情形之一的，基金管理人应当在当日立即向中国证监会备案；已接受的赎回申请，基金管", "page": 20, "section": null, "tags": ["流动性风险"]}, "B690": {"text": "人应当足额兑付；如暂时不能足额兑付，应当按单个账户已被接受的赎回申请量占已接受的赎回申", "page": 20, "section": null, "tags": ["流动性风险"]}, "B691": {"text": "请总量", "page": 20, "section": null, "tags": []}, "B692": {"text": "的比例分配给赎回申请人，其余部分在后续开放日予以兑付。投资者在申请赎回时可选择将当日未", "page": 20, "section": null, "tags": ["流动性风险"]}, "B693": {"text": "获受理", "page": 20, "section": null, "tags": []}, "B694": {"text": "部分予以撤销。", "page": 20, "section": null, "tags": []}, "B695": {"text": "在暂停赎回的情况消除时，基金管理人应及时恢复赎回业务的办理。", "page": 20, "section": null, "tags": ["流动性风险"]}, "B696": {"text": "3.发生基金合同、招募说明书中未予载明的事项，但基金管理人有正当理由认为需要暂停接受基金", "page": 20, "section": null, "tags": []}, "B697": {"text": "购、赎回申请的，报经中国证监会批准后可以暂停接受投资者的申购、赎回申请。", "page": 20, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B698": {"text": "4.暂停基金的申购、赎回，基金管理人应及时在至少一种中国证监会指定媒介公告。", "page": 20, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B699": {"text": "5.暂停期间结束基金重新开放时，基金管理人应予公告。", "page": 20, "section": null, "tags": []}, "B700": {"text": "如果发生暂停的时间为一天，基金管理人将于重新开放日在至少一种中国证监会指定媒介刊登基金", "page": 20, "section": null, "tags": []}, "B701": {"text": "新开放申购或赎回的公告并公告暂停期间的基金收益情况。", "page": 20, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B702": {"text": "如果发生暂停的时间超过一天但少于两周，暂停结束基金重新开放申购或赎回时，基金管理人将提", "page": 20, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B703": {"text": "1个工作日在至少一种中国证监会指定媒介刊登基金重新开放申购或赎回的公告，并在重新开放申购", "page": 20, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B704": {"text": "或赎", "page": 20, "section": null, "tags": []}, "B705": {"text": "回日公告暂停期间的基金收益情况。", "page": 20, "section": null, "tags": []}, "B706": {"text": "如果发生暂停的时间超过两周，暂停期间，基金管理人应每两周至少重复刊登暂停公告一次；当连", "page": 20, "section": null, "tags": []}, "B707": {"text": "暂停时间超过两个月时，可对重复刊登暂停公告的频率进行调整。暂停结束基金重新开放申购或赎", "page": 20, "section": null, "tags": ["机制特有风险"]}, "B708": {"text": "回时，", "page": 20, "section": null, "tags": []}, "B709": {"text": "基金管理人应提前3个工作日在至少一种中国证监会指定媒介连续刊登基金重新开放申购或赎回的公", "page": 20, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B710": {"text": "告，", "page": 20, "section": null, "tags": []}, "B711": {"text": "并在重新开放申购或赎回日公告暂停期间的基金收益情况。", "page": 20, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B712": {"text": "在条件允许的情况下，基金管理人可以根据相关业务规则受理基金份额持有人通过中国证监会认可", "page": 20, "section": null, "tags": []}, "B713": {"text": "交易场所或者交易方式进行份额转让的申请。具体由基金管理人提前发布公告。", "page": 20, "section": null, "tags": []}, "B714": {"text": "十四、基金的非交易过户与转托管等", "page": 20, "section": null, "tags": []}, "B715": {"text": "（一）注册登记机构只受理继承、司法强制执行等情况下的非交易过户申请。其中继承是指基金份", "page": 20, "section": null, "tags": []}, "B716": {"text": "持有人死亡，其持有的基金份额由其合法的继承人继承；司法强制执行是指司法机构依据生效司法", "page": 20, "section": null, "tags": []}, "B717": {"text": "文书将", "page": 21, "section": null, "tags": []}, "B718": {"text": "基金份额持有人持有的基金份额强制划转给其他自然人、法人或其他组织。符合条件的非交易过户", "page": 21, "section": null, "tags": []}, "B719": {"text": "申请自", "page": 21, "section": null, "tags": []}, "B720": {"text": "申请受理日起2个月内办理并按基金注册登记机构规定的标准收费。注册登记机构可依据其业务规则", "page": 21, "section": null, "tags": []}, "B721": {"text": "受理", "page": 21, "section": null, "tags": []}, "B722": {"text": "其他情况下的非交易过户申请，或委托基金销售机构代为办理。", "page": 21, "section": null, "tags": []}, "B723": {"text": "（二）基金份额持有人在变更办理基金申购与赎回等业务的销售机构（网点）时，销售机构（网点", "page": 21, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B724": {"text": "之间不能通存通兑的，可办理已持有基金份额的转托管。办理转托管业务的基金份额持有人需在原", "page": 21, "section": null, "tags": []}, "B725": {"text": "销售机", "page": 21, "section": null, "tags": []}, "B726": {"text": "构（网点）办理转托管转出手续后20个工作日内到其新选择的销售机构（网点）办理转托管转入手", "page": 21, "section": null, "tags": []}, "B727": {"text": "续。对", "page": 21, "section": null, "tags": []}, "B728": {"text": "于有效的基金转托管申请，基金份额将在办理转托管转入手续后转入其指定的销售机构（网点）。", "page": 21, "section": null, "tags": []}, "B729": {"text": "投资者", "page": 21, "section": null, "tags": []}, "B730": {"text": "需交纳一定的注册登记费。", "page": 21, "section": null, "tags": []}, "B731": {"text": "（三）注册登记机构只受理国家有权机关依法要求的基金账户或基金份额的冻结与解冻。被冻结的", "page": 21, "section": null, "tags": []}, "B732": {"text": "金份额在冻结期间仍享有分红权益。基金账户或基金份额被冻结的，被冻结部分产生的权益一并冻", "page": 21, "section": null, "tags": []}, "B733": {"text": "结。", "page": 21, "section": null, "tags": []}, "B734": {"text": "（四）在相关法律法规有明确规定的条件下，注册登记机构可以办理基金份额的质押业务，并制订", "page": 21, "section": null, "tags": []}, "B735": {"text": "布相应的业务规则。", "page": 21, "section": null, "tags": []}, "B736": {"text": "十五、基金资产的托管", "page": 21, "section": null, "tags": []}, "B737": {"text": "本基金资产由基金托管人持有并保管。基金管理人应与基金托管人按照《基金法》、本基金合同及", "page": 21, "section": null, "tags": []}, "B738": {"text": "他有关规定订立《华夏现金增利证券投资基金托管协议》，以明确基金管理人与基金托管人之间在", "page": 21, "section": null, "tags": []}, "B739": {"text": "基金资", "page": 21, "section": null, "tags": []}, "B740": {"text": "产的保管、基金资产的管理和运作及相互监督等相关事宜中的权利和义务，确保基金资产的安全", "page": 21, "section": null, "tags": []}, "B741": {"text": "，保护基", "page": 21, "section": null, "tags": []}, "B742": {"text": "金份额持有人的合法权益。", "page": 21, "section": null, "tags": []}, "B743": {"text": "根据《基金法》、本基金合同和有关证券法规的规定，基金托管人对基金的投资对象、基金资产的", "page": 21, "section": null, "tags": []}, "B744": {"text": "资组合比例、基金资产的核算、基金资产净值的计算、基金管理人报酬的计提和支付、基金托管人", "page": 21, "section": null, "tags": []}, "B745": {"text": "报酬的", "page": 21, "section": null, "tags": []}, "B746": {"text": "计提和支付、基金的申购与赎回、基金收益分配等行为的合法性、合规性进行监督和核查。", "page": 21, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B747": {"text": "基金托管人发现基金管理人的违反《基金法》、本基金合同或有关证券法规规定的行为，应及时以", "page": 21, "section": null, "tags": []}, "B748": {"text": "面形式通知基金管理人限期纠正，基金管理人收到通知后应及时核对确认并以书面形式对基金托管", "page": 21, "section": null, "tags": []}, "B749": {"text": "人发出", "page": 21, "section": null, "tags": []}, "B750": {"text": "回函。在限期内，基金托管人有权随时对通知事项进行复查，督促基金管理人改正。基金管理人对", "page": 21, "section": null, "tags": []}, "B751": {"text": "基金托", "page": 21, "section": null, "tags": []}, "B752": {"text": "管人通知的违规事项未能在限期内纠正的，基金托管人应报告中国证监会。", "page": 21, "section": null, "tags": []}, "B753": {"text": "基金托管人发现基金管理人有重大违规行为，应立即报告中国证监会，同时通知基金管理人限期纠", "page": 22, "section": null, "tags": []}, "B754": {"text": "正。", "page": 22, "section": null, "tags": []}, "B755": {"text": "十六、基金认购、申购和赎回等业务及其代理", "page": 22, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B756": {"text": "本基金的认购、申购、赎回、转换、非交易过户及转托管等业务可由基金管理人及基金管理人委托", "page": 22, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B757": {"text": "其他符合条件的机构办理。", "page": 22, "section": null, "tags": []}, "B758": {"text": "基金管理人委托其他机构办理本基金认购、申购和赎回等业务的，应与代销机构签订委托代理协议", "page": 22, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B759": {"text": "以明确基金管理人和销售机构之间在基金份额认购、申购和赎回等事宜中的权利和义务，确保基金", "page": 22, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B760": {"text": "资产的", "page": 22, "section": null, "tags": []}, "B761": {"text": "安全，保护基金投资者和基金份额持有人的合法权益。", "page": 22, "section": null, "tags": []}, "B762": {"text": "销售机构应严格按照法律法规和本基金合同规定的条件办理本基金的认购、申购和赎回等业务。", "page": 22, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B763": {"text": "十七、基金注册登记业务及其代理", "page": 22, "section": null, "tags": []}, "B764": {"text": "本基金的注册登记业务指本基金登记、存管、清算和交收业务，具体内容包括份额持有人基金账户", "page": 22, "section": null, "tags": []}, "B765": {"text": "理、基金份额登记、清算及基金交易确认、代理发放红利、建立并保管基金份额持有人名册等。", "page": 22, "section": null, "tags": []}, "B766": {"text": "本基金的注册登记业务由基金管理人或基金管理人委托的其他符合条件的机构办理。基金管理人委", "page": 22, "section": null, "tags": []}, "B767": {"text": "其他机构办理本基金注册登记业务的，应与代理人签订委托代理协议，以明确基金管理人和代理机", "page": 22, "section": null, "tags": []}, "B768": {"text": "构在份", "page": 22, "section": null, "tags": []}, "B769": {"text": "额持有人基金账户管理、基金份额登记、清算及基金交易确认、代理发放红利、建立并保管基金份", "page": 22, "section": null, "tags": []}, "B770": {"text": "额持有", "page": 22, "section": null, "tags": []}, "B771": {"text": "人名册等事宜中的权利和义务，保护基金投资者和基金份额持有人的合法权益。", "page": 22, "section": null, "tags": []}, "B772": {"text": "注册登记机构享有如下权利：", "page": 22, "section": null, "tags": []}, "B773": {"text": "1.取得注册登记费；", "page": 22, "section": null, "tags": []}, "B774": {"text": "2.保管基金份额持有人开户资料、交易资料、基金份额持有人名册等；", "page": 22, "section": null, "tags": []}, "B775": {"text": "3.法律法规规定的其他权利。", "page": 22, "section": null, "tags": []}, "B776": {"text": "注册登记机构承担如下义务:", "page": 22, "section": null, "tags": []}, "B777": {"text": "1.配备足够的专业人员办理本基金的注册登记业务；", "page": 22, "section": null, "tags": []}, "B778": {"text": "2.严格按照法律法规和本基金合同规定的条件办理本基金的注册登记业务；", "page": 22, "section": null, "tags": []}, "B779": {"text": "3.保存基金份额持有人名册及相关的申购与赎回等业务记录15年以上；", "page": 22, "section": null, "tags": ["流动性风险", "机制特有风险"]}, "B780": {"text": "4.对基金份额持有人的基金账户信息负有保密义务，因违反该保密义务对投资者或基金带来的损失", "page": 22, "section": null, "tags": []}, "B781": {"text": "须承担相应的赔偿责任，但司法强制检查等情形除外；", "page": 22, "section": null, "tags": []}, "B782": {"text": "5.按本基金合同及招募说明书规定为投资者办理非交易过户业务、提供其他必要的服务；", "page": 22, "section": null, "tags": []}, "B783": {"text": "6.法律法规规定的其他义务。", "page": 22, "section": null, "tags": []}, "B784": {"text": "十八、基金的投资", "page": 22, "section": null, "tags": []}, "B785": {"text": "在确保本金安全和高流动性的前提下，追求超过基准的较高收益。", "page": 22, "section": null, "tags": ["流动性风险"]}, "B786": {"text": "包括：现金，期限在1年以内（含1年）的银行存款、债券回购、中央银行票据、同业存单,剩余期", "page": 22, "section": null, "tags": []}, "B787": {"text": "限在397天以内（含397天）的债券、非金融企业债务融资工具、资产支持证券，以及法律法规或中", "page": 22, "section": null, "tags": ["机制特有风险"]}, "B788": {"text": "国证", "page": 23, "section": null, "tags": []}, "B789": {"text": "监会、中国人民银行认可的其他具有良好流动性的金融工具。", "page": 23, "section": null, "tags": ["流动性风险"]}, "B790": {"text": "如法律法规或监管机构以后允许基金投资其他品种，基金管理人在履行适当程序后，可以将其纳入", "page": 23, "section": null, "tags": []}, "B791": {"text": "资范围。", "page": 23, "section": null, "tags": []}, "B792": {"text": "积极判断短期利率变动，合理安排期限，细致研究，谨慎操作，以实现本金的安全性、流动性和稳", "page": 23, "section": null, "tags": ["流动性风险", "市场风险"]}, "B793": {"text": "超过基准的较高收益。", "page": 23, "section": null, "tags": []}, "B794": {"text": "1.短期利率受到货币政策和短期资金供求等因素的影响，通过对其走势和变动的积极判断，能够优", "page": 23, "section": null, "tags": ["市场风险"]}, "B795": {"text": "期限配置、类属和品种配置，从而提高组合收益。", "page": 23, "section": null, "tags": []}, "B796": {"text": "2.通过合理期限安排，保持组合较高的流动性，既能满足投资者的流动性需求，又能避免组合规模", "page": 23, "section": null, "tags": ["流动性风险"]}, "B797": {"text": "变化对投资策略实施的影响。", "page": 23, "section": null, "tags": []}, "B798": {"text": "3.通过细致研究和谨慎操作，运用多种灵活策略，能够充分利用市场机会，不断积累超额收益。", "page": 23, "section": null, "tags": []}, "B799": {"text": "1.短期利率预期策略", "page": 23, "section": null, "tags": ["市场风险"]}, "B800": {"text": "短期利率预期策略是本基金的基本投资策略。根据对宏观经济指标、财政与货币政策、金融监管政", "page": 23, "section": null, "tags": ["市场风险"]}, "B801": {"text": "策、", "page": 23, "section": null, "tags": []}, "B802": {"text": "市场结构变化和市场资金供求等因素的研究与分析，对未来一段时期的短期市场利率进行积极的判", "page": 23, "section":
